    foot.append(btn("Close", "primary", closeModal));
  });
}

/* Open the Licenses modal — TAPR OHL + a short bundled-software notice. */
function openLicensesModal() {
  openModal("Licenses", (body, foot) => {
    body.innerHTML = `
      <div class="legal-tabs">
        <button class="active" data-tab="tapr" type="button">TAPR OHL v1.0 (hardware)</button>
        <button data-tab="software" type="button">Software notice</button>
      </div>
      <div class="legal-reader" id="legal-pane"></div>
    `;
    const pane = body.querySelector("#legal-pane");
    function showTab(name) {
      body.querySelectorAll(".legal-tabs button").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === name));
      if (name === "tapr") {
        pane.innerHTML = `<pre>${escapeHtml(TAPR_TEXT)}</pre>`;
      } else {
        pane.innerHTML = `
          <h2>Software notice</h2>
          <p>The CORNERSTONE Open Platform PDK Monitor dashboard
          (this HTML application) is &copy; 2026 CORNERSTONE Open
          Platform. It is made available free of charge under the
          Terms &amp; Conditions you have accepted.</p>
          <p>Bundled third-party libraries (loaded at runtime):</p>
          <ul>
            <li><strong>JSZip</strong> &mdash; MIT / GPLv3 (dual)</li>
            <li><strong>SheetJS Community Edition</strong> &mdash; Apache 2.0</li>
            <li><strong>Pyodide</strong> (where used) &mdash; Mozilla Public License 2.0</li>
          </ul>
          <p>Hardware content shipped via the Service is licensed under
          the TAPR Open Hardware License v1.0 (see the other tab).</p>
        `;
      }
    }
    body.querySelectorAll(".legal-tabs button").forEach(b =>
      b.addEventListener("click", () => showTab(b.dataset.tab)));
    showTab("tapr");
    foot.innerHTML = "";
    foot.append(btn("View Terms of Use", "ghost", () => { closeModal(); openTermsModal(); }));
    foot.append(btn("Close", "primary", closeModal));
  });
}

/* First-launch (or version-bump) acceptance gate.
   The dashboard remains rendered behind the dim overlay, but body
   scrolling is locked and the user cannot interact with anything
   else until they accept or decline. */
function showTermsGate() {
  const gate       = document.getElementById("terms-gate");
  const body       = document.getElementById("terms-gate-body");
  const cb         = document.getElementById("terms-gate-accept-cb");
  const acceptBtn  = document.getElementById("terms-gate-accept-btn");
  const declineBtn = document.getElementById("terms-gate-decline");
  const viewFull   = document.getElementById("terms-gate-view-full");
  const viewTapr   = document.getElementById("terms-gate-view-tapr");

  function renderSummary() { body.innerHTML = TERMS_SUMMARY_HTML; body.scrollTop = 0; }
  renderSummary();

  function renderInlineReader(title, html) {
    body.innerHTML = `<h3>${escapeHtml(title)}</h3>${html}
      <p style="margin-top:14px;">
        <button type="button" id="terms-gate-back"
          style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:5px 12px;font-size:11px;border-radius:4px;cursor:pointer;">
          &larr; Back to summary
        </button>
      </p>`;
    body.querySelector("#terms-gate-back").addEventListener("click", renderSummary);
    body.scrollTop = 0;
  }

  viewFull.onclick = (ev) => { ev.preventDefault(); renderInlineReader("Full Terms & Conditions", TERMS_FULL_HTML); };
  viewTapr.onclick = (ev) => { ev.preventDefault(); renderInlineReader(
    "TAPR Open Hardware License v1.0",
    `<pre style="white-space:pre-wrap;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;">${escapeHtml(TAPR_TEXT)}</pre>`
  ); };

  cb.checked = false;
  acceptBtn.disabled = true;
  cb.onchange = () => { acceptBtn.disabled = !cb.checked; };

  acceptBtn.onclick = () => {
    if (!cb.checked) return;
    const stamp = { version: TERMS_VERSION, acceptedAt: new Date().toISOString() };
    try { localStorage.setItem(TERMS_KEY, JSON.stringify(stamp)); }
    catch (e) { console.warn("Could not persist Terms acceptance:", e); }
    gate.classList.remove("open");
    gate.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    try { toast(`Thanks — Terms of Use v${TERMS_VERSION} accepted`); } catch {}
  };

  declineBtn.onclick = () => {
    if (!confirm("If you don't accept, the dashboard won't open. That's OK — reload the page any time to take another look. Close now?")) return;
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,Segoe UI,sans-serif;color:#c9d1d9;background:#0d1117;">
        <h1 style="font-size:18px;margin:0 0 8px;font-weight:600;letter-spacing:.03em;">No worries &mdash; come back any time</h1>
        <p style="max-width:520px;font-size:13px;color:#8b949e;margin:0 0 10px;line-height:1.55;">
          You haven&rsquo;t accepted the CORNERSTONE Open Platform Terms
          of Use, so the dashboard won&rsquo;t open. Nothing has been
          saved or shared. You can reload this page whenever you&rsquo;d
          like to review the Terms again.
        </p>
        <p style="font-size:11px;color:#6e7681;margin:0;">Version `+TERMS_VERSION+` &middot; `+TERMS_EFFECTIVE+`</p>
      </div>`;
  };

  document.body.style.overflow = "hidden";
  gate.classList.add("open");
  gate.setAttribute("aria-hidden", "false");
}

function maybeShowTermsGate() {
  let stamp = null;
  try { stamp = JSON.parse(localStorage.getItem(TERMS_KEY) || "null"); } catch {}
  if (!stamp || stamp.version !== TERMS_VERSION) showTermsGate();
}

/* Footer link wiring. */
document.getElementById("footer-terms-link")?.addEventListener("click", (ev) => {
  ev.preventDefault(); openTermsModal();
});
document.getElementById("footer-privacy-link")?.addEventListener("click", (ev) => {
  ev.preventDefault(); openTermsModal("privacy");
});
document.getElementById("footer-licenses-link")?.addEventListener("click", (ev) => {
  ev.preventDefault(); openLicensesModal();
});
document.getElementById("footer-about-link")?.addEventListener("click", (ev) => {
  ev.preventDefault();
  if (typeof openAbout === "function") openAbout();
});

/* Run after initial render so the dashboard is visible behind the gate. */
maybeShowTermsGate();
</script>
