/* Reconstruct a downloadable file from a saved test / dataset record.
   Priority order:
   1. rawText  → save verbatim as the original filename (works for csv/txt/json/s2p)
   2. parsed   → re-emit as CSV (header = sweep name + trace names)
   3. neither  → fall back to a small JSON sidecar with metadata only
*/
function downloadFileFromCard(rec) {
  const name = rec.filename || `${rec.name || "file"}.txt`;
  let blob, downloadName = name;
  if (rec.binaryContent) {
    // Original bytes — best fidelity, works for any extension
    const bytes = base64ToBytes(rec.binaryContent);
    blob = new Blob([bytes], { type: "application/octet-stream" });
  } else if (rec.imageUrl) {
    // Image data URL — convert back to a blob and trigger download
    fetch(rec.imageUrl).then(r => r.blob()).then(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    return;
  } else if (rec.rawText && rec.rawText.length > 0) {
    // best — original-ish bytes
    blob = new Blob([rec.rawText], { type: "text/plain;charset=utf-8" });
  } else if (rec.parsed && rec.parsed.sweep && rec.parsed.traces?.length) {
    // synthesise a CSV from parsed data
    const sweep = rec.parsed.sweep;
    const traces = rec.parsed.traces;
    const header = [sweep.name || "x", ...traces.map(t => t.name || "y")];
    const lines = [header.join(",")];
    const n = sweep.values.length;
    for (let i = 0; i < n; i++) {
      const row = [sweep.values[i], ...traces.map(t => t.values[i])];
      lines.push(row.map(v => v == null ? "" : v).join(","));
    }
    blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
    if (!/\.csv$/i.test(downloadName)) downloadName = `${rec.name || "file"}.csv`;
  } else {
    // Fall back to metadata-only JSON sidecar so the user gets *something*
    const sidecar = {
      name: rec.name, filename: rec.filename, kind: rec.kind, size: rec.size,
      metadata: rec.metadata || {},
      note: "Original file content was not preserved (binary file or oversized text). This is a metadata-only sidecar.",
    };
    blob = new Blob([JSON.stringify(sidecar, null, 2)], { type: "application/json" });
    downloadName = `${(rec.name || "file").replace(/\s+/g, "_")}.metadata.json`;
    toast("Original bytes weren't stored — saved a metadata-only sidecar instead.");
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = downloadName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function readFileAsArrayBuffer(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); }); }

function downloadBytes(filename, bytes, mime) {

function arrayBufferToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* =================================================================
   FILTERS
================================================================= */
function entityMatches(e, q, status, kind, userSet) {
  // Status / kind / user: parent matches if it OR any descendant matches.
  function selfMatchesStatus(x) { return !status || x.status === status; }
  function selfMatchesKind(x)   { return !kind   || x.kind   === kind; }
  function selfMatchesUser(x) {
    // User filter: empty selection = pass-through; otherwise an item
    // matches if EITHER its own owner OR any of its uploaded
    // files / datasets / scripts has a "who" that's in the selected
    // set (OR-of-users semantics — pick three users → see anything
    // any of those three touched).
    if (!userSet || userSet.size === 0) return true;
    const own = (getOwner && getOwner(x.id)) || x.owner || "";
    if (own && userSet.has(own)) return true;
    const blobs = [
      ...(x.files || []),
      ...allDatasets(x),
      ...(x.scripts || []),
    ];
    return blobs.some(f => f && f.who && userSet.has(f.who));
  }
  function selfMatchesQ(x) {
    if (!q) return true;
    const tnames = (x.testGroups || []).flatMap(tg => tg.tests.map(t => t.name + " " + (t.filename || "") + " " + (t.metadata?.device_id || "")));
    const hay = [
      x.name, x.owner, x.description, x.kind, x.bbType,
      ...(x.files || []).map(f => (f.path || "") + " " + (f.who || "")),
      ...(x.scripts || []).map(s => s.name + " " + s.language),
      ...allDatasets(x).map(d => d.name + " " + (d.filename || "")),
      ...tnames,
    ].join(" ").toLowerCase();
    return hay.includes(q);
  }
  function any(node) {
    if (selfMatchesStatus(node) && selfMatchesKind(node) && selfMatchesQ(node) && selfMatchesUser(node)) return true;
    for (const sb of (node.subBlocks || [])) if (any(sb)) return true;
    return false;
  }
  return any(e);
}

/* Walk every ownership stamp + uploader attribution on the model and
   return a sorted list of unique contributor identities. Used to build
   the header user-filter dropdown so dashboard viewers can scope the
   board to a single user's contributions. */
function collectUsers() {
  const set = new Set();
  // Top-level ownership map
  if (MODEL && MODEL.ownership) {
    for (const v of Object.values(MODEL.ownership)) {
      if (v && typeof v === "string") set.add(v);
    }
  }
  function visit(x) {
    if (!x) return;
    if (x.owner) set.add(x.owner);
    (x.files || []).forEach(f => { if (f && f.who) set.add(f.who); });
    (x.scripts || []).forEach(s => { if (s && s.who) set.add(s.who); });
    if (typeof allDatasets === "function") {
      (allDatasets(x) || []).forEach(d => { if (d && d.who) set.add(d.who); });
    }
    (x.subBlocks || []).forEach(visit);
  }
  for (const tb of (MODEL.tabs || []))
    for (const g of (tb.groups || []))
      for (const e of (g.entities || [])) visit(e);
  // Keep the literal "admin" at the top of the list, then alphabetical.
  const arr = Array.from(set).filter(Boolean);
  arr.sort((a, b) => {
    if (a === "admin") return -1;
    if (b === "admin") return 1;
    return a.localeCompare(b);
  });
  return arr;
}

function rebuildFilters() {

  if (Array.from(sf.options).some(o => o.value === curStatus)) sf.value = curStatus;

  rebuildUserFilter();

/* Re-populate the user-filter popover list and update the trigger
   button label. Drops any selected users that no longer exist on the
   model (so stale selections clean themselves up after a Reset). */
function rebuildUserFilter() {
  if (!userFilterBtn) return;
  const users = collectUsers();
  // Drop selections that no longer exist on the model
  for (const u of Array.from(_userFilterSelection)) {
    if (!users.includes(u)) _userFilterSelection.delete(u);
  }
  // Filter by search query (case-insensitive substring)
  const q = (_userFilterSearchText || "").trim().toLowerCase();
  const visible = q
    ? users.filter(u => {
        const label = (typeof displayName === "function" ? displayName(u) : "") || "";
        return u.toLowerCase().includes(q) || label.toLowerCase().includes(q);
      })
    : users;
  // Render rows
  if (!visible.length) {
    userFilterList.innerHTML = `<div class="empty">${users.length ? "No contributors match your search." : "No contributors yet — once admins / user-admins upload files, they'll appear here."}</div>`;
  } else {
    userFilterList.innerHTML = visible.map(u => {
      const checked = _userFilterSelection.has(u);
      // Show only the friendly name in the dropdown — never expose the
      // email / GitHub username as a subtitle (those stay in the
      // Contributors management modal, which is the proper place to
      // see and edit identifying details).
      const label = (typeof displayName === "function" ? displayName(u) : null) || u;
      return `<label class="user-row${checked ? " is-checked" : ""}" data-uid="${escapeHtml(u)}">
        <input type="checkbox" data-uid="${escapeHtml(u)}"${checked ? " checked" : ""}>
        <span>${escapeHtml(label)}</span>
      </label>`;
    }).join("");
    userFilterList.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener("change", () => {
        const uid = cb.dataset.uid;
        if (cb.checked) _userFilterSelection.add(uid);
        else _userFilterSelection.delete(uid);
        cb.closest(".user-row").classList.toggle("is-checked", cb.checked);
        updateUserFilterBadge();
        // Apply live as the user clicks — feels more responsive than
        // forcing a separate "Apply" press. The Apply button still
        // works as an explicit "close + done" affordance.
        render();
      });
    });
  }
  updateUserFilterBadge();
}

function updateUserFilterBadge() {
  if (!userFilterBtn) return;
  const n = _userFilterSelection.size;
  if (userFilterLabel) {
    if (n === 0) userFilterLabel.textContent = "All users";
    else if (n === 1) {
      const only = Array.from(_userFilterSelection)[0];
      const lbl = (typeof displayName === "function" ? displayName(only) : null) || only;
      userFilterLabel.textContent = lbl.length > 18 ? lbl.slice(0, 16) + "…" : lbl;
    } else {
      userFilterLabel.textContent = `${n} users`;
    }
  }
  userFilterBtn.classList.toggle("has-selection", n > 0);
  if (userFilterCount) userFilterCount.textContent = `${n} selected`;
}

function render() {
  // header title from MODEL.about (so it survives reloads / imports)
  if (typeof applyAbout === "function") applyAbout();
  // tab strip
  if (!activeTab() && MODEL.tabs[0]) activeTabId = MODEL.tabs[0].id;
  rebuildFilters();
  tabStrip.innerHTML = "";
  for (const tb of MODEL.tabs) {
    const totalBlocks = tb.groups.reduce((acc, g) => acc + g.entities.length, 0);
    const btn = document.createElement("button");
    btn.className = "tab" + (tb.id === activeTabId ? " active" : "");
    btn.draggable = !isReadOnly();
    btn.dataset.tabid = tb.id;
    btn.innerHTML = `<span>${escapeHtml(tb.name)}</span><span class="ct">${totalBlocks}</span>`;
    btn.addEventListener("click", () => { activeTabId = tb.id; render(); });
    btn.addEventListener("dragstart", (ev) => {
      if (isReadOnly()) { ev.preventDefault(); return; }
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/tab-id", tb.id);
      btn.classList.add("dragging");
    });
    btn.addEventListener("dragend", () => btn.classList.remove("dragging"));
    btn.addEventListener("dragover", (ev) => {
      if (ev.dataTransfer.types.includes("text/tab-id")) {
        ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
      }
    });
    btn.addEventListener("dragenter", (ev) => {
      if (ev.dataTransfer.types.includes("text/tab-id")) btn.classList.add("drag-over");
    });
    btn.addEventListener("dragleave", () => btn.classList.remove("drag-over"));
    btn.addEventListener("drop", (ev) => {
      ev.preventDefault();
      btn.classList.remove("drag-over");
      const fromId = ev.dataTransfer.getData("text/tab-id");
      if (!fromId || fromId === tb.id) return;
      const fromIdx = MODEL.tabs.findIndex(t => t.id === fromId);
      const toIdx   = MODEL.tabs.findIndex(t => t.id === tb.id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = MODEL.tabs.splice(fromIdx, 1);
      MODEL.tabs.splice(toIdx, 0, moved);
      saveModel(); render();
    });
    const menu = document.createElement("button");
    menu.className = "menu"; menu.innerHTML = "⋯"; menu.title = "Tab options";
    menu.addEventListener("click", (ev) => { ev.stopPropagation(); showTabMenu(tb); });
    menu.draggable = false;
    btn.appendChild(menu);
    tabStrip.appendChild(btn);
  }
  const addTabBtn = document.createElement("button");
  addTabBtn.className = "add-tab admin-only"; addTabBtn.textContent = "+ Add tab";
  addTabBtn.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to add tabs.")) return;
    const name = prompt("Name for the new tab:");
    if (!name || !name.trim()) return;
    const t = { id: uid("tab"), name: name.trim(), groups: [] };
    MODEL.tabs.push(t); activeTabId = t.id; saveModel(); render();
  });
  tabStrip.appendChild(addTabBtn);

  // Collapse-all / Expand-all for the active tab's groups
  const _curTab = activeTab();
  if (_curTab && _curTab.groups.length) {
    const allCollapsed = _curTab.groups.every(g => g.collapsed);
    const collapseAll = document.createElement("button");
    collapseAll.className = "add-tab";
    collapseAll.style.borderStyle = "solid";
    collapseAll.title = allCollapsed ? "Expand every sub-entity in this tab" : "Collapse every sub-entity in this tab";
    collapseAll.textContent = allCollapsed ? "▾ Expand all" : "▸ Collapse all";
    collapseAll.addEventListener("click", () => {
      const target = !allCollapsed;
      for (const g of _curTab.groups) g.collapsed = target;
      saveModel(); render();
    });
    tabStrip.appendChild(collapseAll);
  }

  // stats — built dynamically from MODEL.statuses so the row reflects whatever
  // the user has configured (no more hardcoded done/stale/blocked).
  const q = qInput.value.trim().toLowerCase();
  const status = statusFilter.value;
  const kind = kindFilter.value;
  const userSet = _userFilterSelection;
  let total = 0;
  const counts = {};
  for (const tb of MODEL.tabs)
    for (const g of tb.groups)
      for (const e of g.entities) {
        total++;
        counts[e.status] = (counts[e.status] || 0) + 1;
      }
  const statBits = [`<span><b>${total}</b> blocks</span>`];
  for (const s of statusList()) {
    const n = counts[s.id] || 0;
    if (n === 0) continue;   // hide rows with no blocks
    statBits.push(`<span><b style="color:${escapeHtml(s.color)}">${n}</b> ${escapeHtml(s.name.toLowerCase())}</span>`);
  }
  // Surface any orphan statuses (older entries that reference a status no longer in the list)
  for (const k of Object.keys(counts)) {
    if (!statusList().some(s => s.id === k) && counts[k] > 0) {
      statBits.push(`<span style="color:var(--text-faint)"><b>${counts[k]}</b> ${escapeHtml(k)} (legacy)</span>`);
    }
  }
  stats.innerHTML = statBits.join("");

  // board
  board.innerHTML = "";
  const tab = activeTab();
  if (!tab) return;
  for (const g of tab.groups) board.appendChild(renderGroup(g, q, status, kind, userSet));
  const addCat = document.createElement("button");
  addCat.className = "add-group admin-only"; addCat.textContent = "+ Add sub-entity";
  addCat.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to add platforms / sub-entities.")) return;
    openGroupForm(null, tab.id);
  });
  board.appendChild(addCat);

  updateStorageBadge();
}

function showTabMenu(tb) {
  if (isReadOnly()) { toast("Read-only mode — switch to Admin to edit", "err"); return; }
  // Per-tab ownership: a user-admin can only rename / delete a tab they
  // themselves created. Admin-created tabs (or tabs from another
  // user-admin) are read-only to everyone except the full admin.
  if (!canModifyId(tb.id)) {
    const owner = displayName(getOwner(tb.id)) || "another user";
    toast(`Tab "${tb.name}" was created by ${owner} — only they (or an admin) can rename / delete it.`, "err");
    return;
  }
  const choice = prompt(`Tab "${tb.name}" — type:\n  r = rename\n  d = delete (and all its sub-entities)\n  ↵ = cancel`);
  if (!choice) return;
  const c = choice.trim().toLowerCase();
  if (c === "r") {
    const name = prompt("New tab name:", tb.name);
    if (!name || !name.trim()) return;
    tb.name = name.trim(); saveModel(); render();
  } else if (c === "d") {
    const blocks = tb.groups.reduce((a,g)=>a+g.entities.length,0);
    if (!confirm(`Delete tab "${tb.name}" with ${tb.groups.length} sub-entit${tb.groups.length===1?"y":"ies"} and ${blocks} block${blocks===1?"":"s"}?`)) return;
    deleteTab(tb.id);
    if (!findTab(activeTabId)) activeTabId = MODEL.tabs[0]?.id;
    saveModel(); render();
  }
}

function renderGroup(g, q, status, kind, userSet) {
  const matched = g.entities.filter(e => entityMatches(e, q, status, kind, userSet));
  const groupEl = document.createElement("section");
  groupEl.className = "group";
  groupEl.dataset.gid = g.id;
  groupEl.draggable = !isReadOnly();
  if (g.platformMeta?.material) groupEl.dataset.mat = g.platformMeta.material;
  // Persisted column width (drag the right edge to resize). Default is the
  // CSS rule (3 across); explicit user-set widths override via flex-basis,
  // and the row will naturally wrap if the explicit width is bigger than
  // a third of the row.
  if (Number.isFinite(g.width) && g.width > 0) {
    groupEl.style.flex = `0 0 ${g.width}px`;
  }
  // Drag-to-reorder columns within the active tab (admin only)
  groupEl.addEventListener("dragstart", (ev) => {
    if (isReadOnly()) { ev.preventDefault(); return; }
    // Only start a column-drag if the user grabbed the head, not a button or input
    if (ev.target.closest("button, input, .add-btn, .menu-btn")) {
      ev.preventDefault(); return;
    }
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/group-id", g.id);
    groupEl.classList.add("dragging");
  });
  groupEl.addEventListener("dragend", () => groupEl.classList.remove("dragging"));
  groupEl.addEventListener("dragover", (ev) => {
    if (ev.dataTransfer.types.includes("text/group-id")) {
      ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
    }
  });
  groupEl.addEventListener("dragenter", (ev) => {
    if (ev.dataTransfer.types.includes("text/group-id")) groupEl.classList.add("drag-over");
  });
  groupEl.addEventListener("dragleave", () => groupEl.classList.remove("drag-over"));
  groupEl.addEventListener("drop", (ev) => {
    ev.preventDefault();
    groupEl.classList.remove("drag-over");
    const fromId = ev.dataTransfer.getData("text/group-id");
    if (!fromId || fromId === g.id) return;
    const tab = activeTab();
    if (!tab) return;
    const fromIdx = tab.groups.findIndex(x => x.id === fromId);
    const toIdx   = tab.groups.findIndex(x => x.id === g.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = tab.groups.splice(fromIdx, 1);
    tab.groups.splice(toIdx, 0, moved);
    saveModel(); render();
  });

  const head = document.createElement("div");
  head.className = "group-head";
  // Top stripe colour from the editable platforms list (Manage lists → Platforms).
  // Editing a platform's colour there now updates the stripe on every column live.
  const stripe = groupStripeColor(g);
  if (stripe) head.style.borderTopColor = stripe;
  // Chevron toggle on the left
  const chevron = document.createElement("button");
  chevron.className = "menu-btn";
  chevron.title = g.collapsed ? "Expand" : "Collapse";
  chevron.innerHTML = g.collapsed ? "▸" : "▾";
  chevron.style.fontSize = "12px";
  chevron.addEventListener("click", (ev) => {
    ev.stopPropagation();
    g.collapsed = !g.collapsed;
    saveModel(); render();
  });
  head.appendChild(chevron);
  const titleArea = document.createElement("div");
  titleArea.className = "title-area";
  const h2 = document.createElement("h2");
  h2.textContent = g.name;
  if (!isReadOnly()) {
    h2.title = "Click to rename"; h2.style.cursor = "text";
    h2.addEventListener("click", () => beginRenameGroup(g, titleArea, h2));
  }
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = `${matched.length}/${g.entities.length}`;
  titleArea.append(h2, count);
  // Optional category + status chips on the sub-entity itself
  if (g.kind) {
    const cC = categoryColor(g.kind);
    const chip = document.createElement("span");
    chip.className = "category-chip";
    chip.style.background = cC + "22"; chip.style.color = cC;
    chip.textContent = categoryLabel(g.kind);
    titleArea.appendChild(chip);
  }
  if (g.status) {
    const sC = statusColor(g.status);
    const pill = document.createElement("span");
    pill.className = "pill";
    pill.style.background = sC + "22"; pill.style.color = sC;
    pill.textContent = statusLabel(g.status);
    titleArea.appendChild(pill);
  }
  head.appendChild(titleArea);

  // Sync GitHub — replays every previously-used GitHub URL on every BB in
  // this platform. Only shown if at least one BB has a fetch history entry.
  // Available to read-only viewers as well (vetted URLs only, no new
  // content can be introduced).
  const fetchCount = g.entities.reduce((a, e) => a + (e.fetchHistory?.length || 0), 0);
  if (fetchCount > 0) {
    const syncBtn = document.createElement("button");
    syncBtn.className = "group-sync-btn";
    syncBtn.title = `Re-run every previously-used GitHub URL on the ${g.entities.length} BB${g.entities.length===1?"":"s"} in this platform (${fetchCount} URL${fetchCount===1?"":"s"} stored). Available in read-only mode too.`;
    syncBtn.innerHTML = `<span class="ico">↻</span><span class="lbl">Sync</span>`;
    syncBtn.addEventListener("click", (ev) => { ev.stopPropagation(); openPlatformSyncModal(g); });
    head.appendChild(syncBtn);
  }

  const menu = document.createElement("button");
  menu.className = "menu-btn admin-only"; menu.title = "Sub-entity options"; menu.innerHTML = "⋯";
  menu.addEventListener("click", (ev) => { ev.stopPropagation(); showGroupMenu(g); });
  head.appendChild(menu);
  groupEl.appendChild(head);

  if (g.platformMeta?.material && !g.collapsed) {
    const meta = document.createElement("div");
    meta.className = "platform-meta";
    meta.innerHTML = `
      <span class="chip">${escapeHtml(g.platformMeta.material)}</span>
      <span class="chip">${g.platformMeta.thickness} nm thick</span>
    `;
    groupEl.appendChild(meta);
  }

  // Collapsed: stop here. Show a thin one-line summary so you still see the
  // BB count / status / category at a glance without the cards.
  if (g.collapsed) {
    const summary = document.createElement("div");
    summary.style.cssText = "padding:8px 14px 12px;color:var(--text-faint);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;";
    summary.innerHTML = `
      <span>${g.entities.length} block${g.entities.length===1?"":"s"} hidden</span>
      ${g.platformMeta?.material ? `<span>·</span><span>${escapeHtml(g.platformMeta.material)} ${g.platformMeta.thickness} nm</span>` : ""}
    `;
    groupEl.appendChild(summary);
    return groupEl;
  }

  const body = document.createElement("div");
  body.className = "group-body";
  if (Number.isFinite(g.bodyHeight) && g.bodyHeight > 0) {
    body.style.height = `${g.bodyHeight}px`;
  }
  if (g.entities.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "No blocks yet — add the first one below.";
    body.appendChild(empty);
  } else if (!matched.length) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "No blocks match the filter.";
    body.appendChild(empty);
  } else {
    for (const e of matched) body.appendChild(renderCard(e));
  }
  const addBtn = document.createElement("button");
  addBtn.className = "add-btn admin-only";
  addBtn.textContent = "+ Add block";
  addBtn.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to add blocks.")) return;
    openEdit(null, g.id);
  });
  body.appendChild(addBtn);
  groupEl.appendChild(body);

  // Right-edge drag handle to resize this column's width.
  // (Inner BB-list height is still adjustable by editing the panel-style css,
  // but the dynamic resize on each card is now horizontal — matches the prior
  // version Emre liked.)
  const handle = document.createElement("div");
  handle.className = "group-resize-handle admin-only";
  handle.title = "Drag to resize this column";
  handle.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const startX = ev.clientX;
    const startW = groupEl.offsetWidth;
    groupEl.classList.add("resizing");
    handle.setPointerCapture(ev.pointerId);
    function onMove(e) {
      // Allow the user to resize up to the row's available width so they
      // can make one column eat a whole row if they really want; flex-wrap
      // takes care of pushing the rest down.
      const rowWidth = board.clientWidth - 44;   // padding+scrollbar slack
      const w = Math.max(280, Math.min(rowWidth, startW + (e.clientX - startX)));
      groupEl.style.flex = `0 0 ${w}px`;
      g.width = Math.round(w);
    }
    function onUp() {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      groupEl.classList.remove("resizing");
      saveModelSoon();
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
  });
  // Stop column-drag-to-reorder from triggering when grabbing the handle
  handle.addEventListener("dragstart", (ev) => ev.preventDefault());
  groupEl.appendChild(handle);

  return groupEl;
}

function beginRenameGroup(g, titleArea, h2) {
  const input = document.createElement("input");
  input.type = "text"; input.className = "title-edit"; input.value = g.name;
  titleArea.replaceChild(input, h2);
  input.focus(); input.select();
  function commit(save) {
    const v = input.value.trim();
    if (save && v && v !== g.name) {
      g.name = v;
      g.platformMeta = inferPlatformMeta(v) || g.platformMeta;
      saveModel();
    }
    render();
  }
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") commit(true);
    else if (ev.key === "Escape") commit(false);
  });
  input.addEventListener("blur", () => commit(true));
}

function showGroupMenu(g) {
  if (isReadOnly()) { toast("Read-only mode — switch to Admin to edit", "err"); return; }
  // Platform / group ownership: only the creator (or admin) can edit /
  // delete the platform itself. Adding BBs into it stays open for everyone.
  if (!canModifyId(g.id)) {
    const ownerName = displayName(getOwner(g.id));
    toast(`Platform "${g.name}" was created by ${ownerName || "an admin"} — only they can edit / delete it. You can still add new BBs inside it.`, "err");
    return;
  }
  const choice = prompt(`"${g.name}" — type:\n  e = edit (name + platform)\n  d = delete (and all blocks inside)\n  ↵ = cancel`);
  if (!choice) return;
  const c = choice.trim().toLowerCase();
  if (c === "e" || c === "r") {
    openGroupForm(g.id, null);
  } else if (c === "d") {
    if (!canModifyId(g.id)) { toast(`Platform created by ${displayName(getOwner(g.id))} — only they can delete it.`, "err"); return; }
    if (!confirm(`Delete "${g.name}" and its ${g.entities.length} block${g.entities.length===1?"":"s"}?`)) return;
    deleteGroup(g.id); saveModel(); render();
  }
}

/* Group create/edit form. tabId is required when creating (g is null);
   when editing, tabId is ignored. */
function openGroupForm(groupId, tabId) {
  if (!requireWrite("Read-only mode — sign in to create or edit platforms.")) return;
  const isNew = !groupId;
  const g = isNew ? null : findGroup(groupId);
  const draftName   = g?.name || "";
  const draftMat    = g?.platformMeta?.material  || "";
  const draftThk    = g?.platformMeta?.thickness || "";
  const draftStatus = g?.status || "";
  const draftKind   = g?.kind   || "";

  // Curated platforms list (Manage lists → Platforms) plus any one-off
  // platforms found in existing groups that aren't already in the curated list.
  const knownPlatforms = [];
  const seen = new Set();
  for (const p of platformList()) {
    if (!seen.has(p.name)) {
      seen.add(p.name);
      knownPlatforms.push({ name: p.name, meta: { material: p.material || "", thickness: p.thickness || 0 } });
    }
  }
  for (const tb of MODEL.tabs)
    for (const gg of tb.groups)
      if (gg.platformMeta && gg.name && !seen.has(gg.name)) {
        seen.add(gg.name);
        knownPlatforms.push({ name: gg.name, meta: gg.platformMeta });
      }

  openModal(isNew ? "New sub-entity" : `Edit "${g.name}"`, (body, foot) => {
    body.innerHTML = `
      <div><div class="field-label">Name</div><input id="gf-name" type="text" value="${escapeHtml(draftName)}" placeholder="e.g. 220 nm SOI, Detectors, Modulators"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
        <div>
          <div class="field-label">Status (optional)</div>
          <select id="gf-status">
            <option value="" ${draftStatus === "" ? "selected" : ""}>(none)</option>
            ${statusList().map(s => `<option value="${escapeHtml(s.id)}" ${s.id === draftStatus ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("")}
          </select>
        </div>
        <div>
          <div class="field-label">Category (optional)</div>
          <select id="gf-kind">
            <option value="" ${draftKind === "" ? "selected" : ""}>(none)</option>
            ${categoryList().map(c => `<option value="${escapeHtml(c.id)}" ${c.id === draftKind ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div style="margin-top:12px;">
        <div class="field-label">Quick-pick platform (optional)</div>
        <select id="gf-platform">
          <option value="">— None / custom below —</option>
          ${knownPlatforms.map(p => `<option value="${escapeHtml(p.name)}|${p.meta.material}|${p.meta.thickness}">${escapeHtml(p.name)}  ·  ${p.meta.material} ${p.meta.thickness} nm</option>`).join("")}
        </select>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px;">
          Pick an existing platform to copy its name + material + thickness chips. Or leave blank and fill the fields below.
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;">
        <div><div class="field-label">Material (optional)</div><input id="gf-mat" type="text" placeholder="Si, SiN, LN, …" value="${escapeHtml(draftMat)}"></div>
        <div><div class="field-label">Thickness (nm)</div><input id="gf-thk" type="number" min="1" placeholder="220" value="${escapeHtml(String(draftThk))}"></div>
      </div>
    `;
    body.querySelector("#gf-platform").addEventListener("change", (ev) => {
      const v = ev.target.value;
      if (!v) return;
      const [name, mat, thk] = v.split("|");
      body.querySelector("#gf-name").value = name;
      body.querySelector("#gf-mat").value = mat;
      body.querySelector("#gf-thk").value = thk;
    });
    foot.innerHTML = "";
    foot.append(btn("Cancel", "ghost", closeModal));
    foot.append(btn(isNew ? "Create" : "Save", "primary", () => {
      const name = body.querySelector("#gf-name").value.trim();
      if (!name) { toast("Name is required", "err"); return; }
      const mat = body.querySelector("#gf-mat").value.trim();
      const thkRaw = body.querySelector("#gf-thk").value;
      const thk = thkRaw ? Number(thkRaw) : null;
      const meta = (mat || thk) ? { material: mat || "", thickness: thk || 0 } : (inferPlatformMeta(name) || null);
      const status = body.querySelector("#gf-status").value;
      const kind   = body.querySelector("#gf-kind").value;
      if (isNew) {
        const tab = findTab(tabId);
        if (!tab) { toast("Tab not found — try reloading", "err"); return; }
        const newGroup = {
          id: uid("g"),
          name, platformMeta: meta,
          status, kind,
          collapsed: false,
          entities: [],
        };
        tab.groups.push(newGroup);
        saveModel(); closeModal();
        // Make sure we're on the right tab so the user sees the new column
        activeTabId = tab.id;
        render();
        // Scroll the new column into view
        setTimeout(() => {
          const el = board.querySelector(`.group [data-gid="${newGroup.id}"]`);
          (el || board.lastElementChild)?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        }, 50);
        toast(`Sub-entity "${name}" created — click "+ Add block" inside it to add a BB`);
      } else {
        g.name = name;
        g.platformMeta = meta;
        g.status = status;
        g.kind   = kind;
        saveModel(); closeModal(); render();
      }
    }));
  });
}

function renderCard(e) {
  const el = document.createElement("article");
  el.className = "card";
  el.dataset.eid = e.id;
  const scriptCount = (e.scripts || []).length;
  const dataCount   = allDatasets(e).length;
  const testCount   = (e.testGroups || []).reduce((a,tg) => a + tg.tests.length, 0);
  const sCol = statusColor(e.status);
  const cCol = categoryColor(e.kind);
  const variantCount = (e.subBlocks || []).length;
  el.innerHTML = `
    <div class="card-row1">
      <div class="card-title">${escapeHtml(e.name)}</div>
      ${variantCount ? `<span class="variant-chip" title="Click to open the Variants tab"><b>${variantCount}</b> variant${variantCount===1?"":"s"}</span>` : ""}
      ${e.kind ? `<span class="category-chip" style="background:${cCol}22;color:${cCol};">${escapeHtml(categoryLabel(e.kind))}</span>` : ""}
      <span class="pill" style="background:${sCol}22;color:${sCol};">${escapeHtml(statusLabel(e.status))}</span>
    </div>
    <div class="card-row2">
      <span class="owner"><span class="avatar">${initials(e.owner)}</span>${escapeHtml(e.owner || "—")}</span>
      <span class="badges">
        ${scriptCount ? `<span class="badge">⚙ <b>${scriptCount}</b></span>` : ""}
        ${dataCount   ? `<span class="badge">📊 <b>${dataCount}</b></span>` : ""}
        ${testCount   ? `<span class="badge">🧪 <b>${testCount}</b></span>` : ""}
      </span>
      <span class="updated">${escapeHtml(e.updated || "—")}</span>
    </div>
  `;
  el.addEventListener("click", () => openView(e.id));
  // Clicking the variant-chip on a card jumps straight to its Variants tab
  const vchip = el.querySelector(".variant-chip");
  if (vchip) {
    vchip.addEventListener("click", (ev) => {
      ev.stopPropagation();
      openView(e.id, "variants");
    });
  }
  return el;
}

let activeBBTab = "details";

function openView(id, tab) {
  const found = findEntity(id);
  if (!found) return;
  const e = found.entity;
  activeBBTab = tab || activeBBTab;
  if (!["details","viz","scripts","data","tests","variants","fab","eda"].includes(activeBBTab)) activeBBTab = "details";

  pTitle.textContent = e.name;
  pPill.hidden = false;
  const sC = statusColor(e.status);
  pPill.style.background = sC + "22";
  pPill.style.color = sC;
  pPill.textContent = statusLabel(e.status);

  if (e.kind) {
    const cC = categoryColor(e.kind);
    pKind.style.background = cC + "22";
    pKind.style.color = cC;
    pKind.textContent = categoryLabel(e.kind);
  }

  const totalTests = (e.testGroups || []).reduce((a,tg)=>a+tg.tests.length,0);
  pTabs.hidden = false;
  pTabs.innerHTML = `
    <button data-tab="details" class="${activeBBTab==="details"?"active":""}">Details</button>

    <button data-tab="scripts" class="${activeBBTab==="scripts"?"active":""}" title="Python scripts">Scripts <span class="count">${(e.scripts||[]).length}</span></button>
    <button data-tab="eda"     class="${activeBBTab==="eda"    ?"active":""}" title="EDA tool links">EDA <span class="count">${(e.edaLinks||[]).length}</span></button>

    <button data-tab="tests"   class="${activeBBTab==="tests"  ?"active":""}" title="Test results">Tests <span class="count">${totalTests}</span></button>
    <button data-tab="variants" class="${activeBBTab==="variants"?"active":""}" title="Variants">Variants <span class="count">${(e.subBlocks||[]).length}</span></button>
  `;
  pTabs.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { activeBBTab = b.dataset.tab; openView(id); })
  );

  pBody.innerHTML = "";
  if (activeBBTab === "details") renderDetailsTab(e, found.group);
  else if (activeBBTab === "viz") renderVizTab(e, found.group);
  else if (activeBBTab === "scripts") renderScriptsTab(e);
  else if (activeBBTab === "eda") renderEdaTab(e);
  else if (activeBBTab === "fab") renderFabTab(e);
  else if (activeBBTab === "data") renderDataTab(e);
  else if (activeBBTab === "tests") renderTestsTab(e);
  else if (activeBBTab === "variants") renderVariantsTab(e, found.group);

  pFoot.innerHTML = "";
  // Only render Edit / Delete buttons if the caller can actually modify
  // this BB. Admins can always; user-admins only on BBs they themselves
  // created (or that have no recorded owner — those are admin-owned).
  const mayModify = canModifyId(id);
  const del = document.createElement("button");
  del.className = "danger admin-only"; del.textContent = "Delete block";
  del.addEventListener("click", () => {
    if (!canModifyId(id)) { toast("Only the creator of this BB (or an admin) can delete it.", "err"); return; }
    if (!confirm(`Delete "${e.name}"?`)) return;
    deleteEntity(id); saveModel(); closePanel(); render();
    toast("Block deleted");
  });
  if (!mayModify) del.style.display = "none";
  const right = document.createElement("div");
  right.className = "right";
  const close = document.createElement("button");
  close.className = "ghost"; close.textContent = "Close";
  close.addEventListener("click", closePanel);
  // Per-BB sync — only shown if this BB has at least one recorded GitHub URL.
  // Available in read-only mode too (read-only users replay vetted URLs but
  // can't introduce new ones — see openBBSyncModal + requireWrite()).
  const syncBtn = document.createElement("button");
  const fc = (e.fetchHistory || []).length;
  syncBtn.className = "ghost";
  syncBtn.textContent = `↻ Sync (${fc})`;
  syncBtn.title = fc
    ? `Replay every GitHub URL recorded for ${e.name} (${fc} URL${fc===1?"":"s"}). Available in read-only mode too — only previously-vetted URLs are replayed.`
    : "No GitHub fetch history yet for this BB";
  if (!fc) syncBtn.disabled = true;
  syncBtn.addEventListener("click", () => openBBSyncModal(e));
  const edit = document.createElement("button");
  edit.className = "primary admin-only"; edit.textContent = "Edit";
  edit.addEventListener("click", () => {
    if (!canModifyId(id)) { toast("Only the creator of this BB (or an admin) can edit it.", "err"); return; }
    openEdit(id, found.group.id);
  });
  if (!mayModify) edit.style.display = "none";
  // Tiny "owned by …" pill so user-admins can tell at a glance who created
  // each BB (otherwise the missing Edit button is mysterious). Uses the
  // friendly Label from the guest entry, falling back to email/github.
  const ownerId = getOwner(id);
  if (ownerId) {
    const ownerName = displayName(ownerId);
    const chip = document.createElement("span");
    chip.style.cssText = "font-size:11px;color:var(--text-faint);margin-right:auto;align-self:center;padding-left:8px;";
    chip.textContent = mayModify ? `created by you (${ownerName})` : `created by ${ownerName}`;
    pFoot.appendChild(chip);
  }
  right.append(close, syncBtn, edit);
  pFoot.append(del, right);

  openPanel();
}

/* =================================================================
   GDS PARSER  (port of parse_gds.py to JS)
================================================================= */
const GDS = {
  HEADER:0x00, BGNLIB:0x01, LIBNAME:0x02, UNITS:0x03, ENDLIB:0x04,
  BGNSTR:0x05, STRNAME:0x06, ENDSTR:0x07,
  BOUNDARY:0x08, PATH:0x09, SREF:0x0A, AREF:0x0B, TEXT:0x0C,
  LAYER:0x0D, DATATYPE:0x0E, WIDTH:0x0F, XY:0x10, ENDEL:0x11, SNAME:0x12,
};
function gdsReal(view, off) {
  // GDSII 8-byte real (Excess-64, base 16)
  const b0 = view.getUint8(off);
  const sign = (b0 & 0x80) ? -1 : 1;
  const exp = (b0 & 0x7F) - 64;
  // mantissa = bytes 1..7 / 2^56
  let m = 0;
  for (let i = 1; i < 8; i++) m = m * 256 + view.getUint8(off + i);
  if (m === 0) return 0;
  return sign * (m / Math.pow(2, 56)) * Math.pow(16, exp);
}
function parseGDS(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  let off = 0;
  let userUnit = 1, dbUnit = 1e-9;
  const cells = {};
  let cur = null, curEl = null;
  while (off + 4 <= view.byteLength) {
    const len = view.getUint16(off, false);
    if (len < 4) break;
    const rt = view.getUint8(off + 2);
    const dataOff = off + 4;
    const dataEnd = off + len;
    if (rt === GDS.UNITS && len >= 4 + 16) {
      userUnit = gdsReal(view, dataOff);
      dbUnit   = gdsReal(view, dataOff + 8);
    } else if (rt === GDS.BGNSTR) {
      cur = { name: null, polys: [], paths: [], layers: new Set(),
              minx: null, miny: null, maxx: null, maxy: null, refs: [] };
    } else if (rt === GDS.STRNAME && cur) {
      let s = "";
      for (let i = dataOff; i < dataEnd; i++) {
        const b = view.getUint8(i); if (b === 0) break;
        s += String.fromCharCode(b);
      }
      cur.name = s;
    } else if (rt === GDS.BOUNDARY && cur) {
      curEl = { kind: "boundary", layer: 0, xy: [] };
    } else if (rt === GDS.PATH && cur) {
      curEl = { kind: "path", layer: 0, width: 0, xy: [] };
    } else if (rt === GDS.SREF && cur) {
      curEl = { kind: "sref", layer: -1, xy: [] };
    } else if (rt === GDS.AREF && cur) {
      curEl = { kind: "aref", layer: -1, xy: [] };
    } else if (rt === GDS.TEXT && cur) {
      curEl = { kind: "text", layer: 0, xy: [] };
    } else if (rt === GDS.LAYER && curEl) {
      curEl.layer = view.getInt16(dataOff, false);
      cur.layers.add(curEl.layer);
    } else if (rt === GDS.WIDTH && curEl && curEl.kind === "path") {
      curEl.width = view.getInt32(dataOff, false);
    } else if (rt === GDS.SNAME && curEl) {
      let s = "";
      for (let i = dataOff; i < dataEnd; i++) {
        const b = view.getUint8(i); if (b === 0) break;
        s += String.fromCharCode(b);
      }
      curEl._sname = s;
    } else if (rt === GDS.XY && curEl) {
      const npairs = (dataEnd - dataOff) / 8;
      for (let k = 0; k < npairs; k++) {
        const x = view.getInt32(dataOff + k*8, false);
        const y = view.getInt32(dataOff + k*8 + 4, false);
        curEl.xy.push([x, y]);
        if (cur.minx === null || x < cur.minx) cur.minx = x;
        if (cur.maxx === null || x > cur.maxx) cur.maxx = x;
        if (cur.miny === null || y < cur.miny) cur.miny = y;
        if (cur.maxy === null || y > cur.maxy) cur.maxy = y;
      }
    } else if (rt === GDS.ENDEL && cur && curEl) {
      if (curEl.kind === "boundary") cur.polys.push({ layer: curEl.layer, xy: curEl.xy });
      else if (curEl.kind === "path") cur.paths.push({ layer: curEl.layer, width: curEl.width, xy: curEl.xy });
      else if (curEl.kind === "sref" || curEl.kind === "aref") cur.refs.push(curEl._sname || "?");
      curEl = null;
    } else if (rt === GDS.ENDSTR && cur) {
      cur.layers = [...cur.layers].sort((a,b)=>a-b);
      cells[cur.name] = cur;
      cur = null;
    }
    off = dataEnd;
  }
  // identify top cells
  const referenced = new Set();
  for (const c of Object.values(cells)) for (const r of c.refs) referenced.add(r);
  const out = { userUnit, dbUnit, cells: [] };
  for (const [n, c] of Object.entries(cells)) {
    out.cells.push({
      name: n, isTop: !referenced.has(n), isLeaf: c.refs.length === 0,
      polys: c.polys, paths: c.paths, refs: c.refs, layers: c.layers,
      minx: c.minx, miny: c.miny, maxx: c.maxx, maxy: c.maxy,
    });
  }
  return out;
}

const LAYER_COLORS = {
  3:  "#d29922", 4:  "#db61a2", 5:  "#f5a83a", 6:  "#c4742d",
  22: "#3fb950", 39: "#db61a2", 41: "#a371f7", 60: "#58a6ff",
  99: "#6e7681", 100: "#58a6ff", 203: "#d29922", 204: "#c4742d",
};
function layerColor(l) { return LAYER_COLORS[l] || "#a371f7"; }

function renderGdsCellSVG(cell, dbUnit, userUnit, cellName) {
  // db units → microns
  const scale = dbUnit / 1e-6;
  if (cell.minx === null) {
    return `<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
      <rect x="0" y="0" width="800" height="320" fill="#0b1117"/>
      <text x="400" y="160" text-anchor="middle" fill="#6e7681" font-size="14">Cell "${escapeHtml(cellName)}" has no geometry</text>
    </svg>`;
  }
  // The layer legend lives OUTSIDE the SVG as wrap-friendly HTML chips, so
  // it can never get clipped at the bottom of the SVG viewBox. The SVG
  // itself holds title + drawable area only.
  const W = 1000, H = 560;
  const padX = 48, padTop = 60, padBottom = 24;
  const drawableW = W - 2 * padX;
  const drawableH = H - padTop - padBottom;
  const dx = (cell.maxx - cell.minx) * scale;
  const dy = (cell.maxy - cell.miny) * scale;
  const sx = drawableW / Math.max(dx, 1e-9);
  const sy = drawableH / Math.max(dy, 1e-9);
  const s = Math.min(sx, sy);
  const drawnW = dx * s;
  const drawnH = dy * s;
  const offsetX = padX + (drawableW - drawnW) / 2;
  const offsetTop = padTop + (drawableH - drawnH) / 2;
  const xform = (xy) => xy.map(([x, y]) => {
    const ux = (x - cell.minx) * scale;
    const uy = (y - cell.miny) * scale;
    return [offsetX + ux * s, offsetTop + drawnH - uy * s];
  });
  const polysByLayer = {};
  for (const p of cell.polys) (polysByLayer[p.layer] ||= []).push(xform(p.xy));
  const pathsByLayer = {};
  for (const p of cell.paths) (pathsByLayer[p.layer] ||= []).push({ pts: xform(p.xy), width: Math.max(1, p.width * scale * s) });

  const layerOrder = [...new Set([...cell.polys.map(p=>p.layer), ...cell.paths.map(p=>p.layer)])].sort((a,b)=>a-b);
  const polyEls = layerOrder.flatMap(l => (polysByLayer[l] || []).map(pts => {
    const d = "M " + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L ") + " Z";
    return `<path d="${d}" fill="${layerColor(l)}" fill-opacity="0.55" stroke="${layerColor(l)}" stroke-width="0.5" />`;
  }));
  const pathEls = layerOrder.flatMap(l => (pathsByLayer[l] || []).map(({pts, width}) => {
    const d = "M " + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" L ");
    return `<path d="${d}" fill="none" stroke="${layerColor(l)}" stroke-width="${width.toFixed(1)}" stroke-linecap="round" />`;
  }));

  // SVG = layout only, with a translucent border around the cell extent so
  // you can see how the layout was placed inside the canvas.
  // data-um-per-svgunit lets the measurement tool convert SVG distances
  // back to physical microns (1 SVG unit = 1/s microns).
  const umPerSvg = 1 / s;
  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0b1117;" data-um-per-svgunit="${umPerSvg.toExponential(6)}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b1117"/>
    <rect x="${offsetX}" y="${offsetTop}" width="${drawnW}" height="${drawnH}"
          fill="none" stroke="#2a323d" stroke-width="0.5" stroke-dasharray="4 4" />
    ${polyEls.join("")}
    ${pathEls.join("")}
    <text x="${W/2}" y="26" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="ui-monospace,monospace">${escapeHtml(cellName)}</text>
    <text x="${W/2}" y="46" text-anchor="middle" fill="#6e7681" font-size="11" font-family="ui-monospace,monospace">${dx.toFixed(2)} × ${dy.toFixed(2)} µm  (parsed from .gds)</text>
  </svg>`;

  // Layer legend rendered as wrapping HTML chips below the SVG — never clipped,
  // works for any number of layers.
  const legendChips = layerOrder.map(l =>
    `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);border:1px solid var(--border);border-radius:4px;padding:3px 9px;font-size:11px;font-family:ui-monospace,monospace;">
       <span style="display:inline-block;width:12px;height:12px;background:${layerColor(l)};opacity:0.85;border-radius:2px;"></span>
       <span style="color:var(--text-dim);">L${l}</span>
     </span>`
  ).join("");
  const legend = `<div style="padding:10px 12px 12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--panel-2);border-top:1px solid var(--border);">
    <span style="font-size:11px;color:var(--text-faint);align-self:center;margin-right:4px;">GDS layers:</span>
    ${legendChips}
  </div>`;

  return svg + legend;
}

/* =================================================================
   PANEL: LAYOUT (Visualization) tab
================================================================= */
let _vizMode = "auto";

/* Make any <svg> inside `host` interactively zoom/pan via its viewBox.
   Wheel = zoom around cursor; drag = pan; "Reset" puts it back. Adds a
   small overlay toolbar at the top-right of the host. */
/* Measurement / calibration tool for the Layout viewer.
   Workflow:
   1. User clicks "📏 Measure" — toolbar button toggles "active" mode
   2. User clicks two points on the SVG; a yellow line + label is drawn
      and labelled with the SVG-unit distance and (if known) microns.
   3. "📐 Set scale" lets the user click two points and enter the real
      distance in microns; saves as e.layoutScaleUmPerPx for raw SVGs.
   4. "× Clear" removes all measurement overlays.
   The SVG-unit-to-micron conversion uses, in priority:
     - the SVG's data-um-per-svgunit attribute (set by renderGdsCellSVG)
     - e.layoutScaleUmPerPx (user calibration, persisted)
     - otherwise no µm display, only SVG-unit distance. */
function setupLayoutMeasurement(host, e) {
  const measureBtn  = host.parentElement.querySelector("#layout-measure");
  const scaleBtn    = host.parentElement.querySelector("#layout-setscale");
  const clearBtn    = host.parentElement.querySelector("#layout-clearmeas");
  const svg = host.querySelector("svg");
  if (!measureBtn || !svg) return;
  let mode = null;          // null | "measure" | "scale"
  let firstPt = null;       // {x, y} in SVG coords for the next click
  // Group inside the SVG to hold our overlay strokes
  let overlay = svg.querySelector("[data-meas-overlay]");
  if (!overlay) {
    overlay = document.createElementNS("http://www.w3.org/2000/svg", "g");
    overlay.setAttribute("data-meas-overlay", "1");
    svg.appendChild(overlay);
  }
  function umPerSvg() {
    if (e.layoutScaleUmPerPx && Number.isFinite(e.layoutScaleUmPerPx) && e.layoutScaleUmPerPx > 0) {
      return e.layoutScaleUmPerPx;
    }
    const baked = parseFloat(svg.getAttribute("data-um-per-svgunit") || "");
    return Number.isFinite(baked) && baked > 0 ? baked : 0;
  }
  // Pixels-per-SVG-unit at the current viewBox. We use this to keep the
  // dots and labels at a constant on-screen size when the user zooms.
  function svgUnitsPerScreenPx() {
    const vb = svg.viewBox?.baseVal;
    const rect = svg.getBoundingClientRect();
    if (!vb || !rect.width) return 1;
    return vb.width / rect.width;
  }
  // Re-size every dot, line and label so they read at constant px size.
  // Targets: circle r = DOT_R px, line stroke = LINE_W px, text size = FONT px.
  const DOT_R = 4, LINE_W = 1.5, FONT = 11, HALO = 3;
  function rescaleOverlay() {
    const k = svgUnitsPerScreenPx();
    overlay.querySelectorAll("circle").forEach(c => c.setAttribute("r", DOT_R * k));
    overlay.querySelectorAll("line").forEach(l => l.setAttribute("stroke-width", LINE_W * k));
    overlay.querySelectorAll("text").forEach(t => {
      t.setAttribute("font-size", FONT * k);
      t.setAttribute("stroke-width", HALO * k);
    });
  }
  // Watch the viewBox attribute — the zoom toolbar mutates it.
  const obs = new MutationObserver(() => rescaleOverlay());
  obs.observe(svg, { attributes: true, attributeFilter: ["viewBox"] });
  // Also re-scale on layout resize (modal opens, panel resized, etc.)
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => rescaleOverlay());
    ro.observe(svg);
  }
  // Show a small "scale chip" so the user can tell how the dashboard knows
  // the calibration. Hidden if there's no scale.
  const chip = document.createElement("div");
  // Top-left, *above* the GDS-layer legend (which lives at the bottom of
  // the host as wrap-friendly HTML chips). Top is also where the wheel-zoom
  // toolbar lives — the chip stays on the left so the two never overlap.
  chip.style.cssText = "position:absolute;top:8px;left:8px;background:rgba(13,17,23,0.92);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font:11px ui-monospace,monospace;color:var(--text-dim);z-index:5;display:none;pointer-events:none;";
  function refreshChip() {
    const um = umPerSvg();
    if (!um) { chip.style.display = "none"; return; }
    const src = e.layoutScaleUmPerPx > 0 ? "manual" : "from .gds";
    chip.textContent = `Scale: 1 SVG unit = ${um.toExponential(3)} µm  (${src})`;
    chip.style.display = "block";
  }
  if (getComputedStyle(host).position === "static") host.style.position = "relative";
  host.appendChild(chip);
  refreshChip();
  function svgPointFromEvent(ev) {
    // Convert client-space coords into SVG user coords using the inverse CTM
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const inv = m.inverse();
    const r = pt.matrixTransform(inv);
    return { x: r.x, y: r.y };
  }
  function setMode(m) {
    mode = m;
    firstPt = null;
    measureBtn.classList.toggle("active", m === "measure");
    scaleBtn.classList.toggle("active", m === "scale");
    svg.style.cursor = (m === "measure" || m === "scale") ? "crosshair" : "grab";
  }
  function drawDot(p, color) {
    const k = svgUnitsPerScreenPx();
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
    c.setAttribute("r", DOT_R * k); c.setAttribute("fill", color);
    overlay.appendChild(c);
    return c;
  }
  function drawSegment(a, b, color, label) {
    const k = svgUnitsPerScreenPx();
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y);
    ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
    ln.setAttribute("stroke", color);
    ln.setAttribute("stroke-width", LINE_W * k);
    ln.setAttribute("stroke-linecap", "round");
    overlay.appendChild(ln);
    const tx = document.createElementNS("http://www.w3.org/2000/svg", "text");
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    // Offset label by a few screen pixels worth of SVG units
    tx.setAttribute("x", cx + 6 * k); tx.setAttribute("y", cy - 6 * k);
    tx.setAttribute("fill", color);
    tx.setAttribute("font-size", FONT * k);
    tx.setAttribute("font-family", "ui-monospace,monospace");
    tx.setAttribute("paint-order", "stroke");
    tx.setAttribute("stroke", "#0b1117");
    tx.setAttribute("stroke-width", HALO * k);
    tx.textContent = label;
    overlay.appendChild(tx);
  }
  measureBtn.addEventListener("click", () => setMode(mode === "measure" ? null : "measure"));
  scaleBtn.addEventListener("click", () => setMode(mode === "scale" ? null : "scale"));
  clearBtn?.addEventListener("click", () => { overlay.innerHTML = ""; setMode(null); });

  svg.addEventListener("click", (ev) => {
    if (!mode) return;
    ev.preventDefault();
    ev.stopPropagation();
    const p = svgPointFromEvent(ev);
    if (!firstPt) {
      firstPt = p;
      drawDot(p, mode === "scale" ? "#58a6ff" : "#ffcc33");
      return;
    }
    // Second point — finalise
    const a = firstPt, b = p;
    firstPt = null;
    const dxs = b.x - a.x, dys = b.y - a.y;
    const distSvg = Math.sqrt(dxs * dxs + dys * dys);
    if (mode === "scale") {
      drawDot(b, "#58a6ff");
      drawSegment(a, b, "#58a6ff", `${distSvg.toFixed(1)} px`);
      const real = prompt(`Enter the real distance between these two points in microns (µm):`, "100");
      if (real == null) { setMode(null); return; }
      const umReal = Number(real);
      if (!Number.isFinite(umReal) || umReal <= 0) {
        toast("Need a positive number of microns", "err");
        setMode(null); return;
      }
      e.layoutScaleUmPerPx = umReal / distSvg;
      saveModel();
      toast(`Calibrated: 1 SVG unit = ${e.layoutScaleUmPerPx.toExponential(3)} µm`);
      // Re-render with the new label including µm now
      overlay.innerHTML = "";
      drawDot(a, "#58a6ff"); drawDot(b, "#58a6ff");
      drawSegment(a, b, "#58a6ff", `${umReal.toFixed(2)} µm`);
      refreshChip();
      setMode(null);
    } else {
      // Measure mode
      const factor = umPerSvg();
      const label = factor > 0
        ? `${(distSvg * factor).toFixed(2)} µm`
        : `${distSvg.toFixed(1)} px (no scale — use 📐 Set scale)`;
      drawDot(b, "#ffcc33");
      drawSegment(a, b, "#ffcc33", label);
    }
  });
}

function attachSvgZoom(host) {
  const svg = host.querySelector("svg");
  if (!svg) return;
  // Ensure host has positioning context for the overlay
  if (getComputedStyle(host).position === "static") host.style.position = "relative";
  // Remove any existing toolbar leftover from a previous render
  host.querySelectorAll(".svg-zoom-toolbar").forEach(x => x.remove());
  // Read or synthesise the viewBox
  let vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  if (vb.length !== 4 || vb.some(v => !Number.isFinite(v))) {
    const w = svg.clientWidth || 700, h = svg.clientHeight || 320;
    vb = [0, 0, w, h];
    svg.setAttribute("viewBox", vb.join(" "));
  }
  const initial = vb.slice();
  function setVB(x, y, w, h) {
    vb = [x, y, w, h];
    svg.setAttribute("viewBox", vb.join(" "));
  }
  // Wheel zoom around cursor
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    const fx = (ev.clientX - rect.left) / rect.width;
    const fy = (ev.clientY - rect.top) / rect.height;
    const factor = ev.deltaY > 0 ? 1.15 : 0.87;
    const nw = Math.max(1, vb[2] * factor);
    const nh = Math.max(1, vb[3] * factor);
    const nx = vb[0] + (vb[2] - nw) * fx;
    const ny = vb[1] + (vb[3] - nh) * fy;
    setVB(nx, ny, nw, nh);
  }, { passive: false });
  // Drag to pan
  let dragging = false, lx = 0, ly = 0;
  svg.style.cursor = "grab";
  svg.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".svg-zoom-toolbar")) return;
    dragging = true; lx = ev.clientX; ly = ev.clientY;
    svg.setPointerCapture(ev.pointerId); svg.style.cursor = "grabbing";
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const rect = svg.getBoundingClientRect();
    const dx = (ev.clientX - lx) * (vb[2] / rect.width);
    const dy = (ev.clientY - ly) * (vb[3] / rect.height);
    lx = ev.clientX; ly = ev.clientY;
    setVB(vb[0] - dx, vb[1] - dy, vb[2], vb[3]);
  });
  function endDrag() { dragging = false; svg.style.cursor = "grab"; }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("pointerleave", endDrag);
  // Toolbar
  const tb = document.createElement("div");
  tb.className = "svg-zoom-toolbar";
  tb.style.cssText = "position:absolute;top:8px;right:8px;display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:2px;z-index:5;";
  tb.innerHTML = `
    <button class="mini" data-zact="in"  title="Zoom in">＋</button>
    <button class="mini" data-zact="out" title="Zoom out">−</button>
    <button class="mini" data-zact="fit" title="Reset view">⤢ Reset</button>
  `;
  function zoomCenter(factor) {
    const cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
    const nw = Math.max(1, vb[2] * factor), nh = Math.max(1, vb[3] * factor);
    setVB(cx - nw/2, cy - nh/2, nw, nh);
  }
  tb.querySelector('[data-zact="in"]').addEventListener("click", () => zoomCenter(0.8));
  tb.querySelector('[data-zact="out"]').addEventListener("click", () => zoomCenter(1.25));
  tb.querySelector('[data-zact="fit"]').addEventListener("click", () => setVB(...initial));
  host.appendChild(tb);
}

function renderVizTab(e, g) {

      <button class="ghost" id="layout-setscale" title="Calibrate the layout scale: click two points whose real distance you know, then enter it in microns">📐 Set scale</button>
      <button class="ghost" id="layout-clearmeas" title="Clear all measurement marks">× Clear</button>
      ${e.customSketchUrl ? `<button class="mini danger-mini" id="clear-img" title="Clear uploaded image">× img</button>` : ""}
      ${e.gdsContent ? `<button class="ghost" id="dl-gds" title="Download original GDS">Download .gds</button>` : ""}
      ${e.layoutSvg  ? `<button class="ghost" id="dl-svg" title="Download rendered SVG">Download .svg</button>` : ""}

    </div>
    <div class="viz-stage" id="viz-stage"></div>
    <div style="font-size:11px;color:var(--text-faint);line-height:1.5;">
      <b>Sketch:</b> auto-generated from BB type + parameters when dimensions are on.
      <b>Layout:</b> renders an uploaded <code>.svg</code> directly, or parses a <code>.gds</code>
      in the browser and renders polygons coloured by layer (legend below the layout).
      ${e.gdsName ? `<br><b>Stored GDS:</b> ${escapeHtml(e.gdsName)} (${(e.gdsSize/1024).toFixed(1)} KB)` : ""}
    </div>
  `;
  const stage = pBody.querySelector("#viz-stage");
  const renderStage = () => {

    pBody.querySelectorAll(".xyz-controls").forEach(c => c.remove());
    if (_vizMode === "custom" && e.layoutSvg) {
      stage.innerHTML = e.layoutSvg;
      const svg = stage.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width"); svg.removeAttribute("height");
        svg.style.width = "100%"; svg.style.height = "auto"; svg.style.display = "block";
        if (!svg.getAttribute("preserveAspectRatio")) {
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
      }
    } else {
      _vizMode = "auto";
      stage.innerHTML = e.dimensionsOn ? renderSketchSVG(e, g) :
        `<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
          <text x="350" y="150" text-anchor="middle" fill="#6e7681" font-size="14">Dimensions are turned off for this block</text>
          <text x="350" y="172" text-anchor="middle" fill="#6e7681" font-size="11">Toggle in Edit → "Include dimensions" to draw an auto sketch</text>
        </svg>`;
    }
    attachSvgZoom(stage);
  };
  renderStage();
  pBody.querySelector("#viz-auto").addEventListener("click", () => { if (e.dimensionsOn) { _vizMode = "auto"; renderVizTab(e, g); } });
  pBody.querySelector("#viz-custom").addEventListener("click", () => { if (e.layoutSvg) { _vizMode = "custom"; renderVizTab(e, g); } });

  pBody.querySelector("#upload-btn")?.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to upload layouts.")) return;
    // Layout is part of a BB's identity, so we gate the WHOLE Layout tab
    // by BB ownership. Only the user-admin who created the BB (or any
    // admin) can upload / replace / clear / fetch the layout. Other
    // user-admins, even if they previously uploaded the layout slot, do
    // NOT keep that privilege when the BB belongs to someone else.
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Layout belongs to BB created by ${own} — only they (or an admin) can change the layout.`, "err");
      return;
    }
    pBody.querySelector("#layout-up").click();
  });
  pBody.querySelector("#layout-up")?.addEventListener("change", async (ev) => {
    if (!requireWrite("Read-only mode — sign in to upload layouts.")) { ev.target.value = ""; return; }
    const f = ev.target.files?.[0];
    if (!f) return;
    // Defence-in-depth in case the input was triggered through dev tools.
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Layout belongs to BB created by ${own} — only they (or an admin) can change the layout.`, "err");
      ev.target.value = ""; return;
    }
    const lower = f.name.toLowerCase();
    if (lower.endsWith(".svg") || f.type === "image/svg+xml") {
      const text = await readFileAsText(f);
      e.layoutSvg = text; e.gdsName = ""; e.gdsSize = 0; e.gdsContent = "";
      // Mirror into Uploads (replaces any previous Layout entry for this BB).
      recordLayoutUpload(e, f.name, f.size, btoa(unescape(encodeURIComponent(text))), "svg");
      saveModel(); _vizMode = "custom"; toast("SVG uploaded");
      openView(e.id, "viz");
    } else if (lower.endsWith(".gds")) {
      try {
        const buf = await readFileAsArrayBuffer(f);
        const parsed = parseGDS(buf);
        const cell = pickCellToRender(parsed, e.name);
        if (!cell) { toast("No cells found in this GDS file", "err"); return; }
        const svg = renderGdsCellSVG(cell, parsed.dbUnit, parsed.userUnit, cell.name);
        e.layoutSvg = svg; e.gdsName = f.name; e.gdsSize = f.size;
        // Store the raw GDS bytes verbatim — IndexedDB has plenty of room.
        // Cap raised to 1 GB; the base64 conversion may still fail on the
        // browser's JS-string limit (typically ~500–700 MB of input) and
        // we surface that as a clear error if it does.
        const GDS_STORE_CAP = 1024 * 1024 * 1024;
        let b64 = "";
        if (f.size <= GDS_STORE_CAP) {
          try {
            b64 = arrayBufferToBase64(buf);
            e.gdsContent = b64;
          } catch (err) {
            e.gdsContent = "";
            toast(`Rendered ${cell.name} — original .gds (${(f.size/1024/1024).toFixed(2)} MB) too large to base64-encode in this browser (${err.message}). Download skipped, but the rendered SVG is stored.`, "err");
          }
        } else {
          e.gdsContent = "";
          toast(`Rendered ${cell.name} — original .gds (${(f.size/1024/1024).toFixed(2)} MB) above the 1 GB cap, download skipped`, "err");
        }
        // Mirror into Uploads (replaces any previous Layout entry for this BB).
        recordLayoutUpload(e, f.name, f.size, b64, "gds");
        saveModel(); _vizMode = "custom";
        if (e.gdsContent) toast(`Rendered ${cell.name} (${parsed.cells.length} cells in file)`);
        openView(e.id, "viz");
      } catch (err) {
        toast(`Could not parse GDS: ${err.message}`, "err");
      }
    } else {
      toast("Only .svg or .gds files are accepted", "err");
    }
    ev.target.value = "";
  });
  // Download buttons (only present when content is stored)
  pBody.querySelector("#dl-gds")?.addEventListener("click", () => {
    if (!e.gdsContent) return;
    const bytes = base64ToBytes(e.gdsContent);
    downloadBytes(e.gdsName || `${e.name}.gds`, bytes, "application/octet-stream");
  });
  pBody.querySelector("#dl-svg")?.addEventListener("click", () => {
    if (!e.layoutSvg) return;
    const filename = (e.gdsName ? e.gdsName.replace(/\.gds$/i, "") : e.name) + ".svg";
    downloadText(filename, e.layoutSvg);
  });
  if (e.layoutSvg) {
    const layoutKey       = "layout:" + e.id;
    // Layout clear is gated by BB ownership only — the layout-slot
    // ownership marker isn't enough on its own (a previous uploader who
    // doesn't own the BB must NOT be able to wipe it).
    const layoutMayClear  = canModifyId(e.id);
    const bbOwnerName     = displayName(getOwner(e.id));
    const clearBtn = pBody.querySelector("#clear-svg");
    if (clearBtn && !layoutMayClear) {
      clearBtn.disabled = true;
      clearBtn.style.opacity = "0.45";
      clearBtn.title = `Layout belongs to BB created by ${bbOwnerName || "another user"} — only they (or an admin) can remove it.`;
    }
    clearBtn?.addEventListener("click", () => {
      if (!canModifyId(e.id)) {
        toast(`Layout belongs to BB created by ${bbOwnerName || "another user"} — only they (or an admin) can remove it.`, "err");
        return;
      }
      if (!confirm("Remove the uploaded layout?")) return;
      e.layoutSvg = ""; e.gdsName = ""; e.gdsSize = 0; e.gdsContent = "";
      // Drop the matching entry from MODEL.uploads too — Layout is empty now.
      dropPriorLayoutMirrors(e.id);
      // Forget any recorded layout fetch URL so a future sync doesn't
      // resurrect the file the user just removed.
      if (Array.isArray(e.fetchHistory)) {
        e.fetchHistory = e.fetchHistory.filter(x => x.section !== "layout");
      }
      // Clear the layout-slot ownership marker too.
      if (MODEL.ownership) delete MODEL.ownership[layoutKey];
      saveModel(); _vizMode = "auto"; openView(e.id, "viz");
    });
  }
  // Upload custom image (png/jpg/svg) — gets shown in place of the procedural sketch.
  // Same Layout-tab gate: only the BB creator (or admin) can change this.
  pBody.querySelector("#img-btn")?.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to upload sketch images.")) return;
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Sketch belongs to BB created by ${own} — only they (or an admin) can change it.`, "err");
      return;
    }
    pBody.querySelector("#img-up").click();
  });
  pBody.querySelector("#img-up")?.addEventListener("change", async (ev) => {
    if (!requireWrite("Read-only mode — sign in to upload sketch images.")) { ev.target.value = ""; return; }
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Sketch belongs to BB created by ${own} — only they (or an admin) can change it.`, "err");
      ev.target.value = ""; return;
    }
    const f = ev.target.files?.[0];
    if (!f) return;
    if (f.size > 16 * 1024 * 1024) {
      toast("Image too big — keep custom sketches under 16 MB so the browser doesn't choke", "err");
      ev.target.value = ""; return;
    }
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f);
      });
      e.customSketchUrl = dataUrl;
      e.customSketchName = f.name;
      saveModel(); _vizMode = "auto"; toast("Image uploaded — showing as sketch");
      openView(e.id, "viz");
    } catch (err) { toast(`Upload failed: ${err.message}`, "err"); }
    ev.target.value = "";
  });
  pBody.querySelector("#clear-img")?.addEventListener("click", () => {
    // Sketch image lives on the entity itself; gate by BB ownership.
    if (!canModifyId(e.id)) {
      const ownerName = displayName(getOwner(e.id));
      toast(`Sketch image belongs to BB created by ${ownerName || "another user"} — only they (or an admin) can remove it.`, "err");
      return;
    }
    if (!confirm("Remove the uploaded sketch image?")) return;
    e.customSketchUrl = ""; e.customSketchName = "";
    saveModel(); openView(e.id, "viz");
  });
  // Per-BB Layout GitHub fetch — pulls a single .gds / .svg file from a
  // GitHub URL into this BB's layout slot.
  pBody.querySelector("#layout-fetch-gh")?.addEventListener("click", () => {
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Layout belongs to BB created by ${own} — only they (or an admin) can fetch a new layout.`, "err");
      return;
    }
    openLayoutGithubFetch(e);
  });
  pBody.querySelector("#layout-pr-gh")?.addEventListener("click", () => {
    if (!canModifyId(e.id)) {
      const own = displayName(getOwner(e.id)) || "another user";
      toast(`Layout belongs to BB created by ${own} — only they (or an admin) can open a Pull Request for it.`, "err");
      return;
    }
    openSectionPullRequest(e, "layout");
  });
  // Disable the Layout-tab modify buttons + inputs when the viewer is not
  // the BB owner. They stay visible (so it's clear what an owner could do)
  // but go to 0.45 opacity with a tooltip naming the owner. This matches
  // the per-section ownership pattern used elsewhere.
  if (!canModifyId(e.id)) {
    const ownerLabel = displayName(getOwner(e.id)) || "another user";
    const tip = `Layout belongs to BB created by ${ownerLabel} — only they (or an admin) can change it.`;
    ["#upload-btn", "#img-btn", "#layout-fetch-gh", "#layout-pr-gh", "#clear-svg", "#clear-img"].forEach(sel => {
      const b = pBody.querySelector(sel);
      if (b) { b.disabled = true; b.style.opacity = "0.45"; b.title = tip; }
    });
  }

  // Measurement / calibration tools — operate on the SVG inside #viz-stage.
  // The SVG carries a data-um-per-svgunit attribute for GDS-rendered layouts;
  // for raw SVGs the user calibrates via "Set scale" which is persisted in
  // e.layoutScaleUmPerPx.
  setupLayoutMeasurement(stage, e);
}

/* Layout-specific GitHub fetch — single file (gds/svg) into one BB. */
function openLayoutGithubFetch(e) {
  openModal(`Fetch layout from GitHub → ${e.name}`, (body, foot) => {

      <div><div class="field-label">Repo URL or path (file or folder)</div>
        <input id="lf-url" type="text" placeholder="https://github.com/owner/repo/blob/main/components/strip_wg/strip_wg.gds">
      </div>
      <div style="margin-top:10px;">
        <div class="field-label">Personal access token (optional)</div>
        <input id="lf-token" type="password" placeholder="ghp_…">
      </div>
      <div style="font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.5;">
        Pasting a file URL pulls that exact .gds / .svg into this BB's layout.
        Pasting a folder URL picks the first .gds / .svg whose name matches "<b>${escapeHtml(e.name)}</b>",
        then falls back to the first one if no match. Files &gt; 5 MB are skipped.
      </div>
      <div id="lf-log" style="margin-top:10px;font-family:ui-monospace,monospace;font-size:11px;color:var(--text-dim);max-height:30vh;overflow:auto;background:#0b1117;border:1px solid var(--border);border-radius:6px;padding:10px;white-space:pre-wrap;"></div>
    `;
    const stored = localStorage.getItem("github-token");
    if (stored) body.querySelector("#lf-token").value = stored;
    foot.innerHTML = "";
    foot.append(btn("Cancel", "ghost", closeModal));
    foot.append(btn("Fetch", "primary", async () => {
      const url = body.querySelector("#lf-url").value.trim();
      const token = body.querySelector("#lf-token").value.trim();
      if (!url) { toast("Paste a GitHub URL", "err"); return; }
      const log = body.querySelector("#lf-log");
      log.textContent = "";
      const append = (s) => { log.textContent += s + "\n"; log.scrollTop = log.scrollHeight; };
      try {
        await runLayoutGithubFetch(e, url, token, append);
        recordFetch(e, "layout", url);
        markGithubFetched();
        await saveModel();
        if (panel.classList.contains("open")) openView(e.id, "viz");
        append("\nDone.");
      } catch (err) { append(`\nError: ${err.message}`); }
    }));
