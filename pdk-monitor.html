    ["dragenter","dragover"].forEach(t => dz.addEventListener(t, (ev) => { ev.preventDefault(); ev.stopPropagation(); dz.classList.add("over"); }));
    ["dragleave","drop"].forEach(t => dz.addEventListener(t, (ev) => { ev.preventDefault(); ev.stopPropagation(); dz.classList.remove("over"); }));
    dz.addEventListener("drop", (ev) => handleTestFiles(e, tg, ev.dataTransfer.files, { tabName, refreshTab: refresh }));
    dz.addEventListener("click", () => fileInput.click());
  });
  return wrap;
}

async function handleTestFiles(e, tg, fileList, opts) {
  if (!requireWrite("Read-only mode — sign in to upload test / measurement files.")) return;
  opts = opts || {};
  for (const file of fileList) {
    try { tg.tests.push(await parseTestFile(file)); }
    catch (err) { toast(`Could not load ${file.name}: ${err.message}`, "err"); }
  }
  saveModel();
  if (opts.refreshTab) opts.refreshTab();
  else openView(e.id, opts.tabName || "tests");
}
const IMAGE_EXT = /\.(png|jpe?g|gif|webp|bmp|svg)$/i;
/* Parse a File into the dashboard's "test" shape. Always keeps the original
   bytes (as base64 in `binaryContent`) when the file is small enough, so:
   - Download → returns the exact bytes, every time
   - Create PR → can upload the original file to the repo no matter the
     extension (.gds / .mat / .hdf5 / .npy / proprietary …)
   Cap is 50 MB — IndexedDB on every major browser handles per-blob sizes
   that big without trouble, and the practical bottleneck moves to total
   per-origin quota (50+ MB on Safari, several GB on Chrome / Firefox).
   Larger files keep metadata only. */
const BINARY_STORE_CAP = 50 * 1024 * 1024;
async function parseTestFile(file) {
  const lower = file.name.toLowerCase();
  const baseName = file.name.replace(/\.[^.]+$/, "");
  const isBinary = TEST_BINARY_EXT.test(lower);
  const isImage  = IMAGE_EXT.test(lower);
  const test = {
    id: uid("t"), name: baseName, filename: file.name,
    kind: lower.split(".").pop() || "", size: file.size,
    parsed: null, rawText: null, imageUrl: null, binaryContent: null,
    metadata: { device_id: "", date: todayISO(), instrument: "", conditions: "", notes: "" },
    updated: todayISO(),
  };
  // Always try to keep original bytes as base64 for round-trip download / PR
  // upload. Falls back to text-mode reads below if that's more useful for
  // plotting or in-browser parsing (rawText / parsed).
  if (file.size <= BINARY_STORE_CAP) {
    try {
      const buf = await readFileAsArrayBuffer(file);
      test.binaryContent = arrayBufferToBase64(buf);
    } catch { /* ignore — read errors fall through to other branches */ }
  }
  if (isImage) {
    if (file.size > BINARY_STORE_CAP) {
      toast(`${file.name} too big — kept as metadata only (>${Math.round(BINARY_STORE_CAP / 1024 / 1024)} MB cap)`, "err");
    } else if (test.binaryContent) {
      // Build a data URL from the base64 we already grabbed
      const mime = file.type || (lower.endsWith(".png") ? "image/png" : (lower.endsWith(".svg") ? "image/svg+xml" : "image/jpeg"));
      test.imageUrl = `data:${mime};base64,${test.binaryContent}`;
    }
  } else if (lower.endsWith(".json")) {
    const text = await readFileAsText(file);
    try { test.parsed = normaliseJson(JSON.parse(text)); } catch {}
    test.rawText = text.length <= TEST_MAX_TEXT ? text : text.slice(0, TEST_MAX_TEXT);
  } else if (lower.endsWith(".csv") || lower.endsWith(".txt") || lower.endsWith(".tsv") || lower.endsWith(".dat") || lower.endsWith(".s2p") || lower.endsWith(".s4p")) {
    const text = await readFileAsText(file);
    try { test.parsed = normaliseCsv(text); } catch {}
    test.rawText = text.length <= TEST_MAX_TEXT ? text : text.slice(0, TEST_MAX_TEXT);
  } else if (lower.endsWith(".xlsx") || lower.endsWith(".xls")) {
    const buf = await readFileAsArrayBuffer(file);
    const XLSX = await ensureSheetJS();
    const wb = XLSX.read(buf, { type: "array" });
    try { test.parsed = normaliseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" })); } catch {}
  } else if (!isBinary) {
    try { const text = await readFileAsText(file); test.rawText = text.length <= TEST_MAX_TEXT ? text : text.slice(0, TEST_MAX_TEXT); } catch {}
  }
  return test;
}

  el.querySelector('[data-act="imgshow"]')?.addEventListener("click", showImage);
  el.querySelector('[data-act="imgview"]')?.addEventListener("click", showImage);
  if (t.rawText) el.querySelector('[data-act="raw"]').addEventListener("click", () => {
    openModal(`Raw: ${t.filename}`, (body, foot) => {
      body.innerHTML = `<div class="code-view" style="max-height:60vh;">${escapeHtml(t.rawText)}</div>`;
      foot.innerHTML = ""; foot.append(btn("Close", "primary", closeModal));
    });
  });
  // Plot raw — works for already-parsed tests, but also re-parses rawText on
  // the fly if .parsed wasn't recognized (e.g. a plain numeric .txt that the
  // initial parser failed on). Falls back to a clear error if nothing usable.
  el.querySelector('[data-act="plotraw"]')?.addEventListener("click", () => {
    let parsed = t.parsed;
    if (!parsed && t.rawText) {
      try { parsed = normaliseCsv(t.rawText); } catch {}
      if (!parsed) {
        try { parsed = normaliseJson(JSON.parse(t.rawText)); } catch {}
      }
    }
    if (parsed && parsed.sweep && parsed.traces && parsed.traces.length) {
      plotDataset({ name: t.name, parsed });
    } else {
      toast("Could not extract a plottable sweep + trace from this file", "err");
    }
  });
  // Per-file ownership: a user-admin can only modify (Edit metadata /
  // Rename / Remove) files THEY uploaded. For foreign files the buttons
  // are disabled (not hidden) so the constraint is visible — and a
  // small "by …" chip names the uploader.
  const fileMayModify = canModifyId(t.id);
  const fileOwnerId   = getOwner(t.id);
  const fileOwnerName = displayName(fileOwnerId);
  if (!fileMayModify && fileOwnerId) {
    ["meta", "rename", "del"].forEach(act => {
      const b = el.querySelector(`[data-act="${act}"]`);
      if (b) {
        b.disabled = true;
        b.style.opacity = "0.45";
        b.title = `Uploaded by ${fileOwnerName} — only they (or an admin) can change this file. You can still ⬇ Download it.`;
      }
    });
    const meta = el.querySelector(".item-meta");
    if (meta) {
      const chip = document.createElement("span");
      chip.style.cssText = "font-size:10px;color:var(--text-faint);margin-left:6px;padding:1px 6px;border:1px solid var(--border);border-radius:10px;";
      chip.textContent = `by ${fileOwnerName}`;
      chip.title = `Uploaded by ${fileOwnerName}.`;
      meta.appendChild(chip);
    }
  }
  el.querySelector('[data-act="meta"]')?.addEventListener("click", () => {
    if (!canModifyId(t.id)) { toast(`Uploaded by ${fileOwnerName || "another user"} — only they (or an admin) can edit metadata.`, "err"); return; }
    editTestMetadata(e, tg, t, { tabName, refreshTab: refresh });
  });
  el.querySelector('[data-act="rename"]')?.addEventListener("click", () => {
    if (!canModifyId(t.id)) { toast(`Uploaded by ${fileOwnerName || "another user"} — only they (or an admin) can rename it.`, "err"); return; }
    const n = prompt("Test name:", t.name);
    if (!n || !n.trim()) return;
    t.name = n.trim(); saveModel(); refresh();
  });
  el.querySelector('[data-act="del"]')?.addEventListener("click", () => {
    if (!canModifyId(t.id)) { toast(`Uploaded by ${fileOwnerName || "another user"} — only they (or an admin) can remove it.`, "err"); return; }
    if (!confirm(`Remove "${t.name}"?`)) return;
    tg.tests = tg.tests.filter(x => x.id !== t.id);
    saveModel(); refresh();
  });
  return el;
}
function editTestMetadata(e, tg, t, opts) {
  if (!requireWrite("Read-only mode — sign in to edit test metadata.")) return;
  opts = opts || {};
  const tabName = opts.tabName || "tests";
  const refresh = opts.refreshTab || (() => openView(e.id, tabName));
  const m = t.metadata || (t.metadata = {});
  openModal(`Metadata: ${t.name}`, (body, foot) => {
    body.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div><div class="field-label">Device ID</div><input id="m-dev" type="text" value="${escapeHtml(m.device_id || "")}"></div>
        <div><div class="field-label">Date</div><input id="m-date" type="date" value="${escapeHtml(m.date || "")}"></div>
        <div><div class="field-label">Instrument</div><input id="m-inst" type="text" placeholder="e.g. Keysight N5247B" value="${escapeHtml(m.instrument || "")}"></div>
        <div><div class="field-label">Conditions</div><input id="m-cond" type="text" placeholder="e.g. 25 °C / TE pol / V_bias=0" value="${escapeHtml(m.conditions || "")}"></div>
      </div>
      <div style="margin-top:10px;"><div class="field-label">Notes</div><textarea id="m-notes">${escapeHtml(m.notes || "")}</textarea></div>
    `;
    foot.innerHTML = "";
    foot.append(btn("Cancel", "ghost", closeModal));
    foot.append(btn("Save", "primary", () => {
      m.device_id  = body.querySelector("#m-dev").value.trim();
      m.date       = body.querySelector("#m-date").value;
      m.instrument = body.querySelector("#m-inst").value.trim();
      m.conditions = body.querySelector("#m-cond").value.trim();
      m.notes      = body.querySelector("#m-notes").value.trim();
      t.updated = todayISO();
      saveModel(); closeModal(); refresh();
    }));
  });
}

function runScriptOnTest(e, tg, t) {
  const pyScripts = (e.scripts || []).filter(s => s.language === "python");
  // Default plotter: wavelength on X, power transmission on Y. Title
  // built from metadata. No normalisation, just the parsed values.
  const defaultSrc =
`# Default plotter — wavelength on X, power transmission on Y.
# Reads the parsed test data and the test metadata.
#
# Globals exposed by the dashboard:
#   test    — this single file (parsed + metadata)
#   tests   — every file in folder '${tg.name.replace(/'/g, "\\'")}'

import io, base64
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt

def emit(fig):
    buf = io.BytesIO()
    fig.savefig(buf, format="png", dpi=110, bbox_inches="tight")
    print("DASH_PLOT_PNG:" + base64.b64encode(buf.getvalue()).decode())
    plt.close(fig)

def pretty(name):
    """'wavelength_nm' -> 'wavelength (nm)'"""
    if "_" in name:
        head, unit = name.rsplit("_", 1)
        return f"{head.replace('_', ' ')} ({unit})"
    return name

p = test.get("parsed")
if not p:
    print(f"No parsed data on '{test['name']}'.")
else:
    sweep  = p["sweep"]["values"]
    xname  = p["sweep"].get("name", "wavelength")
    traces = p["traces"]
    meta   = test.get("metadata") or {}

    title_bits = []
    if meta.get("device_id"):  title_bits.append(meta["device_id"])
    title_bits.append(test["name"])
    if meta.get("instrument"): title_bits.append(f"instrument: {meta['instrument']}")
    if meta.get("date"):       title_bits.append(meta["date"])
    title = "  ·  ".join(title_bits)

    fig, ax = plt.subplots(figsize=(9, 4.6))
    for tr in traces:
        ax.plot(sweep, tr["values"], lw=1.0, label=tr.get("name") or "trace")
    ax.set_xlabel(pretty(xname))
    ax.set_ylabel("power transmission")
    ax.set_title(title)
    ax.grid(True, alpha=0.3)
    if len(traces) > 1:
        ax.legend(fontsize=9, loc="best")
    fig.tight_layout()
    emit(fig)

    print(f"Test: {test['name']}")
    print(f"  device     : {meta.get('device_id', '?')}")
    print(f"  instrument : {meta.get('instrument', '?')}")
    print(f"  conditions : {meta.get('conditions', '?')}")
    print(f"  sweep      : {sweep[0]:.3f} - {sweep[-1]:.3f}   ({len(sweep)} pts)")
    for tr in traces:
        ys = [v for v in tr["values"] if v is not None and v == v]
        if not ys: continue
        peak = max(ys); peak_idx = tr["values"].index(peak)
        print(f"  {tr.get('name','trace'):<14} peak {peak:.4e}  @  {sweep[peak_idx]:.3f}   "
              f"min {min(ys):.4e}  max {max(ys):.4e}")
`;
  showRunModal(`Run on ${t.name}`, pyScripts, defaultSrc, (py, src) => {
    py.globals.set("test", py.toPy({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, parsed: t.parsed, rawText: t.rawText, metadata: t.metadata || {} }));
    py.globals.set("tests", py.toPy(tg.tests.map(x => ({ name: x.name, filename: x.filename, parsed: x.parsed, metadata: x.metadata || {} }))));
    return py.runPythonAsync(wrapPython(src));
  });
}

function runScriptOverFolder(e, tg) {
  const pyScripts = (e.scripts || []).filter(s => s.language === "python");
  // Default: overlay every parseable test in the folder on one chart.
  // We pass `tests_json` (a JSON string) instead of `tests` (a JsProxy) so
  // the Python side gets pure Python dicts/lists via json.loads — avoids
  // the nested-JsProxy issues in older Pyodide where `.get(key, default)`
  // silently fails and the loop quits after the first iteration.
  const defaultSrc =
`# Overlay every parseable test in this folder on a single chart.
# Globals provided by the dashboard:
#   tests_json   — JSON string with the list of files in the folder
#                  each item: {name, filename, parsed, metadata, rawText}
#   folder_name  — the folder's display name (string)
#
# Each test's "parsed" is either {sweep: {name, values}, traces: [{name, values}]}
# or None (for files the dashboard couldn't parse). Files that arrived as raw
# text are ALSO pre-parsed by the dashboard before this script runs, so any
# parseable numeric file should show up here.
#
# matplotlib is pre-loaded; "emit(fig)" sends the figure back to the modal.

import json
import matplotlib.pyplot as plt

tests = json.loads(tests_json)
print(f"folder='{folder_name}', files={len(tests)}")

# 1) Bucket everything once so we can report what the script saw.
parseable, no_parsed, empty = [], [], []
for t in tests:
    p = t.get("parsed")
    name = t.get("name") or t.get("filename") or "?"
    if p is None:
        no_parsed.append(name)
        continue
    sweep  = (p.get("sweep")  or {}).get("values") or []
    traces = p.get("traces") or []
    if not sweep or not traces:
        empty.append(name)
        continue
    parseable.append((t, p, sweep, traces))

print(f"  parseable: {len(parseable)},  no parsed data: {len(no_parsed)},  empty: {len(empty)}")
if no_parsed[:3]:
    print(f"  examples (no parsed data): {no_parsed[:3]}")

# 2) Plot every parseable one onto a single axes — and tell the user what
#    we're plotting along the way so silent failures show up in the log.
fig, ax = plt.subplots(figsize=(9.5, 5.0))
xlabel = "x"
n_lines = 0
for t, p, sweep, traces in parseable:
    sweep_meta = p.get("sweep") or {}
    xlabel = sweep_meta.get("name") or xlabel
    md = t.get("metadata") or {}
    label_base = md.get("device_id") or t.get("name") or t.get("filename") or "trace"
    for tr in traces:
        ys = tr.get("values") or []
        if not ys:
            continue
        # Truncate the longer side so plot doesn't error on length mismatch
        n = min(len(sweep), len(ys))
        if n < 2:
            continue
        tr_name = tr.get("name") or "y"
        legend = f"{label_base}:{tr_name}" if len(traces) > 1 else label_base
        ax.plot(sweep[:n], ys[:n], lw=0.8, alpha=0.85, label=legend)
        n_lines += 1
    print(f"  · plotted {label_base} ({len(traces)} trace(s))")

ax.set_xlabel(xlabel)
ax.set_ylabel("value")
ax.set_title(f"{folder_name} — overlay of {len(parseable)}/{len(tests)} files ({n_lines} traces)")
ax.grid(True, alpha=0.3)
if 0 < n_lines <= 24:
    ax.legend(loc="best", fontsize=8, ncol=2, framealpha=0.9)
fig.tight_layout()
emit(fig)

print(f"Plotted {n_lines} traces from {len(parseable)} of {len(tests)} files.")
`;
  showRunModal(`Run over folder "${tg.name}"`, pyScripts, defaultSrc, (py, src) => {
    // Pre-parse any test that has rawText but no parsed data — headerless
    // TXT, whitespace-separated, etc. — so the Python side sees the same
    // data as the in-browser plotter.
    const enriched = tg.tests.map(x => {
      let parsed = x.parsed;
      if (!parsed && x.rawText) {
        try { parsed = normaliseCsv(x.rawText); } catch {}
        if (!parsed) {
          try { parsed = normaliseJson(JSON.parse(x.rawText)); } catch {}
        }
      }
      return { name: x.name, filename: x.filename, parsed, metadata: x.metadata || {}, rawText: x.rawText || null };
    });
    py.globals.set("tests_json", JSON.stringify(enriched));
    py.globals.set("folder_name", tg.name);
    // Backwards-compat alias: also expose `tests` as a JsProxy for any
    // user-edited script still using the old global name.
    py.globals.set("tests", py.toPy(enriched));
    return py.runPythonAsync(wrapPython(src));
  });
}

function showRunModal(title, pyScripts, defaultSrc, runner) {
  openModal(title, (body, foot) => {
    body.innerHTML = `
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <div class="field-label" style="margin:0;">Inline code (matplotlib plotter) — or pick a saved script from this BB</div>
          <label class="tickbox" style="margin-left:auto;">
            <input type="checkbox" id="rs-popout" ${_autoOpenPlots ? "checked" : ""}>
            Auto-open each plot in a new window
          </label>
        </div>
        <select id="rs-pick" style="margin-bottom:10px;">
          <option value="">— Inline code (default plotter) —</option>
          ${pyScripts.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")}
        </select>
        <textarea id="rs-src" class="code">${escapeHtml(defaultSrc)}</textarea>
        <div id="rs-output" style="margin-top:10px;"></div>
      </div>
    `;
    body.querySelector("#rs-popout").addEventListener("change", (ev) => setAutoOpen(ev.target.checked));
    body.querySelector("#rs-pick").addEventListener("change", (ev) => {
      const s = pyScripts.find(x => x.id === ev.target.value);
      body.querySelector("#rs-src").value = s ? (s.source || "") : defaultSrc;
    });
    foot.innerHTML = "";
    foot.append(btn("Close", "ghost", closeModal));
    const dlBtn = btn("Download .txt", "ghost", () => {});
    dlBtn.disabled = true; dlBtn.title = "Run first, then download";
    let lastRun = null;
    dlBtn.addEventListener("click", () => {
      if (!lastRun) return;
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      const slug = (title || "output").replace(/[^A-Za-z0-9_.-]+/g, "_").slice(0, 60);
      downloadText(`${slug}_${stamp}.txt`, buildOutputText(lastRun.captured, lastRun.result, lastRun.error));
    });
    foot.append(dlBtn);
    const runBtn = btn("▶ Run", "primary", async () => {
      runBtn.disabled = true; runBtn.textContent = "Loading…";
      let py;
      try { py = await ensurePyodide(); }
      catch (err) {
        runBtn.disabled = false; runBtn.textContent = "▶ Run";
        toast("Could not load Pyodide: " + err.message, "err"); return;
      }
      const src = body.querySelector("#rs-src").value;
      // Pre-load packages we know the script will need. We pattern-match
      // imports rather than rely solely on loadPackagesFromImports because
      // the latter sometimes misses re-exports like matplotlib.pyplot.
      runBtn.textContent = "Loading packages…";
      const wanted = ["matplotlib"]; // always — the bootstrap imports it
      if (/import\s+numpy|from\s+numpy/.test(src))   wanted.push("numpy");
      if (/import\s+scipy|from\s+scipy/.test(src))   wanted.push("scipy");
      if (/import\s+pandas|from\s+pandas/.test(src)) wanted.push("pandas");
      try {
        await py.loadPackage(wanted);
        if (py.loadPackagesFromImports) await py.loadPackagesFromImports(src);
      } catch (err) {
        toast(`Package load failed: ${err.message}`, "err");
      }
      runBtn.disabled = false; runBtn.textContent = "▶ Run";
      const captured = { stdout: [], stderr: [] };
      py.setStdout({ batched: (s) => captured.stdout.push(s) });
      py.setStderr({ batched: (s) => captured.stderr.push(s) });
      let error = null, result;
      try { result = await runner(py, src); }
      catch (err) { error = err; }
      py.setStdout({}); py.setStderr({});
      lastRun = { captured, result, error };
      const stdoutRaw = (captured.stdout.join("") || "").trim();
      const { cleaned: out, plots } = extractPlots(stdoutRaw);
      const err = (captured.stderr.join("") || "").trim();
      const repr = (result === undefined || result === null) ? "" : String(result);
      const outDiv = body.querySelector("#rs-output");
      outDiv.innerHTML = `
        ${error ? `<div class="field-label" style="color:var(--danger);">Error</div><div class="code-view" style="border-color:var(--danger);">${escapeHtml(String(error))}</div>` : ""}
        ${renderPlotBlock(plots)}
        ${out ? `<div class="field-label" style="margin-top:8px;">stdout</div><div class="code-view">${escapeHtml(out)}</div>` : ""}
        ${err ? `<div class="field-label" style="margin-top:8px;color:var(--danger);">stderr</div><div class="code-view" style="border-color:var(--danger);">${escapeHtml(err)}</div>` : ""}
        ${repr ? `<div class="field-label" style="margin-top:8px;">last expression</div><div class="code-view">${escapeHtml(repr)}</div>` : ""}
        ${(!out && !err && !repr && !error && !plots.length) ? `<div class="panel-empty">Script ran but produced no output.</div>` : ""}
      `;
      wireUpPlotPopouts(outDiv, plots);
      const hasOutput = !!(out || err || repr || error || plots.length);
      dlBtn.disabled = !hasOutput;
      dlBtn.title = hasOutput ? "Save stdout / stderr / result to a .txt file" : "Run first, then download";
    });
    foot.append(runBtn);
  });
}

   PANEL: VARIANTS TAB (sub-blocks)
================================================================= */
function renderVariantsTab(e, g) {
  pBody.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="field-label" style="margin:0;">Variants of "${escapeHtml(e.name)}" (${(e.subBlocks||[]).length})</div>
      <button class="ghost admin-only" id="add-sub" style="margin-left:auto;">+ Add variant</button>
    </div>
    <div id="subs-wrap" style="display:flex;flex-direction:column;gap:8px;"></div>
    <div style="font-size:11px;color:var(--text-faint);line-height:1.5;">
      Use Variants to group multiple versions of the same BB (e.g. MMI v1 / v2 / v3,
      different waveguide widths, generations of the same device). Each variant has
      its own Layout, Scripts, S-matrix, Tests — same panel as the parent.
      Clicking a variant opens it; the parent name stays at the top of the panel
      title for context.
    </div>
  `;
  const wrap = pBody.querySelector("#subs-wrap");
  if (!(e.subBlocks || []).length) {
    wrap.innerHTML = `<div class="panel-empty">No variants yet.</div>`;
  } else {
    e.subBlocks.forEach((sb, idx) => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:8px;";
      const card = renderCard(sb);
      // Override click to navigate to the variant directly
      card.replaceWith(card.cloneNode(true));
      const fresh = card.cloneNode(true);
      fresh.style.flex = "1";
      fresh.addEventListener("click", () => openView(sb.id, "details"));
      // Action buttons next to the card
      const actions = document.createElement("div");
      actions.className = "admin-only";
      actions.style.cssText = "display:flex;gap:4px;flex-direction:column;";
      // Variant ownership: promote / remove only by the variant's creator
      // (or the BB's creator, or an admin).
      const variantMayModify = canModifyId(sb.id) || canModifyId(e.id);
      const variantOwnerName = displayName(getOwner(sb.id));
      const promote = document.createElement("button");
      promote.className = "mini";
      promote.title = "Promote this variant to be the main BB; the current main becomes a variant. All data stays attached.";
      promote.textContent = "↑ Promote";
      if (!variantMayModify && variantOwnerName) {
        promote.disabled = true;
        promote.style.opacity = "0.45";
        promote.title = `Variant created by ${variantOwnerName} — only they (or the BB owner / an admin) can promote it.`;
      }
      promote.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!(canModifyId(sb.id) || canModifyId(e.id))) {
          toast(`Variant created by ${variantOwnerName || "another user"} — only they (or the BB owner / an admin) can promote it.`, "err");
          return;
        }
        if (!confirm(`Promote "${sb.name}" to main? Current main "${e.name}" becomes a variant — all data on both BBs is preserved.`)) return;
        // Pull the sub out of e.subBlocks first
        e.subBlocks.splice(idx, 1);
        // Find the parent group containing e
        const found = findEntity(e.id);
        if (!found) { toast("Could not locate parent — aborting", "err"); return; }
        const arr = (found.parent ? found.parent.subBlocks : found.group.entities);
        const i = arr.findIndex(x => x.id === e.id);
        if (i < 0) { toast("Parent slot not found", "err"); return; }
        // Demote the old main into a variant of the new main
        const oldMain = arr[i];
        const oldSubs = oldMain.subBlocks || [];
        delete oldMain.subBlocks;
        sb.subBlocks = [oldMain, ...oldSubs];
        arr[i] = sb;
        saveModel(); render(); openView(sb.id, "variants");
        toast(`"${sb.name}" is now the main BB`);
      });
      const del = document.createElement("button");
      del.className = "mini danger-mini";
      del.title = "Remove this variant (data is lost)";
      del.textContent = "× Remove";
      if (!variantMayModify && variantOwnerName) {
        del.disabled = true;
        del.style.opacity = "0.45";
        del.title = `Variant created by ${variantOwnerName} — only they (or the BB owner / an admin) can remove it.`;
      }
      del.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!(canModifyId(sb.id) || canModifyId(e.id))) {
          toast(`Variant created by ${variantOwnerName || "another user"} — only they (or the BB owner / an admin) can remove it.`, "err");
          return;
        }
        if (!confirm(`Remove variant "${sb.name}"? All its files / scripts / data will be deleted.`)) return;
        e.subBlocks.splice(idx, 1);
        saveModel(); render(); openView(e.id, "variants");
        toast("Variant removed");
      });
      actions.append(promote, del);
      row.append(fresh, actions);
      wrap.appendChild(row);
    });
  }
  const addBtn = pBody.querySelector("#add-sub");
  if (addBtn) addBtn.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to add variants.")) return;
    try {
      const name = prompt(`Name for the new variant of "${e.name}":`, `${e.name} v2`);
      if (!name || !name.trim()) return;
      // Belt and braces: make sure the entity has a subBlocks array
      if (!Array.isArray(e.subBlocks)) e.subBlocks = [];
      const newSub = {
        id: uid("e"),
        name: name.trim(),
        status: e.status,
        owner: e.owner || "",
        description: "",
        githubUrl: "",
        kind: e.kind,
        bbType: e.bbType,
        dimensionsOn: !!e.dimensionsOn,
        params: JSON.parse(JSON.stringify(e.params || {})),   // clone params
        files: [], scripts: [], datasets: [], testGroups: [], subBlocks: [],
        layoutSvg: "", gdsName: "", gdsSize: 0, gdsContent: "",
        updated: todayISO(),
      };
      e.subBlocks.push(newSub);
      saveModel();
      render();                 // refresh kanban so the count badge updates
      openView(e.id, "variants"); // stay on Variants tab so the new variant is in the list
      toast(`Variant "${name.trim()}" added — see the Variants tab list`);
    } catch (err) {
      console.error("Add variant failed:", err);
      toast(`Could not add variant: ${err.message || err}`, "err");
    }
  });
}

let _activeFabSubId = null;

/* =================================================================

function renderEdaEntry(e, lk, idx, refresh) {
  const card = document.createElement("div");
  card.className = "folder-card";
  const tool = edaToolByName(lk.tool);
  const toolColor = tool ? (tool.color || "#8b949e") : "#8b949e";
  card.innerHTML = `
    <div class="folder-head">
      <span class="fname" style="display:flex;align-items:center;gap:8px;flex:1;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${toolColor};"></span>
        <span data-eda-summary>${escapeHtml(lk.label || (tool ? tool.name : "Untitled"))}</span>
      </span>
      ${lk.url ? `<a href="${escapeHtml(lk.url)}" target="_blank" rel="noopener" title="Open in new tab" style="display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:3px 9px;font-size:11px;font-weight:600;text-decoration:none;">↗ Open</a>` : ""}
      <button class="mini admin-only" data-eda-act="del" title="Remove this EDA entry">×</button>
    </div>
    <div class="folder-actions" style="flex-direction:column;align-items:stretch;padding:10px 12px;gap:8px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <div class="field-label">EDA tool</div>
          <select data-eda-k="tool" style="width:100%;font-size:12px;padding:5px 7px;">
            <option value="" ${!lk.tool ? "selected" : ""}>— pick tool —</option>
            ${edaToolList().map(t => `<option value="${escapeHtml(t.id)}" ${t.id === lk.tool ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}
            <option value="__custom__" ${lk.tool === "__custom__" ? "selected" : ""}>Custom (use the Label field)</option>
          </select>
        </div>
        <div>
          <div class="field-label">Display label (optional)</div>
          <input type="text" data-eda-k="label" placeholder="e.g. IPKISS PDK / strip_wg" value="${escapeHtml(lk.label || "")}" style="width:100%;font-size:12px;padding:5px 7px;">
        </div>
      </div>
      <div>
        <div class="field-label">Repo / link URL</div>
        <input type="url" data-eda-k="url" placeholder="https://github.com/owner/repo or https://luceda.com/…" value="${escapeHtml(lk.url || "")}" style="width:100%;font-size:12px;padding:5px 7px;">
      </div>
      <div>
        <div class="field-label">Description</div>
        <textarea data-eda-k="description" placeholder="Where exactly is this BB inside the tool? Cell name, library path, version, gotchas…" style="min-height:60px;font-size:12px;">${escapeHtml(lk.description || "")}</textarea>
      </div>
    </div>
    <div class="folder-body" data-eda-files style="border-top:1px solid var(--border);padding-top:8px;"></div>
  `;
  // EDA-entry ownership: only the creator (or admin) can edit / delete.
  const edaMayModify = canModifyId(lk.id);
  const edaOwnerName = displayName(getOwner(lk.id));
  if (!edaMayModify) {
    // Disable every editable input + the delete × button.
    card.querySelectorAll("[data-eda-k]").forEach(inp => {
      inp.disabled = true;
      inp.style.opacity = "0.55";
      inp.title = `Created by ${edaOwnerName || "another user"} — only they (or an admin) can edit this entry.`;
    });
    const delBtn = card.querySelector('[data-eda-act="del"]');
    if (delBtn) {
      delBtn.disabled = true;
      delBtn.style.opacity = "0.45";
      delBtn.title = `Created by ${edaOwnerName || "another user"} — only they (or an admin) can remove it.`;
    }
    // Mini "by …" chip on the summary line
    const sum = card.querySelector("[data-eda-summary]");
    if (sum) {
      const chip = document.createElement("span");
      chip.style.cssText = "font-size:10px;color:var(--text-faint);margin-left:6px;padding:1px 6px;border:1px solid var(--border);border-radius:10px;";
      chip.textContent = `by ${edaOwnerName}`;
      sum.appendChild(chip);
    }
  }
  // Wire up inputs (live-save) — guarded by ownership
  card.querySelectorAll("[data-eda-k]").forEach(inp => {
    inp.addEventListener("input", () => {
      if (!canModifyId(lk.id)) return;
      lk[inp.dataset.edaK] = inp.value; saveModelSoon();
    });
    inp.addEventListener("change", () => {
      if (!canModifyId(lk.id)) return;
      lk[inp.dataset.edaK] = inp.value;
      saveModel();
      const tool2 = edaToolByName(lk.tool);
      const sum = card.querySelector("[data-eda-summary]");
      if (sum) sum.firstChild.textContent = lk.label || (tool2 ? tool2.name : "Untitled");
      const dot = card.querySelector(".fname > span");
      if (dot && dot.style) dot.style.background = tool2 ? (tool2.color || "#8b949e") : "#8b949e";
    });
  });
  // Delete — gated
  card.querySelector('[data-eda-act="del"]')?.addEventListener("click", () => {
    if (!canModifyId(lk.id)) { toast(`Created by ${edaOwnerName || "another user"} — only they (or an admin) can remove this entry.`, "err"); return; }
    if (!confirm("Remove this EDA entry?")) return;
    e.edaLinks.splice(idx, 1);
    saveModel(); refresh();
  });
  // Files area — reuse the standard folder card so users get all the
  // existing affordances (drop files, View raw, Plot raw, Run script, …).
  const filesHost = card.querySelector("[data-eda-files]");
  // We need a "folder" object the existing renderer recognises. Reuse lk
  // directly — it already has {id, name, tests}. Provide a name so the head
  // reads cleanly; override removeFromParent so deleting the folder removes
  // the whole entry.
  if (!lk.name) lk.name = "Files";
  filesHost.appendChild(renderFolderCard(e, lk, {
    tabName: "eda",
    refreshTab: refresh,
    removeFromParent: () => {
      e.edaLinks.splice(idx, 1);
    },
  }));
  return card;
}

      / .matlab raw etc.), with <b>View raw</b>, <b>Plot raw</b>, <b>Plot all</b>

  function renderTabs() {
    fabTabsEl.innerHTML = "";

      fabTabsEl.innerHTML = `<div class="panel-empty" style="padding:6px 0;">No sub-tabs yet — click + Add sub-tab to get started.</div>`;

    e.fabTabs.forEach(ft => {
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:inline-flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:2px 4px 2px 10px;font-size:12px;";
      if (ft.id === _activeFabSubId) {
        wrap.style.borderColor = "var(--accent)";
        wrap.style.background  = "var(--accent-soft)";
      }
      const lbl = document.createElement("button");
      lbl.style.cssText = "background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;padding:4px 0;";
      const fileCount = (ft.tests || []).length;
      lbl.innerHTML = `${escapeHtml(ft.name)}${fileCount ? ` <span style="color:var(--text-faint);font-size:11px;">(${fileCount})</span>` : ""}`;
      lbl.addEventListener("click", () => { _activeFabSubId = ft.id; renderTabs(); renderBody(); });
      // Sub-tab ownership: only the creator (or admin) can rename / delete it.
      const subMayModify = canModifyId(ft.id);
      const subOwnerName = displayName(getOwner(ft.id));
      const ren = document.createElement("button");
      ren.className = "menu-btn admin-only";
      ren.title = subMayModify ? "Rename" : `Sub-tab created by ${subOwnerName || "another user"} — only they (or an admin) can rename it.`;
      ren.textContent = "✎";
      ren.style.cssText = "font-size:12px;padding:0 4px;color:var(--text-faint);background:transparent;border:none;cursor:pointer;";
      if (!subMayModify) { ren.disabled = true; ren.style.opacity = "0.45"; }
      ren.addEventListener("click", () => {
        if (!canModifyId(ft.id)) { toast(`Sub-tab created by ${subOwnerName || "another user"} — only they (or an admin) can rename it.`, "err"); return; }
        const v = prompt("Rename sub-tab:", ft.name);
        if (v && v.trim()) { ft.name = v.trim(); saveModel(); renderTabs(); }
      });
      const del = document.createElement("button");
      del.className = "menu-btn admin-only";
      del.title = subMayModify ? "Remove" : `Sub-tab created by ${subOwnerName || "another user"} — only they (or an admin) can remove it.`;
      del.textContent = "×";
      del.style.cssText = "font-size:14px;padding:0 4px;color:var(--text-faint);background:transparent;border:none;cursor:pointer;";
      if (!subMayModify) { del.disabled = true; del.style.opacity = "0.45"; }
      del.addEventListener("click", () => {
        if (!canModifyId(ft.id)) { toast(`Sub-tab created by ${subOwnerName || "another user"} — only they (or an admin) can remove it.`, "err"); return; }
        const fc = (ft.tests || []).length;
        if (!confirm(`Remove sub-tab "${ft.name}"? Its notes${fc ? ` and ${fc} file(s)` : ""} will be lost.`)) return;
        const idx = e.fabTabs.findIndex(x => x.id === ft.id);
        if (idx < 0) return;
        e.fabTabs.splice(idx, 1);
        if (_activeFabSubId === ft.id) _activeFabSubId = e.fabTabs[0]?.id || null;
        saveModel(); renderTabs(); renderBody();
      });
      wrap.append(lbl, ren, del);
      fabTabsEl.appendChild(wrap);
    });
  }

  function renderBody() {
    fabBody.innerHTML = "";
    if (!_activeFabSubId) {
      fabBody.innerHTML = `<div class="panel-empty">Add a sub-tab to start writing fabrication notes.</div>`;
      return;
    }
    const ft = e.fabTabs.find(x => x.id === _activeFabSubId);
    if (!ft) return;

    // Description / notes — read-only when the sub-tab belongs to another
    // user-admin (or the admin), so user-admins can READ admin-authored
    // notes but can't edit them in place.
    const ftMayModify   = canModifyId(ft.id);
    const ftOwnerName   = displayName(getOwner(ft.id));
    const noteWrap = document.createElement("div");
    noteWrap.innerHTML = `<div class="field-label">Description / notes${(!ftMayModify && ftOwnerName) ? ` <span style="color:var(--text-faint);font-weight:normal;font-size:11px;">— read-only (by ${escapeHtml(ftOwnerName)})</span>` : ""}</div>`;
    const ta = document.createElement("textarea");
    ta.style.cssText = "width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:13px;";
    ta.value = ft.notes || "";
    ta.placeholder = "Process flow, mask layer notes, yield, special handling, run history…";
    if (!ftMayModify && ftOwnerName) {
      ta.readOnly = true;
      ta.title = `Notes authored by ${ftOwnerName} — only they (or an admin) can edit.`;
      ta.style.opacity = "0.85";
    } else {
      ta.addEventListener("input", () => { ft.notes = ta.value; saveModelSoon(); });
    }
    noteWrap.appendChild(ta);
    fabBody.appendChild(noteWrap);

    // Folder card — fully reuses the Tests / S-matrix folder UI.
    // We pass an opts object so renames / deletes inside the card refresh the
    // Fabrication tab (not the Tests tab) and the Delete-folder logic clears
    // the active sub-tab.
    fabBody.appendChild(renderFolderCard(e, ft, {
      tabName: "fab",
      refreshTab: refresh,
      removeFromParent: () => {
        const idx = e.fabTabs.findIndex(x => x.id === ft.id);
        if (idx >= 0) e.fabTabs.splice(idx, 1);
        if (_activeFabSubId === ft.id) _activeFabSubId = e.fabTabs[0]?.id || null;
      },
    }));
  }

  pBody.querySelector("#fab-fetch-gh")?.addEventListener("click", () => openSectionGithubFetch(e, "fab"));
  pBody.querySelector("#fab-pr-gh")?.addEventListener("click", () => openSectionPullRequest(e, "fab"));
  pBody.querySelector("#fab-add")?.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to add fabrication sub-tabs.")) return;
    const v = prompt("Name for the new fabrication sub-tab (e.g. 'Process flow', 'Mask set', 'Yield', 'Run history'):");
    if (!v || !v.trim()) return;
    const ft = { id: uid("ft"), name: v.trim(), notes: "", tests: [] };
    e.fabTabs.push(ft);
    _activeFabSubId = ft.id;
    saveModel(); renderTabs(); renderBody();
  });

  renderTabs(); renderBody();
}

/* =================================================================
   ANALYSIS PANEL  (cross-platform select + export)
================================================================= */
function flattenAllEntities() {
  // Returns [{e, g, tab, parent}] across the whole tree, including sub-blocks.
  const out = [];
  function walk(arr, g, tab, parent) {
    for (const e of arr) {
      out.push({ e, g, tab, parent: parent || null });
      if (Array.isArray(e.subBlocks) && e.subBlocks.length) walk(e.subBlocks, g, tab, e);
    }
  }
  for (const tb of MODEL.tabs)
    for (const g of tb.groups) walk(g.entities, g, tb, null);
  return out;
}

let _anaSelected = new Set();
let _anaFilter = "";   // "" | "active" | "passive" | "wgds" | "wtests"

/* Lightweight live-count update for keystroke filtering — keeps the typed
   keyword as part of the filter without re-rendering everything. */
function refreshAnalysisCount(body) {
  const all = flattenAllEntities();
  let visible = all;
  if (_anaFilter === "wtests")  visible = visible.filter(x => (x.e.testGroups || []).some(tg => tg.tests.length));
  if (_anaFilter === "wsmatrix")visible = visible.filter(x => allDatasets(x.e).length);
  if (_anaFilter === "active")  visible = visible.filter(x => x.e.kind === "active");
  if (_anaFilter === "passive") visible = visible.filter(x => x.e.kind === "passive");
  if (_anaFilter === "pd")      visible = visible.filter(x => /photodetector|photo|^pd$|detector/i.test(x.e.bbType + " " + x.e.name + " " + (x.e.kind || "")));
  if (_anaFilter === "laser")   visible = visible.filter(x => /laser|source|gain|sld/i.test(x.e.bbType + " " + x.e.name + " " + (x.e.kind || "")));
  if (_anaFilter === "te")      visible = visible.filter(x => /\bTE\b|\bTE0\b|\bTE-pol\b/i.test(x.e.name + " " + (x.e.description || "")));
  if (_anaFilter === "tm")      visible = visible.filter(x => /\bTM\b|\bTM0\b|\bTM-pol\b/i.test(x.e.name + " " + (x.e.description || "")));
  if (_anaFilter === "rib")     visible = visible.filter(x => /\brib\b/i.test(x.e.name + " " + x.e.bbType + " " + (x.e.description || "")));
  if (_anaFilter === "strip")   visible = visible.filter(x => /\bstrip\b/i.test(x.e.name + " " + x.e.bbType + " " + (x.e.description || "")));
  if (_anaFilter === "wgds")    visible = visible.filter(x => x.e.layoutSvg || x.e.gdsName);
  if (_anaPlatform) visible = visible.filter(x => x.g.name === _anaPlatform);
  const liveTyped = (body.querySelector("#ana-q")?.value || "").toLowerCase().trim();
  const allKws = [..._anaKeywords.map(k => k.toLowerCase()), ...(liveTyped ? [liveTyped] : [])];
  if (allKws.length) {
    visible = visible.filter(x => {
      const tnames = (x.e.testGroups || []).flatMap(tg =>
        tg.tests.map(t => t.name + " " + (t.filename || "") + " " + (t.metadata?.device_id || "")));
      const hay = [x.e.name, x.e.description || "", x.g.name, x.tab.name, ...tnames].join(" ").toLowerCase();
      return allKws.every(kw => hay.includes(kw));
    });
  }
  const span = body.querySelector(".analysis-side > div > span");
  // The first <span> in the count row holds the "N matches" text; safer is
  // to re-find by content prefix.
  body.querySelectorAll(".analysis-side span").forEach(s => {
    if (/match(es)?$/.test(s.textContent.trim())) {
      s.textContent = `${visible.length} match${visible.length===1?"":"es"}`;
    }
  });
}

function refreshAnalysis(body) {
  const all = flattenAllEntities();
  // Apply quick-filter (active/passive/wgds/wtests)
  let visible = all;
  if (_anaFilter === "wtests")  visible = visible.filter(x => (x.e.testGroups || []).some(tg => tg.tests.length));
  if (_anaFilter === "wsmatrix")visible = visible.filter(x => allDatasets(x.e).length);
  if (_anaFilter === "active")  visible = visible.filter(x => x.e.kind === "active");
  if (_anaFilter === "passive") visible = visible.filter(x => x.e.kind === "passive");
  if (_anaFilter === "pd")      visible = visible.filter(x => /photodetector|photo|^pd$|detector/i.test(x.e.bbType + " " + x.e.name + " " + (x.e.kind || "")));
  if (_anaFilter === "laser")   visible = visible.filter(x => /laser|source|gain|sld/i.test(x.e.bbType + " " + x.e.name + " " + (x.e.kind || "")));
  if (_anaFilter === "te")      visible = visible.filter(x => /\bTE\b|\bTE0\b|\bTE-pol\b/i.test(x.e.name + " " + (x.e.description || "")));
  if (_anaFilter === "tm")      visible = visible.filter(x => /\bTM\b|\bTM0\b|\bTM-pol\b/i.test(x.e.name + " " + (x.e.description || "")));
  if (_anaFilter === "rib")     visible = visible.filter(x => /\brib\b/i.test(x.e.name + " " + x.e.bbType + " " + (x.e.description || "")));
  if (_anaFilter === "strip")   visible = visible.filter(x => /\bstrip\b/i.test(x.e.name + " " + x.e.bbType + " " + (x.e.description || "")));
  if (_anaFilter === "wgds")    visible = visible.filter(x => x.e.layoutSvg || x.e.gdsName);
  // Platform dropdown
  if (_anaPlatform) visible = visible.filter(x => x.g.name === _anaPlatform);
  // Keyword chips — every chip must match (AND). Free-text typed in the
  // search box that hasn't been added as a chip yet still filters live.
  function buildHaystack(x) {
    const tnames = (x.e.testGroups || []).flatMap(tg =>
      tg.tests.map(t => t.name + " " + (t.filename || "") + " " + (t.metadata?.device_id || "") + " " + (t.metadata?.instrument || "") + " " + (t.metadata?.notes || "")));
    return [
      x.e.name, x.e.description || "", x.e.kind, x.e.bbType, x.e.status, x.e.owner || "",
      x.e.githubUrl || "", x.g.name, x.tab.name,
      ...(x.e.edaTools || []).map(edaToolLabel),
      ...(x.e.scripts || []).map(s => s.name + " " + s.language),
      ...allDatasets(x.e).map(d => d.name + " " + (d.filename || "")),
      ...tnames,
    ].join(" ").toLowerCase();
  }
  const liveTyped = (body.querySelector("#ana-q")?.value || "").toLowerCase().trim();
  const allKws = [..._anaKeywords.map(k => k.toLowerCase()), ...(liveTyped ? [liveTyped] : [])];
  if (allKws.length) {
    visible = visible.filter(x => {
      const hay = buildHaystack(x);
      return allKws.every(kw => hay.includes(kw));
    });
  }

  // Collect unique platform names from groups (every sub-entity is a "platform" in this dropdown)
  const platformNames = [];
  const seen = new Set();
  for (const tb of MODEL.tabs)
    for (const g of tb.groups)
      if (!seen.has(g.name)) { seen.add(g.name); platformNames.push(g.name); }

  // Side panel: filter chips + keyword search + platform select + grouped checkbox list
  const side = body.querySelector("#ana-side");
  const filters = [
    ["",          `All (${all.length})`],
    ["wtests",    "With test data"],
    ["wsmatrix",  "With S-matrix"],
    ["active",    "Active"],
    ["passive",   "Passive"],
    ["pd",        "PD"],
    ["laser",     "Laser"],
    ["te",        "TE-mode"],

  side.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;">

  const qInputEl = side.querySelector("#ana-q");

  if (qInputEl) {

  const main = body.querySelector("#ana-main");
  main.innerHTML = `

    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-bottom:6px;">
      <span style="color:var(--text-faint);font-size:11px;">Status filter:</span>
      <button class="pill-btn" data-pie-status="" style="font-size:11px;padding:3px 8px;">All</button>
      ${statusList().map(s => `<button class="pill-btn" data-pie-status="${escapeHtml(s.id)}" style="font-size:11px;padding:3px 8px;border-color:${escapeHtml(s.color)};color:${escapeHtml(s.color)};">${escapeHtml(s.name)}</button>`).join("")}
      <span id="ana-pie-count" style="margin-left:auto;color:var(--text-faint);font-size:11px;"></span>

    <div style="position:relative;background:#0b1117;border:1px solid var(--border);border-radius:6px;padding:10px;">
      <div id="ana-pie-stage" style="display:grid;grid-template-columns:1fr;gap:8px;">

  // Pie chart — Technology-Platforms tab only, filtered by status pills.
  // Click a slice to drill into status / category for that platform.
  (async () => {
    let Chart;
    try { Chart = await ensureChartJS(); } catch { return; }
    let _chart = null, _chart2 = null, _drillPlatform = null, _statusFilter = "";
    const root = getComputedStyle(document.documentElement);
    const palette = ["--t1","--t2","--t3","--t4","--t5","--t6"];
    const colorAt = i => root.getPropertyValue(palette[i % palette.length]).trim() || "#58a6ff";

    // Restrict the pie to the "Technology Platforms" tab — fall back to the
    // first tab that contains groups with platformMeta if a user renamed it.
    // Counts only top-level BBs (variants are not included as separate BBs).
    function platformRows() {
      const tab = MODEL.tabs.find(t => t.name === "Technology Platforms")
                 || MODEL.tabs.find(t => t.groups?.some(g => g.platformMeta))
                 || MODEL.tabs[0];
      if (!tab) return [];
      const rows = [];
      for (const g of (tab.groups || [])) {
        for (const e of (g.entities || [])) rows.push({ e, g });

      return rows;
    }
    function applyStatusFilter(rows) {
      if (!_statusFilter) return rows;

    function syncPills() {
      main.querySelectorAll("[data-pie-status]").forEach(b => {
        b.classList.toggle("active", (b.dataset.pieStatus || "") === _statusFilter);
        if (b.classList.contains("active")) {

          b.style.background = "transparent";

    }

    function makeChart(canvas, labels, counts, colors, title) {
      return new Chart(canvas.getContext("2d"), {
        type: "doughnut",
        data: { labels, datasets: [{ data: counts, backgroundColor: colors, borderColor: "#0b1117", borderWidth: 2 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,         // honour the wrapper's height
          layout: { padding: { right: 200 } }, // reserve space for the summary overlay
          plugins: {
            legend: { position: "right", align: "start", labels: { color: "#e6edf3", font: { size: 10 }, boxWidth: 10, padding: 6 } },
            tooltip: { callbacks: { label: (c) => `${c.label}: ${c.parsed} (${(c.parsed/counts.reduce((a,b)=>a+b,0)*100).toFixed(1)}%)` } },
            title: title ? { display: true, text: title, color: "#e6edf3", font: { size: 12, weight: "600" }, padding: { top: 0, bottom: 4 } } : { display: false },
          },
        },
      });
    }
    function renderSummary(rows, label) {
      const tab = MODEL.tabs.find(t => t.name === "Technology Platforms")
                 || MODEL.tabs.find(t => t.groups?.some(g => g.platformMeta))
                 || MODEL.tabs[0];
      const byPlat = {};
      for (const r of rows) byPlat[r.g.name] = (byPlat[r.g.name] || 0) + 1;
      const lines = [];
      lines.push(`<div style="color:var(--text-faint);font-size:11px;margin-bottom:6px;">${escapeHtml(label || "Counts")}</div>`);
      let total = 0;
      for (const g of (tab.groups || [])) {
        const n = byPlat[g.name] || 0;
        total += n;
        const stripe = groupStripeColor(g) || "var(--text-faint)";
        lines.push(`<div style="display:flex;align-items:center;gap:8px;padding:2px 0;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${stripe};"></span><span style="flex:1;color:var(--text-dim);">${escapeHtml(g.name)}</span><b style="color:var(--text);">${n}</b></div>`);
      }
      lines.push(`<div style="border-top:1px dashed var(--border);margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;"><span style="color:var(--text-dim);">Total BBs</span><b style="color:var(--accent);">${total}</b></div>`);
      main.querySelector("#ana-pie-summary-body").innerHTML = lines.join("");
    }
    function redraw() {
      const c1 = main.querySelector("#ana-pie");
      const c2 = main.querySelector("#ana-pie-2");
      const stage = main.querySelector("#ana-pie-stage");
      const allRows = platformRows();
      const rows = applyStatusFilter(allRows);
      const cnt = rows.length;
      const totalAll = allRows.length;
      main.querySelector("#ana-pie-count").textContent =
        _statusFilter
          ? `${cnt} / ${totalAll} BBs match "${statusLabel(_statusFilter)}"`
          : `${cnt} BBs across ${new Set(rows.map(r => r.g.name)).size} platforms`;

      if (_chart)  { _chart.destroy();  _chart  = null; }
      if (_chart2) { _chart2.destroy(); _chart2 = null; }

      // Wrappers with explicit heights are what `maintainAspectRatio:false`
      // sizes against, so we control the canvas height not the canvas itself.
      const w1 = c1.parentElement, w2 = c2.parentElement;
      if (!_drillPlatform) {
        // Single chart — by platform
        const byPlatform = {};
        for (const r of rows) byPlatform[r.g.name] = (byPlatform[r.g.name] || 0) + 1;

        const tab = MODEL.tabs.find(t => t.name === "Technology Platforms")

        main.querySelector("#ana-chart-back").style.display = "none";
        renderSummary(rows, _statusFilter ? `BBs matching "${statusLabel(_statusFilter)}"` : "BBs per platform");

        const drilled = rows.filter(r => r.g.name === _drillPlatform);
        const byStatus = {}, byCat = {};
        for (const r of drilled) {
          const s = statusLabel(r.e.status) || "—";

          byCat[c]    = (byCat[c]    || 0) + 1;

        const sLabels = Object.keys(byStatus), sCounts = Object.values(byStatus);
        const sColors = sLabels.map(k => {
          const m = statusList().find(x => x.name === k);
          return m ? m.color : colorAt(sLabels.indexOf(k));
        });
        const cLabels = Object.keys(byCat), cCounts = Object.values(byCat);
        const cColors = cLabels.map(k => {

          return m ? m.color : colorAt(cLabels.indexOf(k) + 3);

        stage.style.gridTemplateColumns = "1fr";
        w1.style.display = "block";

        main.querySelector("#ana-chart-mode").textContent = `— ${_drillPlatform}: ${drilled.length} BBs (status + category)`;
        main.querySelector("#ana-chart-back").style.display = "";
        // Summary in drill: per-status + per-category counts in this platform
        const sumLines = [];
        sumLines.push(`<div style="color:var(--text-faint);font-size:11px;margin-bottom:6px;">${escapeHtml(_drillPlatform)} · ${drilled.length} BB${drilled.length===1?"":"s"}</div>`);
        sumLines.push(`<div style="color:var(--text-faint);font-size:11px;margin-top:4px;">By status</div>`);
        for (const [k, v] of Object.entries(byStatus)) {
          const m = statusList().find(x => x.name === k);
          const stripe = m ? m.color : "var(--text-faint)";
          sumLines.push(`<div style="display:flex;align-items:center;gap:8px;padding:2px 0;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${stripe};"></span><span style="flex:1;color:var(--text-dim);">${escapeHtml(k)}</span><b style="color:var(--text);">${v}</b></div>`);
        }
        sumLines.push(`<div style="color:var(--text-faint);font-size:11px;margin-top:8px;">By category</div>`);
        for (const [k, v] of Object.entries(byCat)) {
          const m = categoryList().find(x => x.name === k);
          const stripe = m ? m.color : "var(--text-faint)";
          sumLines.push(`<div style="display:flex;align-items:center;gap:8px;padding:2px 0;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${stripe};"></span><span style="flex:1;color:var(--text-dim);">${escapeHtml(k)}</span><b style="color:var(--text);">${v}</b></div>`);
        }
        main.querySelector("#ana-pie-summary-body").innerHTML = sumLines.join("");
      }
      // Re-bind onClick handler on the platform chart to drill in
      if (!_drillPlatform && _chart) {
        _chart.options.onClick = (_evt, elements) => {
          if (!elements || !elements.length) return;
          const idx = elements[0].index;
          _drillPlatform = _chart.data.labels[idx];
          redraw();
        };
        _chart.update();
      }
    }
    // Wire pill clicks to live-filter the pie
    main.querySelectorAll("[data-pie-status]").forEach(b => {
      b.addEventListener("click", () => {
        _statusFilter = b.dataset.pieStatus || "";
        syncPills(); redraw();
      });
    });
    main.querySelector("#ana-chart-back").addEventListener("click", () => {
      _drillPlatform = null; redraw();
    });
    main.querySelector("#ana-chart-dl")?.addEventListener("click", () => {
      const stamp = todayISO();
      const tag = _drillPlatform ? `_${_drillPlatform.replace(/\s+/g, "-")}` : "";
      // Re-render onto a new canvas with the dashboard's dark bg painted in,
      // so the light-coloured legend / title text stays readable when the PNG
      // is opened on a white background (Slack, Word, image viewers, etc).
      const exportPng = (chart, filename) => {
        const src = chart.canvas;
        const out = document.createElement("canvas");
        out.width  = src.width;
        out.height = src.height;
        const ctx = out.getContext("2d");
        ctx.fillStyle = "#0b1117";
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(src, 0, 0);
        const a = document.createElement("a");
        a.href = out.toDataURL("image/png");
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
      };
      if (_chart)  exportPng(_chart,  `pdk-pie${tag}_${_drillPlatform ? "status" : "platforms"}_${stamp}.png`);
      if (_chart2) exportPng(_chart2, `pdk-pie${tag}_category_${stamp}.png`);
    });

  function preview(text) {

function csvEsc(v) {
  if (v == null) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportSmatrixCsv(selected) {
  // One block of rows per dataset, with sweep + traces side-by-side.
  const out = [];
  for (const r of selected) {
    for (const d of allDatasets(r.e)) {
      out.push(`# block: ${r.e.name}  ·  platform: ${r.g.name}  ·  dataset: ${d.name}`);
      const sw = d.parsed?.sweep?.values || [];
      const tr = d.parsed?.traces || [];
      out.push([d.parsed?.sweep?.name || "x", ...tr.map(t => t.name)].map(csvEsc).join(","));
      for (let i = 0; i < sw.length; i++) {
        out.push([sw[i], ...tr.map(t => t.values?.[i] ?? "")].map(csvEsc).join(","));
      }
      out.push("");
    }
  }
  if (!out.length) return "# No S-matrix datasets in selection\n";
  return out.join("\n") + "\n";
}

function exportTestSummaryCsv(selected) {
  // One row per test file with metadata + quick stats.
  const rows = [["block", "platform", "folder", "test", "filename", "kind", "device_id", "date", "instrument", "n_pts", "peak_y", "peak_x", "min_y", "max_y"]];
  for (const r of selected) {
    for (const tg of (r.e.testGroups || [])) {
      for (const t of tg.tests) {
        const sw = t.parsed?.sweep?.values || [];
        const ys = (t.parsed?.traces?.[0]?.values || []).filter(v => v != null && !isNaN(v));
        let peakY = "", peakX = "", minY = "", maxY = "";
        if (ys.length) {
          peakY = Math.max(...ys);
          const idx = (t.parsed.traces[0].values || []).indexOf(peakY);
          peakX = idx >= 0 ? sw[idx] : "";
          minY = Math.min(...ys);
          maxY = peakY;
        }
        rows.push([
          r.e.name, r.g.name, tg.name, t.name, t.filename, t.kind,
          t.metadata?.device_id || "", t.metadata?.date || "", t.metadata?.instrument || "",
          sw.length, peakY, peakX, minY, maxY,
        ]);
      }
    }
  }
  return rows.map(r => r.map(csvEsc).join(",")).join("\n") + "\n";
}

function exportTestDataLongCsv(selected) {
  // Long-format: one row per (test, point), useful for pandas / R loaders.
  const rows = [["block", "platform", "folder", "test", "device_id", "x_name", "x", "trace", "y"]];
  for (const r of selected) {
    for (const tg of (r.e.testGroups || [])) {
      for (const t of tg.tests) {
        if (!t.parsed) continue;
        const sw = t.parsed.sweep.values || [];
        const xName = t.parsed.sweep.name || "x";
        for (const tr of t.parsed.traces || []) {
          for (let i = 0; i < sw.length; i++) {
            rows.push([r.e.name, r.g.name, tg.name, t.name, t.metadata?.device_id || "", xName, sw[i], tr.name, tr.values?.[i] ?? ""]);
          }
        }
      }
    }
  }
  return rows.map(r => r.map(csvEsc).join(",")).join("\n") + "\n";
}

function exportSelectedJson(selected) {
  const out = selected.map(r => ({
    block: r.e.name, platform: r.g.name, tab: r.tab.name,
    parent: r.parent?.name || null,
    kind: r.e.kind, bbType: r.e.bbType, status: r.e.status,
    githubUrl: r.e.githubUrl || "",
    params: r.e.params || {},
    datasets: allDatasets(r.e).map(d => ({
      name: d.name, kind: d.kind, filename: d.filename, parsed: d.parsed,
    })),
    testGroups: (r.e.testGroups || []).map(tg => ({
      name: tg.name,
      tests: tg.tests.map(t => ({
        name: t.name, filename: t.filename, kind: t.kind,
        metadata: t.metadata, parsed: t.parsed,
      })),
    })),
  }));
  return JSON.stringify({ exported: new Date().toISOString(), blocks: out }, null, 2);
}

function exportOverviewMarkdown(selected) {
  const lines = [`# PDK selection — ${new Date().toISOString().slice(0, 10)}`,
                 `${selected.length} block${selected.length === 1 ? "" : "s"} selected`, ""];
  // Group by tab+platform
  const byPath = new Map();
  for (const r of selected) {
    const key = `${r.tab.name} ▸ ${r.g.name}`;
    if (!byPath.has(key)) byPath.set(key, []);
    byPath.get(key).push(r);
  }
  for (const [path, rows] of byPath) {
    lines.push(`## ${path}`, "");
    lines.push("| Block | Type | Category | Status | S-mat | Tests | GitHub |");
    lines.push("| --- | --- | --- | --- | --- | --- | --- |");
    for (const r of rows) {
      const dCount = allDatasets(r.e).length;
      const tCount = (r.e.testGroups || []).reduce((a, tg) => a + tg.tests.length, 0);
      lines.push(`| ${r.e.name} | ${r.e.bbType || "—"} | ${categoryLabel(r.e.kind) || "—"} | ${statusLabel(r.e.status)} | ${dCount} | ${tCount} | ${r.e.githubUrl ? `[link](${r.e.githubUrl})` : "—"} |`);
    }
    lines.push("");
  }
  return lines.join("\n");
}

/* =================================================================
   GITHUB FETCH  (public repos via API + raw)
================================================================= */
/* Find or create a single MODEL.uploads folder for this fetch run. Reusing
   the same name across the run means all files from one fetch land in one
   folder, regardless of which BB sections they routed to. */
function getOrMakeUploadsFolder(name, source) {
  MODEL.uploads = MODEL.uploads || [];
  let f = MODEL.uploads.find(u => u.name === name);
  if (!f) {
    f = { id: uid("up"), name, source: source || "", tests: [] };
    MODEL.uploads.push(f);
  }
  return f;
}
/* Mirror a fetched file into MODEL.uploads with a trace of where it was
   routed. Storing a clone (structuredClone if available) keeps the BB-side
   copy independent of edits in the Uploads view. */
function mirrorToUploads(uploadsFolder, fileObj, routedTo) {
  if (!uploadsFolder) return;
  let copy;
  try { copy = structuredClone(fileObj); }
  catch { copy = JSON.parse(JSON.stringify(fileObj)); }
  copy.id = uid("t");                       // distinct id from the BB copy
  copy._routedTo = routedTo || null;        // {bbName, section, folderName}
  uploadsFolder.tests.push(copy);
}

/* Drop any previously-mirrored Layout uploads for this BB out of the
   Uploads section. Used right before we record a fresh layout upload so
   the Uploads view never accumulates stale GDS/SVG files for the same BB. */
function dropPriorLayoutMirrors(bbId) {
  if (!Array.isArray(MODEL.uploads)) return;
  for (const f of MODEL.uploads) {
    if (!Array.isArray(f.tests)) continue;
    f.tests = f.tests.filter(t => !(t._routedTo &&
      t._routedTo.section === "layout" &&
      t._routedTo.bbId === bbId));
  }
  // Garbage-collect any folders that became empty as a result.
  MODEL.uploads = MODEL.uploads.filter(f => (f.tests || []).length > 0);
}

/* Record a layout upload (from the BB's Layout tab Upload button) into
   MODEL.uploads so it shows up in the global Uploads view next to fetched
   files. Removes any earlier layout entry for the same BB first so a fresh
   GDS/SVG always replaces the previous one.
   Bytes go into `binaryContent` (the field downloadFileFromCard recognises)
   so the ⬇ button on the Uploads tree returns the original .gds / .svg
   verbatim instead of a metadata-only JSON sidecar. */
function recordLayoutUpload(e, fileName, fileSize, bytesB64, kind) {
  dropPriorLayoutMirrors(e.id);
  MODEL.uploads = MODEL.uploads || [];
  const folderName = "📤 Layout uploads";
  let folder = MODEL.uploads.find(u => u.name === folderName);
  if (!folder) {
    folder = { id: uid("up"), name: folderName, source: "layout-upload", tests: [] };
    MODEL.uploads.push(folder);
  }
  const baseName = fileName || `${e.name}.${kind}`;
  const rec = {
    id: uid("t"),
    name:     baseName,
    filename: baseName,
    size:     fileSize || 0,
    kind:     kind,
    metadata: { kind, bb: e.name, bbId: e.id },
    binaryContent: bytesB64 || "",
    _routedTo: { bbId: e.id, bbName: e.name, section: "layout", folderName },
  };
  folder.tests.push(rec);
  // User-admin tracking: layout uploads modify entity-level fields rather
  // than create a per-file id, so we tag the entity itself so the PR modal
  // knows this user-admin "owns" the layout for that BB this session.
  if (isUserAdmin()) {
    _uaAdditions.add("layout:" + e.id);
    _persistUaAdditions();
  }
  // Persistent ownership for the layout slot under a synthetic key. Lets
  // the × Clear button on the Layout tab gate by who actually uploaded it.
  const owner = currentIdentity();
  if (owner) {
    MODEL.ownership = MODEL.ownership || {};
    MODEL.ownership["layout:" + e.id] = owner;
  }
}

/* Record a fetch URL on a BB so we can replay it later via the platform
   "Sync GitHub" button.
   - For "layout" we keep ONLY ONE URL per BB — uploading or fetching a new
     layout overwrites the prior entry, so subsequent syncs always replay
     the latest source, not the whole history.
   - For other sections, same (section, url) is upserted, not duplicated. */
function recordFetch(e, section, url) {
  if (!url) return;
  e.fetchHistory = e.fetchHistory || [];
  if (section === "layout") {
    e.fetchHistory = e.fetchHistory.filter(x => x.section !== "layout");
    e.fetchHistory.push({ section, url, ts: todayISO() });
    return;
  }
  const existing = e.fetchHistory.find(x => x.section === section && x.url === url);
  if (existing) existing.ts = todayISO();
  else e.fetchHistory.push({ section, url, ts: todayISO() });
}

/* Replay every recorded GitHub fetch on every BB inside a platform group.
   Shows a progress modal so the user can watch each URL roll past, with
   per-section counts at the end. */
/* Per-BB sync — same flow as the platform-wide one but only replays the
   GitHub URLs recorded for this single BB. */
function openBBSyncModal(e) {
  // Sync intentionally works in read-only mode — only the URLs already
  // recorded on this BB's fetchHistory get replayed, never anything new.
  // The replay loop runs inside withSyncContext() so requireWrite() lets
  // the per-section file writes through for the duration.
  const jobs = (e.fetchHistory || []).map(h => ({ section: h.section, url: h.url, ts: h.ts }));
  const total = jobs.length;
  if (!total) { toast("No GitHub fetch history on this BB yet — run a fetch from any sub-tab first", "err"); return; }
  openModal(`Sync ${escapeHtml(e.name)} from GitHub`, (body, foot) => {

    `;

    if (stored) body.querySelector("#bs-token").value = stored;
    foot.innerHTML = "";
    foot.append(btn("Cancel", "ghost", closeModal));
    const goBtn = btn("Start sync", "primary", async () => {
      goBtn.disabled = true; goBtn.textContent = "Syncing…";
      const token = body.querySelector("#bs-token").value.trim();
      const log = body.querySelector("#bs-log");
      const append = (s) => { log.textContent += s + "\n"; log.scrollTop = log.scrollHeight; };
      append(`Replaying ${total} job${total===1?"":"s"}…`);
      let ok = 0, fail = 0;
      await withSyncContext(async () => {
        let done = 0;
        for (const j of jobs) {
          done++;
          append(`\n[${done}/${total}] ${j.section} ← ${j.url}`);
          try {
            if (j.section === "layout") {
              await runLayoutGithubFetch(e, j.url, token, append);

    });
    foot.append(goBtn);
  });
}

/* =================================================================
   GITHUB PULL REQUEST  — open a PR with the section's files
   =================================================================
   Uses the GitHub REST API directly from the browser via a
   Personal Access Token (PAT) with `repo` scope. The token is
   never sent anywhere except api.github.com (the user can tick
   Remember to keep it in localStorage between sessions).

   Flow per request:
     1. GET /user                         (verify PAT works)
     2. GET /repos/{owner}/{repo}/git/ref/heads/{baseBranch}
                                          (parent commit SHA)
     3. POST /repos/{owner}/{repo}/git/refs
                                          (create new branch)
     4. PUT /repos/{owner}/{repo}/contents/{path}  (one per file,
                                          on the new branch)
     5. POST /repos/{owner}/{repo}/pulls  (open the PR)
*/
function openSectionPullRequest(e, section) {
  if (isReadOnly()) { toast("Read-only mode — switch to Admin", "err"); return; }
  const labels = { tests: "Test results", smatrix: "S-matrix", scripts: "Scripts", fab: "Fabrication", layout: "Layout" };
  const label = labels[section] || section;
  // Collect the files we'll push. Priority order for getting bytes:
  //   1. binaryContent  → push the original bytes verbatim (any extension)
  //   2. rawText        → push as text
  //   3. imageUrl       → strip the data: prefix, push the base64
  //   4. parsed only    → synthesise a CSV (last-resort fallback)
  let candidateFiles = [];
  // In user-admin mode the PR is restricted to items added in THIS browser
  // session — the user can't push other people's pre-existing files.
  // Tracked via _uaAdditions (a Set kept in sync with sessionStorage).
  const ua = isUserAdmin();
  const isOwn = (id) => !ua || (id && _uaAdditions.has(id));
  // Layout uploads don't have a per-file id — track at entity level via a
  // synthetic "layout:<entityId>" marker (set inside recordLayoutUpload).
  const layoutOwn = (eId) => !ua || _uaAdditions.has("layout:" + eId);
  if (section === "layout") {
    // Layout PR — push only ONE layout file, in this priority order:
    //   1. original .gds bytes (e.gdsContent)
    //   2. user-uploaded .svg verbatim (e.layoutSvg, only if no GDS context)
    // The browser-rendered SVG of a parsed GDS is NEVER pushed — we want
    // the original format preserved.
    if (e.gdsContent && layoutOwn(e.id)) {
      candidateFiles.push({ name: e.gdsName || `${e.name}.gds`, base64: e.gdsContent });
    } else if (e.layoutSvg && !e.gdsName && layoutOwn(e.id)) {
      // Pure-SVG upload (no GDS context) — push the SVG as-is.
      candidateFiles.push({ name: `${e.name}.svg`, content: e.layoutSvg });
    }
    // Optional sketch image — separate asset, kept as-is if present.
    if (e.customSketchUrl && layoutOwn(e.id)) {
      const m = /^data:([^;]+);base64,(.*)$/.exec(e.customSketchUrl);
      if (m) candidateFiles.push({ name: e.customSketchName || `${e.name}-sketch.${m[1].split("/")[1] || "png"}`, base64: m[2] });
    }
  } else if (section === "scripts") {
    candidateFiles = (e.scripts || [])
      .filter(s => isOwn(s.id))
      .map(s => ({ name: s.name || `${uid("s")}.py`, content: s.source || "" }));
  } else {
    const folders = section === "smatrix" ? (e.smatrixGroups || [])
                  : section === "fab"     ? (e.fabTabs || [])
                  : (e.testGroups || []);
    const items = section === "smatrix"
      ? folders.flatMap(f => f.datasets || [])
      : folders.flatMap(f => f.tests || []);
    for (const t of items) {
      if (!isOwn(t.id)) continue;
      const fname = t.filename || t.name;
      if (t.binaryContent) {
        candidateFiles.push({ name: fname, base64: t.binaryContent });
      } else if (t.rawText) {
        candidateFiles.push({ name: fname, content: t.rawText });
      } else if (t.imageUrl) {
        const m = /^data:([^;]+);base64,(.*)$/.exec(t.imageUrl);
        if (m) candidateFiles.push({ name: fname, base64: m[2] });
      } else if (t.parsed) {
        const sw = t.parsed.sweep, tr = t.parsed.traces || [];
        const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
        for (let i = 0; i < (sw.values || []).length; i++) {
          lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
        }
        const baseName = (fname || "data").replace(/\.[^.]+$/, "");
        candidateFiles.push({ name: `${baseName}.csv`, content: lines.join("\n") });
      } else {
        // Metadata-only entry — push as a small JSON sidecar so users at
        // least get the test name + metadata in their PR.
        const sidecar = JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata }, null, 2);
        candidateFiles.push({ name: (fname || `${t.name}.metadata.json`), content: sidecar });
      }
    }
  }

  openModal(`Create Pull Request → ${label}`, (body, foot) => {
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    body.innerHTML = `
      <div><div class="field-label">GitHub folder URL (paste the target folder, not just the repo)</div>
        <input id="pr-url" type="text" placeholder="https://github.com/owner/repo/tree/main/components/SOI_220" value="${escapeHtml(e.githubUrl || "")}">
      </div>

async function ghApi(url, token, init) {
  const headers = Object.assign({
    "Accept": "application/vnd.github+json",
    "Authorization": `Bearer ${token}`,
    "X-GitHub-Api-Version": "2022-11-28",
  }, (init && init.headers) || {});
  const r = await fetch(url, Object.assign({}, init, { headers }));
  if (!r.ok) {
    let msg = `${r.status} ${r.statusText}`;
    let body = null;
    try { body = await r.json(); if (body.message) msg += ` — ${body.message}`; } catch {}
    // 403 from GitHub for write actions is almost always a permission scope
    // issue — call it out so users don't have to read between the lines.
    if (r.status === 403) {
      msg += "\n\n— Common causes —\n"
        + "  • Fine-grained PAT missing 'Contents: Read and Write' or 'Pull requests: Read and Write' on this repo.\n"
        + "  • Classic PAT missing the 'repo' scope (or 'public_repo' for public repos).\n"
        + "  • Org uses SAML SSO and the token wasn't authorised for the org (Configure SSO on the token page).\n"
        + "  • Token has expired or you don't have write access to the repo.\n"
        + "  • Branch is protected and forbids API writes.\n"
        + "Generate / re-scope a token at https://github.com/settings/tokens";
    }
    throw new Error(msg);
  }
  return r.json();
}

/* Run a series of cheap permission checks against the repo BEFORE we try
   to make commits — that way we fail fast with a useful message instead
   of midway through the PR flow. */
async function ghPermissionCheck({ owner, repo, base, token, log }) {
  const me = await ghApi("https://api.github.com/user", token);
  log(`auth ok as @${me.login}`);
  // Repo info — confirms the token can see it AND tells us if we have
  // push permissions. For fine-grained tokens, repo.permissions reflects
  // the granted permissions; for classic, it reflects the user's role.
  let repoInfo;
  try { repoInfo = await ghApi(`https://api.github.com/repos/${owner}/${repo}`, token); }
  catch (err) { throw new Error(`Cannot see ${owner}/${repo} with this token — ${err.message}`); }
  const perms = repoInfo.permissions || {};
  log(`repo permissions: push=${!!perms.push} admin=${!!perms.admin} maintain=${!!perms.maintain}`);
  if (!perms.push && !perms.admin && !perms.maintain) {
    throw new Error(`Token lacks write access to ${owner}/${repo}.\n`
      + "Fine-grained PAT: tick 'Contents: Read and Write' AND 'Pull requests: Read and Write' for this repo on the token page.\n"
      + "Classic PAT: tick the 'repo' scope.\n"
      + "If the org uses SSO, click 'Configure SSO' and authorise the token for the org.");
  }
  // Verify base branch exists
  try { await ghApi(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${encodeURIComponent(base)}`, token); }
  catch (err) { throw new Error(`Base branch '${base}' not found on ${owner}/${repo} — ${err.message}`); }
  log(`base branch '${base}' exists`);
  return { repoInfo, me };
}

async function runCreatePullRequest({ url, base, branch, path, title, prBody, token, files, log }) {
  const { owner, repo } = parseGithubUrl(url);
  log(`repo: ${owner}/${repo}`);
  // 1. fail-fast preflight — token + repo + base branch in one go
  await ghPermissionCheck({ owner, repo, base, token, log });
  // 2. base branch SHA
  const baseRef = await ghApi(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${encodeURIComponent(base)}`, token);
  const baseSha = baseRef.object.sha;
  log(`base ${base} → ${baseSha.slice(0,7)}`);
  // 3. create new branch
  try {
    await ghApi(`https://api.github.com/repos/${owner}/${repo}/git/refs`, token, {
      method: "POST",
      body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: baseSha }),
    });
    log(`created branch ${branch}`);
  } catch (err) {
    if (/already exists/i.test(err.message)) log(`branch ${branch} already exists — committing on top`);
    else throw err;
  }
  // 4. write each file via the contents API
  for (const f of files) {
    const filePath = `${path}/${f.name}`.replace(/^\/+/, "");
    const content_b64 = f.base64 || btoa(unescape(encodeURIComponent(f.content || "")));
    // Need the file's current sha if it exists, to update instead of create
    let existingSha = null;
    try {
      const cur = await ghApi(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURI(filePath)}?ref=${encodeURIComponent(branch)}`, token);
      existingSha = cur.sha;
    } catch (err) { /* 404 — new file */ }
    const body = {
      message: existingSha ? `Update ${filePath}` : `Add ${filePath}`,
      content: content_b64,
      branch,
    };
    if (existingSha) body.sha = existingSha;
    await ghApi(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURI(filePath)}`, token, {
      method: "PUT",
      body: JSON.stringify(body),
    });
    log(`wrote ${filePath}`);
  }
  // 5. create the PR (or surface an existing one)
  try {
    const pr = await ghApi(`https://api.github.com/repos/${owner}/${repo}/pulls`, token, {
      method: "POST",
      body: JSON.stringify({ title, body: prBody, head: branch, base }),
    });
    log(`PR #${pr.number}`);
    return pr.html_url;
  } catch (err) {
    // If a PR for this branch already exists, look it up and return its URL
    try {
      const list = await ghApi(`https://api.github.com/repos/${owner}/${repo}/pulls?head=${encodeURIComponent(`${owner}:${branch}`)}&state=open`, token);
      if (Array.isArray(list) && list.length) {
        log(`PR #${list[0].number} already exists`);
        return list[0].html_url;
      }
    } catch {}
    throw err;
  }
}

/* Per-section GitHub fetch — pulls a single repo / folder and routes every
