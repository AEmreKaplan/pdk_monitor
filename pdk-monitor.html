async function runSectionGithubFetch(e, section, url, token, log, opts) {
  opts = opts || {};
  const replace = !!opts.replace;
  const { owner, repo, branch, path } = parseGithubUrl(url);
  log(`repo: ${owner}/${repo}@${branch}, path: ${path || "/"}${replace ? "  (replace mode — clearing target folder first)" : ""}`);
  const queue = [{ p: path, depth: 0 }];
  const files = [];
  while (queue.length) {
    const { p, depth } = queue.shift();
    if (depth > 2) continue;
    const u = `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
    let items;
    try { items = await ghFetch(u, token); } catch (err) { log(`  skip ${p}: ${err.message}`); continue; }
    if (!Array.isArray(items)) items = [items];
    for (const it of items) {
      if (it.type === "dir") queue.push({ p: it.path, depth: depth + 1 });
      else if (it.type === "file") {
        if (it.size > 50 * 1024 * 1024) { log(`  skip ${it.path} (${(it.size/1024/1024).toFixed(2)} MB > 50 MB cap)`); continue; }
        files.push(it);
      }
    }
  }
  log(`Found ${files.length} files`);
  // No fetch-specific folder. Use the section's first existing folder so
  // the files just show up next to anything the user already has. If the
  // section is empty, fall back to a single neutral "Files" folder — the
  // user can rename it later from the section's UI like any other folder.
  // In `replace` mode (sync), we wipe the target folder first so the freshly-
  // fetched files truly mirror the current GitHub state instead of piling
  // up alongside an out-of-date copy.
  let folder;
  if (section === "tests") {
    e.testGroups = e.testGroups || [];
    folder = e.testGroups[0] || (e.testGroups.push({ id: uid("tg"), name: "Files", tests: [], collapsed: false }), e.testGroups[0]);
    if (replace) folder.tests = [];
  } else if (section === "smatrix") {
    e.smatrixGroups = e.smatrixGroups || [];
    folder = e.smatrixGroups[0] || (e.smatrixGroups.push({ id: uid("sg"), name: "Files", datasets: [], collapsed: false }), e.smatrixGroups[0]);
    if (replace) folder.datasets = [];
  } else if (section === "fab") {
    e.fabTabs = e.fabTabs || [];
    folder = e.fabTabs[0] || (e.fabTabs.push({ id: uid("ft"), name: "Files", notes: "", tests: [], collapsed: false }), e.fabTabs[0]);
    if (replace) folder.tests = [];
  }
  // Always expand the target folder so the freshly-fetched files are visible
  // when the user comes back from the fetch modal.
  if (folder) folder.collapsed = false;
  let counts = { added: 0, scripts: 0, skipped: 0 };
  for (const f of files) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    log(`  ${f.path}  · sha ${(f.sha || "").slice(0, 8)}`);
    try {
      // .py files are special — they become script entries on the BB so
      // the user can run them. Every other extension is accepted as data
      // and goes through parseTestFile, which decides on its own whether
      // to parse it as CSV / JSON / XLSX / image / generic text / metadata-only.
      if (ext === "py") {
        const text = await ghFileText(f, owner, repo, branch, token);
        e.scripts = e.scripts || [];
        // Sync replace: if a script with the same filename already exists,
        // overwrite its source instead of appending a duplicate. Keeps the
        // user's existing script id stable so any local edits / metadata
        // hanging off it survive the refresh.
        const existing = e.scripts.find(s => s.name === f.name);
        if (existing) {
          existing.source = text;
          existing.updated = todayISO();
        } else {
          e.scripts.push({ id: uid("s"), name: f.name, language: "python", source: text, command: `python ./${f.path}`, updated: todayISO() });
        }
        counts.scripts++;
      } else {
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const fakeFile = new File([buf], f.name);
        const parsed = await parseTestFile(fakeFile);
        if (section === "scripts") {
          // Section is "scripts" but file isn't .py — drop into testGroups
          // as a side asset so it's still accessible on the BB.
          e.testGroups = e.testGroups || [];
          let f2 = e.testGroups[0] || (e.testGroups.push({ id: uid("tg"), name: "Files", tests: [], collapsed: false }), e.testGroups[0]);
          f2.tests.push(parsed);
        } else if (section === "smatrix") {
          folder.datasets.push(parsed);
        } else {
          folder.tests.push(parsed);
        }
        counts.added++;
      }
    } catch (err) { log(`    error: ${err.message}`); counts.skipped++; }
  }
  log(`Imported: ${counts.added} files, ${counts.scripts} scripts, ${counts.skipped} skipped`);
}

    `;

async function runGlobalGithubFetch(url, token, log, opts) {
  opts = opts || {};
  const componentsOnly = !!opts.componentsOnly;
  // useConvention = true → route by top-level folder names (components/, sparams/, ...).
  //                  In components-only mode, route .gds/.svg through components/<BB>/.
  // useConvention = false (default) → dump everything into MODEL.uploads.
  const useConvention = !!opts.useConvention;
  const { owner, repo, branch, path } = parseGithubUrl(url);
  log(`repo: ${owner}/${repo}@${branch}, path: ${path || "/"}`
     + (componentsOnly ? "  (components-only mode)" : (useConvention ? "  (folder convention)" : "  (dump-to-Uploads)")));
  // Visible, timestamped folder name so files are easy to find afterwards.
  const ghFolderName = `📥 GitHub fetch — ${todayISO()}`;
  log(`drop-in folder name: "${ghFolderName}"`);

  // ============== NO CONVENTION (default): dump everything into Uploads ===
  if (!useConvention) {
    // Walk recursively up to 4 levels
    const queue = [{ p: path, depth: 0 }];
    const files = [];
    while (queue.length) {
      const { p, depth } = queue.shift();
      if (depth > 4) continue;
      const u = `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
      let items;
      try { items = await ghFetch(u, token); } catch (err) { log(`  skip ${p}: ${err.message}`); continue; }
      if (!Array.isArray(items)) items = [items];
      for (const it of items) {
        if (it.type === "dir") queue.push({ p: it.path, depth: depth + 1 });
        else if (it.type === "file") {
          if (it.size > 50 * 1024 * 1024) { log(`  skip ${it.path} (>50 MB)`); continue; }
          files.push(it);
        }
      }
    }
    log(`Found ${files.length} files`);

    MODEL.uploads = MODEL.uploads || [];
    const folder = { id: uid("up"), name: ghFolderName, source: `${owner}/${repo}@${branch}${path ? "/"+path : ""}`, tests: [] };
    MODEL.uploads.push(folder);

    let counts = { added: 0, skipped: 0 };
    for (const f of files) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      log(`  ${f.path}  · sha ${(f.sha || "").slice(0, 8)}`);
      try {
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const fakeFile = new File([buf], f.name);
        const parsed = await parseTestFile(fakeFile);
        // tag with the original repo path so the user can trace it later
        parsed.metadata = parsed.metadata || {};
        parsed.metadata.notes = (parsed.metadata.notes ? parsed.metadata.notes + " · " : "") + `from ${f.path}`;
        folder.tests.push(parsed);
        counts.added++;
      } catch (err) { log(`    error: ${err.message}`); counts.skipped++; }
    }
    log(`Imported: ${counts.added} files into Uploads (${counts.skipped} skipped)`);
    log(`Open the 📁 Uploads button in the header to browse.`);
    toast(`GitHub fetch done · ${counts.added} files in Uploads → "${ghFolderName}"`);
    return;
  }
  // ============== END NO-CONVENTION PATH =================================
  // Build a flat name→BB index across all platforms
  const allBBs = [];
  for (const tab of MODEL.tabs)
    for (const g of tab.groups)
      for (const e of g.entities) {
        allBBs.push({ e, key: e.name.toLowerCase().replace(/[^a-z0-9]+/g, "") });
        for (const sb of (e.subBlocks || [])) allBBs.push({ e: sb, key: sb.name.toLowerCase().replace(/[^a-z0-9]+/g, "") });
      }
  function matchBB(name) {
    const k = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    if (!k) return null;
    return allBBs.find(x => x.key === k) || allBBs.find(x => x.key.includes(k) || k.includes(x.key)) || null;
  }
  // Walk recursively up to 4 levels
  const queue = [{ p: path, depth: 0 }];
  const files = [];
  while (queue.length) {
    const { p, depth } = queue.shift();
    if (depth > 4) continue;
    const u = `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
    let items;
    try { items = await ghFetch(u, token); } catch (err) { log(`  skip ${p}: ${err.message}`); continue; }
    if (!Array.isArray(items)) items = [items];
    for (const it of items) {
      if (it.type === "dir") queue.push({ p: it.path, depth: depth + 1 });
      else if (it.type === "file") {
        if (it.size > 5 * 1024 * 1024) { log(`  skip ${it.path} (>5 MB)`); continue; }
        files.push(it);
      }
    }
  }
  log(`Found ${files.length} files`);
  // Single mirror folder so the user has one inventory of every file pulled
  // in this run, regardless of which BB section it actually routed to.
  const upFolderConv = getOrMakeUploadsFolder(ghFolderName, `${owner}/${repo}@${branch}${path ? "/"+path : ""}`);
  let counts = { layout: 0, smatrix: 0, tests: 0, fab: 0, scripts: 0, skipped: 0 };
  for (const f of files) {
    // Path inside the repo path-prefix: strip the root path off
    let rel = f.path;
    if (path) rel = rel.replace(new RegExp("^" + path.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/?", ""), "");
    const segs = rel.split("/");
    const top = (segs[0] || "").toLowerCase();
    const bbName = segs[1] || "";
    const target = matchBB(bbName);
    if (!target) { log(`  skip ${rel} (no BB matches "${bbName}")`); counts.skipped++; continue; }
    const e = target.e;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    log(`  ${rel} → ${e.name} (${top}) · sha ${(f.sha || "").slice(0, 8)}`);
    if (componentsOnly && top !== "components") {
      log(`    (components-only mode, skipping ${top})`);
      counts.skipped++;
      continue;
    }
    try {
      if (top === "components" && (ext === "gds" || ext === "svg")) {
        if (ext === "gds") {
          const buf = await ghFileBytes(f, owner, repo, branch, token);
          const b64 = arrayBufferToBase64(buf);
          const parsed = parseGDS(buf);
          const cell = pickCellToRender(parsed, e.name);
          if (cell) {
            e.layoutSvg = renderGdsCellSVG(cell, parsed.dbUnit, parsed.userUnit, cell.name);
            e.gdsName = f.name; e.gdsSize = buf.byteLength;
            if (buf.byteLength <= 1024 * 1024 * 1024) e.gdsContent = b64;
          }
          mirrorToUploads(upFolderConv,
            { id: uid("t"), name: f.name, filename: f.name, kind: "gds", size: buf.byteLength,
              rawText: null, parsed: null, imageUrl: "data:application/octet-stream;base64," + b64,
              metadata: { notes: `from ${f.path}` } },
            { bbName: e.name, section: "layout", folderName: "layout" });
        } else {
          const svgText = await ghFileText(f, owner, repo, branch, token);
          e.layoutSvg = svgText;
          mirrorToUploads(upFolderConv,
            { id: uid("t"), name: f.name, filename: f.name, kind: "svg", size: svgText.length,
              rawText: svgText, parsed: null, imageUrl: null,
              metadata: { notes: `from ${f.path}` } },
            { bbName: e.name, section: "layout", folderName: "layout" });
        }
        counts.layout++;
      } else if ((top === "sparams" || top === "smatrix") && ext !== "py") {
        e.smatrixGroups = e.smatrixGroups || [];
        let folder = e.smatrixGroups[0] || (e.smatrixGroups.push({ id: uid("sg"), name: "Files", datasets: [], collapsed: false }), e.smatrixGroups[0]);
        folder.collapsed = false;
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const parsed = await parseTestFile(new File([buf], f.name));
        folder.datasets.push(parsed);
        mirrorToUploads(upFolderConv, parsed, { bbName: e.name, section: "smatrix", folderName: folder.name });
        counts.smatrix++;
      } else if (top === "characterisation" || top === "characterization" || top === "tests" || top === "measurements") {
        e.testGroups = e.testGroups || [];
        let folder = e.testGroups[0] || (e.testGroups.push({ id: uid("tg"), name: "Files", tests: [], collapsed: false }), e.testGroups[0]);
        folder.collapsed = false;
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const parsed = await parseTestFile(new File([buf], f.name));
        folder.tests.push(parsed);
        mirrorToUploads(upFolderConv, parsed, { bbName: e.name, section: "tests", folderName: folder.name });
        counts.tests++;
      } else if (top === "fabrication" || top === "fab") {
        e.fabTabs = e.fabTabs || [];
        let folder = e.fabTabs[0] || (e.fabTabs.push({ id: uid("ft"), name: "Files", notes: "", tests: [], collapsed: false }), e.fabTabs[0]);
        folder.collapsed = false;
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const parsed = await parseTestFile(new File([buf], f.name));
        folder.tests.push(parsed);
        mirrorToUploads(upFolderConv, parsed, { bbName: e.name, section: "fab", folderName: folder.name });
        counts.fab++;
      } else if (top === "scripts" && ext === "py") {
        const text = await ghFileText(f, owner, repo, branch, token);
        e.scripts = e.scripts || [];
        e.scripts.push({ id: uid("s"), name: f.name, language: "python", source: text, command: `python ./${f.path}`, updated: todayISO() });
        mirrorToUploads(upFolderConv,
          { id: uid("t"), name: f.name, filename: f.name, kind: "py", size: text.length,
            rawText: text, parsed: null, imageUrl: null, metadata: { notes: `from ${f.path}` } },
          { bbName: e.name, section: "scripts", folderName: "scripts" });
        counts.scripts++;
      } else {
        log(`    unrecognised top-folder "${top}" or ext .${ext}, skip`);
        counts.skipped++;
      }
    } catch (err) { log(`    error: ${err.message}`); counts.skipped++; }
  }
  log(`Imported: ${counts.layout} layout, ${counts.smatrix} smatrix, ${counts.tests} tests, ${counts.fab} fab, ${counts.scripts} scripts, ${counts.skipped} skipped`);
  log(`\nWhere to find them on each matched BB:`);
  log(`  · Layout tab — *.gds / *.svg replace the BB layout`);
  log(`  · S-matrix tab → folder "${ghFolderName}"`);
  log(`  · Test results tab → folder "${ghFolderName}"`);
  log(`  · Fabrication tab → sub-tab "${ghFolderName}"`);
  log(`  · Scripts tab — *.py become script entries`);
  toast(`GitHub fetch done · ${counts.layout + counts.smatrix + counts.tests + counts.fab + counts.scripts} files added under "${ghFolderName}"`);
}

function parseGithubUrl(url) {
  // Accepts:
  //   https://github.com/owner/repo
  //   https://github.com/owner/repo/tree/<branch>/<path>
  //   https://github.com/owner/repo/blob/<branch>/<path>
  const m = url.match(/github\.com\/([^\/]+)\/([^\/]+?)(?:\.git)?(?:\/(?:tree|blob)\/([^\/]+)(?:\/(.*))?)?\/?$/);
  if (!m) throw new Error("Could not parse GitHub URL");
  return { owner: m[1], repo: m[2], branch: m[3] || "main", path: m[4] || "" };
}

async function ghFetch(url, token) {
  // Append a unique cache-busting query param so the browser HTTP cache
  // and any intermediate CDN treat each Sync as a fresh request. Headers
  // alone (Cache-Control / Pragma) trigger a CORS preflight that GitHub's
  // API rejects — the query param approach has no preflight cost.
  const sep = url.includes("?") ? "&" : "?";
  const bustedUrl = `${url}${sep}_pdkmonitor_t=${Date.now()}`;
  const headers = { "Accept": "application/vnd.github.v3+json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const r = await fetch(bustedUrl, { headers, cache: "no-store" });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${r.statusText} (${url})`);
  return r.json();
}
/* Cache-busted raw fetch — same query-param trick for raw.githubusercontent.com.
   Used as a FALLBACK only — when we have a file's blob SHA we go through
   ghBlobBytes() instead, which is fully content-addressed and bypasses the
   raw.githubusercontent.com Fastly cache (which sometimes ignores query
   params and serves stale content for minutes after a push). */
async function ghRawFetch(rawUrl) {
  const sep = rawUrl.includes("?") ? "&" : "?";
  const url = `${rawUrl}${sep}_pdkmonitor_t=${Date.now()}`;
  return fetch(url, { cache: "no-store" });
}
/* Fetch a file's bytes via GitHub's git/blobs API, keyed by blob SHA from
   the contents listing. SHAs are content-addressed — when the file changes
   the SHA changes, so two consecutive Syncs after a push give different
   URLs and the response is always fresh. Avoids the raw.githubusercontent.com
   CDN entirely (which serves stale bytes for several minutes after push,
   even with cache-busting query params).
   Returns an ArrayBuffer. Supports any blob size up to GitHub's 100 MB cap. */
async function ghBlobBytes(owner, repo, sha, token) {
  const url = `https://api.github.com/repos/${owner}/${repo}/git/blobs/${sha}`;
  const headers = { "Accept": "application/vnd.github.v3+json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const r = await fetch(url, { headers, cache: "no-store" });
  if (!r.ok) throw new Error(`GitHub blob ${r.status}: ${r.statusText}`);
  const j = await r.json();
  const content = (j.content || "").replace(/\s/g, "");
  if (!content) return new ArrayBuffer(0);
  if (j.encoding !== "base64") throw new Error(`Unexpected blob encoding: ${j.encoding}`);
  // Decode base64 → Uint8Array. atob handles strict-ASCII base64; the API
  // returns content with newlines every 60 chars, which we strip above.
  const bin = atob(content);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
/* Convenience: prefer the blob API when we have a SHA (fully cache-bypassing,
   content-addressed), fall back to the cache-busted raw URL otherwise. Returns
   an ArrayBuffer either way. */
async function ghFileBytes(item, owner, repo, branch, token) {
  if (item && item.sha) {
    try { return await ghBlobBytes(owner, repo, item.sha, token); }
    catch (err) { /* fall through to raw URL */ }
  }
  const rawUrl = (item && item.download_url) ||
    `https://raw.githubusercontent.com/${owner}/${repo}/${encodeURIComponent(branch)}/${(item && item.path) || ""}`;
  return (await ghRawFetch(rawUrl)).arrayBuffer();
}
/* Same idea for text content. Decodes UTF-8 from the blob API response. */
async function ghFileText(item, owner, repo, branch, token) {
  const buf = await ghFileBytes(item, owner, repo, branch, token);
  return new TextDecoder("utf-8").decode(buf);
}

async function runGithubFetch(e, url, token, log) {
  const { owner, repo, branch, path } = parseGithubUrl(url);
  log(`repo: ${owner}/${repo}@${branch}, path: ${path || "/"}`);

  // List contents recursively (max 2 levels)
  const queue = [{ p: path, depth: 0 }];
  const files = [];
  while (queue.length) {
    const { p, depth } = queue.shift();
    if (depth > 2) continue;
    const u = `https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${encodeURIComponent(branch)}`;
    let items;
    try { items = await ghFetch(u, token); }
    catch (err) { log(`  skip ${p}: ${err.message}`); continue; }
    if (!Array.isArray(items)) items = [items];
    for (const it of items) {
      if (it.type === "dir") queue.push({ p: it.path, depth: depth + 1 });
      else if (it.type === "file") {
        if (it.size > 50 * 1024 * 1024) {
          log(`  skip ${it.path} (${(it.size/1024/1024).toFixed(2)} MB > 50 MB cap)`);
          continue;
        }
        files.push(it);
      }
    }
  }
  log(`Found ${files.length} files`);

  // Route by extension
  let counts = { gds: 0, svg: 0, test: 0, script: 0, skipped: 0 };
  // Reuse the section's first existing folder if any; otherwise fall back to
  // a single neutrally-named "Files" folder (no fetch-specific naming).
  e.testGroups = e.testGroups || [];
  let ghFolder = e.testGroups[0];
  for (const f of files) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    log(`  ${f.path}  · sha ${(f.sha || "").slice(0, 8)}`);
    try {
      if (ext === "gds") {
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const parsed = parseGDS(buf);
        const cell = pickCellToRender(parsed, e.name);
        if (!cell) { log(`    no cells in GDS, skip`); counts.skipped++; continue; }
        e.layoutSvg = renderGdsCellSVG(cell, parsed.dbUnit, parsed.userUnit, cell.name);
        e.gdsName = f.name; e.gdsSize = buf.byteLength;
        if (buf.byteLength <= 1024 * 1024 * 1024) {
          try { e.gdsContent = arrayBufferToBase64(buf); }
          catch (err) { e.gdsContent = ""; log(`    keep raw bytes failed: ${err.message}`); }
        } else { e.gdsContent = ""; }
        counts.gds++;
      } else if (ext === "svg") {
        e.layoutSvg = await ghFileText(f, owner, repo, branch, token);
        counts.svg++;
      } else if (ext === "py") {
        const text = await ghFileText(f, owner, repo, branch, token);
        e.scripts.push({
          id: uid("s"), name: f.name,
          language: "python",
          source: text,
          command: `python ./${f.path}`,
          updated: todayISO(),
        });
        counts.script++;
      } else {
        // Accept any other extension as data — parseTestFile decides the
        // best representation (CSV, JSON, image, raw text, or metadata-only).
        if (!ghFolder) { ghFolder = { id: uid("tg"), name: "Files", tests: [], collapsed: false }; e.testGroups.push(ghFolder); }
        const buf = await ghFileBytes(f, owner, repo, branch, token);
        const fakeFile = new File([buf], f.name);
        ghFolder.tests.push(await parseTestFile(fakeFile));
        counts.test++;
      }
    } catch (err) {
      log(`    error: ${err.message}`); counts.skipped++;
    }
  }
  log(`Imported: ${counts.gds} gds + ${counts.svg} svg, ${counts.test} test files, ${counts.script} scripts, ${counts.skipped} skipped`);
  saveModel();
  if (panel.classList.contains("open")) openView(e.id);
}

function openEdit(entityId, groupId) {
  if (!requireWrite("Read-only mode — sign in to create or edit blocks.")) return;
  const isNew = !entityId;
  // Editing an EXISTING BB is gated by ownership — user-admins can't
  // open the edit form for a BB they didn't create. (Creating a NEW BB
  // is always allowed for any signed-in admin / user-admin.)
  if (!isNew && !canModifyId(entityId)) {
    const owner = displayName(getOwner(entityId)) || "another user";
    toast(`This BB was created by ${owner} — only they (or an admin) can edit it.`, "err");
    return;
  }
  const grp = isNew ? findGroup(groupId) : findEntity(entityId).group;
  const draft = isNew
    ? { id: uid("e"), name: "", status: "available", owner: "", description: "", githubUrl: "", files: [], scripts: [], datasets: [], testGroups: [], updated: todayISO(), kind: "passive", bbType: "waveguide", dimensionsOn: true, params: defaultParamsFor("waveguide", grp?.platformMeta), layoutSvg: "", gdsName: "", gdsSize: 0, gdsContent: "", edaTools: [], cdi: {}, fabTabs: [] }
    : structuredClone(findEntity(entityId).entity);
  // Defensive defaults on existing drafts (older saves may not have these)
  if (!Array.isArray(draft.edaTools)) draft.edaTools = [];
  if (draft.cdi == null || typeof draft.cdi !== "object") draft.cdi = {};
  if (!Array.isArray(draft.fabTabs)) draft.fabTabs = [];

  pTitle.textContent = isNew ? "New block" : "Edit block";
  pPill.hidden = true; pKind.hidden = true; pTabs.hidden = true;

  pBody.innerHTML = `
    <div>
      <div class="field-label">Name</div>
      <input id="f-name" type="text" placeholder="e.g. Strip waveguide (single-mode)" value="${escapeHtml(draft.name)}">
    </div>
    <div class="params-grid">
      <div>
        <div class="field-label">Status</div>
        <select id="f-status">
          ${statusList().map(s => `<option value="${escapeHtml(s.id)}" ${s.id === draft.status ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("")}
        </select>
      </div>
      <div>
        <div class="field-label">Category</div>
        <select id="f-kind">
          <option value="" ${draft.kind === "" ? "selected" : ""}>(none)</option>
          ${categoryList().map(c => `<option value="${escapeHtml(c.id)}" ${c.id === draft.kind ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div>
        <div class="field-label">BB type</div>
        <select id="f-bbtype">
          <option value="" ${draft.bbType === "" ? "selected" : ""}>(none)</option>
          ${bbTypeList().map(t => `<option value="${escapeHtml(t.id)}" ${t.id === draft.bbType ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="params-grid">
      <div><div class="field-label">Owner</div><input id="f-owner" type="text" value="${escapeHtml(draft.owner)}"></div>
      <div><div class="field-label">Last updated</div><input id="f-updated" type="date" value="${escapeHtml((draft.updated || "").match(/^\d{4}-\d{2}-\d{2}$/) ? draft.updated : "")}"></div>
      <div id="f-planned-wrap" style="${draft.status === 'planned' ? '' : 'display:none;'}">
        <div class="field-label">Planned release date</div>
        <input id="f-planned" type="date" value="${escapeHtml((draft.plannedReleaseDate || '').match(/^\d{4}-\d{2}-\d{2}$/) ? draft.plannedReleaseDate : '')}">
      </div>
    </div>
    <div><div class="field-label">Description</div><textarea id="f-desc">${escapeHtml(draft.description)}</textarea></div>
    <div>
      <div class="field-label">GitHub URL (repo, file, or PR)</div>
      <input id="f-github" type="text" placeholder="https://github.com/your-org/your-repo/tree/main/pcells/strip_wg.py" value="${escapeHtml(draft.githubUrl || "")}">
    </div>
    <div>
      <div class="field-label">EDA tools where this BB has a PDK cell</div>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">
        Tick all that apply — multi-select. Edit the master list under Manage lists → EDA tools.
      </div>
      <div id="f-edatools" style="display:flex;flex-wrap:wrap;gap:6px 10px;">
        ${edaToolList().map(t => {
          const on = draft.edaTools.includes(t.id);
          return `<label class="tickbox" style="background:${escapeHtml(t.color || "#8b949e")}1a;border:1px solid ${escapeHtml(t.color || "#8b949e")}55;padding:3px 8px;border-radius:4px;">
            <input type="checkbox" data-eda="${escapeHtml(t.id)}" ${on ? "checked" : ""}>
            <span style="color:${escapeHtml(t.color || "#8b949e")};">${escapeHtml(t.name)}</span>
          </label>`;
        }).join("")}
      </div>
    </div>
    <div>
      <div class="field-label">Component Development Index (CDI)</div>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">
        Maturity per axis — leave blank for "not assessed". Configure the axes under Manage lists → CDI axes.
      </div>
      <div id="f-cdi" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        ${cdiAxisList().map(ax => {
          const v = draft.cdi[ax.id];
          const opts = [];
          for (let i = ax.min; i <= ax.max; i++) opts.push(i);
          return `<div>
            <div class="field-label" style="display:flex;align-items:center;gap:6px;">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${escapeHtml(ax.color || "#8b949e")};"></span>
              ${escapeHtml(ax.name)}
            </div>
            <select data-cdi="${escapeHtml(ax.id)}">
              <option value="" ${v == null ? "selected" : ""}>—</option>
              ${opts.map(n => `<option value="${n}" ${Number(v) === n ? "selected" : ""}>${n}</option>`).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div>
      <div class="field-label">Technology Readiness Level (TRL 1-9)</div>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">
        1 = basic principles · 4 = lab validation · 7 = system prototype demo · 9 = proven in operations.
      </div>
      <select id="f-trl" style="max-width:200px;">
        <option value="" ${draft.trl == null ? "selected" : ""}>— not assessed</option>
        ${[1,2,3,4,5,6,7,8,9].map(n => `<option value="${n}" ${Number(draft.trl) === n ? "selected" : ""}>TRL ${n}</option>`).join("")}
      </select>
    </div>
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <div class="field-label" style="margin:0;">Geometry parameters</div>
        <label class="tickbox" style="margin-left:auto;">
          <input type="checkbox" id="f-dimon" ${draft.dimensionsOn ? "checked" : ""}>
          Include dimensions (drives the auto sketch)
        </label>
      </div>
      <div id="params-edit" class="params-grid"></div>
    </div>
  `;
  const paramsWrap = pBody.querySelector("#params-edit");
  function rerenderParams() {
    paramsWrap.innerHTML = "";
    if (!draft.dimensionsOn) {
      paramsWrap.innerHTML = `<div class="panel-empty" style="grid-column:1/-1;">Dimensions off — Layout sketch will show a placeholder. Tick the box above to enter parameters.</div>`;
      return;
    }
    const keys = Object.keys(draft.params || {});
    if (!keys.length) {
      paramsWrap.innerHTML = `<div class="panel-empty" style="grid-column:1/-1;">No parameters for this BB type.</div>`;
      return;
    }
    keys.forEach(k => {
      const div = document.createElement("div");
      div.innerHTML = `
        <div class="field-label">${escapeHtml(k)}</div>
        <input type="text" data-pkey="${escapeHtml(k)}" value="${escapeHtml(String(draft.params[k]))}">
      `;
      paramsWrap.appendChild(div);
      div.querySelector("input").addEventListener("input", (ev) => {
        const v = ev.target.value;
        const n = Number(v);
        draft.params[k] = (v !== "" && Number.isFinite(n)) ? n : v;
      });
    });
  }
  rerenderParams();

  pBody.querySelector("#f-bbtype").addEventListener("change", (ev) => {
    draft.bbType = ev.target.value;
    if (draft.dimensionsOn) draft.params = defaultParamsFor(draft.bbType, grp?.platformMeta);
    rerenderParams();
  });
  // Show/hide the "Planned release date" field as the status changes —
  // only "planned" exposes the date input.
  pBody.querySelector("#f-status")?.addEventListener("change", (ev) => {
    const wrap = pBody.querySelector("#f-planned-wrap");
    if (wrap) wrap.style.display = (ev.target.value === "planned") ? "" : "none";
  });
  pBody.querySelector("#f-dimon").addEventListener("change", (ev) => {
    draft.dimensionsOn = ev.target.checked;
    if (draft.dimensionsOn && !Object.keys(draft.params || {}).length) {
      draft.params = defaultParamsFor(draft.bbType, grp?.platformMeta);
    }
    if (!draft.dimensionsOn) draft.params = {};
    rerenderParams();
  });

  pFoot.innerHTML = "";
  const left = document.createElement("div");
  if (!isNew) {
    // Only show the Delete button if the caller can actually delete this
    // BB. User-admins editing an admin-owned BB don't see Delete at all
    // — and even if it's there, the handler re-checks canModifyId() so
    // a forged DOM-injected click still gets rejected.
    const mayDelete = canModifyId(entityId);
    if (mayDelete) {
      const del = document.createElement("button");
      del.className = "danger"; del.textContent = "Delete";
      del.addEventListener("click", () => {
        if (!canModifyId(entityId)) {
          const owner = displayName(getOwner(entityId)) || "another user";
          toast(`This BB was created by ${owner} — only they (or an admin) can delete it.`, "err");
          return;
        }
        if (!confirm(`Delete "${draft.name || "this block"}"?`)) return;
        deleteEntity(entityId); saveModel(); closePanel(); render();
        toast("Block deleted");
      });
      left.appendChild(del);
    }
  }
  const right = document.createElement("div");
  right.className = "right";
  const cancel = document.createElement("button");
  cancel.className = "ghost"; cancel.textContent = "Cancel";
  cancel.addEventListener("click", () => isNew ? closePanel() : openView(entityId));
  const save = document.createElement("button");
  save.className = "primary"; save.textContent = isNew ? "Create" : "Save";
  save.addEventListener("click", () => {
    draft.name = pBody.querySelector("#f-name").value.trim();
    draft.status = pBody.querySelector("#f-status").value;
    draft.kind = pBody.querySelector("#f-kind").value;
    draft.bbType = pBody.querySelector("#f-bbtype").value;
    draft.owner = pBody.querySelector("#f-owner").value.trim();
    draft.updated = pBody.querySelector("#f-updated").value || "—";
    // Planned release date — only relevant when status === "planned"; cleared
    // otherwise so changing status away from planned doesn't keep stale dates.
    const plannedV = pBody.querySelector("#f-planned")?.value || "";
    draft.plannedReleaseDate = (draft.status === "planned") ? plannedV : "";
    draft.description = pBody.querySelector("#f-desc").value.trim();
    draft.githubUrl = pBody.querySelector("#f-github").value.trim();
    draft.dimensionsOn = pBody.querySelector("#f-dimon").checked;
    if (!draft.dimensionsOn) draft.params = {};
    draft.files = (draft.files || []).filter(f => (f.path || "").trim() || (f.who || "").trim());
    // EDA tools — read every checked box
    draft.edaTools = Array.from(pBody.querySelectorAll('#f-edatools input[type="checkbox"]'))
      .filter(b => b.checked).map(b => b.dataset.eda);
    // CDI — every select; "" means unassessed (drop the key)
    draft.cdi = {};
    pBody.querySelectorAll('#f-cdi select[data-cdi]').forEach(sel => {
      const v = sel.value;
      if (v !== "") draft.cdi[sel.dataset.cdi] = Number(v);
    });
    // TRL — single select 1..9 or null
    const trlV = pBody.querySelector("#f-trl")?.value;
    draft.trl = (trlV === "" || trlV == null) ? null : Number(trlV);
    if (!draft.name) { toast("Name is required", "err"); return; }
    if (isNew) {
      const tgt = findGroup(groupId);
      if (!tgt) { toast("Sub-entity not found — try reloading", "err"); return; }
      tgt.entities.push(draft);
    } else {
      const f = findEntity(entityId);
      if (!f) { toast("Block not found — try reloading", "err"); return; }
      Object.assign(f.entity, draft);
    }
    saveModel(); render();
    openView(draft.id, "details");
    toast(isNew ? "Block created" : "Block saved");
  });
  right.append(cancel, save);
  pFoot.append(left, right);
  openPanel();
  setTimeout(() => pBody.querySelector("#f-name")?.focus(), 60);
}

/* =================================================================
   PANEL & MODAL show/hide
================================================================= */
function openPanel() { scrim.classList.add("open"); panel.classList.add("open"); panel.setAttribute("aria-hidden", "false"); }
function closePanel() { scrim.classList.remove("open"); panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); }
function openModal(title, render) {
  mTitle.textContent = title;
  render(mBody, mFoot);
  modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
}
function closeModal() {
  modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
  mBody.innerHTML = ""; mFoot.innerHTML = "";
}
function btn(label, cls, fn) {
  const b = document.createElement("button");
  b.className = cls; b.textContent = label;
  b.addEventListener("click", fn); return b;
}

/* =================================================================
   EXPORT / IMPORT / RESET
================================================================= */
/* ---------- Manage lists modal ---------- */
function openManageModal() {
  openModal("Manage platforms, statuses, categories, BB types, EDA tools & CDI axes", (body, foot) => {
    function listEditor(label, key, hasColor, hint) {
      const arr = MODEL[key];
      const rowsHtml = arr.map((x, idx) => `
        <div class="item-row" data-idx="${idx}" style="background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:6px 8px;">
          <input type="text" data-k="name" value="${escapeHtml(x.name)}" placeholder="name" style="flex:2;padding:5px 7px;font-size:12px;">
          ${hasColor ? `<input type="color" data-k="color" value="${escapeHtml(x.color || paletteFor(idx))}" style="width:36px;height:30px;padding:0;border:1px solid var(--border);background:transparent;">` : ""}
          <button class="mini danger-mini" data-act="del" title="Remove">×</button>
        </div>
      `).join("");
      return `
        <div style="margin-top:14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <div class="field-label" style="margin:0;">${label} (${arr.length})</div>
            <button class="ghost" data-listadd="${key}" style="margin-left:auto;font-size:12px;padding:5px 10px;">+ Add</button>
          </div>
          ${hint ? `<div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;">${hint}</div>` : ""}
          <div data-list="${key}" style="display:flex;flex-direction:column;gap:6px;">${rowsHtml}</div>
        </div>
      `;
    }
    function platformEditor() {
      const arr = MODEL.platforms || [];
      const rowsHtml = arr.map((p, idx) => `
        <div class="item-row" data-pidx="${idx}" style="background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:6px 8px;display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 36px auto;gap:6px;align-items:center;">
          <input type="text"   data-k="name"           value="${escapeHtml(p.name || "")}"           placeholder="SOI 220 nm"      style="padding:5px 7px;font-size:12px;">
          <input type="text"   data-k="material"       value="${escapeHtml(p.material || "")}"       placeholder="Si"              style="padding:5px 7px;font-size:12px;">
          <input type="number" data-k="thickness"      value="${escapeHtml(p.thickness ?? "")}"      placeholder="220" min="1"      style="padding:5px 7px;font-size:12px;">
          <input type="number" data-k="defaultWGwidth" value="${escapeHtml(p.defaultWGwidth ?? "")}" placeholder="500 (nm)" min="1" style="padding:5px 7px;font-size:12px;">
          <input type="color"  data-k="color"          value="${escapeHtml(p.color || paletteFor(idx))}" style="width:36px;height:30px;padding:0;border:1px solid var(--border);background:transparent;">
          <button class="mini danger-mini" data-pact="del" title="Remove">×</button>
        </div>
      `).join("");
      return `
        <div style="margin-top:14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <div class="field-label" style="margin:0;">Platforms / Portfolio (${arr.length})</div>
            <button class="ghost" data-listadd="platforms" style="margin-left:auto;font-size:12px;padding:5px 10px;">+ Add platform</button>
          </div>
          <div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;">
            Curated foundry platforms — feeds the "Quick-pick platform" dropdown when you create a sub-entity.
            Edit any field inline. Removing a platform from this list does not delete sub-entities already using it.
          </div>
          <div style="display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 36px auto;gap:6px;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;">
            <span>Name</span><span>Material</span><span>Thickness (nm)</span><span>Default WG width (nm)</span><span>Color</span><span></span>
          </div>
          <div data-list="platforms" style="display:flex;flex-direction:column;gap:6px;">${rowsHtml}</div>
        </div>
      `;
    }
    function cdiAxisEditor() {
      const arr = MODEL.cdiAxes || [];
      const rowsHtml = arr.map((p, idx) => `
        <div class="item-row" data-cidx="${idx}" style="background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:6px 8px;display:grid;grid-template-columns:1.6fr .8fr .8fr 36px auto;gap:6px;align-items:center;">
          <input type="text"   data-k="name" value="${escapeHtml(p.name || "")}"  placeholder="Chip level"  style="padding:5px 7px;font-size:12px;">
          <input type="number" data-k="min"  value="${escapeHtml(p.min ?? 1)}"     placeholder="1" min="0" style="padding:5px 7px;font-size:12px;">
          <input type="number" data-k="max"  value="${escapeHtml(p.max ?? 4)}"     placeholder="4" min="1" style="padding:5px 7px;font-size:12px;">
          <input type="color"  data-k="color" value="${escapeHtml(p.color || paletteFor(idx))}" style="width:36px;height:30px;padding:0;border:1px solid var(--border);background:transparent;">
          <button class="mini danger-mini" data-cact="del" title="Remove">×</button>
        </div>
      `).join("");
      return `
        <div style="margin-top:14px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <div class="field-label" style="margin:0;">Component Development Index — axes (${arr.length})</div>
            <button class="ghost" data-listadd="cdiAxes" style="margin-left:auto;font-size:12px;padding:5px 10px;">+ Add axis</button>
          </div>
          <div style="font-size:11px;color:var(--text-faint);margin-bottom:8px;">
            Three orthogonal maturity axes by default — Chip / Wafer / Packaging — each ranked 1-4. Each BB carries
            one number per axis, shown as coloured pills in its Details tab.
          </div>
          <div style="display:grid;grid-template-columns:1.6fr .8fr .8fr 36px auto;gap:6px;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;">
            <span>Axis name</span><span>Min</span><span>Max</span><span>Color</span><span></span>
          </div>
          <div data-list="cdiAxes" style="display:flex;flex-direction:column;gap:6px;">${rowsHtml}</div>
        </div>
      `;
    }
    body.innerHTML =
      platformEditor() +
      listEditor("Statuses", "statuses", true,
        "These appear in the status dropdown on every BB and as the coloured pill on each card.") +
      listEditor("Categories", "categories", true,
        "Functional class of the device (e.g. Passive, Active, Detector, Modulator, Source). Shown as a chip next to each BB title.") +
      listEditor("BB types", "bbTypes", false,
        "Geometry family (e.g. waveguide, mmi, mzi, ring, AWG, grating coupler, edge coupler, etc.). Used by the auto-sketch and by the type dropdown on the BB form. Removing a built-in only hides it from the dropdown.") +
      listEditor("EDA tools", "edaTools", true,
        "Design environments where this BB has a PDK cell — IPKISS, gdsfactory, Synopsys are seeded; add your in-house tools here. Multi-select on the BB form.") +
      cdiAxisEditor();

    function bind() {
      body.querySelectorAll("[data-listadd]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.dataset.listadd;
          if (key === "platforms") {
            const name = prompt("Name for the new platform (e.g. 'GaAs 100 nm'):");
            if (!name || !name.trim()) return;
            const idx = MODEL.platforms.length;
            MODEL.platforms.push({
              id: uid("plat"), name: name.trim(),
              material: "", thickness: 0, defaultWGwidth: 500,
              color: paletteFor(idx),
            });
            saveModel(); closeModal(); openManageModal();
            return;
          }
          if (key === "cdiAxes") {
            const name = prompt("Name for the new CDI axis (e.g. 'Reliability'):");
            if (!name || !name.trim()) return;
            const idx = MODEL.cdiAxes.length;
            MODEL.cdiAxes.push({ id: uid("cdi"), name: name.trim(), min: 1, max: 4, color: paletteFor(idx) });
            saveModel(); closeModal(); openManageModal();
            return;
          }
          const labelByKey = {
            statuses: "status", categories: "category", bbTypes: "BB type",
            edaTools: "EDA tool",
          };
          const name = prompt(`Name for the new ${labelByKey[key] || "item"}:`);
          if (!name || !name.trim()) return;
          const idx = MODEL[key].length;
          const newItem = { id: uid("x"), name: name.trim() };
          if (key !== "bbTypes") newItem.color = paletteFor(idx);
          MODEL[key].push(newItem);
          saveModel(); closeModal(); openManageModal();
        });
      });
      // simple lists (statuses, categories, bbTypes, edaTools) — colour pickers
      // fire many events while dragging, so use the debounced save for those inputs.
      body.querySelectorAll('[data-list]:not([data-list="platforms"]):not([data-list="cdiAxes"])').forEach(wrap => {
        const key = wrap.dataset.list;
        wrap.querySelectorAll("[data-idx]").forEach(row => {
          const idx = +row.dataset.idx;
          row.querySelectorAll("input").forEach(inp => {
            const isColor = inp.type === "color";
            inp.addEventListener("input", () => {
              MODEL[key][idx][inp.dataset.k] = inp.value;
              if (isColor) saveModelSoon();
              else saveModel();
            });
            if (isColor) inp.addEventListener("change", () => { saveModel(); render(); });
          });
          row.querySelector('[data-act="del"]')?.addEventListener("click", () => {
            const item = MODEL[key][idx];
            if (!confirm(`Remove "${item.name}"? Existing BBs that reference it will keep the value but show no colour.`)) return;
            MODEL[key].splice(idx, 1);
            saveModel(); closeModal(); openManageModal();
          });
        });
      });
      // platforms (multi-field). Colour pickers fire 'input' on every drag tick,
      // so we use saveModelSoon (debounced) — and we ALSO listen to 'change' on
      // colour inputs as a final commit so the value is durable even if the
      // user closes the picker mid-debounce.
      const platsWrap = body.querySelector('[data-list="platforms"]');
      if (platsWrap) {
        platsWrap.querySelectorAll("[data-pidx]").forEach(row => {
          const idx = +row.dataset.pidx;
          row.querySelectorAll("input").forEach(inp => {
            const isColor = inp.type === "color";
            const handler = () => {
              const key = inp.dataset.k;
              let v = inp.value;
              if (key === "thickness" || key === "defaultWGwidth") {
                const n = Number(v);
                v = Number.isFinite(n) ? n : 0;
              }
              MODEL.platforms[idx][key] = v;
              if (isColor) saveModelSoon();
              else saveModel();
            };
            inp.addEventListener("input", handler);
            if (isColor) inp.addEventListener("change", () => { saveModel(); render(); }); // commit immediately on picker close + repaint stripes
          });
          row.querySelector('[data-pact="del"]')?.addEventListener("click", () => {
            const item = MODEL.platforms[idx];
            if (!confirm(`Remove platform "${item.name}"? Sub-entities already using it keep their material/thickness; only the Quick-pick suggestion goes away.`)) return;
            MODEL.platforms.splice(idx, 1);
            saveModel(); closeModal(); openManageModal();
          });
        });
      }
      // CDI axes (multi-field with min/max/color)
      const cdiWrap = body.querySelector('[data-list="cdiAxes"]');
      if (cdiWrap) {
        cdiWrap.querySelectorAll("[data-cidx]").forEach(row => {
          const idx = +row.dataset.cidx;
          row.querySelectorAll("input").forEach(inp => {
            const isColor = inp.type === "color";
            const handler = () => {
              const key = inp.dataset.k;
              let v = inp.value;
              if (key === "min" || key === "max") {
                const n = Number(v); v = Number.isFinite(n) ? n : 0;
              }
              MODEL.cdiAxes[idx][key] = v;
              if (isColor) saveModelSoon();
              else saveModel();
            };
            inp.addEventListener("input", handler);
            if (isColor) inp.addEventListener("change", () => { saveModel(); render(); });
          });
          row.querySelector('[data-cact="del"]')?.addEventListener("click", () => {
            const item = MODEL.cdiAxes[idx];
            if (!confirm(`Remove CDI axis "${item.name}"? BBs that have a value on this axis keep the number but it stops being shown.`)) return;
            MODEL.cdiAxes.splice(idx, 1);
            saveModel(); closeModal(); openManageModal();
          });
        });
      }
    }
    bind();

    foot.innerHTML = "";
    foot.append(btn("Compact storage", "ghost", () => {
      if (!confirm("Compact removes the 'View raw' text from any test/dataset that already has parsed numeric data — frees space without losing plottable data. Continue?")) return;
      const r = compactStorage();
      toast(`Stripped raw text from ${r.stripped} file${r.stripped===1?"":"s"} (~${(r.savedBytes/1024).toFixed(0)} KB freed)`);
    }));
    foot.append(btn("Reset to defaults", "ghost", () => {
      if (!confirm("Reset all four lists to factory defaults? Your current entries will be lost.")) return;
      MODEL.statuses   = JSON.parse(JSON.stringify(DEFAULT_STATUSES));
      MODEL.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      MODEL.bbTypes    = JSON.parse(JSON.stringify(DEFAULT_BBTYPES));
      MODEL.platforms  = JSON.parse(JSON.stringify(DEFAULT_PLATFORMS));
      MODEL.edaTools   = JSON.parse(JSON.stringify(DEFAULT_EDATOOLS));
      MODEL.cdiAxes    = JSON.parse(JSON.stringify(DEFAULT_CDI_AXES));
      saveModel(); closeModal(); openManageModal();
    }));
    foot.append(btn("Done", "primary", () => {
      closeModal(); render();
      const openId = panel.classList.contains("open") ? findOpenId() : null;
      if (openId) openView(openId);
    }));
  });
}
function findOpenId() {
  // Best-effort: re-derive from the panel's title; null if nothing matches
  const title = pTitle.textContent;
  for (const tb of MODEL.tabs)
    for (const g of tb.groups)
      for (const e of g.entities)
        if (e.name === title) return e.id;
  return null;
}

function openPasswordsModal() {

      const g = _security.guestPasswords || [];

        <div style="border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--panel-2);margin-bottom:14px;">
          <div class="field-label" style="margin:0 0 6px;">✉ Contact email for access requests</div>
          <input type="email" id="pw-contact-email" placeholder="you@your-org.org" value="${escapeHtml(_security.accessRequestEmail || "")}" style="width:100%;font-size:13px;padding:7px 9px;">
          <div style="font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.5;">

          ${g.map((p, idx) => {

  if (main) main.textContent = a.title    || "CORNERSTONE PDK Monitor";
  if (sub)  sub.textContent  = a.subtitle || "OPENSOURCE PDK live monitor";

  const lw = document.getElementById("logo-widget");
  const lf = document.getElementById("logo-fallback");
  if (lw) {
    if (a.logoUrl) {
      lw.innerHTML = `<img src="${a.logoUrl.replace(/"/g, "&quot;")}" alt="logo">`;
    } else {
      // Fall back to first 3 letters of title
      const initials = (a.title || "PDK").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "PDK";
      lw.innerHTML = `<span id="logo-fallback">${initials}</span>`;
    }
  }
  // Useful links — render up to 4 chips, "..." if more
  const lr = document.getElementById("links-row");
  if (lr) {

      `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label || l.url)}</a>`

      chips.push(`<span class="links-edit" id="links-more" title="Show more">+${links.length - 4}</span>`);
    }
    if (!links.length) chips.push(`<span class="links-edit" id="links-edit-empty" title="Add useful links in About">+ links</span>`);
    lr.innerHTML = chips.join("");
    lr.querySelector("#links-more")?.addEventListener("click", openAbout);
    lr.querySelector("#links-edit-empty")?.addEventListener("click", openAbout);
  }

/* =================================================================
   Contributors modal
   -----------------------------------------------------------------
   Persistent roster of people who built / maintain the dashboard.
   Data lives in MODEL.contributors as an array of:
     { id, name, identity, affiliation, note }
   where "identity" is the email or GitHub username (used to merge
   auto-detected entries from collectUsers() into the list).

   Permissions:
     - Admin / User-admin: full edit (add / rename / delete).
     - Read-only: shown the same roster, in read-only form.
   Auto-detected identities that aren't yet in the manual list get
   a one-click "+ Add" affordance to pre-fill a new row with the
   identity, so the admin only has to type a name + affiliation.
   ================================================================= */
function openContributorsModal() {
  MODEL.contributors = Array.isArray(MODEL.contributors) ? MODEL.contributors : [];
  // Permission tiers:
  //   - Full Admin     : full control (add/edit/delete any row).
  //   - User-admin     : may add ONE row matching their own signed-in
  //                      identity, and edit/delete only that row.
  //   - Read-only      : read-only.
  const fullAdmin = (typeof isFullAdmin === "function") ? isFullAdmin() : false;
  const readOnly  = (typeof isReadOnly  === "function") ? isReadOnly()  : false;
  const myIdent   = ((sessionStorage.getItem("pdk-monitor.identity") || "") + "").trim();
  const myIdentLc = myIdent.toLowerCase();
  const myLabel   = sessionStorage.getItem("pdk-monitor.label") || "";

  function manualKey(c) { return ((c.identity || c.name || "") + "").trim().toLowerCase(); }
  function isMine(c)    { return !!myIdentLc && manualKey(c) === myIdentLc; }
  function canModifyRow(c) { return fullAdmin || isMine(c); }
  function alreadyHaveSelf() {
    if (!myIdentLc) return false;
    return (MODEL.contributors || []).some(isMine);
  }
  function autoSet() {
    const auto = (typeof collectUsers === "function") ? collectUsers() : [];
    const manualKeys = new Set((MODEL.contributors || []).map(manualKey).filter(Boolean));

  openModal("Contributors", (body, foot) => {

        html += `<div class="contrib-readonly-help">As the full Admin you can add, rename, or delete any contributor. Manually entered names always win over auto-detected aliases when both refer to the same email / GitHub username. Changes save automatically.</div>`;
      } else {
        // User-admin
        html += `<div class="contrib-readonly-help">As a User-admin you can <b>only add or edit your own entry</b>. Other rows are read-only — ask the dashboard's full Admin to make changes on someone else's behalf.${myIdent ? "" : " <b>Sign in with an email or GitHub username</b> to add yourself."}</div>`;
      }

      if (contributors.length || !readOnly) {
        html += `<table class="contrib-table" id="contrib-table">

            <th style="width:22%;">Name</th>
            <th style="width:26%;">Email / GitHub</th>
            <th style="width:28%;">Affiliation</th>
            <th style="width:14%;">Note</th>
            <th style="width:6%;">Source</th>

          html += `<tr><td colspan="${showActionsCol?6:5}" style="text-align:center;color:var(--text-faint);padding:14px;">No contributors yet${fullAdmin?" — click + Add contributor below":(myIdent?" — click + Add me below":"")}.</td></tr>`;
        } else {
          contributors.forEach((c, idx) => {
            const editable = !readOnly && canModifyRow(c);
            html += `<tr data-idx="${idx}"${isMine(c)?' style="background:rgba(56,139,253,.06);"':""}>
              <td>${editable
                ? `<input type="text" data-k="name" value="${escapeHtml(c.name||"")}" placeholder="Full name">`

              <td>${editable
                ? `<input type="text" data-k="identity" value="${escapeHtml(c.identity||"")}" placeholder="alice@example.com or github-user"${(!fullAdmin)?' readonly title="User-admins cannot change their own identity"':""}>`
                : `<code style="font-size:11px;">${escapeHtml(c.identity || "—")}</code>`}</td>
              <td>${editable
                ? `<input type="text" data-k="affiliation" value="${escapeHtml(c.affiliation||"")}" placeholder="Institution / company">`
                : escapeHtml(c.affiliation || "—")}</td>
              <td>${editable
                ? `<input type="text" data-k="note" value="${escapeHtml(c.note||"")}" placeholder="Role / note">`
                : escapeHtml(c.note || "")}</td>
              <td><span class="contrib-source is-manual">${isMine(c)?"You":"Manual"}</span></td>
              ${showActionsCol ? `<td><div class="contrib-row-actions">${editable ? `<button type="button" class="danger" data-act="del" title="Remove this contributor">×</button>` : `<span style="color:var(--text-faint);font-size:10px;" title="Only the full Admin (or the contributor themself) can edit this row">🔒</span>`}</div></td>` : ""}
            </tr>`;
          });
        }
        html += `</tbody></table>`;
      }

      // Auto-detected (not in the manual list)
      if (auto.length) {
        html += `<div style="margin-top:18px;font-size:12px;color:var(--text-dim);">
          <b>Auto-detected from dashboard data (${auto.length}):</b>
          <span style="color:var(--text-faint);">these identities have created or uploaded content, but aren't yet in the manual list.</span>
        </div>`;
        html += `<table class="contrib-table" style="margin-top:6px;">
          <thead><tr>
            <th>Identity</th>
            <th>Source</th>
            ${!readOnly ? `<th style="width:90px;"></th>` : ""}
          </tr></thead>
          <tbody>`;
        auto.forEach(u => {
          const label = (typeof displayName === "function" ? displayName(u) : null) || u;
          const isSelf = !!myIdentLc && u.toLowerCase() === myIdentLc;
          // Full admin: + Add any auto entry. User-admin: + Add ONLY self.
          const canAdd = !readOnly && (fullAdmin || isSelf);
          html += `<tr class="is-auto"${isSelf?' style="background:rgba(56,139,253,.06);"':""}>
            <td><span>${escapeHtml(label)}</span>${label!==u?` <code style="color:var(--text-faint);font-size:11px;">${escapeHtml(u)}</code>`:""}${isSelf?` <span style="color:var(--accent);font-size:10px;margin-left:6px;">(you)</span>`:""}</td>
            <td><span class="contrib-source">Auto</span></td>
            ${!readOnly ? `<td><div class="contrib-row-actions">${canAdd ? `<button type="button" data-act="add-auto" data-id="${escapeHtml(u)}" data-name="${escapeHtml(label!==u?label:"")}" title="${fullAdmin?"Add this contributor to the editable list above":"Add yourself to the contributors list"}">+ Add${isSelf&&!fullAdmin?" me":""}</button>` : `<span style="color:var(--text-faint);font-size:10px;" title="Only the full Admin can add other people. You can still add yourself.">🔒</span>`}</div></td>` : ""}
          </tr>`;
        });
        html += `</tbody></table>`;
      }

      // + Add buttons
      if (!readOnly) {
        if (fullAdmin) {
          html += `<div class="contrib-add-row">
            <button type="button" class="ghost" id="contrib-add">+ Add contributor</button>
          </div>`;
        } else if (myIdent && !alreadyHaveSelf()) {
          html += `<div class="contrib-add-row">
            <button type="button" class="ghost" id="contrib-add-self">+ Add me as a contributor</button>
          </div>`;
        } else if (myIdent && alreadyHaveSelf()) {
          html += `<div style="margin-top:10px;font-size:11px;color:var(--text-faint);">You're already in the list — edit your row above to update your name or affiliation.</div>`;
        }
      }

      body.innerHTML = html;

      if (readOnly) return;

      // Wire input edits — only for rows the current user can modify
      body.querySelectorAll(".contrib-table tbody tr[data-idx]").forEach(tr => {
        const idx = parseInt(tr.dataset.idx, 10);
        const c = (MODEL.contributors || [])[idx];
        if (!c) return;
        if (!canModifyRow(c)) return;  // others' rows are locked
        tr.querySelectorAll("input[data-k]").forEach(inp => {
          inp.addEventListener("input", () => {
            // User-admins can't change identity on their own row (the field is
            // also rendered readonly above, but defend in JS in case the DOM
            // is tampered with).
            if (!fullAdmin && inp.dataset.k === "identity") return;
            c[inp.dataset.k] = inp.value;
            saveModelSoon();
          });
        });
        const del = tr.querySelector('[data-act="del"]');
        if (del) del.addEventListener("click", () => {
          if (!confirm(`Remove "${c.name || c.identity || "this contributor"}" from the list?`)) return;
          MODEL.contributors.splice(idx, 1);
          saveModel(); render();
        });
      });

      // Wire "+ Add from auto" — gated by canAdd at render time, but
      // defend in the handler too in case the DOM is tampered with.
      body.querySelectorAll('[data-act="add-auto"]').forEach(b => {
        b.addEventListener("click", () => {
          const id   = b.dataset.id || "";
          const name = b.dataset.name || "";
          if (!fullAdmin && id.toLowerCase() !== myIdentLc) {
            toast("Only the full Admin can add other people. You can still add yourself.", "err");
            return;
          }
          if (!fullAdmin && alreadyHaveSelf()) {
            toast("You're already in the contributors list.", "err");
            return;
          }
          MODEL.contributors = MODEL.contributors || [];
          MODEL.contributors.push({
            id: `c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,
            name, identity: id, affiliation: "", note: "",
          });
          saveModel(); render();
        });
      });

      // Full-admin "+ Add contributor" — blank row.
      body.querySelector("#contrib-add")?.addEventListener("click", () => {
        MODEL.contributors = MODEL.contributors || [];
        MODEL.contributors.push({
          id: `c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,
          name: "", identity: "", affiliation: "", note: "",
        });
        saveModel(); render();
        setTimeout(() => {
          const rows = body.querySelectorAll(".contrib-table tbody tr[data-idx]");
          const last = rows[rows.length - 1];
          last?.querySelector('input[data-k="name"]')?.focus();
        }, 30);
      });

      // User-admin "+ Add me" — single row pre-filled with their identity.
      body.querySelector("#contrib-add-self")?.addEventListener("click", () => {
        if (!myIdent) { toast("Sign in with an email or GitHub username first.", "err"); return; }
        if (alreadyHaveSelf()) { toast("You're already in the contributors list.", "err"); return; }
        MODEL.contributors = MODEL.contributors || [];
        MODEL.contributors.push({
          id: `c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,
          name: myLabel || "", identity: myIdent, affiliation: "", note: "",
        });
        saveModel(); render();
        setTimeout(() => {
          // Focus the name input on the row we just added (the last one
          // whose identity matches myIdent).
          const rows = body.querySelectorAll(".contrib-table tbody tr[data-idx]");
          for (let i = rows.length - 1; i >= 0; i--) {
            const idx = parseInt(rows[i].dataset.idx, 10);
            const c = (MODEL.contributors || [])[idx];
            if (c && isMine(c)) {
              rows[i].querySelector('input[data-k="name"]')?.focus();
              break;
            }
          }
        }, 30);
      });
    }
    render();

    foot.innerHTML = "";
    foot.append(btn("Close", "primary", closeModal));
  });
}
