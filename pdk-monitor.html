/* =================================================================
   Global Distribution — publish / adopt a shared dashboard JSON
   -----------------------------------------------------------------
   Each team picks a single GitHub repo (e.g.
   cornerstone-open-platform/pdk-content) and a path inside it
   (default: dashboard.json). One admin publishes their local
   dashboard configuration to that file; everyone else pulls the
   same file to stay in sync. The shared file contains the entire
   MODEL minus per-machine secrets (no admin/guest passwords —
   those live in a separate localStorage key — and no GitHub PAT).

   The publish step uses the existing runCreatePullRequest helper
   (so PR mode gets the same fail-fast permission preflight as the
   per-BB PR flow). Direct-commit mode writes via the contents API.

   The adopt step is a plain GET of the contents API — public repos
   work without a token, private repos use the stored PAT.

   Persists user preferences (repo / branch / path) into
   MODEL.distribution so they survive reloads, but the GitHub PAT
   itself continues to live in localStorage["github-token"] (same
   key the per-BB sync uses).
================================================================= */
/* Resolve the current publisher's identity and friendly label for any
   GitHub interaction (Distribution publish, per-BB PR, etc.).
   Precedence (highest first):
     1. Whatever the user explicitly typed at sign-in
        (sessionStorage "pdk-monitor.identity" / "pdk-monitor.label").
     2. Role-based default — so the GitHub side always sees the role
        instead of "anonymous":
          - Admin     → identity "dashboard_admin"     · label "Dashboard Admin"
          - User-admin→ identity "dashboard_user-admin"· label "Dashboard User-admin"
     3. Generic fallback ("dashboard_user") — only reached in unusual
        states (no role unlocked but still publishing somehow).
*/
function currentPublisher() {
  const ident = (sessionStorage.getItem("pdk-monitor.identity") || "").trim();
  const label = (sessionStorage.getItem("pdk-monitor.label")    || "").trim();
  const mode = (typeof currentMode === "function") ? currentMode() : "";
  let defaultIdent = "dashboard_user";
  let defaultLabel = "Dashboard user";
  if (mode === "admin")      { defaultIdent = "dashboard_admin";      defaultLabel = "Dashboard Admin"; }
  else if (mode === "user-admin") { defaultIdent = "dashboard_user-admin"; defaultLabel = "Dashboard User-admin"; }
  return {
    identity: ident || defaultIdent,
    label:    label || defaultLabel,
    role:     mode || "(unknown)",
    isCustomIdentity: !!ident,
    isCustomLabel:    !!label,
  };
}

function buildPublishablePayload() {
  // Deep-clone MODEL via JSON round-trip — fine because MODEL is
  // serialisable and we already do this for Backup (.json).
  const payload = JSON.parse(JSON.stringify(MODEL));
  // Strip anything that shouldn't be shared. We don't keep passwords
  // or tokens IN the MODEL (they're in their own localStorage keys),
  // but be defensive in case a fork stashed something here.
  delete payload.security;
  delete payload.adminPassword;
  delete payload.guestPasswords;
  delete payload.githubToken;
  // Stamp distribution metadata using the role-aware publisher
  // resolver so the GitHub side never sees a blank / anonymous field.
  const pub = currentPublisher();
  payload._distribution = {
    publishedAt: new Date().toISOString(),
    publisherIdentity: pub.identity,
    publisherLabel:    pub.label,
    publisherRole:     pub.role,
    appVersion: (MODEL.about && MODEL.about.version) || "v1",
    contributorCount: Array.isArray(MODEL.contributors) ? MODEL.contributors.length : 0,
    bbCount: (MODEL.tabs || []).reduce(
      (a, t) => a + (t.groups || []).reduce(
        (b, g) => b + (g.entities || []).length, 0), 0),
    termsVersion: (typeof TERMS_VERSION !== "undefined") ? TERMS_VERSION : null,
  };
  return payload;
}

function openDistributionModal() {
  MODEL.distribution = MODEL.distribution || {};
  const d = MODEL.distribution;
  const canPublish = (typeof isReadOnly === "function") ? !isReadOnly() : true;
  const isAdmin    = (typeof isFullAdmin === "function") ? isFullAdmin() : false;

  openModal("Distribution — publish & adopt", (body, foot) => {
    function render() {
      body.innerHTML = `
        <div class="dist-section">
          <h4>1. Shared repository</h4>
          <p class="dist-help">
            Pick one GitHub repo your team will use as the source of truth.
            Anyone with read access can <b>Adopt</b>; admins / user-admins
            with write access can <b>Publish</b>. The shared file (default
            <code>dashboard.json</code>) contains the whole MODEL minus
            per-machine secrets &mdash; passwords and GitHub tokens stay
            on each device.
          </p>
          <div class="dist-grid">
            <div class="full">
              <label>Repo URL or <code>owner/repo</code></label>
              <input type="text" id="dist-repo" value="${escapeHtml(d.repo || "")}" placeholder="cornerstone-open-platform/pdk-content">
            </div>
            <div>
              <label>Branch</label>
              <input type="text" id="dist-branch" value="${escapeHtml(d.branch || "main")}" placeholder="main">
            </div>
            <div>
              <label>File path inside the repo</label>
              <input type="text" id="dist-path" value="${escapeHtml(d.path || "dashboard.json")}" placeholder="dashboard.json">
            </div>
            <div class="full">
              <label>GitHub Personal Access Token (PAT) <span style="color:var(--text-faint);">— required for publish, optional for adopt on a public repo</span></label>
              <input type="password" id="dist-token" value="${escapeHtml(localStorage.getItem("github-token") || "")}" placeholder="ghp_…   kept in this browser only">
            </div>
          </div>
          <label class="dist-tickbox"><input type="checkbox" id="dist-remember-token" ${localStorage.getItem("github-token") ? "checked" : ""}> Remember token in this browser</label>
          <div class="dist-actions">
            <button id="dist-save-defaults" type="button">Save as defaults</button>
          </div>
        </div>

        <div class="dist-section">
          <h4>2. Publish to repo ${canPublish ? "" : "<span style='color:var(--text-faint);font-size:10px;'>(sign in as Admin / User-admin to enable)</span>"}</h4>
          <p class="dist-help">
            Pushes your current dashboard as <code>${escapeHtml(d.path || "dashboard.json")}</code>.
            Choose <b>Pull request</b> for review-before-merge (recommended for
            user-admin), or <b>Direct commit</b> to write straight to the
            branch (admin only &mdash; use with care).
          </p>
          <div class="dist-actions">
            <button id="dist-publish-pr" type="button" ${canPublish ? "" : "disabled"}>📤 Publish as Pull Request</button>
            <button id="dist-publish-direct" type="button" class="primary" ${isAdmin ? "" : "disabled"} title="${isAdmin ? "Direct commit — bypasses review" : "Only the full Admin role can direct-commit"}">⚡ Direct commit to branch</button>
          </div>
          <div class="dist-status" id="dist-publish-log"></div>
          ${d.lastPublishedAt ? `<div class="dist-preview"><b>Last publish from this device:</b> ${escapeHtml(d.lastPublishedAt)}${d.lastPublishedSha ? ` &middot; commit <code>${escapeHtml(d.lastPublishedSha.slice(0,7))}</code>` : ""}${d.lastPublishedUrl ? ` &middot; <a href="${escapeHtml(d.lastPublishedUrl)}" target="_blank" rel="noopener">open on GitHub</a>` : ""}</div>` : ""}
        </div>

        <div class="dist-section">
          <h4>3. Adopt latest from repo</h4>
          <p class="dist-help">
            Fetches the latest <code>${escapeHtml(d.path || "dashboard.json")}</code>
            from the repo and shows a preview. Click <b>Apply</b> to swap
            it into your local dashboard. A local Backup (.json) is offered
            first so you can roll back if you don't like the change.
          </p>
          <div class="dist-actions">
            <button id="dist-fetch" type="button">📥 Fetch latest</button>
            <button id="dist-apply" type="button" class="primary" disabled>Apply to my dashboard</button>
          </div>
          <div class="dist-status" id="dist-fetch-log"></div>
          <div id="dist-fetch-preview"></div>
          ${d.lastFetchedAt ? `<div class="dist-preview"><b>Last adopted on this device:</b> ${escapeHtml(d.lastFetchedAt)}${d.lastFetchedSha ? ` &middot; from commit <code>${escapeHtml(d.lastFetchedSha.slice(0,7))}</code>` : ""}</div>` : ""}
        </div>
      `;

      // --- save defaults ---
      body.querySelector("#dist-save-defaults").addEventListener("click", () => {
        d.repo   = body.querySelector("#dist-repo").value.trim();
        d.branch = body.querySelector("#dist-branch").value.trim() || "main";
        d.path   = body.querySelector("#dist-path").value.trim()   || "dashboard.json";
        const remember = body.querySelector("#dist-remember-token").checked;
        const token = body.querySelector("#dist-token").value.trim();
        if (remember && token) {
          localStorage.setItem("github-token", token);
        } else if (!remember) {
          localStorage.removeItem("github-token");
        }
        saveModel();
        toast("Distribution defaults saved");
      });

      // --- publish helpers ---
      function readConfig() {
        const repo = body.querySelector("#dist-repo").value.trim();
        const branch = body.querySelector("#dist-branch").value.trim() || "main";
        const path = body.querySelector("#dist-path").value.trim() || "dashboard.json";
        const token = body.querySelector("#dist-token").value.trim();
        if (!repo) throw new Error("Repo is required (e.g. cornerstone-open-platform/pdk-content)");
        // Normalise "owner/repo" → full URL so parseGithubUrl works for both
        const ghUrl = repo.startsWith("http") ? repo : `https://github.com/${repo.replace(/^\/+|\/+$/g, "")}`;
        const parsed = parseGithubUrl(ghUrl);
        return { owner: parsed.owner, repo: parsed.repo, branch, path, token };
      }

      async function doPublish(mode) {
        const logEl = body.querySelector("#dist-publish-log");
        logEl.textContent = "";
        const log = (s) => { logEl.textContent += s + "\n"; logEl.scrollTop = logEl.scrollHeight; };
        let cfg;
        try { cfg = readConfig(); } catch (err) { log(`Error: ${err.message}`); return; }
        if (!cfg.token) { log("Error: a GitHub Personal Access Token is required to publish."); return; }
        const btnPR = body.querySelector("#dist-publish-pr");
        const btnDC = body.querySelector("#dist-publish-direct");
        btnPR.disabled = btnDC.disabled = true;
        try {
          const payload = buildPublishablePayload();
          const json = JSON.stringify(payload, null, 2);
          const base64 = btoa(unescape(encodeURIComponent(json)));
          log(`Building payload — ${(json.length / 1024).toFixed(1)} KB, ${payload._distribution.bbCount} BBs`);

          if (mode === "pr") {
            const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
            const dist = payload._distribution;
            // PR branch name includes the publisher identity so reviewers
            // can tell at a glance who opened it.
            const safeIdent = (dist.publisherIdentity || "dashboard_user")
              .replace(/[^A-Za-z0-9._-]+/g, "-").slice(0, 40);
            const branchName = `pdk-monitor-publish/${safeIdent}/${stamp}`;
            const fileName   = cfg.path.split("/").pop();
            const dirPath    = cfg.path.includes("/") ? cfg.path.slice(0, cfg.path.lastIndexOf("/")) : "";
            const prUrl = await runCreatePullRequest({
              url: `https://github.com/${cfg.owner}/${cfg.repo}`,
              base: cfg.branch,
              branch: branchName,
              path: dirPath,
              title: `Publish dashboard config — ${dist.bbCount} BBs (by ${dist.publisherLabel})`,
              prBody: [
                "Automated publish from CORNERSTONE PDK Monitor.",
                "",
                `Publisher: **${dist.publisherLabel}** (\`${dist.publisherIdentity}\`)`,
                `Role: **${dist.publisherRole || "(unknown)"}**`,
                `App version: ${dist.appVersion}`,
                `BBs included: ${dist.bbCount}`,
                `Contributors recorded: ${dist.contributorCount}`,
                `Terms version accepted: ${dist.termsVersion}`,
                "",
                "Merge to update the team's shared `dashboard.json`.",
              ].join("\n"),
              token: cfg.token,
              files: [{ name: fileName, base64 }],
              log,
            });
            log(`PR ready ✅ ${prUrl}`);
            toast(`Publish PR opened — ${prUrl}`);
            d.repo = `${cfg.owner}/${cfg.repo}`;
            d.branch = cfg.branch;
            d.path = cfg.path;
            d.lastPublishedAt = payload._distribution.publishedAt;
            d.lastPublishedUrl = prUrl;
            saveModel();
            render();
          } else {
            // Direct commit via the contents API on the configured branch.
            log(`Direct-commit to ${cfg.owner}/${cfg.repo}@${cfg.branch}:${cfg.path}`);
            let existingSha = null;
            try {
              const cur = await ghApi(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}`, cfg.token);
              existingSha = cur.sha;
              log(`Existing file sha ${existingSha.slice(0,7)} — updating`);
            } catch (e) { log("No existing file at that path — creating"); }
            const dist = payload._distribution;
            const body0 = {
              message: `Publish dashboard config — ${dist.bbCount} BBs (by ${dist.publisherLabel} · ${dist.publisherIdentity})`,
              content: base64,
              branch: cfg.branch,
            };
            if (existingSha) body0.sha = existingSha;
            const res = await ghApi(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(cfg.path)}`, cfg.token, {
              method: "PUT",
              body: JSON.stringify(body0),
            });
            log(`Commit ${res.commit?.sha?.slice(0,7)} ✅`);
            toast(`Published — commit ${res.commit?.sha?.slice(0,7)}`);
            d.repo = `${cfg.owner}/${cfg.repo}`;
            d.branch = cfg.branch;
            d.path = cfg.path;
            d.lastPublishedAt = payload._distribution.publishedAt;
            d.lastPublishedSha = res.commit?.sha || "";
            d.lastPublishedUrl = res.commit?.html_url || res.content?.html_url || "";
            saveModel();
            render();
          }
        } catch (err) {
          console.error(err);
          log(`Error: ${err.message}`);
          toast(`Publish failed: ${err.message}`, "err");
        } finally {
          btnPR.disabled = !canPublish;
          btnDC.disabled = !isAdmin;
        }
      }

      body.querySelector("#dist-publish-pr").addEventListener("click", () => doPublish("pr"));
      body.querySelector("#dist-publish-direct").addEventListener("click", () => doPublish("direct"));

      // --- fetch / adopt ---
      let _fetched = null;  // holds the parsed remote payload between Fetch and Apply

      body.querySelector("#dist-fetch").addEventListener("click", async () => {
        const logEl = body.querySelector("#dist-fetch-log");
        const prevEl = body.querySelector("#dist-fetch-preview");
        const applyBtn = body.querySelector("#dist-apply");
        logEl.textContent = "";
        prevEl.innerHTML = "";
        applyBtn.disabled = true;
        const log = (s) => { logEl.textContent += s + "\n"; logEl.scrollTop = logEl.scrollHeight; };
        let cfg;
        try { cfg = readConfig(); } catch (err) { log(`Error: ${err.message}`); return; }
        try {
          /* Two-step fetch that works for files of any size up to 100 MB,
             on both public and private repos:
               (a) Metadata via Accept: application/vnd.github+json
                   — gives us name / size / sha for the log.
               (b) Content via Accept: application/vnd.github.raw
                   — returns the raw bytes directly through the same
                     api.github.com origin, so CORS and auth are
                     consistent. No 1 MB inline limit, no base64,
                     no raw.githubusercontent.com (which can fail
                     with "Failed to fetch" on private repos or
                     restrictive networks).
             We keep download_url and the git/blobs API as tertiary
             fallbacks in case the raw Accept path is blocked. */
          const metaHeaders = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
          if (cfg.token) metaHeaders["Authorization"] = `Bearer ${cfg.token}`;
          const metaUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}&_t=${Date.now()}`;
          log(`GET (metadata) ${metaUrl}`);
          const metaR = await fetch(metaUrl, { headers: metaHeaders, cache: "no-store" });
          if (!metaR.ok) throw new Error(`${metaR.status} ${metaR.statusText}${metaR.status===404?" — file not found at that path/branch":""}`);
          const cur = await metaR.json();
          const sizeMB = (cur.size || 0) / 1024 / 1024;
          log(`Found ${cur.name} · ${sizeMB.toFixed(2)} MB · sha ${cur.sha.slice(0,7)}`);

          let json = null;

          // Path 1 — inline base64 if the file is small enough that the
          // contents API ships it embedded (and it isn't truncated).
          const base64Blob = (cur.content || "").replace(/\s+/g, "");
          if (base64Blob && !cur.truncated) {
            log(`Decoding ${base64Blob.length} base64 chars (inline)`);
            const bin = atob(base64Blob);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            json = new TextDecoder("utf-8").decode(bytes);
          }

          // Path 2 — raw Accept header, same origin (api.github.com).
          // This is the reliable path for >1 MB files, public or
          // private, because CORS + auth come from the API itself.
          if (json == null) {
            try {
              log("Fetching raw bytes via Accept: application/vnd.github.raw …");
              const rawHeaders = { "Accept": "application/vnd.github.raw", "X-GitHub-Api-Version": "2022-11-28" };
              if (cfg.token) rawHeaders["Authorization"] = `Bearer ${cfg.token}`;
              const rawUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}&_t=${Date.now()}`;
              const rawR = await fetch(rawUrl, { headers: rawHeaders, cache: "no-store" });
              if (!rawR.ok) throw new Error(`raw ${rawR.status} ${rawR.statusText}`);
              json = await rawR.text();
              log(`Raw fetch ok — ${(json.length / 1024 / 1024).toFixed(2)} MB of body`);
            } catch (rawErr) {
              log(`Raw Accept path failed (${rawErr.message}) — trying download_url`);
            }
          }

          // Path 3 — last-resort download_url (raw.githubusercontent.com).
          // Less reliable for private repos / restrictive networks, but
          // keep it around so public-repo users with a flaky API path
          // still have a way through.
          if (json == null && cur.download_url) {
            try {
              const dlHeaders = {};
              if (cfg.token) dlHeaders["Authorization"] = `Bearer ${cfg.token}`;
              const dlUrl = `${cur.download_url}${cur.download_url.includes("?")?"&":"?"}_t=${Date.now()}`;
              log(`Falling back to download_url ${dlUrl}`);
              const rr = await fetch(dlUrl, { headers: dlHeaders, cache: "no-store" });
              if (!rr.ok) throw new Error(`download_url ${rr.status} ${rr.statusText}`);
              json = await rr.text();
              log(`download_url ok — ${(json.length / 1024 / 1024).toFixed(2)} MB of body`);
            } catch (dlErr) {
              log(`download_url failed too (${dlErr.message}) — trying git blobs API`);
            }
          }

          // Path 4 — git blobs API for very large files (>100 MB on
          // most APIs but still works through git/blobs).
          if (json == null && cur.sha) {
            log(`Falling back to git blobs API for sha ${cur.sha.slice(0,7)}`);
            const blob = await ghApi(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/blobs/${cur.sha}`, cfg.token || "");
            const b64 = (blob.content || "").replace(/\s+/g, "");
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            json = new TextDecoder("utf-8").decode(bytes);
          }

          if (!json || !json.trim()) throw new Error("Fetched body was empty — the remote file looks blank.");
          log(`Parsing ${(json.length / 1024 / 1024).toFixed(2)} MB of JSON …`);
          let payload;
          try { payload = JSON.parse(json); }
          catch (e) {
            // Surface a snippet of what we got so the user can see whether
            // they pointed at the wrong file (e.g. HTML 404 page).
            const head = json.slice(0, 80).replace(/\s+/g, " ");
            throw new Error(`Could not parse JSON (${e.message}). First 80 chars: ${head}`);
          }
          _fetched = { payload, sha: cur.sha, name: cur.name };
          const dist = payload._distribution || {};
          const bbCount = dist.bbCount != null ? dist.bbCount :
            (payload.tabs || []).reduce((a, t) => a + (t.groups || []).reduce((b, g) => b + (g.entities || []).length, 0), 0);
          prevEl.innerHTML = `<div class="dist-preview">
            <b>Remote dashboard ready</b><br>
            Published: <b>${escapeHtml(dist.publishedAt || "—")}</b><br>
            By: <b>${escapeHtml(dist.publisherLabel || dist.publisherIdentity || "(unknown)")}</b>${dist.publisherRole ? ` <span style="color:var(--text-faint);">(${escapeHtml(dist.publisherRole)})</span>` : ""}<br>
            Identity: <code>${escapeHtml(dist.publisherIdentity || "—")}</code><br>
            App version: <b>${escapeHtml(dist.appVersion || "—")}</b><br>
            BBs in remote: <b>${bbCount}</b><br>
            Contributors recorded: <b>${dist.contributorCount != null ? dist.contributorCount : "—"}</b><br>
            Commit SHA: <code>${cur.sha.slice(0, 12)}</code>
          </div>`;
          applyBtn.disabled = false;
        } catch (err) {
          console.error(err);
          log(`Error: ${err.message}`);
          toast(`Fetch failed: ${err.message}`, "err");
        }
      });

      body.querySelector("#dist-apply").addEventListener("click", async () => {
        if (!_fetched) { toast("Fetch a remote version first", "err"); return; }
        const ok = confirm("This will replace your current dashboard with the remote version. A local Backup (.json) will be downloaded first so you can roll back. Continue?");
        if (!ok) return;
        // Take a local backup first
        try {
          const backup = JSON.parse(JSON.stringify(MODEL));
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `pdk-monitor-pre-adopt-${todayISO()}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        } catch (e) { console.warn("Pre-adopt backup failed:", e); }
        // Swap MODEL
        const payload = _fetched.payload;
        // Preserve the user's own distribution config (they may have a
        // PAT etc. locally that the remote shouldn't overwrite).
        const localDist = MODEL.distribution || {};
        MODEL = payload;
        MODEL.distribution = Object.assign({}, payload.distribution || {}, localDist, {
          lastFetchedAt: new Date().toISOString(),
          lastFetchedSha: _fetched.sha,
        });
        activeTabId = (MODEL.tabs && MODEL.tabs[0] && MODEL.tabs[0].id) || activeTabId;
        await saveModel();
        if (typeof applyAbout === "function") applyAbout();
        render();
        try { window.render?.(); } catch {}
        toast(`Adopted remote dashboard — sha ${_fetched.sha.slice(0,7)}`);
        closeModal();
      });
    }
    render();

    foot.innerHTML = "";
    foot.append(btn("Close", "primary", closeModal));
  });
}
document.getElementById("distribution-btn")?.addEventListener("click", openDistributionModal);

/* ---------- Uploads directory ----------

function openUploadsModal() {

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">

        <button class="ghost" id="ud-zip" title="Download every visible file as a single zip (preserves folder structure)">⬇ Download all (zip)</button>
        <button class="ghost" id="ud-tofolder" title="Pick a folder on your computer (preferably the one next to pdk-monitor.html) and mirror the Uploads bucket into it as real files. Chrome / Edge only — Firefox and Safari should use ⬇ Download all (zip).">📂 Save to folder…</button>

      const q = (body.querySelector("#ud-q").value || "").toLowerCase();
      const onlyGh = body.querySelector("#ud-only-gh").checked;

      const items = [];

        for (const g of tab.groups) {
          function walk(arr) {
            for (const e of arr) {
              const buckets = [
                ["Tests",       e.testGroups   || [], "tests",   tg => tg.tests || []],
                ["S-matrix",    e.smatrixGroups|| [], "datasets", sg => sg.datasets || []],
                ["Fabrication", e.fabTabs      || [], "tests",    ft => ft.tests || []],
              ];
              for (const [section, folders, _key, getFiles] of buckets) {
                for (const folder of folders) {

                    tab, g, e, section, folder, files,

        const tg = grouped.get(it.tab.id);

            for (const [section, rows] of eg.sections) {

              secDet.open = true;

              secDet.innerHTML = `<summary style="cursor:pointer;color:var(--text-dim);">▾ ${escapeHtml(section)} (${rows.length})${openLink}</summary>`;

                const removeBtn = `<button class="mini danger-mini admin-only" data-up-rm="${escapeHtml(folderHandle)}" title="Remove this folder and every file in it" style="margin-left:6px;font-size:13px;line-height:1;">×</button>`;
                folderDet.innerHTML = `<summary style="cursor:pointer;color:${it.isGithub ? "var(--accent)" : "var(--text-dim)"};display:flex;align-items:center;gap:6px;">▾ ${escapeHtml(it.folder.name)} <span style="color:var(--text-faint);font-size:11px;">(${it.files.length})</span>${removeBtn}</summary>${it.files.map(renderFile).join("")}`;

          for (const t of (folder.tests || [])) {
            if (q) {
              const hay = (folder.name + " " + t.name + " " + (t.filename || "")).toLowerCase();
              if (!hay.includes(q)) continue;
            }
            add(`Uploads/${folder.name}`, t);
          }
        }
        if (!n) { toast("No files match the current filter", "err"); return; }
        toast(`Bundling ${n} file${n===1?"":"s"}…`);
        const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `pdk-uploads-${todayISO()}.zip`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        toast(`Saved ${n} file${n===1?"":"s"} into ${a.download}`);
      } catch (err) { toast(`zip failed: ${err.message}`, "err"); }
    });
    // 📂 Save to folder — mirrors the visible Uploads tree to a folder the
    // user picks on their computer, using the File System Access API.
    // Requires user gesture (button click). Available in Chromium-based
    // browsers; Firefox / Safari fall back to the existing zip download.
    body.querySelector("#ud-tofolder").addEventListener("click", async () => {
      if (!window.showDirectoryPicker) {
        toast("This browser can't write directly to a folder — use ⬇ Download all (zip) instead", "err");
        return;
      }
      let root;
      try {
        root = await window.showDirectoryPicker({ mode: "readwrite" });
      } catch { return; }   // user cancelled
      const onlyGh = body.querySelector("#ud-only-gh").checked;
      const q = (body.querySelector("#ud-q").value || "").toLowerCase();
      // Helpers to get-or-create a folder hierarchy under the picked root.
      async function ensureDir(handle, segments) {
        let cur = handle;
        for (const seg of segments) {
          if (!seg) continue;
          cur = await cur.getDirectoryHandle(safeFolder(seg), { create: true });
        }
        return cur;
      }
      async function writeBytes(dirHandle, name, bytes, mime) {
        const fh = await dirHandle.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(new Blob([bytes], { type: mime || "application/octet-stream" }));
        await w.close();
      }
      async function writeText(dirHandle, name, text, mime) {
        const fh = await dirHandle.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(new Blob([text], { type: mime || "text/plain;charset=utf-8" }));
        await w.close();
      }
      async function emitFile(dirHandle, t) {
        if (t.binaryContent) {
          await writeBytes(dirHandle, t.filename || `${safeFolder(t.name)}.bin`, base64ToBytes(t.binaryContent));
        } else if (t.imageUrl) {
          const r = dataUrlToBytes(t.imageUrl);
          if (r) await writeBytes(dirHandle, t.filename || `${safeFolder(t.name)}.bin`, r.bytes, r.mime);
        } else if (t.rawText) {
          await writeText(dirHandle, t.filename || `${safeFolder(t.name)}.txt`, t.rawText);
        } else if (t.parsed && t.parsed.sweep && t.parsed.traces) {
          const sw = t.parsed.sweep, tr = t.parsed.traces;
          const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
          for (let i = 0; i < sw.values.length; i++) {
            lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
          }
          await writeText(dirHandle, `${safeFolder(t.name)}.csv`, lines.join("\n"), "text/csv;charset=utf-8");
        } else {
          await writeText(dirHandle, `${safeFolder(t.name)}.metadata.json`,
            JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata }, null, 2),
            "application/json");
        }
      }
      let n = 0;
      try {
        // Top-level uploads/<folder>/
        const uploadsRoot = await ensureDir(root, ["uploads"]);
        for (const folder of (MODEL.uploads || [])) {
          const isGh = /^📥\s/.test(folder.name || "");
          if (onlyGh && !isGh) continue;
          for (const t of (folder.tests || [])) {
            if (q) {
              const hay = (folder.name + " " + t.name + " " + (t.filename || "")).toLowerCase();
              if (!hay.includes(q)) continue;
            }
            const dh = await ensureDir(uploadsRoot, [folder.name]);
            await emitFile(dh, t); n++;
          }
        }
        // BB-side files routed by section, mirroring the portal layout
        for (const tab of MODEL.tabs) for (const g of tab.groups) {
          async function walk(arr) {
            for (const e of arr) {
              for (const [section, folders, getFiles, top] of [
                ["Tests",       e.testGroups   || [], tg => tg.tests || [],    "characterisation"],
                ["S-matrix",    e.smatrixGroups|| [], sg => sg.datasets || [], "sparams"],
                ["Fabrication", e.fabTabs      || [], ft => ft.tests || [],    "fabrication"],
              ]) {
                for (const folder of folders) {
                  const isGh = /^📥\s/.test(folder.name || "");
                  if (onlyGh && !isGh) continue;
                  const files = getFiles(folder);
                  for (const t of files) {
                    if (q) {
                      const hay = (folder.name + " " + t.name + " " + (t.filename || "") + " " + e.name + " " + g.name).toLowerCase();
                      if (!hay.includes(q)) continue;
                    }
                    const dh = await ensureDir(root, [top, g.name, e.name, folder.name]);
                    await emitFile(dh, t); n++;
                  }
                }
              }
              if (Array.isArray(e.subBlocks)) await walk(e.subBlocks);
            }
          }
          await walk(g.entities || []);
        }
        if (!n) { toast("No files match the current filter", "err"); return; }
        toast(`Mirrored ${n} file${n===1?"":"s"} to "${root.name}"`);
      } catch (err) {
        toast(`Save to folder failed: ${err.message}`, "err");
      }
    });
    build();

    foot.innerHTML = "";
    foot.append(btn("Close", "primary", closeModal));
  });
}

/* ---------- ZIP backup (via JSZip) ----------
   The .zip contains:
     model.json         — full MODEL (same content as the .json backup)
     README.txt         — short description
     files/<platform>/<bb>/...  — every uploaded file written as a real file
                                  (rawText / image data URL / GDS bytes)
   model.json is the canonical restore path; the per-file folder is for
   browsing convenience, e.g. attaching to an email / reading offline. */
let _jszip = null;
async function ensureJSZip() {
  if (_jszip) return _jszip;
  if (!window.JSZip) await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js");
  if (!window.JSZip) throw new Error("JSZip failed to load");
  _jszip = window.JSZip; return _jszip;
}
function safeFolder(name) {
  return String(name || "untitled").replace(/[^A-Za-z0-9_.-]+/g, "_").slice(0, 80) || "untitled";
}
function dataUrlToBytes(url) {
  // "data:<mime>;base64,<payload>" — return Uint8Array of the payload + mime
  const m = /^data:([^;]+);base64,(.*)$/.exec(url || "");
  if (!m) return null;
  const bin = atob(m[2]); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return { bytes: out, mime: m[1] };
}
async function exportBackupZip() {
  let JSZip;
  try { JSZip = await ensureJSZip(); }
  catch (err) { toast(`Could not load JSZip: ${err.message}`, "err"); return; }
  const zip = new JSZip();
  const stamp = new Date().toISOString();
  const ver = (MODEL.about && MODEL.about.version) || "v1";
  const verSlug = ver.replace(/[^a-z0-9]+/gi, "-");

  // Always include the canonical JSON for restore
  const payload = Object.assign({}, MODEL, { exportedAt: stamp });
  zip.file("model.json", JSON.stringify(payload, null, 2));
  zip.file("README.txt",
`PDK Monitor backup (${stamp})
Version: ${ver}

This .zip mirrors the portal folder convention. Drop it next to
pdk-monitor.html and you get the same layout you would see on the
portal — components / sparams / characterisation / fabrication /
scripts at the top, with one folder per platform / BB inside each.

Folders:
  components/<platform>/<BB>/        — layout files (.gds, .svg, sketch)
  sparams/<platform>/<BB>/<folder>/   — S-matrix files (one folder per
                                       BB sub-folder in the dashboard)
  characterisation/<platform>/<BB>/<folder>/ — measurement files
  fabrication/<platform>/<BB>/<folder>/      — fab notes + per-folder files
  scripts/<platform>/<BB>/           — per-BB Python scripts
  uploads/<folder>/                  — global uploads bucket (anything
                                       routed there from a GitHub fetch
                                       or a Layout-tab upload)

Files:
  model.json — the full dashboard. Re-import to restore everything.
  README.txt — this file.

Generated by ${MODEL.about?.title || "CORNERSTONE PDK Monitor"}
`);

  let bbCount = 0, fileCount = 0;
  function pushFile(folder, t) {
    fileCount++;
    if (t.binaryContent) {
      const bytes = base64ToBytes(t.binaryContent);
      folder.file(t.filename || `${safeFolder(t.name)}.bin`, bytes);
    } else if (t.imageUrl) {
      const r = dataUrlToBytes(t.imageUrl);
      if (r) folder.file(t.filename || `${safeFolder(t.name)}.bin`, r.bytes);
    } else if (t.rawText) {
      folder.file(t.filename || `${safeFolder(t.name)}.txt`, t.rawText);
    } else if (t.parsed && t.parsed.sweep && t.parsed.traces) {
      // Synthesised CSV
      const sw = t.parsed.sweep, tr = t.parsed.traces;
      const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
      for (let i = 0; i < sw.values.length; i++) {
        lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
      }
      folder.file(`${safeFolder(t.name)}.csv`, lines.join("\n"));
    } else {
      folder.file(`${safeFolder(t.name)}.metadata.json`,
        JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata, note: "Original bytes were not preserved." }, null, 2));
    }
  }

  // Top-level convention folders mirror the portal layout. Every BB drops
  // into <section>/<platform>/<BB>/ so the zip can be unpacked straight
  // next to pdk-monitor.html and the user keeps the same folder structure
  // they see on the portal side.
  const components     = zip.folder("components");
  const sparams        = zip.folder("sparams");
  const characterisation = zip.folder("characterisation");
  const fabrication    = zip.folder("fabrication");
  const scriptsRoot    = zip.folder("scripts");
  const uploadsRoot    = zip.folder("uploads");
  for (const tab of MODEL.tabs) {
    for (const g of tab.groups) {
      for (const e of g.entities) {
        bbCount++;
        const platSeg = safeFolder(g.name);
        const bbSeg   = safeFolder(e.name);
        // components/<platform>/<BB>/  — layout (.gds, rendered .svg, sketch)
        const compF = components.folder(`${platSeg}/${bbSeg}`);
        if (e.gdsContent) {
          const r = dataUrlToBytes("data:application/octet-stream;base64," + e.gdsContent);
          if (r) compF.file(e.gdsName || `${bbSeg}.gds`, r.bytes);
        }
        if (e.layoutSvg) compF.file(`${bbSeg}.svg`, e.layoutSvg);
        if (e.customSketchUrl) {
          const r = dataUrlToBytes(e.customSketchUrl);
          if (r) compF.file(`sketch_${bbSeg}.${(r.mime.split("/")[1] || "png")}`, r.bytes);
        }
        // characterisation/<platform>/<BB>/<folder>/
        for (const tg of (e.testGroups || [])) {
          const f = characterisation.folder(`${platSeg}/${bbSeg}/${safeFolder(tg.name)}`);
          for (const t of tg.tests) pushFile(f, t);
        }
        // sparams/<platform>/<BB>/<folder>/
        for (const sg of (e.smatrixGroups || [])) {
          const f = sparams.folder(`${platSeg}/${bbSeg}/${safeFolder(sg.name)}`);
          for (const t of sg.datasets) pushFile(f, t);
        }
        // fabrication/<platform>/<BB>/<folder>/
        for (const ft of (e.fabTabs || [])) {
          const f = fabrication.folder(`${platSeg}/${bbSeg}/${safeFolder(ft.name)}`);
          if (ft.notes) f.file("_notes.md", ft.notes);
          for (const t of (ft.tests || [])) pushFile(f, t);
        }
        // scripts/<platform>/<BB>/
        if ((e.scripts || []).length) {
          const f = scriptsRoot.folder(`${platSeg}/${bbSeg}`);
          for (const s of e.scripts) f.file(s.name || `${safeFolder(s.id)}.py`, s.source || "");
        }
      }
    }
  }
  // uploads/<folder>/ — the global Uploads bucket (top-level folders the
  // dashboard creates for global GitHub fetches and Layout-tab uploads).
  for (const folder of (MODEL.uploads || [])) {
    const f = uploadsRoot.folder(safeFolder(folder.name || "Inbox"));
    for (const t of (folder.tests || [])) pushFile(f, t);
  }
  toast(`Building zip — ${bbCount} BBs, ${fileCount} files…`);
  const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `pdk-monitor-backup-${verSlug}-${todayISO()}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast(`Backup ready — ${(blob.size/1024/1024).toFixed(2)} MB · ${bbCount} BBs · ${fileCount} files`);
}
document.getElementById("export-zip-btn").addEventListener("click", exportBackupZip);

/* =================================================================
   Global Download — scoped multi-select zip
   -----------------------------------------------------------------
   Lets the user pick any combination of Platforms (tabs), BB Types
   (categories), Statuses, and Users (contributors), then bundles
   every matching BB into a zip. Unlike the full Backup (.zip),
   this one is organised BB-first — one folder per BB containing
   its layout, S-parameters, characterisation, fabrication, scripts,
   and a manifest.json — so each BB folder is portable on its own.

   Empty selection in any section means "all". The modal shows a
   live preview count of how many BBs and approximate files match.
   ================================================================= */
function openGlobalDownloadModal() {
  const tabsAll     = MODEL.tabs || [];
  const typesAll    = (typeof categoryList === "function") ? categoryList() : [];
  const statusesAll = (typeof statusList   === "function") ? statusList()   : [];
  // Tech platforms = groups across all tabs (each group is one
  // technology platform like "SOI 220nm", "SiN", etc.). We keep both
  // the tab and group ids so the modal can show the parent tab as
  // a faint subtitle next to the platform name.
  const platformsAll = [];
  for (const tab of tabsAll) {
    for (const g of (tab.groups || [])) {
      platformsAll.push({
        id: g.id,
        name: g.name || "(unnamed)",
        tabName: tab.name,
        material: (g.platformMeta && g.platformMeta.material) || "",
      });
    }
  }

  // Pre-fill from any active dashboard filters so the user can hit
  // Download immediately if they've already configured a view.
  const scope = {
    tabs:     new Set(),
    platforms: new Set(),
    types:    new Set(),
    statuses: new Set(),
    users:    new Set(_userFilterSelection || []),
  };
  if (kindFilter && kindFilter.value)     scope.types.add(kindFilter.value);
  if (statusFilter && statusFilter.value) scope.statuses.add(statusFilter.value);

  openModal("Download dashboard content (scoped)", (body, foot) => {
    function checklist(items, kindKey, currentSet, labelKey) {
      if (!items.length) return `<div class="empty">— none configured —</div>`;
      return items.map(it => {
        const id  = it.id;
        const lbl = it[labelKey || "name"] || id;
        const chk = currentSet.has(id) ? " checked" : "";
        return `<label><input type="checkbox" data-kind="${kindKey}" data-id="${escapeHtml(id)}"${chk}> ${escapeHtml(lbl)}</label>`;
      }).join("");
    }
    function platformChecklist() {
      if (!platformsAll.length) return `<div class="empty">— no tech platforms yet —</div>`;
      return platformsAll.map(p => {
        const chk = scope.platforms.has(p.id) ? " checked" : "";
        const sub = p.tabName
          ? ` <span style="color:var(--text-faint);font-size:10px;">${escapeHtml(p.tabName)}${p.material ? ` · ${escapeHtml(p.material)}` : ""}</span>`
          : "";
        return `<label><input type="checkbox" data-kind="platform" data-id="${escapeHtml(p.id)}"${chk}> ${escapeHtml(p.name)}${sub}</label>`;
      }).join("");
    }
    function userChecklist() {
      const users = (typeof collectUsers === "function") ? collectUsers() : [];
      if (!users.length) return `<div class="empty">— no contributors recorded yet —</div>`;
      // Show only the friendly name — never expose the email / GitHub
      // username as a subtitle in the download filter.
      return users.map(u => {
        const lbl = (typeof displayName === "function" ? displayName(u) : null) || u;
        const chk = scope.users.has(u) ? " checked" : "";
        return `<label><input type="checkbox" data-kind="user" data-id="${escapeHtml(u)}"${chk}> ${escapeHtml(lbl)}</label>`;
      }).join("");
    }
    function renderBody() {
      body.innerHTML = `
        <p style="font-size:12px;color:var(--text-dim);margin:0 0 14px;line-height:1.55;">
          Pick the platforms, BB types, statuses, and contributors to
          include. <b>Leaving a section empty means &ldquo;all&rdquo;</b>.
          The zip contains one folder per matched BB with its GDS / SVG
          layout, S-parameters, characterisation, fabrication, scripts,
          and a per-BB <code>manifest.json</code>.
        </p>
        <div class="dl-grid">
          <div class="dl-section">
            <div class="dl-section-head">
              <strong>Tabs (${tabsAll.length})</strong>
              <button type="button" data-act="all" data-kind="tab">Select all</button>
              <button type="button" data-act="clear" data-kind="tab">Clear</button>
            </div>
            <div class="dl-checklist">${checklist(tabsAll, "tab", scope.tabs)}</div>
          </div>
          <div class="dl-section">
            <div class="dl-section-head">
              <strong>Tech platforms (${platformsAll.length})</strong>
              <button type="button" data-act="all" data-kind="platform">Select all</button>
              <button type="button" data-act="clear" data-kind="platform">Clear</button>
            </div>
            <div class="dl-checklist">${platformChecklist()}</div>
          </div>
          <div class="dl-section">
            <div class="dl-section-head">
              <strong>BB types (${typesAll.length})</strong>
              <button type="button" data-act="all" data-kind="type">Select all</button>
              <button type="button" data-act="clear" data-kind="type">Clear</button>
            </div>
            <div class="dl-checklist">${checklist(typesAll, "type", scope.types)}</div>
          </div>
          <div class="dl-section">
            <div class="dl-section-head">
              <strong>Statuses (${statusesAll.length})</strong>
              <button type="button" data-act="all" data-kind="status">Select all</button>
              <button type="button" data-act="clear" data-kind="status">Clear</button>
            </div>
            <div class="dl-checklist">${checklist(statusesAll, "status", scope.statuses)}</div>
          </div>
          <div class="dl-section dl-section-wide">
            <div class="dl-section-head">
              <strong>Contributors</strong>
              <button type="button" data-act="all" data-kind="user">Select all</button>
              <button type="button" data-act="clear" data-kind="user">Clear</button>
            </div>
            <div class="dl-checklist">${userChecklist()}</div>
          </div>
        </div>
        <div class="dl-summary" id="dl-summary"></div>
      `;

      function bucketFor(kind) {
        if (kind === "tab")      return scope.tabs;
        if (kind === "platform") return scope.platforms;
        if (kind === "type")     return scope.types;
        if (kind === "status")   return scope.statuses;
        if (kind === "user")     return scope.users;
        return null;
      }
      body.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", () => {
          const b = bucketFor(cb.dataset.kind);
          if (!b) return;
          if (cb.checked) b.add(cb.dataset.id); else b.delete(cb.dataset.id);
          refreshSummary();
        });
      });
      body.querySelectorAll(".dl-section-head button").forEach(btn0 => {
        btn0.addEventListener("click", () => {
          const k = btn0.dataset.kind;
          const b = bucketFor(k);
          if (!b) return;
          if (btn0.dataset.act === "clear") {
            b.clear();
          } else {
            const items = (k === "tab") ? tabsAll
                       : (k === "platform") ? platformsAll
                       : (k === "type") ? typesAll
                       : (k === "status") ? statusesAll
                       : (k === "user") ? collectUsers()
                       : [];
            items.forEach(it => b.add(typeof it === "string" ? it : it.id));
          }
          renderBody();   // re-render to reflect new check states
        });
      });
      refreshSummary();
    }

    function matchesScope(tab, group, e) {
      if (scope.tabs.size       && !scope.tabs.has(tab.id))        return false;
      if (scope.platforms.size  && !scope.platforms.has(group.id)) return false;
      if (scope.types.size      && !scope.types.has(e.kind))       return false;
      if (scope.statuses.size   && !scope.statuses.has(e.status))  return false;
      if (scope.users.size) {
        // OR-of-users: BB owner OR any uploaded file's "who" matches
        const own = (typeof getOwner === "function" ? getOwner(e.id) : null) || e.owner || "";
        let ok = own && scope.users.has(own);
        if (!ok) {
          const blobs = [
            ...(e.files || []),
            ...((typeof allDatasets === "function" ? allDatasets(e) : []) || []),
            ...(e.scripts || []),
            ...((e.testGroups || []).flatMap(tg => tg.tests || [])),
            ...((e.smatrixGroups || []).flatMap(sg => sg.datasets || [])),
            ...((e.fabTabs || []).flatMap(ft => ft.tests || [])),
          ];
          ok = blobs.some(f => f && f.who && scope.users.has(f.who));
        }
        if (!ok) return false;
      }
      return true;
    }

    /* Estimate the byte size of a single uploaded blob without
       actually decoding it. Falls back through the same precedence
       order pushFile() uses when writing to the zip. */
    function estimateBlobBytes(t) {
      if (!t) return 0;
      if (typeof t.size === "number" && t.size > 0) return t.size;
      if (t.binaryContent) return Math.floor(t.binaryContent.length * 3 / 4);
      if (t.imageUrl) {
        const i = t.imageUrl.indexOf(",");
        return i > 0 ? Math.floor((t.imageUrl.length - i - 1) * 3 / 4) : 0;
      }
      if (t.rawText) return t.rawText.length;
      if (t.parsed && t.parsed.sweep) {
        const rows = (t.parsed.sweep.values || []).length;
        const cols = ((t.parsed.traces || []).length) + 1;
        return rows * cols * 16; // very rough CSV cell estimate
      }
      return 0;
    }
    function estimateBBBytes(e) {
      let n = 0;
      if (e.gdsContent) n += Math.floor(e.gdsContent.length * 3 / 4);
      if (e.layoutSvg)  n += e.layoutSvg.length;
      if (e.customSketchUrl) {
        const i = e.customSketchUrl.indexOf(",");
        if (i > 0) n += Math.floor((e.customSketchUrl.length - i - 1) * 3 / 4);
      }
      for (const f of (e.files   || [])) n += estimateBlobBytes(f);
      for (const s of (e.scripts || [])) n += (s.source || "").length;
      for (const tg of (e.testGroups   || [])) for (const t of (tg.tests    || [])) n += estimateBlobBytes(t);
      for (const sg of (e.smatrixGroups|| [])) for (const t of (sg.datasets || [])) n += estimateBlobBytes(t);
      for (const ft of (e.fabTabs      || [])) for (const t of (ft.tests    || [])) n += estimateBlobBytes(t);
      return n;
    }
    function fmtBytes(n) {
      if (!n) return "0 B";
      const u = ["B","KB","MB","GB","TB"];
      let i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (n < 10 && i > 0 ? n.toFixed(2) : n.toFixed(0)) + " " + u[i];
    }

    function scanMatches() {
      let bbCount = 0, fileCount = 0, totalBytes = 0;
      const matched = [];
      for (const tab of (MODEL.tabs || [])) {
        for (const g of (tab.groups || [])) {
          for (const e of (g.entities || [])) {
            if (!matchesScope(tab, g, e)) continue;
            matched.push({ tab, group: g, entity: e });
            bbCount++;
            const blobs = [
              ...(e.files || []),
              ...((typeof allDatasets === "function" ? allDatasets(e) : []) || []),
              ...(e.scripts || []),
              ...((e.testGroups || []).flatMap(tg => tg.tests || [])),
              ...((e.smatrixGroups || []).flatMap(sg => sg.datasets || [])),
              ...((e.fabTabs || []).flatMap(ft => ft.tests || [])),
            ];
            fileCount += blobs.length;
            if (e.gdsContent)      fileCount++;
            if (e.layoutSvg)       fileCount++;
            if (e.customSketchUrl) fileCount++;
            totalBytes += estimateBBBytes(e);
          }
        }
      }
      return { matched, bbCount, fileCount, totalBytes };
    }

    function refreshSummary() {
      const sumEl = body.querySelector("#dl-summary");
      if (!sumEl) return;
      const { bbCount, fileCount, totalBytes } = scanMatches();
      const tabBit  = scope.tabs.size      ? `${scope.tabs.size} tab${scope.tabs.size===1?"":"s"}`                      : "all tabs";
      const platBit = scope.platforms.size ? `${scope.platforms.size} platform${scope.platforms.size===1?"":"s"}`       : "all platforms";
      const typeBit = scope.types.size     ? `${scope.types.size} BB type${scope.types.size===1?"":"s"}`                : "all BB types";
      const statBit = scope.statuses.size  ? `${scope.statuses.size} status${scope.statuses.size===1?"":"es"}`          : "all statuses";
      const userBit = scope.users.size     ? `${scope.users.size} contributor${scope.users.size===1?"":"s"}`            : "all contributors";
      // The zip uses DEFLATE — text usually compresses 3-5×, binary much less.
      // Conservative blended estimate: ~70% of raw for the worst case.
      const zippedHint = bbCount ? ` (~<b>${fmtBytes(Math.round(totalBytes * 0.7))}</b> zipped)` : "";
      sumEl.innerHTML = `
        Scope: <b>${tabBit}</b> &middot; <b>${platBit}</b> &middot; <b>${typeBit}</b> &middot; <b>${statBit}</b> &middot; <b>${userBit}</b>.<br>
        Matches: <b>${bbCount}</b> building block${bbCount===1?"":"s"}, approximately <b>${fileCount}</b> file${fileCount===1?"":"s"}.<br>
        Estimated download: <b>${fmtBytes(totalBytes)}</b> raw${zippedHint}.
        ${bbCount === 0 ? `<span class="dl-warning">⚠ No BBs match your scope — nothing to download. Loosen a filter above.</span>` : ""}
      `;
      const dl = body.parentNode?.querySelector?.("[data-act=download]");
      if (dl) dl.disabled = (bbCount === 0);
    }

    renderBody();

    foot.innerHTML = "";
    foot.append(btn("Cancel", "ghost", closeModal));
    foot.append(btn("Reset scope", "ghost", () => {
      scope.tabs.clear(); scope.platforms.clear(); scope.types.clear(); scope.statuses.clear(); scope.users.clear();
      renderBody();
    }));
    const dlBtn = btn("⬇ Download zip", "primary", async () => {
      const { matched, bbCount, fileCount } = scanMatches();
      if (bbCount === 0) { toast("Nothing matches your scope.", "err"); return; }
      dlBtn.disabled = true; dlBtn.textContent = "Building…";
      try {
        await buildScopedDownloadZip(scope, matched, bbCount, fileCount);
        closeModal();
      } catch (err) {
        console.error(err);
        toast(`Download failed: ${err.message}`, "err");
      } finally {
        dlBtn.disabled = false; dlBtn.textContent = "⬇ Download zip";
      }
    });
    dlBtn.dataset.act = "download";
    foot.append(dlBtn);
  });
}

/* Build the actual zip. Folder layout (BB-first so each BB is portable):
     <Platform>/<BB>/
       manifest.json              — summary of the BB (owner, status, files)
       layout/<bb>.gds            — GDS bytes (if any)
       layout/<bb>.svg            — rendered SVG (if any)
       layout/sketch_<bb>.<ext>   — custom sketch (if any)
       sparams/<folder>/*         — S-matrix files per BB sub-folder
       characterisation/<folder>/*  — measurement files per BB sub-folder
       fabrication/<folder>/*       — fab notes + per-folder files
       scripts/*.py               — per-BB Python scripts
     _index.csv                   — list of every BB in the bundle
     README.txt                   — what's in the zip + scope summary
*/
async function buildScopedDownloadZip(scope, matched, bbCount, fileCount) {
  const JSZip = await ensureJSZip();
  const zip = new JSZip();
  const stamp = new Date().toISOString();
  const ver = (MODEL.about && MODEL.about.version) || "v1";

  function pushFile(folder, t) {
    if (!folder || !t) return;
    if (t.binaryContent) {
      const bytes = base64ToBytes(t.binaryContent);
      folder.file(t.filename || `${safeFolder(t.name)}.bin`, bytes);
    } else if (t.imageUrl) {
      const r = dataUrlToBytes(t.imageUrl);
      if (r) folder.file(t.filename || `${safeFolder(t.name)}.bin`, r.bytes);
    } else if (t.rawText) {
      folder.file(t.filename || `${safeFolder(t.name)}.txt`, t.rawText);
    } else if (t.parsed && t.parsed.sweep && t.parsed.traces) {
      const sw = t.parsed.sweep, tr = t.parsed.traces;
      const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
      for (let i = 0; i < sw.values.length; i++) {
        lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
      }
      folder.file(`${safeFolder(t.name)}.csv`, lines.join("\n"));
    } else {
      folder.file(`${safeFolder(t.name)}.metadata.json`,
        JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata, note: "Original bytes were not preserved." }, null, 2));
    }
  }

  toast(`Building zip — ${bbCount} BB${bbCount===1?"":"s"}, ~${fileCount} file${fileCount===1?"":"s"}…`);

  const indexRows = [["Platform", "Group", "BB", "Kind", "Status", "Owner", "Files (approx)"]];

  for (const { tab, group, entity } of matched) {
    const platSeg = safeFolder(tab.name);
    const grpSeg  = safeFolder(group.name);
    const bbSeg   = safeFolder(entity.name);
    // <Platform>/<Group>/<BB>/ — keep both tab + group in the path so
    // BB names that collide across sub-platforms don't overwrite.
    const root = zip.folder(`${platSeg}/${grpSeg}/${bbSeg}`);

    // manifest
    const owner = (typeof getOwner === "function" ? getOwner(entity.id) : null) || entity.owner || "";
    const manifest = {
      platform: tab.name,
      group: group.name,
      bb: entity.name,
      kind: entity.kind,
      bbType: entity.bbType,
      status: entity.status,
      owner,
      updated: entity.updated || null,
      githubUrl: entity.githubUrl || null,
      description: entity.description || null,
      counts: {
        testGroups: (entity.testGroups || []).length,
        smatrixGroups: (entity.smatrixGroups || []).length,
        fabTabs: (entity.fabTabs || []).length,
        scripts: (entity.scripts || []).length,
        files: (entity.files || []).length,
      },
      exportedAt: stamp,
    };
    root.file("manifest.json", JSON.stringify(manifest, null, 2));

    // layout (GDS / SVG / sketch)
    const layoutF = root.folder("layout");
    let bbHasLayout = false;
    if (entity.gdsContent) {
      const r = dataUrlToBytes("data:application/octet-stream;base64," + entity.gdsContent);
      if (r) { layoutF.file(entity.gdsName || `${bbSeg}.gds`, r.bytes); bbHasLayout = true; }
    }
    if (entity.layoutSvg) { layoutF.file(`${bbSeg}.svg`, entity.layoutSvg); bbHasLayout = true; }
    if (entity.customSketchUrl) {
      const r = dataUrlToBytes(entity.customSketchUrl);
      if (r) { layoutF.file(`sketch_${bbSeg}.${(r.mime.split("/")[1] || "png")}`, r.bytes); bbHasLayout = true; }
    }
    if (!bbHasLayout) layoutF.file("_no_layout.txt", "No layout (.gds / .svg / sketch) is attached to this BB.\n");

    // characterisation/
    for (const tg of (entity.testGroups || [])) {
      const f = root.folder(`characterisation/${safeFolder(tg.name)}`);
      for (const t of (tg.tests || [])) pushFile(f, t);
    }
    // sparams/
    for (const sg of (entity.smatrixGroups || [])) {
      const f = root.folder(`sparams/${safeFolder(sg.name)}`);
      for (const t of (sg.datasets || [])) pushFile(f, t);
    }
    // fabrication/
    for (const ft of (entity.fabTabs || [])) {
      const f = root.folder(`fabrication/${safeFolder(ft.name)}`);
      if (ft.notes) f.file("_notes.md", ft.notes);
      for (const t of (ft.tests || [])) pushFile(f, t);
    }
    // scripts/
    if ((entity.scripts || []).length) {
      const sf = root.folder("scripts");
      for (const s of entity.scripts) sf.file(s.name || `${safeFolder(s.id)}.py`, s.source || "");
    }
    // other top-level files (Layout tab uploads)
    if ((entity.files || []).length) {
      const ff = root.folder("files");
      for (const t of entity.files) pushFile(ff, t);
    }

    const fileEst =
      (entity.gdsContent ? 1 : 0) + (entity.layoutSvg ? 1 : 0) + (entity.customSketchUrl ? 1 : 0) +
      (entity.files || []).length +
      (entity.scripts || []).length +
      (entity.testGroups   || []).reduce((a, g) => a + (g.tests    || []).length, 0) +
      (entity.smatrixGroups|| []).reduce((a, g) => a + (g.datasets || []).length, 0) +
      (entity.fabTabs      || []).reduce((a, g) => a + (g.tests    || []).length, 0);
    indexRows.push([tab.name, group.name, entity.name, entity.kind || "", entity.status || "", owner, String(fileEst)]);
  }

  // _index.csv + README.txt at the root
  const csv = indexRows.map(r => r.map(c => {
    const s = String(c == null ? "" : c);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\n");
  zip.file("_index.csv", csv);
  zip.file("README.txt",
`CORNERSTONE Open Platform — scoped BB download
Generated: ${stamp}
Dashboard version: ${ver}

Scope:
  Tabs           : ${scope.tabs.size      ? Array.from(scope.tabs).join(", ")      : "(all)"}
  Tech platforms : ${scope.platforms.size ? Array.from(scope.platforms).join(", ") : "(all)"}
  BB types       : ${scope.types.size     ? Array.from(scope.types).join(", ")     : "(all)"}
  Statuses       : ${scope.statuses.size  ? Array.from(scope.statuses).join(", ")  : "(all)"}
  Contributors   : ${scope.users.size     ? Array.from(scope.users).join(", ")     : "(all)"}

Contents:
  <Platform>/<Group>/<BB>/manifest.json     — BB summary (owner, status, etc.)
  <Platform>/<Group>/<BB>/layout/           — .gds, .svg, sketch
  <Platform>/<Group>/<BB>/sparams/<folder>/ — S-matrix files
  <Platform>/<Group>/<BB>/characterisation/<folder>/ — measurement files
  <Platform>/<Group>/<BB>/fabrication/<folder>/      — fab notes + files
  <Platform>/<Group>/<BB>/scripts/          — Python scripts
  <Platform>/<Group>/<BB>/files/            — other Layout-tab files

  _index.csv  — flat list of every BB in this bundle
  README.txt  — this file

Generated by ${MODEL.about?.title || "CORNERSTONE PDK Monitor"}.
`);

  const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const verSlug = ver.replace(/[^a-z0-9]+/gi, "-");
  a.download = `pdk-monitor-scoped-${verSlug}-${todayISO()}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast(`Download ready — ${(blob.size/1024/1024).toFixed(2)} MB · ${bbCount} BB${bbCount===1?"":"s"}`);
}

document.getElementById("export-xlsx-btn").addEventListener("click", async () => {

      cdiAxisList().forEach(ax => {

          ? `${cdiObj[ax.id]}/${ax.max}` : "";
      });
      rows.push({

        Platform: g.name,
        Material: g.platformMeta?.material || "",
        "Thickness (nm)": g.platformMeta?.thickness ?? "",
        "Parent (variant of)": parentName || "",
        Name: e.name,
        Status: statusLabel(e.status),
        Category: e.kind ? categoryLabel(e.kind) : "",
        "BB type": e.bbType || "",
        Owner: e.owner || "",
        "EDA tools": (e.edaTools || []).map(edaToolLabel).join(", "),
        ...cdiCells,
        TRL: (e.trl != null) ? `${e.trl}/9` : "",
        Tests: (e.testGroups || []).reduce((a,tg)=>a+tg.tests.length,0),
        "S-matrix datasets": allDatasets(e).length,
        Scripts: (e.scripts || []).length,
        "Has GDS": e.gdsName ? "yes" : "",
        "Has SVG": e.layoutSvg ? "yes" : "",
        Variants: (e.subBlocks || []).length,
        "Last updated": e.updated || "",
        GitHub: e.githubUrl || "",
        Description: (e.description || "").replace(/\s+/g, " ").trim(),
      });
      (e.subBlocks || []).forEach(sb => row(sb, g, tab, e.name));
    }
    for (const tab of MODEL.tabs)
      for (const g of tab.groups)
        for (const e of g.entities) row(e, g, tab, "");

    if (!rows.length) { toast("No BBs to export", "err"); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    // Auto-fit-ish column widths from header length and a small max
    const headers = Object.keys(rows[0]);
    ws["!cols"] = headers.map(h => {
      const max = rows.reduce((m, r) => Math.max(m, String(r[h] ?? "").length), h.length);
      return { wch: Math.min(60, Math.max(8, max + 2)) };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Building blocks");

    // Second sheet: platforms summary
    const platRows = MODEL.tabs.flatMap(t =>
      t.groups.map(g => ({
        Tab: t.name,
        Platform: g.name,
        Material: g.platformMeta?.material || "",
        "Thickness (nm)": g.platformMeta?.thickness ?? "",
        "BB count": g.entities.length,
        "Variant count": g.entities.reduce((a,e)=>a+(e.subBlocks||[]).length, 0),
      }))
    );
    if (platRows.length) {
      const ws2 = XLSX.utils.json_to_sheet(platRows);
      ws2["!cols"] = Object.keys(platRows[0]).map(h => {
        const max = platRows.reduce((m, r) => Math.max(m, String(r[h] ?? "").length), h.length);
        return { wch: Math.min(60, Math.max(8, max + 2)) };
      });
      XLSX.utils.book_append_sheet(wb, ws2, "Platforms");
    }

    XLSX.writeFile(wb, `pdk-bb-summary-${todayISO()}.xlsx`);
    toast(`Exported ${rows.length} BB row${rows.length === 1 ? "" : "s"}`);
  } catch (err) {
    console.error("xlsx export failed", err);
    toast(`xlsx export failed: ${err.message || err}`, "err");
  }

document.getElementById("import-input").addEventListener("change", async (ev) => {

  const lower = file.name.toLowerCase();
  try {
    let parsed;
    if (lower.endsWith(".zip")) {
      const JSZip = await ensureJSZip();
      const z = await JSZip.loadAsync(file);
      const entry = z.file("model.json") || z.file(/^.*model\.json$/i)?.[0];
      if (!entry) throw new Error("No model.json found inside the zip — the zip wasn't produced by this dashboard");
      parsed = JSON.parse(await entry.async("string"));
    } else {
      parsed = JSON.parse(await file.text());

    if (!confirm("Replace all current data with imported file?")) return;
    MODEL = migrate(parsed);
    activeTabId = MODEL.tabs[0]?.id;
    // Save synchronously to IndexedDB so a quick reload still has the data.
    await saveModel();
    render();

    for (const tab of MODEL.tabs)
      for (const g of tab.groups)

          fileCount += (e.testGroups || []).reduce((a, tg) => a + tg.tests.length, 0);

/* =================================================================
   PARTIAL RESET — wipe ONLY the contributions made by a single
   user-admin identity. Admin-created and other-user-admin-created
   items survive untouched. Containers (folders, sub-tabs, BBs,
   platforms, top-level tabs) owned by the identity are removed only
   when they have NO foreign children left — otherwise we keep them
   so somebody else's data isn't lost as collateral damage.
   Returns a { removed: { scripts, tests, datasets, folders, ... } }
   summary suitable for a toast.
================================================================= */
async function resetUserAdminContributions(identity) {
  if (!identity) throw new Error("resetUserAdminContributions: no identity");
  const own = MODEL.ownership || (MODEL.ownership = {});
  const isMine = (id) => id && own[id] === identity;
  const stripOwn = (id) => { if (id && own[id]) delete own[id]; };
  const stat = { scripts:0, datasets:0, tests:0, folders:0, fabTabs:0, edaLinks:0, subBlocks:0, bbs:0, groups:0, tabs:0, layouts:0, blobs:0 };

  // Drop scripts owned by identity, freeing any IDB blobs along the way.
  async function pruneScripts(arr) {
    if (!Array.isArray(arr)) return arr;
    const keep = [];
    for (const s of arr) {
      if (isMine(s.id)) {
        if (s.blobRef) { try { await idbDeleteBlob(s.blobRef); stat.blobs++; } catch {} }
        stripOwn(s.id); stat.scripts++;
      } else keep.push(s);
    }
    return keep;
  }
  // Drop tests / datasets owned by identity (no blobs to free for these).
  function pruneLeafArr(arr, statKey) {
    if (!Array.isArray(arr)) return arr;
    const keep = [];
    for (const t of arr) {
      if (isMine(t.id)) { stripOwn(t.id); stat[statKey]++; }
      else keep.push(t);
    }
    return keep;
  }

  async function processEntity(e) {
    e.scripts        = await pruneScripts(e.scripts);
    e.datasets       = pruneLeafArr(e.datasets, "datasets");
    // S-matrix folders — prune contents, then drop empty folders we own.
    if (Array.isArray(e.smatrixGroups)) {
      for (const sg of e.smatrixGroups) sg.datasets = pruneLeafArr(sg.datasets, "datasets");
      e.smatrixGroups = e.smatrixGroups.filter(sg => {
        if (isMine(sg.id) && (!sg.datasets || sg.datasets.length === 0)) {
          stripOwn(sg.id); stat.folders++; return false;
        }
        return true;
      });
    }
    // Test folders — same shape.
    if (Array.isArray(e.testGroups)) {
      for (const tg of e.testGroups) tg.tests = pruneLeafArr(tg.tests, "tests");
      e.testGroups = e.testGroups.filter(tg => {
        if (isMine(tg.id) && (!tg.tests || tg.tests.length === 0)) {
          stripOwn(tg.id); stat.folders++; return false;
        }
        return true;
      });
    }
    // Fabrication sub-tabs — they also carry .tests via renderFolderCard reuse.
    if (Array.isArray(e.fabTabs)) {
      for (const ft of e.fabTabs) ft.tests = pruneLeafArr(ft.tests, "tests");
      e.fabTabs = e.fabTabs.filter(ft => {
        if (isMine(ft.id) && (!ft.tests || ft.tests.length === 0)) {
          stripOwn(ft.id); stat.fabTabs++; return false;
        }
        return true;
      });
    }
    // EDA entries — the folder is the entry itself; .tests holds the files.
    if (Array.isArray(e.edaLinks)) {
      for (const lk of e.edaLinks) lk.tests = pruneLeafArr(lk.tests, "tests");
      e.edaLinks = e.edaLinks.filter(lk => {
        if (isMine(lk.id) && (!lk.tests || lk.tests.length === 0)) {
          stripOwn(lk.id); stat.edaLinks++; return false;
        }
        return true;
      });
    }
    // Layout artefact — synthetic "layout:<bbId>" ownership key.
    const layoutKey = "layout:" + e.id;
    if (isMine(layoutKey)) {
      e.layoutSvg = ""; e.gdsName = ""; e.gdsSize = 0; e.gdsContent = "";
      stripOwn(layoutKey); stat.layouts++;
    }
    // Variants (sub-blocks) — recurse, then drop empty mine.
    if (Array.isArray(e.subBlocks)) {
      for (const sb of e.subBlocks) await processEntity(sb);
      e.subBlocks = e.subBlocks.filter(sb => {
        if (isMine(sb.id) && hasNoForeignContent(sb, identity)) {
          stripOwn(sb.id); stat.subBlocks++; return false;
        }
        return true;
      });
    }
  }

  // After processing children, decide whether the entity itself is removable.
  function hasNoForeignContent(e, who) {
    if ((e.scripts        || []).some(s  => own[s.id]  && own[s.id]  !== who)) return false;
    if ((e.datasets       || []).some(d  => own[d.id]  && own[d.id]  !== who)) return false;
    if ((e.smatrixGroups  || []).some(sg => own[sg.id] && own[sg.id] !== who)) return false;
    if ((e.testGroups     || []).some(tg => own[tg.id] && own[tg.id] !== who)) return false;
    if ((e.fabTabs        || []).some(ft => own[ft.id] && own[ft.id] !== who)) return false;
    if ((e.edaLinks       || []).some(lk => own[lk.id] && own[lk.id] !== who)) return false;
    if ((e.subBlocks      || []).some(sb => (own[sb.id] && own[sb.id] !== who) || !hasNoForeignContent(sb, who))) return false;
    // Folder leaves must also be checked — if a foreign user uploaded files
    // into a folder this user-admin created, those files survived above and
    // we must NOT delete the folder out from under them.
    for (const sg of (e.smatrixGroups || [])) for (const d of (sg.datasets || [])) if (own[d.id] && own[d.id] !== who) return false;
    for (const tg of (e.testGroups    || [])) for (const t of (tg.tests    || [])) if (own[t.id] && own[t.id] !== who) return false;
    for (const ft of (e.fabTabs       || [])) for (const t of (ft.tests    || [])) if (own[t.id] && own[t.id] !== who) return false;
    for (const lk of (e.edaLinks      || [])) for (const t of (lk.tests    || [])) if (own[t.id] && own[t.id] !== who) return false;
    return true;
  }

  // Walk every BB.
  for (const tb of (MODEL.tabs || [])) {
    for (const g of (tb.groups || [])) {
      for (const e of (g.entities || [])) await processEntity(e);
      g.entities = g.entities.filter(e => {
        if (isMine(e.id) && hasNoForeignContent(e, identity)) {
          stripOwn(e.id); stat.bbs++; return false;
        }
        return true;
      });
    }
    tb.groups = tb.groups.filter(g => {
      if (isMine(g.id) && (!g.entities || g.entities.length === 0)) {
        stripOwn(g.id); stat.groups++; return false;
      }
      return true;
    });
  }
  MODEL.tabs = MODEL.tabs.filter(tb => {
    if (isMine(tb.id) && (!tb.groups || tb.groups.length === 0)) {
      stripOwn(tb.id); stat.tabs++; return false;
    }
    return true;
  });
  // Make sure activeTabId still points somewhere valid.
  if (!MODEL.tabs.find(t => t.id === activeTabId)) {
    activeTabId = MODEL.tabs[0]?.id || null;
  }
  return stat;
}

document.getElementById("reset-btn").addEventListener("click", async () => {
  // User-admins can ONLY remove their own contributions — admin / other
  // user-admin work is preserved. Full admins still get the original
  // "wipe everything and re-seed defaults" behaviour.
  if (currentMode() === "user-admin") {
    const me = currentIdentity();
    if (!me) { toast("Sign in first", "err"); return; }
    const label = displayName(me) || me;
    if (!confirm(`Remove every contribution made by you (${label})?\n\n• Files / scripts / folders / sub-tabs / BBs / platforms / tabs you created will be deleted.\n• Anything created by the admin or by another user-admin will be left untouched.\n• Containers (e.g. folders, BBs) you created that still hold someone else's content will be kept so their data isn't lost.\n\nThis cannot be undone — Export first if you want a backup.`)) return;
    try {
      const stat = await resetUserAdminContributions(me);
      await saveModel(); render();
      const parts = [];
      if (stat.bbs)       parts.push(`${stat.bbs} BB${stat.bbs===1?"":"s"}`);
      if (stat.subBlocks) parts.push(`${stat.subBlocks} variant${stat.subBlocks===1?"":"s"}`);
      if (stat.scripts)   parts.push(`${stat.scripts} script${stat.scripts===1?"":"s"}`);
      if (stat.datasets)  parts.push(`${stat.datasets} dataset${stat.datasets===1?"":"s"}`);
      if (stat.tests)     parts.push(`${stat.tests} test file${stat.tests===1?"":"s"}`);
      if (stat.folders)   parts.push(`${stat.folders} folder${stat.folders===1?"":"s"}`);
      if (stat.fabTabs)   parts.push(`${stat.fabTabs} fab sub-tab${stat.fabTabs===1?"":"s"}`);
      if (stat.edaLinks)  parts.push(`${stat.edaLinks} EDA entry`);
      if (stat.layouts)   parts.push(`${stat.layouts} layout${stat.layouts===1?"":"s"}`);
      if (stat.groups)    parts.push(`${stat.groups} platform${stat.groups===1?"":"s"}`);
      if (stat.tabs)      parts.push(`${stat.tabs} tab${stat.tabs===1?"":"s"}`);
      toast(parts.length ? `Removed your contributions: ${parts.join(", ")}` : "Nothing to remove — you hadn't contributed anything yet");
    } catch (err) {
      toast(`Reset failed: ${err.message}`, "err");
    }
    return;
  }
  // Full admin → original "wipe and re-seed" behaviour.
  if (!confirm("Wipe EVERYTHING (including admin + every user-admin contribution) and re-seed factory defaults? Export first if you want a backup.")) return;
  MODEL = defaultModel();
  activeTabId = MODEL.tabs[0]?.id;
  // Clear IndexedDB explicitly so the fresh defaults aren't shadowed
  try { await idbDelete("model"); } catch {}
  await saveModel(); render(); toast("Reset to defaults");
});

function openUserFilter() {
  if (!userFilterPop) return;
  rebuildUserFilter();
  userFilterPop.hidden = false;
  setTimeout(() => userFilterSearch?.focus(), 30);
}
function closeUserFilter() {
  if (userFilterPop) userFilterPop.hidden = true;
}
function toggleUserFilter() {
  if (!userFilterPop) return;
  if (userFilterPop.hidden) openUserFilter(); else closeUserFilter();
}
if (userFilterBtn) {
  userFilterBtn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    toggleUserFilter();
  });
}
if (userFilterSearch) {
  userFilterSearch.addEventListener("input", () => {
    _userFilterSearchText = userFilterSearch.value;
    rebuildUserFilter();
  });
  // Pressing Enter in the search box keeps the popover open and
  // applies the current selection (which is already live anyway).
  userFilterSearch.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); render(); }
    if (ev.key === "Escape") { closeUserFilter(); }
  });
}
if (userFilterClear) {
  userFilterClear.addEventListener("click", () => {
    _userFilterSelection.clear();
    _userFilterSearchText = "";
    if (userFilterSearch) userFilterSearch.value = "";
    rebuildUserFilter();
    render();
  });
}
if (userFilterApply) {
  userFilterApply.addEventListener("click", () => {
    render();
    closeUserFilter();
  });
}

document.addEventListener("click", (ev) => {

});
