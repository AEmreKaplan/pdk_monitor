<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CORNERSTONE PDK Monitor</title>
<style>
  :root {
    --bg: #0f1419; --panel: #161c24; --panel-2: #1d242e; --panel-3: #252e3a;
    --border: #2a323d; --text: #e6edf3; --text-dim: #8b949e; --text-faint: #6e7681;
    --accent: #58a6ff; --accent-soft: rgba(88,166,255,.15);
    --danger: #f85149; --danger-soft: rgba(248,81,73,.15);
    --status-done: #3fb950; --status-progress: #d29922; --status-todo: #8b949e;
    --status-stale: #f85149; --status-blocked: #db61a2;
    --kind-active: #db61a2; --kind-passive: #58a6ff;
    --mat-Si: #d29922; --mat-SiN: #58a6ff; --mat-LN: #db61a2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
    --radius: 8px; --gap: 14px;
    --t1:#58a6ff; --t2:#3fb950; --t3:#d29922; --t4:#db61a2; --t5:#a371f7; --t6:#f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,20,25,.92); backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  header h1 .sub { color: var(--text-dim); font-weight: 400; margin-left: 8px; }
  header h1 .title-refresh {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; padding: 0; margin-left: 10px;
    font-size: 14px; cursor: pointer; vertical-align: middle; line-height: 1;
    transition: transform .25s, color .15s, border-color .15s;
  }
  header h1 .title-refresh:hover { color: var(--accent); border-color: var(--accent); transform: rotate(180deg); }
  header .stats { display: flex; gap: 14px; color: var(--text-dim); font-size: 13px; }
  header .stats b { color: var(--text); font-weight: 600; }
  header input[type=search] {
    flex: 0 1 280px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 7px 12px; font: inherit; outline: none;
  }
  header input[type=search]:focus { border-color: var(--accent); }
  /* Status / Category filter dropdowns are narrow now — they show only a
     compact "Status" / "Category" placeholder until you click. The freed
     space is used by the Useful Links chip row + the Logo widget. */
  header select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; outline: none;
    max-width: 130px; font-size: 12px;
  }
  header .spacer { flex: 1; }
  /* Useful links — small chips. Editable via the About modal. */
  header .links {
    display: inline-flex; gap: 6px; flex-wrap: wrap;
    align-items: center; max-width: 360px;
  }
  header .links a, header .links .links-edit {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 4px;
    padding: 4px 9px; font-size: 11px; text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  header .links a:hover, header .links .links-edit:hover {
    border-color: var(--accent); color: var(--accent);
  }
  /* Logo widget — clickable square holding a user-uploaded image (or initials) */
  .logo-widget {
    width: 38px; height: 38px; border-radius: 6px;
    background: var(--panel-2); border: 1px dashed var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer; flex-shrink: 0;
    color: var(--text-faint); font-size: 11px; font-weight: 600;
    letter-spacing: .04em;
  }
  .logo-widget:hover { border-color: var(--accent); }
  .logo-widget img { width: 100%; height: 100%; object-fit: contain; display: block; }
  header button.tool {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font: inherit; cursor: pointer;
  }
  header button.tool:hover { border-color: var(--accent); color: var(--accent); }
  header .storage {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    line-height: 1.15; font-variant-numeric: tabular-nums;
  }
  header .storage .storage-main { color: var(--text-faint); font-size: 12px; }
  header .storage .storage-stamp { color: var(--text-faint); opacity: .75; font-size: 10.5px; }
  header .storage.warn .storage-main { color: var(--status-progress); }
  header .storage.crit .storage-main { color: var(--status-stale); }

  /* ---------- top tab strip (level-1 categories) ---------- */
  .tab-strip {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0;
    padding: 0 22px;
    overflow-x: auto;
    position: sticky; top: 49px; z-index: 9;
  }
  .tab-strip .tab {
    background: transparent; border: none;
    color: var(--text-dim); font: inherit; font-weight: 600;
    padding: 12px 16px; cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tab-strip .tab:hover { color: var(--text); }
  .tab-strip .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-strip .tab .ct { color: var(--text-faint); font-size: 11px; font-weight: 600; }
  .tab-strip .tab .menu {
    color: var(--text-faint); font-size: 14px; padding: 0 4px;
    background: transparent; border: none; cursor: pointer; line-height: 1;
  }
  .tab-strip .tab .menu:hover { color: var(--text); }
  .tab-strip .add-tab {
    background: transparent; border: 1px dashed var(--border); border-radius: 4px;
    color: var(--text-faint); font: inherit; padding: 4px 10px;
    margin: 7px 0 7px 12px; cursor: pointer;
  }
  .tab-strip .add-tab:hover { border-color: var(--accent); color: var(--accent); }

  /* Side-by-side rectangular columns, ~3 per row. Extra platforms wrap to
     the next row and the page scrolls vertically. No horizontal scroll on
     the board. Each column has a default width sized so three fit on a row;
     the user can still drag the right edge to grow / shrink, and a wide
     column will naturally push the next one to the row below. */
  main {
    padding: 22px;
    display: flex; flex-wrap: wrap;
    align-items: flex-start;
    gap: 20px;
    overflow-x: hidden; overflow-y: visible;
  }

  .group {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column;
    /* Default: 3 columns per row, accounting for 2 gaps of 20 px. The min
       protects narrow screens — the row falls back to 2- or 1-up. */
    flex: 1 1 calc((100% - 40px) / 3);
    min-width: 280px;
    max-width: 100%;
    position: relative;
  }
  /* Right-edge resize handle so user can drag a column wider / narrower */
  .group-resize-handle {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 8px; cursor: col-resize;
    background: transparent; z-index: 5;
  }
  .group-resize-handle::after {
    content: ""; position: absolute;
    right: 2px; top: 12px; bottom: 12px; width: 2px;
    background: var(--border); border-radius: 1px;
    transition: background .15s;
  }
  .group-resize-handle:hover::after,
  .group.resizing .group-resize-handle::after { background: var(--accent); }
  .group-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    border-top: 3px solid var(--border);
  }
  .group[data-mat=Si]  .group-head { border-top-color: var(--mat-Si); }
  .group[data-mat=SiN] .group-head { border-top-color: var(--mat-SiN); }
  .group[data-mat=LN]  .group-head { border-top-color: var(--mat-LN); }
  .group-head .title-area { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group-head h2 {
    margin: 0; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-head input.title-edit {
    font: inherit; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--accent);
    color: var(--text); border-radius: 4px;
    padding: 4px 8px; width: 100%; outline: none;
  }
  .group-head .count {
    color: var(--text-faint); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .group-head .menu-btn {
    background: transparent; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 18px; padding: 0 6px; line-height: 1;
    border-radius: 4px;
  }
  .group-head .menu-btn:hover { color: var(--text); background: var(--panel-2); }
  /* Per-platform Sync button — slightly larger and labelled so it stands
     out from the chevron / ⋯ menu. Replays every recorded GitHub URL for
     every BB inside this platform. */
  .group-head .group-sync-btn {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    transition: transform .25s, background .15s;
  }
  .group-head .group-sync-btn .ico { font-size: 16px; line-height: 1; display: inline-block; transition: transform .35s; }
  .group-head .group-sync-btn:hover { background: var(--accent); color: #0b1117; }
  .group-head .group-sync-btn:hover .ico { transform: rotate(180deg); }
  .platform-meta {
    padding: 6px 14px 0; color: var(--text-faint); font-size: 11px;
    display: flex; gap: 10px;
  }
  .platform-meta .chip {
    padding: 1px 7px; border-radius: 3px; background: var(--panel-3);
  }

  /* BB list inside a platform — vertical scroll showing ~4 cards at a time.
     The BB cards themselves average about 64px tall plus 10px gap, so a
     360px viewport shows roughly four. User can drag the bottom handle to
     grow the window. */
  .group-body {
    padding: 12px; display: flex; flex-direction: column; gap: var(--gap);
    height: 360px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
  }
  .group-body::-webkit-scrollbar { width: 10px; }
  .group-body::-webkit-scrollbar-track { background: var(--panel); }
  .group-body::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }
  .group-body::-webkit-scrollbar-thumb:hover { background: var(--border); }
  .group-body .add-btn {
    background: transparent; color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 9px; font: inherit; cursor: pointer;
    transition: border-color .12s, color .12s;
  }
  .group-body .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  .add-group {
    align-self: start; background: transparent; color: var(--text-dim);
    border: 1px dashed var(--border); border-radius: 8px;
    padding: 18px 22px; font: inherit; cursor: pointer;
    min-height: 80px; min-width: 200px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .12s, color .12s;
  }
  .add-group:hover { border-color: var(--accent); color: var(--accent); }

  .empty-msg { color: var(--text-faint); font-style: italic; padding: 4px; font-size: 13px; }

  /* ---------- card ---------- */
  .card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 11px 13px; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card-row1 { display: flex; align-items: center; gap: 10px; }
  .card-title {
    font-weight: 600; font-size: 14px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    font-weight: 600; letter-spacing: .02em; white-space: nowrap;
  }
  .pill[data-status=done]      { background: rgba(63,185,80,.15);  color: var(--status-done); }
  .pill[data-status=progress]  { background: rgba(210,153,34,.15); color: var(--status-progress); }
  .pill[data-status=todo]      { background: rgba(139,148,158,.15);color: var(--status-todo); }
  .pill[data-status=stale]     { background: rgba(248,81,73,.15);  color: var(--status-stale); }
  .pill[data-status=blocked]   { background: rgba(219,97,162,.15); color: var(--status-blocked); }

  .kind-chip, .category-chip {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  /* Colours are applied inline from MODEL.categories / MODEL.statuses. */

  .card-row2 {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    color: var(--text-dim); font-size: 12px;
  }
  .owner {
    display: inline-flex; align-items: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .avatar {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; flex-shrink: 0;
  }
  .badges {
    display: inline-flex; gap: 6px; margin-left: auto;
    color: var(--text-faint); font-size: 11px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--panel-3); padding: 2px 7px; border-radius: 4px;
  }
  .badge b { color: var(--text-dim); font-weight: 600; }
  .updated { color: var(--text-faint); font-variant-numeric: tabular-nums; font-size: 11px; }

  /* ---------- side panel ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 50;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(820px, 96vw); background: var(--panel);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform .2s ease-out;
    z-index: 51; display: flex; flex-direction: column;
    box-shadow: -8px 0 32px rgba(0,0,0,.4);
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .panel-head h3 {
    margin: 0; font-size: 16px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .panel-head button.icon {
    background: transparent; color: var(--text-dim);
    border: none; font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .panel-head button.icon:hover { color: var(--text); }

  /* Single-row BB tab strip — every tab takes its natural width so labels
     are never truncated. Font is tied to the panel width via clamp() so
     things shrink gracefully on small panels and the row keeps fitting
     without ellipsis. */
  .panel-tabs {
    display: flex; gap: 0; padding: 0 4px;
    border-bottom: 1px solid var(--border);
    flex-wrap: nowrap;
    overflow-x: auto;          /* horizontal scroll only as a last resort */
  }
  .panel-tabs::-webkit-scrollbar { height: 4px; }
  .panel-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .panel-tabs button {
    background: transparent; border: none;
    color: var(--text-dim); font: inherit; font-weight: 600;
    font-size: clamp(12px, 1.7vw, 14px);
    padding: 9px 8px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap;
    flex: 0 0 auto;            /* size to content — no truncation */
    text-align: center;
  }
  .panel-tabs button:hover { color: var(--text); background: var(--panel-2); }
  .panel-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-tabs button .count {
    margin-left: 4px; background: var(--panel-2); color: var(--text-faint);
    border-radius: 999px; padding: 0 5px; font-size: 9.5px; font-weight: 600;
    display: inline-block; min-width: 14px; line-height: 14px;
  }

  .panel-body {
    padding: 16px 18px; overflow-y: auto; flex: 1;
    display: flex; flex-direction: column; gap: 16px;
  }
  .panel-foot {
    padding: 12px 18px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .panel-foot .right { margin-left: auto; display: flex; gap: 10px; }

  .field-label {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 4px;
  }
  .field-value { color: var(--text); font-size: 14px; }

  input[type=text], input[type=number], input[type=date], textarea, select {
    width: 100%;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  textarea.code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; min-height: 160px; line-height: 1.45;
    background: #0b1117;
  }

  label.tickbox {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-dim); cursor: pointer; font-size: 13px;
    user-select: none;
  }
  label.tickbox input { width: auto; margin: 0; }

  button.primary {
    background: var(--accent); color: #0b1117; border: none; border-radius: 6px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: .5; cursor: wait; }
  button.ghost {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }
  button.ghost:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost.active { color: var(--accent); border-color: var(--accent); }
  button.danger {
    background: var(--danger-soft); color: var(--danger);
    border: 1px solid transparent; border-radius: 6px;
    padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.danger:hover { border-color: var(--danger); }
  button.mini {
    background: var(--panel-2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font: inherit; font-size: 11px; cursor: pointer;
  }
  button.mini:hover { color: var(--text); border-color: var(--accent); }
  button.mini.danger-mini {
    color: var(--text-faint); background: transparent; border-color: transparent;
    padding: 4px 6px; font-size: 14px;
  }
  button.mini.danger-mini:hover { color: var(--danger); }

  .panel-empty { color: var(--text-faint); font-style: italic; }

  .item-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .item-row { display: flex; align-items: center; gap: 10px; }
  .item-name {
    font-weight: 600; font-size: 13px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--text-faint);
  }
  .lang-chip {
    font-size: 10px; padding: 1px 7px; border-radius: 3px;
    font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .lang-chip.python { background: rgba(88,166,255,.18); color: var(--accent); }
  .lang-chip.matlab { background: rgba(210,153,34,.18); color: var(--status-progress); }
  .item-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .dropzone {
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 12px; text-align: center;
    color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--accent); }

  .code-view {
    background: #0b1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45;
    color: var(--text); white-space: pre; overflow: auto; max-height: 300px;
  }

  /* visualization */
  .viz-toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .viz-stage {
    background: #0b1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 0;
    min-height: 360px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
    overflow: hidden; width: 100%;
  }
  .viz-stage svg {
    width: 100%; height: auto; display: block;
  }
  .xyz-controls {
    display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; align-items: end;
    margin-bottom: 8px;
  }
  .xyz-controls .ctrl { display: flex; flex-direction: column; gap: 2px; min-width: 110px; }
  .xyz-controls .ctrl label {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .xyz-controls input[type=number] {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    padding: 5px 7px; font-size: 12px; width: 100%;
  }
  .params-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* test folder collapsible */
  .folder-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  .folder-head {
    padding: 9px 12px; display: flex; align-items: center; gap: 10px;
    background: var(--panel-3);
    cursor: pointer;
  }
  .folder-head .fname { font-weight: 600; flex: 1; }
  .folder-head .fcount { color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .folder-body {
    padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    max-height: 380px;        /* show ~6-8 files, scroll for longer lists */
    overflow-y: auto;
  }
  .folder-body::-webkit-scrollbar { width: 8px; }
  .folder-body::-webkit-scrollbar-track { background: var(--panel-2); }
  .folder-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .folder-body::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  .folder-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 10px; }
  /* Compact-but-readable header toolbar used by Tests / S-matrix / Scripts /
     Fabrication. Each button keeps an icon + short label so the section
     title stays roomy and the actions are obvious. Buttons share a tight
     grouped look (panel-coloured pill) so the row reads as one toolbar. */
  .section-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section-toolbar .field-label { white-space: nowrap; }
  .section-actions {
    margin-left: auto;
    display: inline-flex; gap: 0;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px;
  }
  .section-actions .icon-btn {
    background: transparent; color: var(--text-dim);
    border: none; cursor: pointer;
    height: 32px; line-height: 1;
    font: inherit; font-size: 12px;
    padding: 0 10px;
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .section-actions .icon-btn .ico { font-size: 15px; line-height: 1; }
  .section-actions .icon-btn:hover { background: var(--panel-3); color: var(--accent); }
  .section-actions .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  /* Outer wrapper for the list of folders inside Test results / S-matrix /
     Fabrication. Caps height at ~72vh so the panel keeps the controls /
     description visible when there are lots of folders. The wrap itself
     scrolls vertically; collapsed folders shrink to a single header row,
     so the user can keep many folders around without screen pressure. */
  .folder-list-wrap {
    max-height: 72vh;
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-gutter: stable;
  }
  .folder-list-wrap::-webkit-scrollbar { width: 8px; }
  .folder-list-wrap::-webkit-scrollbar-track { background: var(--panel); }
  .folder-list-wrap::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }
  .folder-list-wrap::-webkit-scrollbar-thumb:hover { background: var(--border); }
  .folder-card.collapsed .folder-head { border-bottom: none; }

  .modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.96);
    width: min(960px, 96vw); max-height: 92vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow);
    z-index: 60;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .modal-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal-body { padding: 16px; overflow: auto; flex: 1; }
  .modal-foot {
    padding: 10px 16px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  canvas#chart { max-width: 100%; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 16px; font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
    z-index: 100; max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  [hidden] { display: none !important; }

  /* ---------- card variants chip ---------- */
  .variant-chip {
    position: relative;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px;
    padding: 2px 10px; font-size: 11px; cursor: pointer;
    user-select: none; font-weight: 600;
  }
  .variant-chip:hover { filter: brightness(1.15); }
  .variant-chip b { color: var(--text); font-weight: 700; }
  @keyframes pulse-card {
    0%   { box-shadow: 0 0 0 0 rgba(88,166,255,.55); border-color: var(--accent); }
    50%  { box-shadow: 0 0 0 10px rgba(88,166,255,0); border-color: var(--accent); }
    100% { box-shadow: 0 0 0 0 rgba(88,166,255,0); }
  }
  .card.pulse { animation: pulse-card 1.6s ease-out; }
  .variant-menu {
    position: absolute; top: 100%; right: 0;
    z-index: 30; min-width: 220px; max-width: 320px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px; margin-top: 4px;
    box-shadow: var(--shadow);
    display: none;
  }
  .variant-menu.open { display: block; }
  .variant-menu .vm-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px;
    cursor: pointer; font-size: 12px; color: var(--text);
  }
  .variant-menu .vm-item:hover { background: var(--panel-2); }
  .variant-menu .vm-item .meta { color: var(--text-faint); font-size: 11px; margin-left: auto; }

  /* ---------- drag-to-reorder ---------- */
  .tab[draggable=true]   { cursor: grab; }
  .group[draggable=true] { }
  .group .group-head     { cursor: grab; }
  .tab.dragging, .group.dragging { opacity: 0.4; }
  .tab.drag-over   { background: var(--panel-2); border-bottom-color: var(--accent); }
  .group.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius: 8px; }

  /* ---------- read-only / user-admin / admin modes ---------- */
  body.read-only .admin-only { display: none !important; }
  /* User-admin sees the same UI as admin EXCEPT for owner-only actions
     (Reset, Backup, Excel export, Manage lists, 🔑 Passwords, Import). */
  body.user-admin .full-admin-only { display: none !important; }
  body.read-only .full-admin-only { display: none !important; }
  body.read-only .group-head input.title-edit,
  body.read-only h2[title] { pointer-events: none; }
  /* Read-only users must NOT have any upload affordance — drag-and-drop
     surfaces, hidden file inputs, even the dotted "Drop files here" hint
     are all hidden so there's no path to push bytes into the model. The
     handler-side requireWrite() guard catches anyone who bypasses CSS. */
  body.read-only .dropzone,
  body.read-only input[type="file"] { display: none !important; }
  .mode-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
  }
  .mode-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--status-progress);
  }
  /* Admin = warm orange, User-admin = blue, Read-only = green dot */
  body:not(.read-only):not(.user-admin) .mode-pill .dot { background: var(--status-stale); }
  body:not(.read-only):not(.user-admin) .mode-pill { color: var(--status-stale); border-color: var(--status-stale); }
  body.user-admin .mode-pill { color: var(--accent); border-color: var(--accent); }
  body.user-admin .mode-pill .dot { background: var(--accent); }
  body.read-only .mode-pill { color: var(--status-done); border-color: var(--status-done); }
  body.read-only .mode-pill .dot { background: var(--status-done); }

  /* ---------- analysis modal ---------- */
  .analysis-grid {
    display: grid; grid-template-columns: 280px 1fr; gap: 14px;
    align-items: start;
  }
  .analysis-side {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    max-height: 70vh; overflow: auto;
  }
  .analysis-side .filter-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .analysis-side .pill-btn,
  .ana-main .pill-btn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 8px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .analysis-side .pill-btn:hover,
  .ana-main .pill-btn:hover { color: var(--text); }
  .analysis-side .pill-btn.active { color: var(--accent); border-color: var(--accent); }
  .ana-main .pill-btn.active { color: var(--text); }
  .ana-platform { color: var(--text-dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 0 2px; }
  .ana-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 4px;
  }
  .ana-row:hover { background: var(--panel-3); }
  .ana-row label { flex: 1; font-size: 12px; cursor: pointer; }
  .ana-main { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow: auto; }
  .ana-summary {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
    color: var(--text-dim); font-size: 12px;
  }
  .ana-summary b { color: var(--text); }
  .ana-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Distribution (GitHub publish/adopt) modal ---------- */
  .dist-section {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px; margin-bottom: 12px;
  }
  .dist-section h4 {
    margin: 0 0 8px; font-size: 12.5px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .dist-section .dist-help {
    font-size: 11px; color: var(--text-faint); line-height: 1.5; margin: 0 0 10px;
  }
  .dist-grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .dist-grid .full { grid-column: 1 / -1; }
  .dist-grid label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .dist-grid input[type=text], .dist-grid input[type=password] {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    padding: 6px 8px; font: inherit; font-size: 12px; outline: none;
  }
  .dist-grid input:focus { border-color: var(--accent); }
  .dist-actions {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .dist-actions button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .dist-actions button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .dist-actions button:hover { border-color: var(--accent); }
  .dist-actions button:disabled { opacity: .5; cursor: not-allowed; }
  .dist-status {
    margin-top: 10px; font-size: 11.5px; line-height: 1.55;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; color: var(--text-dim);
    white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
  }
  .dist-status:empty { display: none; }
  .dist-preview {
    margin-top: 10px; padding: 10px 12px;
    background: rgba(56, 139, 253, .08); border: 1px solid rgba(56, 139, 253, .35);
    border-radius: 4px; font-size: 11.5px; line-height: 1.55; color: var(--text);
  }
  .dist-preview b { color: var(--accent); }
  .dist-tickbox {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-dim); margin-top: 6px; cursor: pointer;
  }

  /* ---------- Contributors modal ---------- */
  .contrib-table {
    width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px;
  }
  .contrib-table th, .contrib-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .contrib-table th {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-faint); font-weight: 600;
  }
  .contrib-table tr.is-auto td { background: rgba(56, 139, 253, .04); }
  .contrib-table input[type=text], .contrib-table input[type=email] {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    padding: 4px 6px; font: inherit; font-size: 12px; outline: none;
  }
  .contrib-table input:focus { border-color: var(--accent); }
  .contrib-table .contrib-source {
    font-size: 9px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-faint); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 5px; white-space: nowrap;
  }
  .contrib-table .contrib-source.is-manual {
    color: var(--accent); border-color: var(--accent);
  }
  .contrib-table .contrib-row-actions {
    display: flex; gap: 4px; justify-content: flex-end;
  }
  .contrib-table .contrib-row-actions button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  .contrib-table .contrib-row-actions button:hover { color: var(--text); border-color: var(--accent); }
  .contrib-table .contrib-row-actions button.danger:hover {
    color: var(--status-stale); border-color: var(--status-stale);
  }
  .contrib-empty {
    padding: 14px 12px; text-align: center; font-size: 12px;
    color: var(--text-faint); border: 1px dashed var(--border); border-radius: 6px;
    margin-bottom: 12px;
  }
  .contrib-add-row {
    display: flex; gap: 6px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .contrib-add-row .ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .contrib-add-row .ghost:hover { color: var(--text); border-color: var(--accent); }
  .contrib-readonly-help {
    font-size: 11px; color: var(--text-faint);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 12px; line-height: 1.5;
  }

  /* ---------- Global Download modal ---------- */
  .dl-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .dl-grid { grid-template-columns: 1fr; } }
  .dl-section {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
  }
  .dl-section.dl-section-wide { grid-column: 1 / -1; }
  .dl-section-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .dl-section-head strong { flex: 1; font-size: 12px; color: var(--text); }
  .dl-section-head button {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 4px; padding: 3px 8px; font-size: 10px; cursor: pointer;
  }
  .dl-section-head button:hover { color: var(--text); border-color: var(--accent); }
  .dl-checklist {
    max-height: 180px; overflow: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dl-checklist label {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text); padding: 3px 4px; border-radius: 3px; cursor: pointer;
  }
  .dl-checklist label:hover { background: rgba(56, 139, 253, .08); }
  .dl-checklist input[type=checkbox] { margin: 0; flex-shrink: 0; }
  .dl-checklist .empty { font-size: 11px; color: var(--text-faint); padding: 6px 4px; }
  .dl-summary {
    margin-top: 14px; padding: 12px 14px;
    background: rgba(56, 139, 253, .08); border: 1px solid rgba(56, 139, 253, .35);
    border-radius: 6px; font-size: 12px; color: var(--text); line-height: 1.55;
  }
  .dl-summary b { color: var(--accent); }
  .dl-summary .dl-warning { display: block; margin-top: 6px; color: var(--status-stale); }

  /* ---------- Multi-select user filter (header popover) ---------- */
  .user-filter-wrap { position: relative; display: inline-block; }
  .user-filter-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
    max-width: 220px;
  }
  .user-filter-btn:hover { border-color: var(--accent); }
  .user-filter-btn .user-filter-caret { color: var(--text-faint); font-size: 10px; }
  .user-filter-btn.has-selection {
    background: rgba(56, 139, 253, .12);
    border-color: var(--accent);
    color: var(--text);
  }
  .user-filter-pop {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
    width: 280px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; max-height: 60vh; overflow: hidden;
  }
  .user-filter-pop[hidden] { display: none; }
  .user-filter-head {
    padding: 8px; border-bottom: 1px solid var(--border);
  }
  .user-filter-head input[type=search] {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    padding: 6px 8px; font: inherit; font-size: 12px; outline: none;
  }
  .user-filter-head input[type=search]:focus { border-color: var(--accent); }
  .user-filter-list {
    flex: 1; overflow: auto; padding: 4px 0; min-height: 60px;
  }
  .user-filter-list .user-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px; font-size: 12px; color: var(--text);
    cursor: pointer; user-select: none;
  }
  .user-filter-list .user-row:hover { background: var(--panel-2); }
  .user-filter-list .user-row input[type=checkbox] { margin: 0; flex-shrink: 0; }
  .user-filter-list .user-row .user-id-sub {
    font-size: 10px; color: var(--text-faint); margin-left: 6px;
  }
  .user-filter-list .user-row.is-checked { background: rgba(56, 139, 253, .08); }
  .user-filter-list .empty {
    padding: 14px 12px; font-size: 11px; color: var(--text-faint); text-align: center;
  }
  .user-filter-foot {
    display: flex; align-items: center; gap: 6px;
    padding: 8px; border-top: 1px solid var(--border);
  }
  .user-filter-foot .user-filter-count {
    font-size: 11px; color: var(--text-faint);
  }
  .user-filter-foot button {
    font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  .user-filter-foot .ghost {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  }
  .user-filter-foot .ghost:hover { color: var(--text); border-color: var(--accent); }
  .user-filter-foot .primary {
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
  }
  .user-filter-foot .primary:hover { filter: brightness(1.1); }

  /* ---------- Terms / Licenses footer + first-launch acceptance gate ----------
     Footer is a normal block element so it flows after <main> without
     covering content. The acceptance gate is a full-viewport overlay
     that blocks all interaction until the user agrees to the Terms. */
  .app-footer {
    margin: 24px 0 0; padding: 10px 24px 14px;
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 8px 16px;
    font-size: 11px; color: var(--text-faint);
  }
  .app-footer a {
    color: var(--text-dim); text-decoration: none;
    border-bottom: 1px dashed transparent; cursor: pointer;
  }
  .app-footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .app-footer .app-footer-sep { color: var(--text-faint); opacity: .55; margin: 0 4px; }
  .app-footer .app-footer-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .app-footer .app-footer-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

  /* Acceptance gate — fixed overlay, full viewport, dim background.
     Cannot be dismissed by Escape or backdrop click; user must
     check the box and click Accept (or click Decline to back out). */
  .terms-gate {
    position: fixed; inset: 0; z-index: 1000;
    display: none; align-items: center; justify-content: center;
    background: rgba(13, 17, 23, .94); padding: 16px;
  }
  .terms-gate.open { display: flex; }
  .terms-gate-card {
    width: 100%; max-width: 760px; max-height: 90vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 22px 26px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
  }
  .terms-gate-card h2 { margin: 0; font-size: 17px; color: var(--text); }
  .terms-gate-card .terms-gate-version {
    margin: 0; font-size: 11px; color: var(--text-faint); letter-spacing: .03em;
  }
  .terms-gate-body {
    flex: 1; overflow: auto; min-height: 180px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px;
    font-size: 12.5px; line-height: 1.55; color: var(--text-dim);
  }
  .terms-gate-body h3 { font-size: 12.5px; margin: 10px 0 4px; color: var(--text); }

================================================================= */

/* Defaults for the editable lists. Once the model is loaded, the

  { id: "hybrid",    name: "Hybrid",             color: "#8b6cf5" },

];
const DEFAULT_BBTYPES = [

/* Component Development Index axes — three orthogonal maturity axes, each
   ranked 1-4. Editable in Manage lists. Surfaced as three sliders / pickers
   on the BB form and as a row of pills on the BB Details tab. */
const DEFAULT_CDI_AXES = [
  { id: "chip",      name: "Chip level",      min: 1, max: 4, color: "#58a6ff" },

const DEFAULT_PLATFORMS = [
  { id: "soi-220",    name: "SOI 220 nm",                material: "Si",        thickness: 220,  defaultWGwidth: 500,  color: "#d29922" },
  { id: "soi-340",    name: "SOI 340 nm",                material: "Si",        thickness: 340,  defaultWGwidth: 800,  color: "#cdb174" },
  { id: "soi-500",    name: "SOI 500 nm",                material: "Si",        thickness: 500,  defaultWGwidth: 1000, color: "#cdc3ac" },
  { id: "tfln-300",   name: "TFLN 300 nm",               material: "LN",        thickness: 300,  defaultWGwidth: 1500, color: "#7039a7" },

  { id: "ge-on-si",   name: "GeonSi",                    material: "Germanium", thickness: 3000, defaultWGwidth: 2000, color: "#41c851" },
];
const PALETTE_FALLBACK = ["#58a6ff","#3fb950","#d29922","#db61a2","#a371f7","#f85149","#79c0ff","#56d364","#e3b341","#ff7b72"];

function statusList()   { return MODEL.statuses   || DEFAULT_STATUSES; }
function categoryList() { return MODEL.categories || DEFAULT_CATEGORIES; }
function bbTypeList()   { return MODEL.bbTypes    || DEFAULT_BBTYPES; }
function platformList() { return MODEL.platforms  || DEFAULT_PLATFORMS; }
function edaToolList()  { return MODEL.edaTools   || DEFAULT_EDATOOLS; }
function cdiAxisList()  { return MODEL.cdiAxes    || DEFAULT_CDI_AXES; }
function edaToolByName(t) { return edaToolList().find(x => x.id === t || x.name === t); }
function edaToolColor(t) { const x = edaToolByName(t); return x ? x.color : "#8b949e"; }
function edaToolLabel(t) { const x = edaToolByName(t); return x ? x.name : t; }
function cdiAxisByName(a) { return cdiAxisList().find(x => x.id === a || x.name === a); }
function cdiAxisColor(a) { const x = cdiAxisByName(a); return x ? x.color : "#8b949e"; }
function cdiAxisLabel(a) { const x = cdiAxisByName(a); return x ? x.name : a; }

/* Flatten every S-matrix dataset on a BB across its folders. */
function allDatasets(e) {
  if (!e) return [];
  return [
    ...((e.datasets || [])),
    ...((e.smatrixGroups || []).flatMap(sg => sg.datasets || [])),
  ];
}

/* Find the curated platform record that matches a group: prefer name match,
   fall back to material+thickness. Returns null if nothing matches. */
function platformForGroup(g) {
  if (!g) return null;
  const list = platformList();
  let p = list.find(x => x.name === g.name);
  if (p) return p;
  if (g.platformMeta) {
    p = list.find(x =>
      String(x.material || "").toLowerCase() === String(g.platformMeta.material || "").toLowerCase() &&
      Number(x.thickness) === Number(g.platformMeta.thickness));
    if (p) return p;
  }
  return null;
}
function groupStripeColor(g) {
  const p = platformForGroup(g);
  if (p && p.color) return p.color;
  // legacy fallback by material
  const m = g?.platformMeta?.material;
  if (m === "Si")  return "#d29922";
  if (m === "SiN") return "#58a6ff";
  if (m === "LN")  return "#db61a2";
  return null;
}

function statusByName(s) { return statusList().find(x => x.id === s || x.name === s); }
function categoryByName(c) { return categoryList().find(x => x.id === c || x.name === c); }
function bbTypeByName(t) { return bbTypeList().find(x => x.id === t || x.name === t); }

function statusLabel(s) { const x = statusByName(s); return x ? x.name : s; }
function statusColor(s) { const x = statusByName(s); return x ? x.color : "#8b949e"; }
function categoryLabel(c) { const x = categoryByName(c); return x ? x.name : c; }
function categoryColor(c) { const x = categoryByName(c); return x ? x.color : "#8b949e"; }
function paletteFor(i) { return PALETTE_FALLBACK[i % PALETTE_FALLBACK.length]; }

const STATUS_LABEL = {};   // legacy global, populated after model load
const STATUSES = [];       // legacy global

const DEFAULT_ABOUT = {
  title:    'CORNERSTONE Open Platform',
  subtitle: 'OPENSOURCE PDK live monitor',
  version:  'v1.0',

function defaultParamsFor(bbType, platform) {
  const t = platform?.thickness || 220;
  const w = platform?.defaultWGwidth || 500;
  switch (bbType) {
    case "waveguide":            return { width_nm: w, length_um: 100, thickness_nm: t };
    case "mmi":                  return { width_um: 6, length_um: 30, thickness_nm: t, in_ports: 1, out_ports: 2, stub_width_nm: w };
    case "crossing":             return { arm_width_nm: w, arm_length_um: 8, thickness_nm: t };
    case "bend":                 return { radius_um: 10, angle_deg: 90, width_nm: w, thickness_nm: t };
    case "mzi":                  return { arm_length_um: 200, arm_imbalance_um: 50, width_nm: w, thickness_nm: t };
    case "ring":                 return { radius_um: 10, gap_nm: 200, width_nm: w, thickness_nm: t, drop_port: 0 };
    case "directional-coupler":  return { coupling_length_um: 50, gap_nm: 200, width_nm: w, thickness_nm: t };
    case "y-junction":           return { branch_length_um: 30, width_nm: w, thickness_nm: t };
    case "awg":                  return { n_inputs: 1, n_outputs: 4, n_arms: 12, fsr_nm: 12.8, thickness_nm: t };
    case "grating-coupler":      return { period_nm: 630, n_periods: 28, fill_factor: 0.5, width_nm: w, thickness_nm: t };
    case "edge-coupler":         return { tip_width_nm: 100, output_width_nm: w, taper_length_um: 100, thickness_nm: t };
    case "spiral":               return { length_um: 1000, radius_um: 5, width_nm: w, thickness_nm: t };
    case "heater":               return { length_um: 200, filament_width_nm: 900, width_um: 8, thickness_nm: t };
    case "photodetector":        return { length_um: 50, width_um: 4, thickness_nm: t };
    case "modulator":            return { arm_length_um: 1000, electrode_length_um: 1000, vpi_l_v_cm: 1.5, gap_nm: 200, width_nm: w, thickness_nm: t };
    default:                     return {};
  }
}

/* Tracks every new ID generated while the dashboard is in "user-admin" mode.
   The PR modal filters its file list by this set so user-admins only push
   the items THEY added in this session — never pre-existing content. */
const _uaAdditions = new Set();
function _restoreUaAdditions() {
  try {
    const raw = sessionStorage.getItem("pdk-monitor.ua-additions");
    if (raw) for (const id of JSON.parse(raw)) _uaAdditions.add(id);
  } catch {}
}
_restoreUaAdditions();
function _persistUaAdditions() {
  try { sessionStorage.setItem("pdk-monitor.ua-additions", JSON.stringify([..._uaAdditions])); }
  catch {}
}
function isUserAdmin() {
  // Helper kept short — used by uid() below, which runs *very* often.
  // sessionStorage read is cheap but cached behind a single check.
  return sessionStorage.getItem("pdk-monitor.role") === "user-admin";
}
function uid(prefix) {
  const id = (prefix || "x") + "_" + Math.random().toString(36).slice(2, 9);
  if (isUserAdmin()) {
    _uaAdditions.add(id);
    _persistUaAdditions();
  }
  // Stamp the creator on the central ownership map. Admins are recorded
  // with the literal identity "admin" if they didn't supply one at sign-in;
  // user-admins use whatever identity they signed in with (email or GitHub
  // username). MODEL might not exist yet at the very first uid() call —
  // skip silently in that case (defaults are pristine, no ownership to
  // track).
  try {
    if (typeof MODEL === "object" && MODEL) {
      MODEL.ownership = MODEL.ownership || {};
      const owner = currentIdentity();
      if (owner) MODEL.ownership[id] = owner;
    }
  } catch {}
  return id;
}

/* Identity + permission helpers ---------------------------------------- */
function currentIdentity() {
  // Returns the string used to attribute new items.
  //   - admin: ALWAYS the literal "admin", regardless of any identity the
  //     admin typed at sign-in. This is the critical rule: admin-created
  //     items must never be modifiable by user-admins, even if the same
  //     person signs back in as user-admin with the same email/github.
  //     The role is the boundary, not the human.
  //   - user-admin: their typed identity (email / GitHub username) — the
  //     Sign-in modal enforces a non-empty value before letting them in.
  //   - read-only: null (no ownership stamped).
  const role = sessionStorage.getItem("pdk-monitor.role") || "";
  if (role === "admin") return "admin";
  if (role === "user-admin") {
    const id = sessionStorage.getItem("pdk-monitor.identity") || "";
    return id || null;
  }
  return null;
}
function getOwner(id) {
  if (!id || !MODEL || !MODEL.ownership) return null;
  return MODEL.ownership[id] || null;
}
/* Friendly display name for an identity. Lookup order:
     1. MODEL.labels[identity]              — populated at sign-in
     2. _security.guestPasswords matching   — live fallback if the owner
                                              renamed a guest entry after
                                              that user signed in
     3. the identity itself (email / github username) */
function displayName(identity) {
  if (!identity) return "";
  if (MODEL && MODEL.labels && MODEL.labels[identity]) return MODEL.labels[identity];
  try {
    const guests = (_security && _security.guestPasswords) || [];
    for (const g of guests) {
      if (g.label && (g.email === identity || g.githubUser === identity)) {
        return g.label;
      }
    }
  } catch {}
  return identity;
}
/* Convenience: format an identity for display alongside its email/github
   in parentheses when both are available, else just the label. */
function displayNameLong(identity) {
  if (!identity) return "";
  const lbl = (MODEL && MODEL.labels) ? MODEL.labels[identity] : "";
  if (lbl && lbl !== identity) return `${lbl} <${identity}>`;
  return identity;
}
/* Can the current session modify the item with the given id?
 *  - Admin: always yes.
 *  - User-admin: only if THEY own it.
 *      * Items with no recorded owner          → no (legacy ≈ admin-owned).
 *      * Items owned by the literal "admin"     → no (any admin's work).
 *      * Items owned by their own identity      → yes.
 *      * Items owned by another identity        → no.
 *  - Read-only: always no. */
function canModifyId(id) {
  const role = sessionStorage.getItem("pdk-monitor.role") || "";
  if (role === "admin") return true;
  if (role !== "user-admin") return false;   // read-only or signed out
  const owner = getOwner(id);
  if (!owner) return false;                  // legacy
  if (owner === "admin") return false;       // any admin's creation
  return owner === currentIdentity();
}
/* Convenience: object-form (looks up obj.id). */
function canModify(obj) {
  return obj && obj.id ? canModifyId(obj.id) : false;
}

function defaultModel() {
  const m = {
    statuses:   JSON.parse(JSON.stringify(DEFAULT_STATUSES)),
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    bbTypes:    JSON.parse(JSON.stringify(DEFAULT_BBTYPES)),
    platforms:  JSON.parse(JSON.stringify(DEFAULT_PLATFORMS)),
    edaTools:   JSON.parse(JSON.stringify(DEFAULT_EDATOOLS)),
    cdiAxes:    JSON.parse(JSON.stringify(DEFAULT_CDI_AXES)),
    about:      JSON.parse(JSON.stringify(DEFAULT_ABOUT)),
    ownership:  {},                  // id → identity (creator)
    labels:     {},                  // identity → friendly label (from guest entry)
    uploads:    [],
    tabs: [
      {
        id: uid("tab"), name: "Technology Platforms",
        groups: SEED_PLATFORMS.map(p => ({
          id: uid("g"), name: p.name,
          platformMeta: { material: p.material, thickness: p.thickness },
          entities: [],
        })),
      },
      { id: uid("tab"), name: "Design Manual",   groups: [] },
      { id: uid("tab"), name: "Post-Processing", groups: [] },
    ],
  };
  return m;
}

function inferPlatformMeta(name) {
  const m = (name || "").match(/(SOI|SiN|TFLN)\s*(\d+)/i);
  if (!m) return null;
  const kind = m[1].toUpperCase();
  return { material: kind === "SOI" ? "Si" : kind === "TFLN" ? "LN" : "SiN", thickness: Number(m[2]) };
}
function inferBbType(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("modulat"))                                   return "modulator";   // before "mzi"
  if (n.includes("mzi") || n.includes("mach-zehnder"))         return "mzi";
  if (n.includes("ring"))                                      return "ring";
  if (n.includes("directional") || n.includes("dir coup"))     return "directional-coupler";
  if (n.includes("grating coupler") || n.includes("grating"))  return "grating-coupler";
  if (n.includes("edge coupler") || n.includes("inverse taper")) return "edge-coupler";
  if (n.includes("spiral"))                                    return "spiral";
  if (n.includes("photo") || n === "pd" || n.includes("detector")) return "photodetector";
  if (n.includes("mmi"))                                       return "mmi";
  if (n.includes("crossing"))                                  return "crossing";
  if (n.includes("bend"))                                      return "bend";
  if (n.includes("wave"))                                      return "waveguide";
  return "";
}

function migrateEntity(e, gMeta) {
  if (!e.id) e.id = uid("e");
  // status: if not in current list, leave as-is (don't overwrite — user may
  // have used a custom status that isn't in defaults). Coerce blank to "todo".
  if (typeof e.status !== "string" || !e.status) e.status = "todo";
  if (typeof e.name !== "string") e.name = "";
  if (typeof e.githubUrl !== "string") e.githubUrl = "";
  if (typeof e.owner !== "string") e.owner = "";
  if (typeof e.description !== "string") e.description = "";
  if (typeof e.updated !== "string") e.updated = "";
  if (typeof e.plannedReleaseDate !== "string") e.plannedReleaseDate = "";
  if (!Array.isArray(e.files))    e.files    = [];
  if (!Array.isArray(e.scripts))  e.scripts  = [];
  if (!Array.isArray(e.datasets)) e.datasets = [];
  if (!Array.isArray(e.smatrixGroups)) e.smatrixGroups = [];
  // Migrate the old flat datasets array into the new folder structure
  if (e.datasets.length && !e.smatrixGroups.length) {
    for (const d of e.datasets) {
      if (!d.metadata || typeof d.metadata !== "object") d.metadata = {};
      if (typeof d.size !== "number") d.size = 0;
    }
    e.smatrixGroups.push({ id: uid("sg"), name: "Imported", datasets: e.datasets.slice() });
    e.datasets = [];
  }
  for (const sg of e.smatrixGroups) {
    if (!sg.id) sg.id = uid("sg");
    if (typeof sg.name !== "string") sg.name = "Folder";
    if (!Array.isArray(sg.datasets)) sg.datasets = [];
    for (const d of sg.datasets) {
      if (!d.id) d.id = uid("d");
      if (!d.metadata || typeof d.metadata !== "object") d.metadata = {};
      if (typeof d.size !== "number") d.size = 0;
    }
  }
  if (typeof e.kind !== "string")    e.kind = "";
  if (typeof e.bbType !== "string")  e.bbType = inferBbType(e.name);
  if (typeof e.layoutSvg !== "string") e.layoutSvg = "";
  if (typeof e.gdsName !== "string")   e.gdsName = "";
  if (typeof e.gdsSize !== "number")   e.gdsSize = 0;
  if (typeof e.gdsContent !== "string") e.gdsContent = "";
  // Optional user-uploaded sketch image (data: URL or remote URL)
  if (typeof e.customSketchUrl !== "string") e.customSketchUrl = "";
  if (typeof e.customSketchName !== "string") e.customSketchName = "";
  // Layout scale calibration — microns per SVG unit. GDS-rendered layouts
  // bake their own value into the SVG via data-um-per-svgunit; this field
  // overrides for raw user SVGs after the user calibrates with "Set scale".
  if (typeof e.layoutScaleUmPerPx !== "number") e.layoutScaleUmPerPx = 0;
  if (!Array.isArray(e.subBlocks))     e.subBlocks = [];
  if (typeof e.expanded !== "boolean")  e.expanded = false;
  for (const sb of e.subBlocks) migrateEntity(sb, gMeta);
  // optional dimensions: derive from existing params presence
  if (typeof e.dimensionsOn !== "boolean") {
    e.dimensionsOn = e.params && Object.keys(e.params).length > 0;
  }
  if (e.params == null || typeof e.params !== "object") {
    e.params = e.dimensionsOn
      ? defaultParamsFor(e.bbType, gMeta ? { thickness: gMeta.thickness, defaultWGwidth: 500 } : null)
      : {};
  }
  // GitHub fetch history — every URL pulled into this BB (per section), so
  // the per-platform "Sync GitHub" button can replay them. Each entry is
  //   { section: "layout" | "tests" | "smatrix" | "scripts" | "fab",
  //     url, ts, lastResult }
  if (!Array.isArray(e.fetchHistory)) e.fetchHistory = [];
  // EDA tools (multi-select) — list of edaTool ids, e.g. ["ipkiss","gdsfactory"]
  if (!Array.isArray(e.edaTools)) e.edaTools = [];
  // EDA tab — list of per-tool repo entries on this BB. Each entry has
  // {id, tool: "<edaTool id>", label, url, description, tests: [...]}.
  // The "tests" array lets users attach files (PDFs, screenshots, etc.)
  // alongside each link, mirroring the Fabrication-tab shape.
  if (!Array.isArray(e.edaLinks)) e.edaLinks = [];
  for (const lk of e.edaLinks) {
    if (!lk.id) lk.id = uid("eda");
    if (typeof lk.tool        !== "string") lk.tool = "";
    if (typeof lk.label       !== "string") lk.label = "";
    if (typeof lk.url         !== "string") lk.url = "";
    if (typeof lk.description !== "string") lk.description = "";
    if (!Array.isArray(lk.tests)) lk.tests = [];
    for (const t of lk.tests) {
      if (!t.id) t.id = uid("t");
      if (!t.metadata || typeof t.metadata !== "object") t.metadata = {};
    }
  }
  // Component Development Index — flat object keyed by axis id, value 1-N (or null)
  if (e.cdi == null || typeof e.cdi !== "object") e.cdi = {};
  // Technology Readiness Level — integer 1-9 (or null = not assessed)
  if (typeof e.trl !== "number" && e.trl !== null) e.trl = null;
  // Fabrication tab — user-editable sub-tabs. Each sub-tab is now full-featured:
  // notes (textarea) + tests array (drop files / View raw / Plot raw / Run script),
  // same shape as a Tests-tab folder so the same renderers apply.
  if (!Array.isArray(e.fabTabs)) e.fabTabs = [];
  for (const ft of e.fabTabs) {
    if (!ft.id) ft.id = uid("ft");
    if (typeof ft.name !== "string") ft.name = "Tab";
    if (typeof ft.notes !== "string") ft.notes = "";
    if (!Array.isArray(ft.tests)) ft.tests = [];
    for (const t of ft.tests) {
      if (!t.id) t.id = uid("t");
      if (!t.metadata || typeof t.metadata !== "object") t.metadata = {};
    }
  }
  // Tests → testGroups (folders). Migrate flat tests array if present.
  if (!Array.isArray(e.testGroups)) e.testGroups = [];
  if (Array.isArray(e.tests) && e.tests.length) {
    e.testGroups.unshift({
      id: uid("tg"),
      name: "All",
      tests: e.tests,
    });
    delete e.tests;
  }
  // Make sure each test has the modern shape
  for (const tg of e.testGroups) {
    if (!tg.id)  tg.id = uid("tg");
    if (!tg.name) tg.name = "Folder";
    if (!Array.isArray(tg.tests)) tg.tests = [];
    for (const t of tg.tests) {
      if (!t.id) t.id = uid("t");
      if (!t.metadata || typeof t.metadata !== "object") t.metadata = {};
    }
  }
  return e;
}

function migrateGroup(g) {
  if (!g.id) g.id = uid("g");
  if (!g.name) g.name = "Untitled";
  if (g.platformMeta == null) g.platformMeta = inferPlatformMeta(g.name);
  if (typeof g.status !== "string") g.status = "";
  if (typeof g.kind   !== "string") g.kind   = "";
  if (typeof g.collapsed !== "boolean") g.collapsed = false;
  // No forced default width — leave undefined so the flex default (3 across)
  // applies. A user-dragged width is persisted as an explicit pixel value.
  if (!Array.isArray(g.entities)) g.entities = [];
  for (const e of g.entities) migrateEntity(e, g.platformMeta);
  return g;
}

function ensureLists(model) {
  if (!Array.isArray(model.statuses) || !model.statuses.length) {
    model.statuses = JSON.parse(JSON.stringify(DEFAULT_STATUSES));
  }
  if (!Array.isArray(model.categories) || !model.categories.length) {
    model.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  }
  if (!Array.isArray(model.bbTypes) || !model.bbTypes.length) {
    model.bbTypes = JSON.parse(JSON.stringify(DEFAULT_BBTYPES));
  }
  if (!Array.isArray(model.platforms) || !model.platforms.length) {
    model.platforms = JSON.parse(JSON.stringify(DEFAULT_PLATFORMS));
  }
  if (!Array.isArray(model.edaTools) || !model.edaTools.length) {
    model.edaTools = JSON.parse(JSON.stringify(DEFAULT_EDATOOLS));
  }
  if (!Array.isArray(model.cdiAxes) || !model.cdiAxes.length) {
    model.cdiAxes = JSON.parse(JSON.stringify(DEFAULT_CDI_AXES));
  }
  // About / version info — editable header text + free-form notes.
  // Defaults pulled from DEFAULT_ABOUT (baked into the source) so a brand
  // new dashboard ships with the curated CORNERSTONE Open Platform identity
  // without needing any external seed file.
  if (!model.about || typeof model.about !== "object") model.about = {};
  if (typeof model.about.title    !== "string") model.about.title    = DEFAULT_ABOUT.title;
  if (typeof model.about.subtitle !== "string") model.about.subtitle = DEFAULT_ABOUT.subtitle;
  if (typeof model.about.version  !== "string") model.about.version  = DEFAULT_ABOUT.version;
  if (typeof model.about.notes    !== "string") model.about.notes    = DEFAULT_ABOUT.notes;
  if (typeof model.about.contact  !== "string") model.about.contact  = DEFAULT_ABOUT.contact;
  if (typeof model.about.logoUrl  !== "string") model.about.logoUrl  = DEFAULT_ABOUT.logoUrl;
  if (!Array.isArray(model.about.links) || !model.about.links.length) {
    model.about.links = JSON.parse(JSON.stringify(DEFAULT_ABOUT.links || []));
  }
  for (const l of model.about.links) {
    if (typeof l.label !== "string") l.label = "Link";
    if (typeof l.url !== "string") l.url = "";
  }
  // Top-level Uploads bucket — destination for any global GitHub fetch
  // that wasn't using the components/sparams/... folder convention.
  // Each entry is a folder { id, name, tests: [...] } using the same
  // shape as a Test-results folder so the same renderers / downloaders
  // can target it directly.
  if (!Array.isArray(model.uploads)) model.uploads = [];
  for (const u of model.uploads) {
    if (!u.id) u.id = uid("up");
    if (typeof u.name !== "string") u.name = "Uploads";
    if (!Array.isArray(u.tests)) u.tests = [];
    for (const t of u.tests) {
      if (!t.id) t.id = uid("t");
      if (!t.metadata || typeof t.metadata !== "object") t.metadata = {};
    }
  }
  for (const arr of [model.statuses, model.categories, model.bbTypes, model.platforms, model.edaTools, model.cdiAxes]) {
    for (const x of arr) { if (!x.id) x.id = uid("x"); }
  }
}

function migrate(parsed) {
  if (!parsed) return defaultModel();
  // Backfill ownership map (added in v1.0). Existing items have no owner →
  // they're treated as admin-owned (only admins can modify them). New items
  // created by user-admins get stamped automatically by uid().
  if (typeof parsed.ownership !== "object" || parsed.ownership === null) {
    parsed.ownership = {};
  }
  // Backfill labels map (identity → friendly display label).
  if (typeof parsed.labels !== "object" || parsed.labels === null) {
    parsed.labels = {};
  }
  // v5 already
  if (Array.isArray(parsed.tabs)) {
    for (const tb of parsed.tabs) {
      if (!tb.id) tb.id = uid("tab");
      if (!tb.name) tb.name = "Untitled";
      if (!Array.isArray(tb.groups)) tb.groups = [];
      for (const g of tb.groups) migrateGroup(g);
    }
    ensureLists(parsed);
    return parsed;
  }
  // v3/v4 had top-level groups[]
  if (Array.isArray(parsed.groups)) {
    const platformGroups = [];
    const otherGroups = [];
    for (const g of parsed.groups) {
      migrateGroup(g);
      if (g.platformMeta) platformGroups.push(g);
      else otherGroups.push(g);
    }
    const tabs = [];
    if (platformGroups.length) {
      tabs.push({ id: uid("tab"), name: "Technology Platforms", groups: platformGroups });
    } else {
      tabs.push({ id: uid("tab"), name: "Technology Platforms", groups: [] });
    }
    for (const g of otherGroups) {
      tabs.push({ id: uid("tab"), name: g.name, groups: [g] });
    }
    const out = { tabs };
    ensureLists(out);
    return out;
  }
  return defaultModel();
}

/* ============================================================
   STORAGE: IndexedDB primary, localStorage fallback for legacy.

   localStorage is capped at ~5 MB per origin; once a user has
   imported a real backup with files attached the model can easily
   blow past that. IndexedDB has 50+ MB on most browsers and grows
   with available disk, which is what we actually need here.

   We keep the MODEL global synchronous so the rest of the code is
   unchanged. saveModel is fire-and-forget async; loadModel returns
   a default synchronously, and an async bootstrap upgrades MODEL
   from IndexedDB / localStorage and calls render() when ready.
============================================================ */
const IDB_NAME  = "pdkmonitor";
const IDB_STORE = "model";
let _idbPromise = null;
function idbOpen() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
  return _idbPromise;
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const r  = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idbDelete(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  });
}
/* Blob helpers — IndexedDB stores Blob/ArrayBuffer values natively without
   any JSON / base64 round-trip. Critical for large binary uploads (.exe,
   native solvers, …): a 250 MB binary stored as base64 in MODEL would peak
   at ~1 GB heap during JSON.stringify; storing the raw Blob keeps it as a
   single 250 MB allocation that the browser never has to serialise. */
const BLOB_KEY_PREFIX = "blob:";
async function idbPutBlob(blobId, blob) {
  await idbSet(BLOB_KEY_PREFIX + blobId, blob);
}
async function idbGetBlob(blobId) {
  return idbGet(BLOB_KEY_PREFIX + blobId);
}
async function idbDeleteBlob(blobId) {
  await idbDelete(BLOB_KEY_PREFIX + blobId);
}

function loadModel() {
  // Synchronous fallback used only on first paint. The async loadModelAsync()
  // below upgrades MODEL with the full IndexedDB copy as soon as it's ready.
  //
  // Lookup order:
  //   1. localStorage (lite copy — small but sync, gives us instant render)
  //   2. legacy localStorage keys (for upgrades from older builds)
  //   3. embedded <script id="seed-data">  (single-file bundle path)
  //   4. defaultModel()  (brand-new install / Reset)
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn("localStorage load failed:", e); }
  for (const k of LEGACY_KEYS) {
    try {
      const raw = localStorage.getItem(k);
      if (raw) return migrate(JSON.parse(raw));
    } catch (e) { /* */ }
  }
  try {
    const seedEl = document.getElementById("seed-data");
    if (seedEl && seedEl.textContent.trim()) {
      return migrate(JSON.parse(seedEl.textContent));
    }
  } catch (e) { console.warn("seed-data load failed:", e); }
  return defaultModel();
}

async function loadModelAsync() {
  // Pulls the full MODEL out of IndexedDB (which can hold ~50+ MB vs the
  // localStorage 5 MB cap). When found, it overrides whatever loadModel()
  // gave us and re-renders so file uploads, fetched bytes, and other
  // heavyweight data appear without manual import.
  try {
    const fromIdb = await idbGet("model");
    if (fromIdb) {
      MODEL = migrate(fromIdb);
      activeTabId = MODEL.tabs[0]?.id;
      render();
      return;
    }
  } catch (err) { console.warn("idb load failed:", err); }
  // No IndexedDB record yet — keep whatever loadModel() found in
  // localStorage (already in MODEL). Persist once into IndexedDB so
  // future saves use the bigger store.
  try { await idbSet("model", JSON.parse(JSON.stringify(MODEL))); } catch (e) {}
}

let _saveError = false;
async function saveModel() {
  // Strip seed-data block reference if present (we never write it back).
  // The whole MODEL goes to IndexedDB. localStorage gets a small "lite"
  // copy with the heavy bytes stripped, only as a fallback for anyone
  // who reloads in a private window where IndexedDB is restricted.
  let saved = false;
  try {
    await idbSet("model", JSON.parse(JSON.stringify(MODEL)));
    saved = true;
    if (_saveError) { _saveError = false; toast("Storage recovered"); }
  } catch (e) {
    if (!_saveError) toast(`IndexedDB save failed: ${e.message}`, "err");
    _saveError = true;
    console.error("idbSet failed:", e);
  }
  // Lite copy to localStorage — small metadata only, so reload still
  // recovers the structure if IndexedDB is missing. Stripped of rawText /
  // imageUrl / parsed / customSketchUrl / gdsContent.
  try {
    const lite = JSON.parse(JSON.stringify(MODEL));
    function stripFile(t) {
      delete t.rawText; delete t.imageUrl; delete t.parsed;
    }
    for (const tab of (lite.tabs || []))
      for (const g of (tab.groups || []))
        for (const e of (g.entities || [])) {
          delete e.gdsContent; delete e.customSketchUrl; delete e.layoutSvg;
          for (const tg of (e.testGroups || [])) for (const t of tg.tests || []) stripFile(t);
          for (const sg of (e.smatrixGroups || [])) for (const t of sg.datasets || []) stripFile(t);
          for (const ft of (e.fabTabs || [])) for (const t of ft.tests || []) stripFile(t);
        }
    if (lite.about && typeof lite.about.logoUrl === "string") delete lite.about.logoUrl;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lite));
  } catch (e) {
    // Quota exceeded on the lite copy is harmless — IndexedDB is the source of truth
    if (!saved) console.warn("localStorage lite save failed:", e);
  }
  updateStorageBadge();
}

    foot.append(btn("Cancel", "ghost", () => {
      if (limitTicker) { clearInterval(limitTicker); limitTicker = null; }
      closeModal();
    }));
    // ✉ Request access — ALWAYS rendered, regardless of whether a contact
    // email is currently saved on this machine. Behaviour:
    //   * contactEmail set    → mailto: addressed to it.
    //   * contactEmail blank  → mailto: with empty recipient (the user fills
    //                            it in their mail client) and a tip in the
    //                            body to ask the owner directly.
    // Anti-spam: the same per-email bucket is used to throttle this
    // button — 60 seconds between clicks — so a bot can't fire
    // hundreds of mailtos at the owner's inbox.
    foot.append(btn("✉ Request access", "ghost", () => {
      const id = (body.querySelector("#login-id").value || "").trim();
      const errEl = body.querySelector("#login-err");
      const lockedR = accessLockedSecondsFor(id);
      if (lockedR > 0) {
        errEl.textContent = `This address is locked from new attempts for ${fmtCountdown(lockedR)}. Please wait before requesting access.`;
        errEl.style.display = "block";
        return;
      }
      const coolR = cooldownSecondsFor(id, ACCESS_REQUEST_COOLDOWN_MS);
      if (coolR > 0) {
        errEl.textContent = `Please wait ${coolR}s before sending another request.`;
        errEl.style.display = "block";
        return;
      }
      // Touch lastSubmit (success=true → don't increment failure count)
      // so the 60-second access-request cooldown applies even if the
      // user types nothing.
      recordAccessAttempt(id, true);
      refreshLimitLine();
      const subject = encodeURIComponent("PDK Monitor — request user-admin password");
      const lines = [
        "Hi,",
        "",
        "Please grant me a user-admin password for the CORNERSTONE PDK Monitor dashboard.",
        "",
        id ? `My GitHub / email: ${id}` : "My GitHub username: ",
        id ? "" : "My email:           ",
        "Project / context:   ",
        "",
        "Thanks!",
      ];
      const bodyText = encodeURIComponent(lines.join("\n"));
      // mailto: with no recipient is valid — the mail client opens with
      // an empty To: that the user fills in.
      const to = contactEmail ? encodeURIComponent(contactEmail) : "";
      window.location.href = `mailto:${to}?subject=${subject}&body=${bodyText}`;
    }));
    foot.append(btn("Sign in", "primary", trySubmit));
  });
}

  // Walk the tree: tabs > groups > entities > subBlocks (recursive).
  // Returns { entity, group, tab, parent? } where parent is set when the
  // match is a sub-block (parent is the BB that owns it).
  function walk(arr, group, tab, parent) {
    for (const e of arr) {
      if (e.id === id) return { entity: e, group, tab, parent: parent || null };
      if (Array.isArray(e.subBlocks) && e.subBlocks.length) {
        const r = walk(e.subBlocks, group, tab, e);
        if (r) return r;
      }
    }
    return null;
  }
  for (const tb of MODEL.tabs)
    for (const g of tb.groups) {
      const r = walk(g.entities, g, tb, null);
      if (r) return r;
    }
  return null;
}
