}

async function runLayoutGithubFetch(e, url, token, log) {
  const { owner, repo, branch, path } = parseGithubUrl(url);
  log(`repo: ${owner}/${repo}@${branch}, path: ${path || "/"}`);
  // Decide if it's a file or folder. Try fetching the contents API; if it
  // returns an array → folder, single object → file.
  const u = `https://api.github.com/repos/${owner}/${repo}/contents/${path || ""}?ref=${encodeURIComponent(branch)}`;
  let item = await ghFetch(u, token);
  if (Array.isArray(item)) {
    // Folder — pick the .gds file matching the BB name, else the first .gds.
    // SVGs are NOT auto-picked from a folder URL; if the user wants the SVG
    // they have to point the URL directly at it.
    const candidates = item.filter(it => it.type === "file" && /\.gds$/i.test(it.name));
    if (!candidates.length) throw new Error("No .gds file in that folder (SVGs aren't auto-picked — paste the SVG file URL directly if that's what you want)");
    const lower = e.name.toLowerCase().replace(/[^a-z0-9]+/g, "");
    item = candidates.find(c => c.name.toLowerCase().replace(/[^a-z0-9]+/g, "").includes(lower)) || candidates[0];
    log(`folder URL → picked ${item.name}`);
  }
  if (item.size > 50 * 1024 * 1024) throw new Error(`${item.name} is ${(item.size/1024/1024).toFixed(2)} MB (>50 MB per-file cap)`);
  const ext = (item.name.split(".").pop() || "").toLowerCase();
  log(`SHA: ${(item.sha || "(unknown)").slice(0, 10)}…`);
  if (ext === "gds") {
    // Content-addressed fetch via the blob API — bypasses the raw CDN cache,
    // so re-syncing after a push always returns the new bytes.
    const buf = await ghFileBytes(item, owner, repo, branch, token);
    const parsed = parseGDS(buf);
    const cell = pickCellToRender(parsed, e.name);
    if (!cell) throw new Error("No cells found in the GDS");
    e.layoutSvg = renderGdsCellSVG(cell, parsed.dbUnit, parsed.userUnit, cell.name);
    e.gdsName = item.name; e.gdsSize = buf.byteLength;
    // Keep original bytes verbatim — Pull Request and Download .gds need
    // the file as it came from the repo (no rendering / round-tripping).
    // 1 GB cap. base64 conversion may still hit the browser JS-string
    // limit on very large files; we surface that as an error toast.
    let b64 = "";
    if (buf.byteLength <= 1024 * 1024 * 1024) {
      try { b64 = arrayBufferToBase64(buf); e.gdsContent = b64; }
      catch (err) {
        e.gdsContent = "";
        toast(`Fetched ${item.name} but couldn't keep raw bytes (${err.message}). Rendered SVG is stored.`, "err");
      }
    } else {
      e.gdsContent = "";
    }
    recordLayoutUpload(e, item.name, buf.byteLength, b64, "gds");
    log(`Layout updated from ${item.name} (cell: ${cell.name})`);
    toast(`Layout fetched · ${item.name}`);
  } else if (ext === "svg") {
    const text = await ghFileText(item, owner, repo, branch, token);
    e.layoutSvg = text;
    e.gdsName = ""; e.gdsSize = 0; e.gdsContent = "";
    recordLayoutUpload(e, item.name, text.length, btoa(unescape(encodeURIComponent(text))), "svg");
    log(`Layout updated from ${item.name}`);
    toast(`Layout fetched · ${item.name}`);
  } else {
    throw new Error(`Unsupported extension .${ext} (.gds / .svg only)`);
  }
}

function pickCellToRender(parsed, blockName) {
  if (!parsed.cells.length) return null;
  // 1) prefer exact name match
  const lower = (blockName || "").toLowerCase();
  let exact = parsed.cells.find(c => c.name.toLowerCase().includes(lower) && c.polys.length);
  if (exact) return exact;
  // 2) prefer the only top cell with geometry
  const tops = parsed.cells.filter(c => c.isTop && c.polys.length);
  if (tops.length === 1) return tops[0];
  // 3) the top cell with the most polygons
  if (tops.length > 1) return tops.sort((a,b) => b.polys.length - a.polys.length)[0];
  // 4) any cell with polygons
  const any = parsed.cells.filter(c => c.polys.length).sort((a,b) => b.polys.length - a.polys.length);
  return any[0] || parsed.cells[0];
}

/* ---------- procedural sketches (unchanged) ---------- */
function renderSketchSVG(e, g) {
  const p = e.params || {};
  // If the BB has a user-uploaded sketch image, prefer that over the procedural sketch
  if (e.customSketchUrl) {
    return `<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
      <rect x="0" y="0" width="800" height="480" fill="#0b1117"/>
      <image href="${escapeHtml(e.customSketchUrl)}" x="20" y="20" width="760" height="440" preserveAspectRatio="xMidYMid meet"/>
      <text x="20" y="14" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">user image · ${escapeHtml(e.customSketchName || "")}</text>
    </svg>`;
  }
  switch (e.bbType) {
    case "waveguide":           return svgWaveguide(p, g);
    case "mmi":                 return svgMMI(p, g);
    case "crossing":            return svgCrossing(p, g);
    case "bend":                return svgBend(p, g);
    case "mzi":                 return svgMZI(p, g);
    case "ring":                return svgRing(p, g);
    case "directional-coupler": return svgDC(p, g);
    case "grating-coupler":     return svgGratingCoupler(p, g);
    case "edge-coupler":        return svgEdgeCoupler(p, g);
    case "spiral":              return svgSpiral(p, g);
    case "photodetector":       return svgPD(p, g);
    case "modulator":           return svgMZM(p, g);
    case "custom":
    default: return `<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
      <rect x="0" y="0" width="700" height="320" fill="#0b1117"/>
      <text x="350" y="146" text-anchor="middle" fill="#6e7681" font-size="14">No sketch yet</text>
      <text x="350" y="168" text-anchor="middle" fill="#6e7681" font-size="11">Upload your own image, .svg or .gds in the Layout tab to fill this space</text>
    </svg>`;
  }
}
function matFill(g) {
  const m = g?.platformMeta?.material;
  if (m === "Si")  return "#d29922";
  if (m === "SiN") return "#58a6ff";
  if (m === "LN")  return "#db61a2";
  return "#a371f7";
}
function svgWaveguide(p, g) {
  const length = p.length_um || 100, width = (p.width_nm || 500) / 1000;
  const fill = matFill(g);
  const visW = Math.max(width * 6, 12);
  const W = 700, H = 220, margin = 40;
  const wgX = margin, wgY = (H - visW) / 2, wgW = W - 2 * margin;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b1117"/>
    <rect x="${wgX}" y="${wgY}" width="${wgW}" height="${visW}" fill="${fill}" opacity="0.85"/>
    <text x="${W/2}" y="${H-6}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">L = ${length} µm</text>
    <text x="${W/2}" y="${wgY-8}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">w = ${(width*1000).toFixed(0)} nm  ·  t = ${p.thickness_nm||"?"} nm</text>
  </svg>`;
}
function svgMMI(p, g) {
  const length = p.length_um || 30, widthU = p.width_um || 6;
  const stubW = (p.stub_width_nm || 500) / 1000;
  const inP = Math.max(1, p.in_ports || 1), outP = Math.max(1, p.out_ports || 2);
  const fill = matFill(g);
  const W = 700, H = 320, stagePad = 60;
  const stageW = W - 2*stagePad, stageH = H - 80;
  const visStubW = Math.max(stubW * 6, 8);
  const mmiH = Math.min(widthU * 6, stageH * 0.75);
  const mmiW = stageW * 0.55;
  const mmiX = stagePad + (stageW - mmiW)/2, mmiY = (H - mmiH)/2;
  function ports(n, side) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      const yc = mmiY + (mmiH * (i+1))/(n+1);
      const x1 = side === "L" ? stagePad : mmiX + mmiW;
      const x2 = side === "L" ? mmiX     : W - stagePad;
      arr.push(`<rect x="${x1}" y="${yc - visStubW/2}" width="${x2-x1}" height="${visStubW}" fill="${fill}" opacity="0.8"/>`);
    }
    return arr.join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b1117"/>
    ${ports(inP, "L")}${ports(outP, "R")}
    <rect x="${mmiX}" y="${mmiY}" width="${mmiW}" height="${mmiH}" fill="${fill}" opacity="0.95"/>
    <text x="${mmiX + mmiW/2}" y="${mmiY-10}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">L_MMI = ${length} µm  ·  W_MMI = ${widthU} µm</text>
    <text x="${mmiX + mmiW/2}" y="${mmiY+mmiH+22}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">${inP}×${outP} multimode interferometer</text>
  </svg>`;
}
function svgCrossing(p, g) {
  const armW = (p.arm_width_nm || 500) / 1000, armL = p.arm_length_um || 8;
  const fill = matFill(g);
  const W = 700, H = 320;
  const visW = Math.max(armW * 6, 14);
  const armPx = Math.min(W * 0.5, armL * 30);
  const cx = W/2, cy = H/2;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b1117"/>
    <rect x="${cx-armPx/2}" y="${cy-visW/2}" width="${armPx}" height="${visW}" fill="${fill}" opacity="0.85"/>
    <rect x="${cx-visW/2}" y="${cy-armPx/2}" width="${visW}" height="${armPx}" fill="${fill}" opacity="0.85"/>
    <text x="${cx}" y="${cy+armPx/2+24}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">arm L = ${armL} µm  ·  w = ${(armW*1000).toFixed(0)} nm</text>
  </svg>`;
}
function svgBend(p, g) {
  const r = p.radius_um || 10;
  const angle = (p.angle_deg || 90) * Math.PI / 180;
  const w = (p.width_nm || 500) / 1000;
  const fill = matFill(g);
  const W = 700, H = 320;
  const cx = 200, cy = H - 80;
  const px = Math.min(W - 280, r * 12);
  const visW = Math.max(w * 6, 10);
  const ex = cx + Math.sin(angle) * px;
  const ey = cy - (1 - Math.cos(angle)) * px;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0b1117"/>
    <path d="M ${cx} ${cy} A ${px} ${px} 0 0 0 ${ex} ${ey}" fill="none" stroke="${fill}" stroke-width="${visW}" stroke-linecap="butt" opacity="0.9"/>
    <text x="${cx + 80}" y="${cy + 30}" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">R = ${r} µm  ·  θ = ${p.angle_deg||90}°  ·  w = ${(w*1000).toFixed(0)} nm</text>
  </svg>`;
}

/* ---------- Mach-Zehnder Interferometer ---------- */
function svgMZI(p, g) {
  const fill = matFill(g);
  const W = 700, H = 280, w = 10, cy = H/2;
  const inX = 50, splitX = 200, combineX = 500, outX = 650;
  const off = 40;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    <line x1="${inX}" y1="${cy}" x2="${splitX}" y2="${cy}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <path d="M ${splitX} ${cy} Q ${splitX+40} ${cy} ${splitX+80} ${cy-off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <path d="M ${splitX} ${cy} Q ${splitX+40} ${cy} ${splitX+80} ${cy+off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <line x1="${splitX+80}" y1="${cy-off}" x2="${combineX-80}" y2="${cy-off}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <path d="M ${splitX+80} ${cy+off} Q ${(splitX+combineX)/2} ${cy+off+30} ${combineX-80} ${cy+off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <path d="M ${combineX-80} ${cy-off} Q ${combineX-40} ${cy} ${combineX} ${cy}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <path d="M ${combineX-80} ${cy+off} Q ${combineX-40} ${cy} ${combineX} ${cy}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <line x1="${combineX}" y1="${cy}" x2="${outX}" y2="${cy}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <text x="${W/2}" y="${cy+off+50}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">L_arm = ${p.arm_length_um || 200} µm  ·  ΔL = ${p.arm_imbalance_um || 50} µm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Mach-Zehnder Interferometer (top-down, schematic)</text>
  </svg>`;
}

/* ---------- Ring resonator ---------- */
function svgRing(p, g) {
  const fill = matFill(g);
  const W = 700, H = 280, w = 8;
  const r = 70, cx = W/2, cy = H/2 - 10;
  const gap = 6, busY = cy + r + gap + w/2;
  const drop = !!p.drop_port;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    <line x1="60" y1="${busY}" x2="${W-60}" y2="${busY}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${fill}" stroke-width="${w}"/>
    ${drop ? `<line x1="60" y1="${cy - r - gap - w/2}" x2="${W-60}" y2="${cy - r - gap - w/2}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>` : ""}
    <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">R = ${p.radius_um || 10} µm</text>
    <text x="${cx}" y="${busY + 22}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">gap = ${p.gap_nm || 200} nm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Ring resonator${drop ? " (add-drop)" : " (all-pass)"} — schematic</text>
  </svg>`;
}

/* ---------- Directional coupler ---------- */
function svgDC(p, g) {
  const fill = matFill(g);
  const W = 700, H = 220, w = 8, cy = H/2;
  const coupL = Math.min((p.coupling_length_um || 50) * 4, 240);
  const gap = 6, off = 30;
  const x1 = (W - coupL)/2, x2 = x1 + coupL;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    <path d="M 40 ${cy-off} C 100 ${cy-off} ${x1-30} ${cy-gap/2-w/2} ${x1} ${cy-gap/2-w/2} L ${x2} ${cy-gap/2-w/2} C ${x2+30} ${cy-gap/2-w/2} ${W-100} ${cy-off} ${W-40} ${cy-off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <path d="M 40 ${cy+off} C 100 ${cy+off} ${x1-30} ${cy+gap/2+w/2} ${x1} ${cy+gap/2+w/2} L ${x2} ${cy+gap/2+w/2} C ${x2+30} ${cy+gap/2+w/2} ${W-100} ${cy+off} ${W-40} ${cy+off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <text x="${W/2}" y="${cy+off+22}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">L_c = ${p.coupling_length_um || 50} µm  ·  gap = ${p.gap_nm || 200} nm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Directional coupler (top-down, schematic)</text>
  </svg>`;
}

/* ---------- Y-junction ---------- */
function svgYJunction(p, g) {
  const fill = matFill(g);
  const W = 700, H = 240, w = 10, cy = H/2;
  const inX = 50, splitX = 250, outX = 600;
  const off = 50;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    <line x1="${inX}" y1="${cy}" x2="${splitX}" y2="${cy}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <path d="M ${splitX} ${cy} Q ${splitX+80} ${cy} ${splitX+150} ${cy-off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <path d="M ${splitX} ${cy} Q ${splitX+80} ${cy} ${splitX+150} ${cy+off}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <line x1="${splitX+150}" y1="${cy-off}" x2="${outX}" y2="${cy-off}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <line x1="${splitX+150}" y1="${cy+off}" x2="${outX}" y2="${cy+off}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>
    <text x="${W/2}" y="${H-20}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">branch L = ${p.branch_length_um || 30} µm  ·  w = ${p.width_nm || 500} nm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Y-junction splitter (top-down, schematic)</text>
  </svg>`;
}

/* ---------- Arrayed Waveguide Grating ---------- */
function svgAWG(p, g) {
  const fill = matFill(g);
  const W = 700, H = 320, w = 4, cy = H/2;
  const nArms = Math.min(p.n_arms || 12, 18);
  const inX = 100, outX = W - 100;
  const inputs = Math.max(1, p.n_inputs || 1);
  const outputs = Math.max(1, p.n_outputs || 4);
  let s = "";
  for (let i = 0; i < inputs; i++) {
    const y = cy + (i - (inputs-1)/2) * 24;
    s += `<line x1="20" y1="${y}" x2="${inX}" y2="${cy}" stroke="${fill}" stroke-width="6" stroke-linecap="round" opacity="0.85"/>`;
  }
  s += `<path d="M ${inX-10} ${cy-50} L ${inX} ${cy-60} L ${inX} ${cy+60} L ${inX-10} ${cy+50} Z" fill="${fill}" opacity="0.55"/>`;
  for (let i = 0; i < nArms; i++) {
    const t = (i - (nArms-1)/2) / nArms;
    const peakY = 80 - i * 4;
    const yIn = cy + t * 90;
    const yOut = cy + t * 90;
    s += `<path d="M ${inX} ${yIn} C ${inX+80} ${yIn-30} ${(W-200)/2} ${peakY} ${W/2} ${peakY} S ${outX-80} ${yOut-30} ${outX} ${yOut}" stroke="${fill}" stroke-width="${w}" fill="none" opacity="0.7"/>`;
  }
  s += `<path d="M ${outX} ${cy-60} L ${outX+10} ${cy-50} L ${outX+10} ${cy+50} L ${outX} ${cy+60} Z" fill="${fill}" opacity="0.55"/>`;
  for (let i = 0; i < outputs; i++) {
    const y = cy + (i - (outputs-1)/2) * 22;
    s += `<line x1="${outX}" y1="${cy}" x2="${W-20}" y2="${y}" stroke="${fill}" stroke-width="6" stroke-linecap="round" opacity="0.85"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>

    <text x="${W/2}" y="${H-20}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">${nArms}-arm AWG  ·  ${inputs}×${outputs}  ·  FSR = ${p.fsr_nm || 12.8} nm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Arrayed waveguide grating (top-down, schematic)</text>
  </svg>`;
}

/* ---------- Grating coupler ---------- */
function svgGratingCoupler(p, g) {
  const fill = matFill(g);
  const W = 700, H = 280, w = 8, cy = H/2;
  const inputX = 50, fanStart = 200, gratStart = 280, gratEnd = 580;
  const fanH = 70;
  const nPeriods = Math.min(p.n_periods || 28, 40);
  const periodPx = (gratEnd - gratStart) / nPeriods;
  let s = `<line x1="${inputX}" y1="${cy}" x2="${fanStart}" y2="${cy}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/>`;
  s += `<path d="M ${fanStart} ${cy-w/2} L ${gratStart} ${cy-fanH} L ${gratStart} ${cy+fanH} L ${fanStart} ${cy+w/2} Z" fill="${fill}" opacity="0.45"/>`;
  for (let i = 0; i < nPeriods; i++) {
    const x = gratStart + i * periodPx;
    s += `<rect x="${x}" y="${cy-fanH}" width="${Math.max(1, periodPx*0.55)}" height="${fanH*2}" fill="${fill}" opacity="0.92"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    ${s}
    <text x="${(gratStart+gratEnd)/2}" y="${cy+fanH+22}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">Λ = ${p.period_nm || 630} nm  ·  ${nPeriods} teeth  ·  fill = ${(p.fill_factor||0.5)}</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Grating coupler (top-down, schematic)</text>
  </svg>`;
}

/* ---------- Inverse-taper edge coupler ---------- */

/* ---------- Spiral waveguide ---------- */
function svgSpiral(p, g) {
  const fill = matFill(g);
  const W = 700, H = 320, w = 4;
  const cx = W/2, cy = H/2;
  const turns = 4, startR = 14, endR = 100;
  const steps = turns * 60;
  let d = "";
  for (let i = 0; i <= steps; i++) {
    const theta = (i / steps) * turns * Math.PI * 2;
    const r = startR + (endR - startR) * (i / steps);
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    d += (i === 0 ? "M " : "L ") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">
    <rect width="${W}" height="${H}" fill="#0b1117"/>
    <path d="${d}" stroke="${fill}" stroke-width="${w}" fill="none" stroke-linecap="round"/>
    <text x="${cx}" y="${H-20}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="ui-monospace,monospace">L = ${p.length_um || 1000} µm  ·  R_min = ${p.radius_um || 5} µm  ·  w = ${p.width_nm || 500} nm</text>
    <text x="14" y="22" fill="#6e7681" font-size="10" font-family="ui-monospace,monospace">Spiral waveguide (top-down, schematic)</text>
  </svg>`;
}

================================================================= */
function renderScriptsTab(e) {
  pBody.innerHTML = `
    <div class="section-toolbar">
      <div class="field-label" style="margin:0;">Scripts &amp; tools (${(e.scripts||[]).length})</div>
      <span class="section-actions">
        <button class="icon-btn admin-only" id="scripts-fetch-gh" title="Fetch *.py from GitHub"><span class="ico">⤓</span> GitHub fetch</button>
        <button class="icon-btn admin-only" id="scripts-pr-gh" title="Create Pull Request"><span class="ico">⇪</span> GitHub Pull Request</button>
        <input type="file" id="scripts-binary-input" multiple hidden>
        <button class="icon-btn admin-only" id="add-binary-script" title="Upload a compiled tool (.exe, native binary, jar, …). Browsers can NOT execute these in-page — use 💻 Run locally to bundle the binary with your data files and run it from a terminal."><span class="ico">📦</span> Upload binary</button>
        <button class="icon-btn admin-only" id="add-py-script" title="New Python script"><span class="ico">＋</span> Python script</button>
      </span>
    </div>
    <div id="scripts-wrap" style="display:flex;flex-direction:column;gap:8px;"></div>
    <div style="font-size:11px;color:var(--text-faint);line-height:1.5;">
      <b>Python</b> runs in-browser via Pyodide (loaded on first use; matplotlib / numpy / scipy / pandas auto-installed).
      Globals exposed: <code>data</code> (S-matrix datasets), <code>tests</code> (all tests across folders).
      <code>print("DASH_PLOT_PNG:&lt;base64&gt;")</code> renders a PNG inline + opens it in a new window.<br>
      <b>Binary tools</b> (.exe / native executables) <i>cannot</i> run in-browser — that's a hard browser-sandbox limit.
      Use <b>💻 Run locally</b> to bundle the binary alongside this BB's data files into a folder, then run it from a terminal.
    </div>
  `;
  const wrap = pBody.querySelector("#scripts-wrap");
  if (!(e.scripts || []).length) wrap.innerHTML = `<div class="panel-empty">No scripts yet.</div>`;
  else e.scripts.forEach(s => wrap.appendChild(renderScriptCard(e, s)));
  pBody.querySelector("#add-py-script")?.addEventListener("click", () => addScript(e));
  pBody.querySelector("#scripts-fetch-gh")?.addEventListener("click", () => openSectionGithubFetch(e, "scripts"));
  pBody.querySelector("#scripts-pr-gh")?.addEventListener("click", () => openSectionPullRequest(e, "scripts"));
  // Upload arbitrary binary tools (.exe, .bin, jar, etc.) and store as
  // base64 binaryContent. The card shows 💻 Run locally + Download but
  // hides ▶ Run (browsers can't spawn native processes).
  const binaryInput = pBody.querySelector("#scripts-binary-input");
  pBody.querySelector("#add-binary-script")?.addEventListener("click", () => {
    if (!requireWrite("Read-only mode — sign in to upload binaries.")) return;
    binaryInput.click();
  });
  binaryInput?.addEventListener("change", async (ev) => {
    if (!requireWrite("Read-only mode — sign in to upload binaries.")) { ev.target.value = ""; return; }
    const files = Array.from(ev.target.files || []);
    for (const f of files) {
      try {
        const cap = 500 * 1024 * 1024;   // 500 MB per binary
        if (f.size > cap) {
          toast(`Skipped ${f.name} — ${(f.size/1024/1024).toFixed(1)} MB > ${cap/1024/1024} MB cap`, "err");
          continue;
        }
        // Store the file as a Blob in IndexedDB, keep only a small
        // reference in MODEL. Avoids the ~3× heap blow-up of base64
        // encoding plus JSON.stringify on big binaries.
        const blobId = uid("b");
        try {
          await idbPutBlob(blobId, f);   // f is already a Blob (subclass of File)
        } catch (err) {
          toast(`Could not store ${f.name} (${err.message})`, "err");
          continue;
        }
        e.scripts.push({
          id: uid("s"),
          name: f.name,
          language: "binary",
          source: "",                                 // not used for binaries
          blobRef: blobId,                            // pointer into IDB blob store
          size: f.size,
          // Best-guess shell command. The user can edit it from "View / edit"
          // (the source editor's CLI run command field).
          command: /\.(exe)$/i.test(f.name)
            ? `${f.name} <args>`             // Windows: invoke directly
            : `./${f.name} <args>`,          // Unix: relative path
          updated: todayISO(),
        });
      } catch (err) {
        toast(`Could not read ${f.name}: ${err.message}`, "err");
      }
    }
    saveModel();
    openView(e.id, "scripts");
    ev.target.value = "";
  });
}
function addScript(e) {
  if (!requireWrite("Read-only mode — sign in to add scripts.")) return;
  const name = prompt("Name for the new Python script:", "plot_xy.py");
  if (!name || !name.trim()) return;
  e.scripts.push({
    id: uid("s"),
    name: name.trim(),
    language: "python",
    source: `# Working starter — plots column 0 (x) vs column 1 (y) of the
# first parseable test on this BB. Edit freely.
#
# Globals exposed by the dashboard:
#   tests    : list of every test on this BB (parsed dict + metadata)
#   data     : dict of S-matrix datasets keyed by name
#
# To emit a matplotlib figure, use the helper at the top.

import io, base64
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt

def emit(fig):
    buf = io.BytesIO()
    fig.savefig(buf, format="png", dpi=110, bbox_inches="tight")
    print("DASH_PLOT_PNG:" + base64.b64encode(buf.getvalue()).decode())
    plt.close(fig)

# Pick the first test that has parsed numeric data
candidate = None
for t in tests:
    if t.get("parsed") and t["parsed"].get("sweep") and t["parsed"].get("traces"):
        candidate = t
        break

if candidate is None:
    print("No tests with parsed numeric data on this BB yet.")
    print("Drop a CSV / TXT into the Test results tab and re-run.")
else:
    sweep  = candidate["parsed"]["sweep"]
    traces = candidate["parsed"]["traces"]
    fname  = candidate.get("name") or candidate.get("filename") or "data"
    fig, ax = plt.subplots(figsize=(9, 4.6))
    for tr in traces:
        # Prefix every legend entry with the source filename so the legend
        # in the plot window tells you exactly which file each trace came
        # from (matches the "Plot raw" behaviour on the dashboard side).
        tr_name = tr.get("name") or "y"
        legend  = f"{fname}:{tr_name}" if len(traces) > 1 else fname
        ax.plot(sweep["values"], tr["values"], lw=1.0, label=legend)
    ax.set_xlabel(sweep.get("name") or "x")
    ax.set_ylabel("value")
    ax.set_title(fname)
    ax.grid(True, alpha=0.3)
    ax.legend(fontsize=9, loc="best")
    fig.tight_layout()
    emit(fig)
    print(f"Plotted {len(traces)} trace(s) from '{fname}'.")
`,
    command: "python ./scripts/" + name.trim() + " <data.csv>",
    updated: todayISO(),
  });
  saveModel(); openView(e.id, "scripts");
}
function renderScriptCard(e, s) {
  const el = document.createElement("div");
  el.className = "item-card";
  // Binary scripts (.exe, native tools) — Run-locally + Download only.
  // ▶ Run is hidden because browsers can't spawn native processes.
  const isBinary = (s.language === "binary");
  const sizeNote = isBinary && s.size ? ` · ${(s.size/1024).toFixed(1)} KB` : "";
  el.innerHTML = `
    <div class="item-row">
      <span class="lang-chip ${s.language}" title="${isBinary ? "Native binary — use 💻 Run locally to bundle with data files and run from terminal." : ""}">${s.language}</span>
      <span class="item-name">${escapeHtml(s.name)}</span>
      <span class="item-meta">${escapeHtml(s.updated || "")}${sizeNote}</span>
    </div>
    <div class="item-actions">
      ${s.language === "python" ? `<button class="mini" data-act="run">▶ Run</button>` : ""}
      <button class="mini" data-act="run-local" title="${isBinary
        ? "Save this binary tool + every test/S-matrix file on this BB into a folder you can run from a terminal. The browser can&#39;t execute the binary itself."
        : "Save the script + every test/S-matrix file on this BB into a folder you pick, then offer deeplinks to VS Code / PyCharm / Sublime so you can run it in your local Python tooling"}">💻 Run locally…</button>
      <button class="mini" data-act="cmd">Copy command</button>
      ${isBinary ? "" : `<button class="mini" data-act="src">View / edit source</button>`}
      <button class="mini" data-act="dl">Download</button>
      <button class="mini danger-mini" data-act="del" title="Remove">×</button>
    </div>
  `;
  el.querySelector('[data-act="cmd"]').addEventListener("click", () => copyToClipboard(s.command || s.name));
  el.querySelector('[data-act="src"]')?.addEventListener("click", () => openScriptEditor(e, s));
  el.querySelector('[data-act="dl"]').addEventListener("click", async () => {
    if (isBinary) {
      // New path: blob stored in IDB under s.blobRef. Pull it out and
      // download as a single Blob — no base64, no JSON round-trip.
      if (s.blobRef) {
        try {
          const blob = await idbGetBlob(s.blobRef);
          if (!blob) { toast("Binary missing from storage — re-upload it", "err"); return; }
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = s.name || "binary";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        } catch (err) { toast(`Download failed: ${err.message}`, "err"); }
        return;
      }
      // Legacy path: older builds stored the bytes as base64 in MODEL.
      if (s.binaryContent) {
        downloadBytes(s.name, base64ToBytes(s.binaryContent), "application/octet-stream");
        return;
      }
      toast("This binary has no stored bytes", "err");
    } else {
      downloadText(s.name, s.source || "");
    }
  });
  // Script-card ownership gating: foreign scripts get disabled-but-visible
  // src + del with a tooltip that names the creator + a chip on the row.
  const scriptMayModify = canModifyId(s.id);
  const scriptOwnerId   = getOwner(s.id);
  const scriptOwnerName = displayName(scriptOwnerId);
  if (!scriptMayModify && scriptOwnerId) {
    ["src", "del"].forEach(act => {
      const b = el.querySelector(`[data-act="${act}"]`);
      if (b) {
        b.disabled = true;
        b.style.opacity = "0.45";
        b.title = `Created by ${scriptOwnerName} — only they (or an admin) can change this script. You can still ▶ Run / 💻 Run locally / Download.`;
      }
    });
    const meta = el.querySelector(".item-meta");
    if (meta) {
      const chip = document.createElement("span");
      chip.style.cssText = "font-size:10px;color:var(--text-faint);margin-left:6px;padding:1px 6px;border:1px solid var(--border);border-radius:10px;";
      chip.textContent = `by ${scriptOwnerName}`;
      meta.appendChild(chip);
    }
  }
  el.querySelector('[data-act="del"]')?.addEventListener("click", async () => {
    if (!canModifyId(s.id)) { toast("Only the script's creator (or an admin) can delete it.", "err"); return; }
    if (!confirm(`Remove script "${s.name}"?`)) return;
    // Free the Blob in IndexedDB if this was a binary upload — otherwise
    // big binaries linger forever after the script entry is gone.
    if (s.blobRef) {
      try { await idbDeleteBlob(s.blobRef); } catch {}
    }
    e.scripts = e.scripts.filter(x => x.id !== s.id);
    saveModel(); openView(e.id, "scripts");
  });
  if (s.language === "python") {
    el.querySelector('[data-act="run"]')?.addEventListener("click", (ev) => runPythonScript(e, s, ev.currentTarget));
  }
  // Run-locally is offered for both Python AND binary scripts — for the
  // binary case the modal writes the raw bytes (no source) and the
  // terminal command becomes "./tool.exe …" / "tool.exe …".
  el.querySelector('[data-act="run-local"]')?.addEventListener("click", () => openRunLocallyModal(e, s));
  return el;
}

/* Workspace folder — picked ONCE per browser, then remembered in
   IndexedDB so subsequent Run-locally clicks don't re-prompt. The user
   picks the folder where `pdk-monitor.html` lives (or any folder they
   want as their dashboard workspace) and every Run-locally creates a
   fresh dated subfolder inside it.
   FileSystemDirectoryHandle is structured-cloneable, so it stores in
   IndexedDB cleanly. On retrieval we re-request `readwrite` permission
   if the browser dropped it. */
const WORKSPACE_KEY = "workspace-folder-handle";
async function getStoredWorkspaceHandle({ requireGranted = true } = {}) {
  if (!window.showDirectoryPicker) return null;
  try {
    const handle = await idbGet(WORKSPACE_KEY);
    if (!handle) return null;
    if (!requireGranted) return handle;
    let perm = await handle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") perm = await handle.requestPermission({ mode: "readwrite" });
    return perm === "granted" ? handle : null;
  } catch { return null; }
}
async function pickAndStoreWorkspaceHandle() {
  if (!window.showDirectoryPicker) return null;
  let handle;
  try {
    handle = await window.showDirectoryPicker({
      mode: "readwrite",
      id:   "pdk-monitor-workspace",
      startIn: "documents",
    });
  } catch { return null; }   // user cancelled
  try { await idbSet(WORKSPACE_KEY, handle); } catch (err) { console.warn("Couldn't persist workspace handle:", err); }
  return handle;
}
async function clearStoredWorkspaceHandle() {
  try { await idbDelete(WORKSPACE_KEY); } catch {}
}

/* "Run locally" — save a Python script + its data files into a fresh
   dated subfolder inside the user's workspace folder. After the first
   pick the workspace is remembered, so every later run is one click.
   Pure-browser sandbox can't launch programs directly, but the user
   gets a real on-disk folder they can `cd` into and run `python` from
   their terminal — and the data files sit beside the script so plain
   open() / glob() calls work without path tweaks.
   Two call shapes:
     openRunLocallyModal(e, scriptObj)      — invoked from a Scripts-tab
                                              card; data files = every test
                                              / S-matrix / fab file on the
                                              BB (matches the in-browser
                                              ▶ Run behaviour).
     openRunLocallyModal(e, { dataItems,    — invoked from a Tests / S-matrix
                              contextLabel,    / Fabrication folder card; the
                              folderName })    user picks WHICH script to run
                                              (from e.scripts) inside the
                                              modal, then the dashboard
                                              writes that script + the
                                              folder's files.
*/
function openRunLocallyModal(e, secondArg) {
  // Detect call shape
  const isScriptForm = !!(secondArg && typeof secondArg === "object" &&
                          typeof secondArg.source === "string" &&
                          typeof secondArg.name === "string");
  let s = isScriptForm ? secondArg : null;
  let dataItems, contextLabel, suggestedFolder;
  if (isScriptForm) {
    // Script-card flow: collect every data file on the BB.
    dataItems = [];
    for (const tg of (e.testGroups   || [])) for (const t of (tg.tests   || [])) dataItems.push(t);
    for (const sg of (e.smatrixGroups|| [])) for (const t of (sg.datasets|| [])) dataItems.push(t);
    for (const ft of (e.fabTabs      || [])) for (const t of (ft.tests   || [])) dataItems.push(t);
    contextLabel    = `every data file on this BB`;
    suggestedFolder = `${(e.name || "bb").replace(/[^a-z0-9_-]+/gi, "_")}__${(s.name || "script").replace(/\.[^.]+$/, "")}`;
  } else {
    // Folder-card flow: caller pre-selected the dataItems + a label.
    dataItems       = (secondArg && Array.isArray(secondArg.dataItems)) ? secondArg.dataItems : [];
    contextLabel    = (secondArg && secondArg.contextLabel) || `${dataItems.length} file${dataItems.length === 1 ? "" : "s"}`;
    suggestedFolder = (secondArg && secondArg.folderName)
      ? `${(e.name || "bb").replace(/[^a-z0-9_-]+/gi, "_")}__${secondArg.folderName.replace(/[^a-z0-9_-]+/gi, "_")}`
      : `${(e.name || "bb").replace(/[^a-z0-9_-]+/gi, "_")}__local-run`;
  }
  // List of scripts available on this BB so the user can pick one
  // (folder-card flow only). For the script-card flow we already have `s`.
  // Include both Python sources AND binary tools — Run-locally bundles
  // either kind alongside the data files.
  const pyScripts = (e.scripts || []).filter(x => x.language === "python" || x.language === "binary");
  const titleStr = isScriptForm ? `💻 Run "${s.name}" locally`
                                : `💻 Run a script locally over ${contextLabel}`;
  openModal(titleStr, (body, foot) => {
    // For folder-card flow, render a script picker. The user can either
    // pick from BB scripts (e.scripts) or use a built-in starter.
    const scriptPickerHtml = isScriptForm ? "" : `
      <div style="margin-bottom:12px;">
        <div class="field-label">Which script do you want to run?</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <select id="rl-script-pick" style="flex:1;font-size:12px;padding:6px 8px;">
            ${pyScripts.length
              ? pyScripts.map(x => `<option value="${escapeHtml(x.id)}">${escapeHtml(x.name)}</option>`).join("")
              : `<option value="">(no Python scripts on this BB yet)</option>`}
            <option value="__starter__">— Starter (overlay every parseable file)</option>
          </select>
          <span id="rl-script-name" style="color:var(--text-faint);font-size:11px;"></span>
        </div>
        ${pyScripts.length ? "" : `
          <div style="font-size:11px;color:var(--text-faint);margin-top:4px;">
            No Python scripts on this BB yet — pick "Starter" or add one in the Scripts tab first.
          </div>`}
      </div>`;
    body.innerHTML = `
      ${scriptPickerHtml}
      <div style="font-size:12px;color:var(--text-dim);line-height:1.55;margin-bottom:12px;">
        Save the chosen script plus
        <b>${dataItems.length}</b> data file${dataItems.length === 1 ? "" : "s"}
        from <b>${escapeHtml(contextLabel)}</b> into a folder you can run
        from a terminal: <code>python script.py</code>. Data files sit
        beside the script so plain <code>open("filename.csv")</code>
        / <code>glob("*.csv")</code> calls work without path tweaks.
      </div>

      <!-- ⬇ ZIP DOWNLOAD — the friction-free path. Works in every browser,

      <div style="border:1px solid var(--accent);border-radius:6px;padding:14px;background:var(--accent-soft);margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <button class="primary" id="rl-zip" style="font-size:13px;padding:9px 18px;font-weight:600;">⬇ Download as zip — recommended</button>
          <span style="color:var(--text-dim);font-size:12px;line-height:1.4;flex:1;min-width:200px;">
            One click → ZIP appears in your Downloads folder. Unzip

            <code>cd</code> into it, run from terminal. <b>No prompts,
            no setup, every browser.</b>
          </span>
        </div>
      </div>

      <details style="margin-bottom:12px;">
        <summary style="cursor:pointer;font-size:12px;color:var(--text-dim);">

        </summary>
        <div style="margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:6px;">
          <div style="font-size:11px;color:var(--text-faint);line-height:1.55;margin-bottom:8px;">
            Browsers can't autonomously write to your disk for security reasons,

          <button class="mini" id="rl-cmd-copy" title="Copy to clipboard">📋</button>
        </div>
      </div>

      <div id="rl-log" style="margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;color:var(--text-dim);max-height:24vh;overflow:auto;background:#0b1117;border:1px solid var(--border);border-radius:6px;padding:10px;white-space:pre-wrap;display:none;"></div>
    `;
    foot.innerHTML = "";
    foot.append(btn("Close", "primary", closeModal));
    const status   = body.querySelector("#rl-status");
    const log      = body.querySelector("#rl-log");
    const result   = body.querySelector("#rl-result");
    const wsLabel  = body.querySelector("#rl-workspace-label");
    // Refresh the workspace name display (stored handle's name).
    async function refreshWorkspaceLabel() {
      const h = await getStoredWorkspaceHandle({ requireGranted: false });
      wsLabel.textContent = h ? `Workspace: "${h.name}"` : "Workspace: (not set yet — first click on Save will prompt you)";
    }
    refreshWorkspaceLabel();
    body.querySelector("#rl-workspace-change").addEventListener("click", async () => {
      const h = await pickAndStoreWorkspaceHandle();
      if (h) { toast(`Workspace: "${h.name}"`); refreshWorkspaceLabel(); }
    });
    // Resolve the active script — either fixed (script-card flow) or live
    // off the picker (folder-card flow). pickActiveScript() returns
    // { name, source } or null if the user has nothing useful selected.
    function pickActiveScript() {
      if (isScriptForm) {
        return {
          name: s.name,
          source: s.source || "",
          binaryContent: s.binaryContent || "",   // legacy base64 path
          blobRef: s.blobRef || "",                // new IDB blob path
          isBinary: (s.language === "binary"),
        };
      }
      const sel = body.querySelector("#rl-script-pick");
      const v = sel ? sel.value : "";

        // ships with — see runScriptOverFolder for the full version.
        return {
          name: "run_locally_starter.py",
          source:
`# Auto-generated starter — overlay every parseable file in this folder.
# Drop your real analysis here.
import os, glob, sys
import matplotlib.pyplot as plt
csvs = sorted(glob.glob("*.csv") + glob.glob("*.txt") + glob.glob("*.tsv"))
print(f"Found {len(csvs)} files in {os.getcwd()}")
fig, ax = plt.subplots(figsize=(9, 5))
for fn in csvs:
    try:
        # very forgiving CSV — first numeric column is X, the rest are Y series

        # try to detect a header
        try: header = [c.strip() for c in rows[0].split(",")]; float(rows[0].split(",")[0]); header = None
        except ValueError: header = [c.strip() for c in rows[0].split(",")]; rows = rows[1:]
        cols = list(zip(*[[float(c) if c.replace(".","",1).replace("-","",1).isdigit() else None for c in r.split(",")] for r in rows]))
        if not cols: continue
        x = cols[0]
        for j, y in enumerate(cols[1:], 1):
            label = (header[j] if header and j < len(header) else f"col{j}")
            ax.plot(x, y, lw=0.8, label=f"{fn}:{label}")
    except Exception as exc:
        print(f"  skip {fn}: {exc}")
ax.set_xlabel("x"); ax.set_ylabel("y"); ax.grid(True, alpha=0.3)
ax.legend(fontsize=7, loc="best", ncol=2, framealpha=0.9)

`
        };
      }
      const found = pyScripts.find(x => x.id === v);
      if (!found) return null;
      return {
        name: found.name,
        source: found.source || "",
        binaryContent: found.binaryContent || "",
        blobRef: found.blobRef || "",
        isBinary: (found.language === "binary"),
      };
    }
    function appendLog(line) {
      log.style.display = "block";
      log.textContent += line + "\n";
      log.scrollTop = log.scrollHeight;
    }
    function refreshScriptName() {
      const cur = pickActiveScript();
      const name = body.querySelector("#rl-script-name");

    }

    refreshScriptName();
    body.querySelector("#rl-cmd-copy").addEventListener("click", () => {
      copyToClipboard(body.querySelector("#rl-cmd").textContent);
    });
    /* 💾 Save to workspace — reuses the persisted workspace handle (or
       prompts on first use), then creates a fresh dated subfolder named

    body.querySelector("#rl-save").addEventListener("click", async () => {
      if (!window.showDirectoryPicker) {
        toast("This browser can't write directly to disk — use ⬇ Download as zip", "err");
        return;
      }
      const cur = pickActiveScript();
      if (!cur) { toast("Pick a script first (top of the modal)", "err"); return; }
      // Reuse the saved workspace if we have it; otherwise pick once.
      let ws = await getStoredWorkspaceHandle();
      if (!ws) {
        appendLog("First-time setup — pick the folder where pdk-monitor.html lives (or any folder you want as your workspace).");
        ws = await pickAndStoreWorkspaceHandle();
        if (!ws) return;
        await refreshWorkspaceLabel();
      }
      // Build a unique subfolder name. Date stamp (down to seconds) keeps
      // successive runs distinct so previous outputs aren't clobbered.
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      const slug  = (suggestedFolder || "run").replace(/[^a-z0-9_-]+/gi, "_").slice(0, 80);
      const subName = `${slug}__${stamp}`;
      let dir;
      try { dir = await ws.getDirectoryHandle(subName, { create: true }); }
      catch (err) { toast(`Couldn't create subfolder: ${err.message}`, "err"); return; }
      log.textContent = "";
      appendLog(`Workspace: ${ws.name}`);
      appendLog(`New subfolder: ${subName}`);
      // Helper writers
      async function writeBytes(name, bytes) {
        const fh = await dir.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(new Blob([bytes], { type: "application/octet-stream" }));
        await w.close();
      }
      async function writeText(name, text, mime) {
        const fh = await dir.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(new Blob([text], { type: mime || "text/plain;charset=utf-8" }));
        await w.close();
      }
      // 1) the script itself
      try {
        if (cur.isBinary && cur.blobRef) {
          // New path: pull the Blob straight from IDB and pipe it to disk.
          // No base64 round-trip = no extra heap pressure for big binaries.
          const blob = await idbGetBlob(cur.blobRef);
          if (!blob) throw new Error("Binary missing from storage — re-upload it");
          const fh = await dir.getFileHandle(cur.name, { create: true });
          const w = await fh.createWritable();
          await w.write(blob);
          await w.close();
          appendLog(`  ${cur.name}  (binary, ${blob.size} bytes)`);
        } else if (cur.isBinary && cur.binaryContent) {
          // Legacy path for older entries still stored as base64.
          await writeBytes(cur.name, base64ToBytes(cur.binaryContent));
          appendLog(`  ${cur.name}  (binary, legacy)`);
        } else {
          await writeText(cur.name, cur.source || "", "text/x-python;charset=utf-8");
          appendLog(`  ${cur.name}  (${(cur.source || "").length} chars)`);
        }
      } catch (err) { appendLog(`  ${cur.name} — ERROR ${err.message}`); }
      // 2) every data file (priority order: binary → image → rawText → parsed-CSV → metadata sidecar)
      let n = 1;
      for (const t of dataItems) {
        const fname = t.filename || `${(t.name || "data").replace(/\s+/g, "_")}.txt`;
        try {
          if (t.binaryContent) {
            await writeBytes(fname, base64ToBytes(t.binaryContent));
            appendLog(`  ${fname}  (binary)`);
          } else if (t.imageUrl) {
            const r = dataUrlToBytes(t.imageUrl);
            if (r) { await writeBytes(fname, r.bytes); appendLog(`  ${fname}  (image)`); }
          } else if (t.rawText) {
            await writeText(fname, t.rawText);
            appendLog(`  ${fname}  (text, ${t.rawText.length} chars)`);
          } else if (t.parsed && t.parsed.sweep && t.parsed.traces) {
            const sw = t.parsed.sweep, tr = t.parsed.traces;
            const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
            for (let i = 0; i < (sw.values || []).length; i++) {
              lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
            }

            await writeText(csvName, lines.join("\n"), "text/csv;charset=utf-8");
            appendLog(`  ${csvName}  (CSV from parsed)`);
          } else {
            const sidecar = JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata }, null, 2);
            const sName = (t.name || "file").replace(/\s+/g, "_") + ".metadata.json";
            await writeText(sName, sidecar, "application/json");
            appendLog(`  ${sName}  (metadata-only sidecar)`);
          }
          n++;
        } catch (err) { appendLog(`  ${fname} — ERROR ${err.message}`); }
      }
      // 3) tiny README so the subfolder is self-documenting. The "how to
      // run" line adapts to Python source vs native binary.
      const runLine = cur.isBinary
        ? (/\.exe$/i.test(cur.name) ? `${cur.name} <args>` : `./${cur.name} <args>`)
        : `python "${cur.name}"`;
      const kindLabel = cur.isBinary ? "the native binary" : "the Python script";
      await writeText("README.txt",
        `Generated by CORNERSTONE PDK Monitor on ${new Date().toISOString()}.\n` +
        `\nThis folder contains:\n  - ${cur.name} — ${kindLabel}\n  - ${n - 1} data file${n === 1 ? "" : "s"} from "${contextLabel}"\n` +
        `\nTo run:\n  1. cd into this folder.\n  2. ${runLine}\n` +
        `\n${cur.isBinary
          ? "The browser cannot execute the binary itself for security reasons —\nthat's why this folder is created for you to run from a terminal.\nOn Linux / macOS you may need: chmod +x \"" + cur.name + "\""
          : "The script reads neighbouring files with plain open() / glob() calls\n— no path tweaks needed."}\n`);
      appendLog(`  README.txt`);
      appendLog(`Done — wrote ${n + 1} file${(n + 1) === 1 ? "" : "s"} into "${ws.name}/${subName}".`);
      // Show the result block + the terminal command using the workspace
      // name and the subfolder we just made.
      result.style.display = "flex";
      const cmd = `cd "${ws.name}/${subName}" && ${runLine}`;
      body.querySelector("#rl-cmd").textContent = cmd;
      status.textContent = `Saved → ${ws.name}/${subName}`;
      toast(`Saved → ${ws.name}/${subName}`);
    });
    // ZIP fallback — works in every browser (Chrome / Firefox / Edge / Safari).
    // Bundles the script + every data file into a single .zip the user
    // downloads, extracts, and runs from terminal. Mirrors what the
    // pick-folder flow writes, just packaged.
    body.querySelector("#rl-zip").addEventListener("click", async () => {
      const cur = pickActiveScript();
      if (!cur) { toast("Pick a script first (top of the modal)", "err"); return; }
      let JSZip;
      try { JSZip = await ensureJSZip(); }
      catch (err) { toast(`Could not load JSZip: ${err.message}`, "err"); return; }

      const root = zip.folder(folderSlug);

      if (cur.isBinary && cur.blobRef) {

        const blob = await idbGetBlob(cur.blobRef);

        appendLog(`  ${folderSlug}/${cur.name}  (binary, ${blob.size} bytes)`);
      } else if (cur.isBinary && cur.binaryContent) {
        const bytes = base64ToBytes(cur.binaryContent);
        root.file(cur.name, bytes);
        appendLog(`  ${folderSlug}/${cur.name}  (binary, legacy)`);
      } else {
        root.file(cur.name, cur.source || "");
        appendLog(`  ${folderSlug}/${cur.name}  (${(cur.source || "").length} chars)`);
      }
      // 2) every data file (same priority order as the disk-write path).
      let n = 1;
      for (const t of dataItems) {
        const fname = t.filename || `${(t.name || "data").replace(/\s+/g, "_")}.txt`;
        try {
          if (t.binaryContent) {
            root.file(fname, base64ToBytes(t.binaryContent));
            appendLog(`  ${folderSlug}/${fname}  (binary)`);
          } else if (t.imageUrl) {
            const r = dataUrlToBytes(t.imageUrl);
            if (r) { root.file(fname, r.bytes); appendLog(`  ${folderSlug}/${fname}  (image)`); }
          } else if (t.rawText) {
            root.file(fname, t.rawText);
            appendLog(`  ${folderSlug}/${fname}  (text, ${t.rawText.length} chars)`);
          } else if (t.parsed && t.parsed.sweep && t.parsed.traces) {
            const sw = t.parsed.sweep, tr = t.parsed.traces;
            const lines = [[sw.name || "x", ...tr.map(x => x.name || "y")].join(",")];
            for (let i = 0; i < (sw.values || []).length; i++) {
              lines.push([sw.values[i], ...tr.map(x => x.values?.[i] ?? "")].join(","));
            }
            const csvName = fname.replace(/\.[^.]+$/, "") + ".csv";
            root.file(csvName, lines.join("\n"));
            appendLog(`  ${folderSlug}/${csvName}  (CSV from parsed)`);
          } else {
            const sidecar = JSON.stringify({ name: t.name, filename: t.filename, kind: t.kind, size: t.size, metadata: t.metadata }, null, 2);
            const sName = (t.name || "file").replace(/\s+/g, "_") + ".metadata.json";
            root.file(sName, sidecar);
            appendLog(`  ${folderSlug}/${sName}  (metadata-only sidecar)`);
          }
          n++;
        } catch (err) { appendLog(`  ${fname} — ERROR ${err.message}`); }
      }
      // 3) a tiny README the user can read after unzipping.
      const readme =
`# Run locally — ${folderSlug}

Generated by CORNERSTONE PDK Monitor on ${new Date().toISOString()}.

This folder contains:
  - ${cur.name}                       — ${cur.isBinary ? "the native binary" : "the Python script"}
  - ${n - 1} data file${n === 1 ? "" : "s"} from "${contextLabel}"

To run:
  1. Unzip wherever you like.
  2. cd into the folder.
  3. ${cur.isBinary
        ? (/\.exe$/i.test(cur.name) ? `${cur.name} <args>` : `./${cur.name} <args>`)
        : `python "${cur.name}"`}

${cur.isBinary
  ? `The browser cannot execute the binary itself — that's why this zip is\nbuilt for you to run from a terminal. On Linux / macOS you may need:\nchmod +x "${cur.name}"`
  : `The script reads neighbouring files with plain open("filename.csv") /\nglob("*.csv") calls — no path tweaks needed.`}
`;
      root.file("README.txt", readme);
      appendLog(`  ${folderSlug}/README.txt`);
      appendLog(`Building zip…`);
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });

      appendLog(`Done — saved as ${folderSlug}.zip (${(blob.size/1024).toFixed(0)} KB).`);
      status.textContent = `Saved ${folderSlug}.zip — unzip and run from terminal`;

/* Wrap user Python so matplotlib always renders cleanly:
   - Force the Agg backend so plots never leak into the page DOM
   - Patch plt.show() to a no-op (kills "no figure" warnings)
   - Define _dash_emit(fig) so users can manually emit a figure
   - After user code runs, AUTO-EMIT every still-open figure as a
     DASH_PLOT_PNG marker, so a script with just `plt.plot(x, y)` works.
   This bootstrap is prepended; the auto-emit is appended. */
const PY_BOOTSTRAP_PRE = `
import os as _os
_os.environ["MPLBACKEND"] = "Agg"
import matplotlib
matplotlib.use("Agg", force=True)
import matplotlib.pyplot as _plt
_plt.show = lambda *a, **k: None
import io as _io, base64 as _b64
def _dash_emit(_fig):
    """Publish a matplotlib figure as a DASH_PLOT_PNG marker in stdout."""
    _buf = _io.BytesIO()
    _fig.savefig(_buf, format="png", dpi=110, bbox_inches="tight")
    print("DASH_PLOT_PNG:" + _b64.b64encode(_buf.getvalue()).decode())
    try: _plt.close(_fig)
    except Exception: pass
# also expose under the user-facing name "emit" so the inline templates work
emit = _dash_emit
`;
const PY_BOOTSTRAP_POST = `
# Auto-capture every open figure that the user code created without calling
# emit(). plt.get_fignums() returns figure numbers in creation order; we emit
# each, then close them so a re-run starts fresh.
try:
    _nums = list(_plt.get_fignums())
    for _n in _nums:
        _dash_emit(_plt.figure(_n))
except Exception as _e:
    print("[dash] auto-emit failed:", _e)
`;
function wrapPython(src) {
  // Indent user code under a try/except wrapper so a syntax error in the
  // user code doesn't take out the auto-emit step. We wrap user source in
  // exec() so its top-level globals stay accessible afterwards.
  return PY_BOOTSTRAP_PRE + "\n" + (src || "") + "\n" + PY_BOOTSTRAP_POST;
}

async function runPythonScript(e, s, runBtn) {
  let py;
  try {
    if (runBtn) { runBtn.disabled = true; runBtn.textContent = "Loading…"; }
    py = await ensurePyodide();
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = "▶ Run"; }
  } catch (err) {
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = "▶ Run"; }
    toast("Could not load Pyodide: " + err.message, "err"); return;
  }
  // Auto-load matplotlib (always — the bootstrap imports it) plus any
  // numpy/scipy/pandas the user code mentions.
  if (runBtn) runBtn.textContent = "Loading packages…";
  try {
    const src = s.source || "";
    const wanted = ["matplotlib"];
    if (/import\s+numpy|from\s+numpy/.test(src))   wanted.push("numpy");
    if (/import\s+scipy|from\s+scipy/.test(src))   wanted.push("scipy");
    if (/import\s+pandas|from\s+pandas/.test(src)) wanted.push("pandas");
    await py.loadPackage(wanted);
    if (py.loadPackagesFromImports) await py.loadPackagesFromImports(src);
  } catch (err) { toast(`Package load failed: ${err.message}`, "err"); }
  if (runBtn) runBtn.textContent = "▶ Run";
  const dataObj = {};
  for (const d of allDatasets(e)) if (d.parsed) dataObj[d.name] = d.parsed;
  const allTests = (e.testGroups || []).flatMap(tg => tg.tests.map(t => ({
    name: t.name, filename: t.filename, kind: t.kind, parsed: t.parsed, rawText: t.rawText, metadata: t.metadata || {}, folder: tg.name,
  })));
  const captured = { stdout: [], stderr: [] };
  py.setStdout({ batched: (s) => captured.stdout.push(s) });
  py.setStderr({ batched: (s) => captured.stderr.push(s) });
  let error = null, result;
  try {
    py.globals.set("data", py.toPy(dataObj));
    py.globals.set("tests", py.toPy(allTests));
    result = await py.runPythonAsync(wrapPython(s.source || ""));
  } catch (err) { error = err; }
  py.setStdout({}); py.setStderr({});
  showOutputModal(`Output: ${s.name}`, captured, result, error);
}
/* Strip DASH_PLOT_PNG markers from stdout, return the cleaned text + an
   array of base64 PNGs. Scripts produce these markers via:
     buf = io.BytesIO(); plt.savefig(buf, format="png", ...)
     print(f"DASH_PLOT_PNG:{base64.b64encode(buf.getvalue()).decode()}")
*/
function extractPlots(text) {
  const plots = [];
  const cleaned = text.replace(/DASH_PLOT_PNG:([A-Za-z0-9+/=]+)/g, (_, b64) => {
    plots.push(b64);
    return "";
  }).replace(/\n{3,}/g, "\n\n").trim();
  return { cleaned, plots };
}

function buildOutputText(captured, result, error) {
  const stdoutRaw = (captured.stdout.join("") || "").trimEnd();
  const { cleaned: out } = extractPlots(stdoutRaw);
  const err = (captured.stderr.join("") || "").trimEnd();
  const repr = (result === undefined || result === null) ? "" : String(result);
  const parts = [];
  parts.push(`# Run output — ${new Date().toISOString()}`);
  if (error) parts.push(`## error\n${String(error)}`);
  if (out)   parts.push(`## stdout\n${out}`);
  if (err)   parts.push(`## stderr\n${err}`);
  if (repr)  parts.push(`## last expression\n${repr}`);
  return parts.join("\n\n") + "\n";
}

function wireUpPlotPopouts(parent, plots) {
  parent.querySelectorAll("[data-plot-popout]").forEach(a => {

  });

  if (_autoOpenPlots && plots.length) {

  }
}
function showOutputModal(title, captured, result, error) {
  openModal(title, (body, foot) => {
    const stdoutRaw = (captured.stdout.join("") || "").trim();
    const { cleaned: out, plots } = extractPlots(stdoutRaw);
    const err = (captured.stderr.join("") || "").trim();
    const repr = (result === undefined || result === null) ? "" : String(result);
    body.innerHTML = `
      ${error ? `<div class="field-label" style="color:var(--danger);">Error</div><div class="code-view" style="border-color:var(--danger);">${escapeHtml(String(error))}</div>` : ""}
      ${renderPlotBlock(plots)}
      ${out ? `<div class="field-label" style="margin-top:10px;">stdout</div><div class="code-view">${escapeHtml(out)}</div>` : ""}
      ${err ? `<div class="field-label" style="margin-top:10px;color:var(--danger);">stderr</div><div class="code-view" style="border-color:var(--danger);">${escapeHtml(err)}</div>` : ""}
      ${repr ? `<div class="field-label" style="margin-top:10px;">last expression</div><div class="code-view">${escapeHtml(repr)}</div>` : ""}
      ${(!out && !err && !repr && !error && !plots.length) ? `<div class="panel-empty">Script ran but produced no output.</div>` : ""}
    `;
    wireUpPlotPopouts(body, plots);
    foot.innerHTML = "";
    if (plots.length) {
      foot.append(btn(`Download plot${plots.length>1?"s":""}`, "ghost", () => {
        const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
        const slug = (title || "plot").replace(/[^A-Za-z0-9_.-]+/g, "_").slice(0, 60);
        plots.forEach((b, i) => {
          const bytes = base64ToBytes(b);
          downloadBytes(`${slug}_${stamp}_${i+1}.png`, bytes, "image/png");
        });
      }));
    }
    if (out || err || repr || error || plots.length) {
      foot.append(btn("Download .txt", "ghost", () => {
        const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
        const slug = (title || "output").replace(/[^A-Za-z0-9_.-]+/g, "_").slice(0, 60);
        downloadText(`${slug}_${stamp}.txt`, buildOutputText(captured, result, error));
      }));
    }
    foot.append(btn("Close", "primary", closeModal));
  });
}

}

async function handleDataFiles(e, fileList) {

  }

async function parseDataFile(file) {
  const lower = file.name.toLowerCase();
  if (lower.endsWith(".json")) return normaliseJson(JSON.parse(await readFileAsText(file)));
  if (lower.endsWith(".csv"))  return normaliseCsv(await readFileAsText(file));
  const buf = await readFileAsArrayBuffer(file);
  const XLSX = await ensureSheetJS();
  const wb = XLSX.read(buf, { type: "array" });
  return normaliseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }));
}
/* Auto-detect comma / tab / whitespace separator. CORNERSTONE .txt files
   are tab-separated with no header — that case used to fail and bail with
   "need at least 2 numeric columns" because the old parser only split on commas. */
function normaliseCsv(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) throw new Error("file is empty");
  // Strip leading comment lines (e.g. starting with # or %) — common in
  // instrument exports — but keep them in case nothing else is recognised.
  const dataLines = lines.filter(l => !/^[#%]/.test(l));
  const probe = (dataLines.length ? dataLines : lines).slice(0, 5).join("\n");
  let split;
  if (/,/.test(probe))        split = csvLineToCells;
  else if (/\t/.test(probe))  split = (s) => s.split("\t").map(x => x.trim());
  else                        split = (s) => s.trim().split(/\s+/);
  return normaliseRows((dataLines.length ? dataLines : lines).map(split));
}
function csvLineToCells(line) {
  const out = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) { if (c === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (c === '"') inQ = false; else cur += c; }
    else { if (c === '"') inQ = true; else if (c === ",") { out.push(cur); cur = ""; } else cur += c; }
  }
  out.push(cur); return out;
}
function normaliseRows(aoa) {
  if (!aoa || !aoa.length) throw new Error("file is empty");
  // If the first row's cells are all numeric, the file has no header — treat
  // it as data and synthesise column names. Photonics .txt sweeps are usually
  // headerless wavelength/transmission pairs.
  const firstRowAllNumeric = aoa[0].length > 0 && aoa[0].every(v =>
    v !== "" && v != null && Number.isFinite(Number(String(v).trim())));
  let headers, dataRows;
  if (firstRowAllNumeric) {
    headers = aoa[0].map((_, i) => i === 0 ? "wavelength_nm" : (i === 1 ? "transmission" : `y${i}`));
    dataRows = aoa;
  } else {
    headers = aoa[0].map((h, i) => String(h ?? "").trim() || `col${i}`);
    dataRows = aoa.slice(1);
  }
  const cols = headers.map(() => []);
  for (const row of dataRows) {
    for (let c = 0; c < headers.length; c++) {
      const v = row[c];
      const n = (v === "" || v == null) ? NaN : Number(String(v).trim());
      cols[c].push(Number.isFinite(n) ? n : NaN);
    }
  }
  const keep = cols.map(c => c.some(Number.isFinite));
  const headersN = headers.filter((_, i) => keep[i]);
  const colsN = cols.filter((_, i) => keep[i]);
  if (colsN.length < 2) {
    throw new Error(`need at least 2 numeric columns — got ${colsN.length}. ` +
      `First-line preview: "${aoa[0].slice(0,4).join(" | ").slice(0, 80)}"`);
  }
  return {
    sweep: { name: headersN[0], values: colsN[0] },
    traces: headersN.slice(1).map((h, i) => ({ name: h, values: colsN[i+1] })),
  };
}
function normaliseJson(obj) {
  if (obj && obj.sweep && Array.isArray(obj.traces)) {
    return { sweep: { name: String(obj.sweep.name || "x"), values: obj.sweep.values.map(Number) },
             traces: obj.traces.map(t => ({ name: String(t.name || "y"), values: t.values.map(Number) })) };
  }
  if (obj && typeof obj === "object" && !Array.isArray(obj)) {
    const keys = Object.keys(obj).filter(k => Array.isArray(obj[k]));
    if (keys.length >= 2) return { sweep: { name: keys[0], values: obj[keys[0]].map(Number) }, traces: keys.slice(1).map(k => ({ name: k, values: obj[k].map(Number) })) };
  }
  throw new Error("unrecognised JSON shape");
}

        const ds = chartObj.data.datasets;

        for (const d of ds) for (const p of d.data) if (p && p.x != null) xs.add(p.x);
        const sortedX = [...xs].sort((a,b) => a - b);
        const header = ["x", ...ds.map(d => d.label)];
        const rows = [header];
        const idxMap = ds.map(d => {
          const m = new Map();
          for (const p of d.data) if (p && p.x != null) m.set(p.x, p.y);
          return m;
        });
        for (const x of sortedX) rows.push([x, ...idxMap.map(m => m.has(x) ? m.get(x) : "")]);
        return rows;
      },
      title.replace(/[^a-z0-9_-]+/gi, "_").slice(0, 60)
    ));
    const palette = ["--t1","--t2","--t3","--t4","--t5","--t6"];
    const root = getComputedStyle(document.documentElement);
    const colorAt = i => root.getPropertyValue(palette[i % palette.length]).trim();
    let chartObj = null, xname = "x";
    function build(mode) {

        xname = it.parsed.sweep.name || xname;
        const sweep = it.parsed.sweep.values;
        for (const tr of it.parsed.traces) {
          let pts;
          if (mode === "db") {
            const ys = (tr.values || []).map(v => (v == null || isNaN(v) || v <= 0) ? null : v);
            const peak = Math.max(...ys.filter(v => v != null));
            pts = (tr.values || []).map((y, k) => ({
              x: sweep[k],
              y: (y == null || isNaN(y) || y <= 0 || !isFinite(peak) || peak <= 0) ? null : 10 * Math.log10(y / peak),
            }));
          } else {
            pts = (tr.values || []).map((y, k) => ({ x: sweep[k], y }));
          }
          datasets.push({
            label: it.label + (it.parsed.traces.length > 1 ? `:${tr.name}` : ""),
            data: pts,
            borderColor: colorAt(palIdx),
            backgroundColor: colorAt(palIdx) + "33",
            borderWidth: 0.9, pointRadius: 0, tension: 0, parsing: false, spanGaps: false,
          });
          palIdx++;
        }
      }
      if (chartObj) chartObj.destroy();
      chartObj = new Chart(body.querySelector("#chart").getContext("2d"), {
        type: "line", data: { datasets },
        options: {
          responsive: true, animation: false,
          scales: {
            x: { type: "linear", title: { display: true, text: xname, color: "#8b949e" }, grid: { color: "#2a323d" }, ticks: { color: "#8b949e" } },
            y: { title: { display: true, text: mode === "db" ? "transmission (dB, per-trace peak)" : "magnitude (raw)", color: "#8b949e" }, grid: { color: "#2a323d" }, ticks: { color: "#8b949e" } },
          },
          plugins: {
            legend: { labels: { color: "#e6edf3" }, display: datasets.length <= 14 },
            tooltip: { mode: "nearest", intersect: false },
            zoom: chartZoomConfig(),
          },
          interaction: { mode: "nearest", axis: "x", intersect: false },
        },
      });
    }
    body.querySelector("#y-linear").addEventListener("click", () => {
      body.querySelector("#y-linear").classList.add("active");
      body.querySelector("#y-db").classList.remove("active");
      build("linear");
    });
    body.querySelector("#y-db").addEventListener("click", () => {
      body.querySelector("#y-db").classList.add("active");
      body.querySelector("#y-linear").classList.remove("active");
      build("db");
    });
    build("linear");
  });
}

async function plotDataset(d) {
  let Chart;
  try { Chart = await ensureChartJS(); }
  catch (err) { toast("Could not load Chart.js: " + err.message, "err"); return; }
  openModal(`Spectrum: ${d.name}`, (body, foot) => {
    body.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <span style="color:var(--text-dim);font-size:12px;">Y-axis:</span>
        <button class="ghost active" id="y-linear" style="font-size:12px;padding:5px 10px;">Linear (raw)</button>
        <button class="ghost"        id="y-db"     style="font-size:12px;padding:5px 10px;">dB (normalized to peak)</button>
      </div>
      <div id="tb-slot"></div>
      <canvas id="chart" width="900" height="460"></canvas>
    `;
    foot.innerHTML = "";
    foot.append(btn("Close", "primary", closeModal));
    body.querySelector("#tb-slot").appendChild(plotToolbar(
      () => chartObj,
      () => {
        if (!chartObj) return [];
        const ds = chartObj.data.datasets;
        const xs = new Set();
        for (const ddd of ds) for (const p of ddd.data) if (p && p.x != null) xs.add(p.x);
        const sortedX = [...xs].sort((a,b) => a - b);
        const header = ["x", ...ds.map(ddd => ddd.label)];
        const rows = [header];
        const idxMap = ds.map(ddd => {
          const m = new Map();
          for (const p of ddd.data) if (p && p.x != null) m.set(p.x, p.y);
          return m;
        });
        for (const x of sortedX) rows.push([x, ...idxMap.map(m => m.has(x) ? m.get(x) : "")]);
        return rows;
      },
      d.name.replace(/[^a-z0-9_-]+/gi, "_").slice(0, 60)
    ));
    const palette = ["--t1","--t2","--t3","--t4","--t5","--t6"];
    const root = getComputedStyle(document.documentElement);
    const colorAt = i => root.getPropertyValue(palette[i % palette.length]).trim();

    let chartObj = null;
    function build(mode) {
      const traceCount = (d.parsed.traces || []).length;
      const datasets = (d.parsed.traces || []).map((t, i) => {
        let pts;
        if (mode === "db") {
          // Normalize each trace to its own peak, convert to dB.
          const ys = (t.values || []).map(v => (v == null || isNaN(v) || v <= 0) ? null : v);
          const peak = Math.max(...ys.filter(v => v != null));
          pts = (t.values || []).map((y, k) => ({
            x: d.parsed.sweep.values[k],
            y: (y == null || isNaN(y) || y <= 0 || !isFinite(peak) || peak <= 0)
                 ? null
                 : 10 * Math.log10(y / peak),
          }));
        } else {
          pts = (t.values || []).map((y, k) => ({ x: d.parsed.sweep.values[k], y }));
        }
        return {
          // Prefix every legend entry with the source filename so the user
          // can tell which file produced each trace inside the plot window.
          label: traceCount > 1 ? `${d.name}:${t.name}` : d.name,
          data: pts,
          borderColor: colorAt(i), backgroundColor: colorAt(i) + "33",
          borderWidth: 1.5, pointRadius: 0, tension: 0, parsing: false, spanGaps: false,
        };
      });
      if (chartObj) chartObj.destroy();
      chartObj = new Chart(body.querySelector("#chart").getContext("2d"), {
        type: "line", data: { datasets },
        options: {
          responsive: true, animation: false,
          scales: {
            x: { type: "linear", title: { display: true, text: d.parsed.sweep.name, color: "#8b949e" }, grid: { color: "#2a323d" }, ticks: { color: "#8b949e" } },
            y: { title: { display: true, text: mode === "db" ? "transmission (dB)" : "magnitude (raw)", color: "#8b949e" }, grid: { color: "#2a323d" }, ticks: { color: "#8b949e" } },
          },
          plugins: { legend: { labels: { color: "#e6edf3" } }, tooltip: { mode: "index", intersect: false }, zoom: chartZoomConfig() },
          interaction: { mode: "nearest", axis: "x", intersect: false },
        },
      });
    }
    body.querySelector("#y-linear").addEventListener("click", () => {
      body.querySelector("#y-linear").classList.add("active");
      body.querySelector("#y-db").classList.remove("active");
      build("linear");
    });
    body.querySelector("#y-db").addEventListener("click", () => {
      body.querySelector("#y-db").classList.add("active");
      body.querySelector("#y-linear").classList.remove("active");
      build("db");
    });
    build("linear");
  });
}

  wrap.querySelector('[data-act="run-local"]').addEventListener("click", () => openRunLocallyModal(e, {

  wrap.querySelector('[data-act="plotall"]').addEventListener("click", () => {

      if (parsed && parsed.sweep && parsed.traces?.length) {
        items.push({ label: (t.metadata?.device_id || t.name), parsed });

    plotMultiParsed(`Folder: ${tg.name}`, items);

  // hidden) for foreign folders, with a tooltip that names the owner so
  // the constraint is visible. Adding files INTO any folder stays open
  // — user-admins are encouraged to contribute alongside each other.
  const folderMayModify = canModifyId(tg.id);
  const folderOwnerId   = getOwner(tg.id);
  const folderOwnerName = displayName(folderOwnerId);
  const renameBtn = wrap.querySelector('[data-act="rename"]');

      delBtn.style.opacity = "0.45";

      chip.textContent = `by ${folderOwnerName}`;
      chip.title = `Folder created by ${folderOwnerName}. You can add new files here, but not rename / delete the folder itself.`;
      owned.after(chip);
    }
  }
  renameBtn?.addEventListener("click", () => {
    if (!canModifyId(tg.id)) { toast(`Folder created by ${folderOwnerName || "another user"} — only they (or an admin) can rename it.`, "err"); return; }
    const n = prompt("Folder name:", tg.name);
    if (!n || !n.trim()) return;
    tg.name = n.trim(); saveModel(); refresh();

  delBtn?.addEventListener("click", () => {
    if (!canModifyId(tg.id)) { toast(`Folder created by ${folderOwnerName || "another user"} — only they (or an admin) can delete it.`, "err"); return; }
    if (!confirm(`Delete folder "${tg.name}" and its ${tg.tests.length} file(s)?`)) return;
